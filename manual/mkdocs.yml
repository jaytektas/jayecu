site_name: jayecu User Manual
site_description: The complete reference for the jayecu ECU and jayecu Studio — wiring, configuration, tuning, diagnostics.
docs_dir: docs
site_dir: site
strict: true
# Snippet files are pulled INTO chapters (--8<--) and are not pages of their own: built, they turned up
# in search as a bare table with a file name for a title.
exclude_docs: |
  reference/settings/_*.table.md
  part2/_pins-*.md

theme:
  name: material
  logo: img/brand/studio.png
  favicon: img/brand/studio.png
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.tabs.link
    # ONE INDEX, not two: the page's own sections sit under the current chapter in the left-hand
    # index, so the right-hand column is not spent on a second table of contents.
    - toc.integrate
  # Dark first, like the studio; the studio's own orange as the accent (studio.common.style).
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark }

plugins:
  - search
  - offline          # works from file:// — the copy shipped inside the studio opens with no server

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.snippets: { base_path: [docs] }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - css/manual.css

# ---------------------------------------------------------------------------------------------------
# THE INDEX. Parts run from first contact to reference; within a part, chapters run basic to advanced.
# Module chapters (template 5a in STANDARD.md) list the firmware modules they cover in their trailing comment;
# everything else is a topic chapter (5b).
# Every firmware module in definition/ecu.schema.yaml has exactly one home here.
# ---------------------------------------------------------------------------------------------------
nav:
  - Home: index.md

  - Part I — Getting started:
      - part1/index.md
      - 1 How to use this manual: part1/01-using-this-manual.md
      - 2 The system at a glance: part1/02-system-overview.md          # ECU, studio, definitions, tunes, layouts, how they talk
      - 3 Installing jayecu Studio: part1/03-installing-studio.md      # AppImage, Windows installer, USB rule/driver, updates
      - 4 A tour of the studio: part1/04-studio-tour.md                # menus, navigation, pages, Locked/Editing, Burn, Verify
      - 5 First connection: part1/05-first-connection.md
      - 6 Quick start — box to first start: part1/06-quick-start.md    # the checklist, pointing into the rest

  - Part II — Hardware and wiring:
      - part2/index.md
      - 7 The jaytek_v1 board: part2/07-board.md                        # connectors, pinout, I/O capability, specifications
      - 8 Tools and materials: part2/08-tools.md                        # crimpers, wire, heatshrink, meters, scope, stim
      - 9 Wiring practice: part2/09-wiring-practice.md                  # gauges, routing, shielding, splices, connectors
      - 10 Power, grounds and protection: part2/10-power-grounds.md
      - 11 Wiring sensors: part2/11-wiring-sensors.md                   # analog, temp, pressure, knock, wideband, VR/Hall, SENT, digital
      - 12 Wiring outputs: part2/12-wiring-outputs.md                   # injectors, coils, relays, PWM valves, H-bridge, stepper
      - 13 CAN bus: part2/13-can-bus.md                                 # topology, termination, devices, templates
      - 14 Vehicle integration: part2/14-vehicle-integration.md         # tacho, fuel pump, fans, A/C, cluster, VSS, OBD

  - Part III — Configuring the engine:
