      - 15 Engine and vehicle basics: part3/15-engine-vehicle.md    # Engine, Vehicle
      - 16 The trigger system: part3/16-trigger.md                  # Trigger — theory, sync, cam, examples, Trigger Designer, library
      - 17 Sensors and calibration: part3/17-sensors.md             # Sensors, sensor types, calibration curves
      - 18 Outputs and the pin system: part3/18-outputs.md          # Outputs, output templates, pin registry, output test
      - 19 Fuel: part3/19-fuel.md                                   # FuelCalculator, TransientThrottle
      - 20 Ignition: part3/20-ignition.md                           # Ignition
      - 21 Idle: part3/21-idle.md                                   # Idle, Stepper
      - 22 Electronic throttle: part3/22-electronic-throttle.md     # App, ElectronicThrottle, HBridge
      - 23 Closed-loop lambda: part3/23-lambda.md                   # Lambda
      - 24 Boost: part3/24-boost.md                                 # Boost
      - 25 Cam and valve control: part3/25-vvt-vvl.md               # VvtControl, VVL
