<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>Where copies of a tune live</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .line { stroke: #5f6670; stroke-width: 2; fill: none; }
    .box  { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .ecu  { fill: #fdf0e3; stroke: #d9822b; stroke-width: 2; }
    .pc   { fill: #e8f1fb; stroke: #3b82c4; stroke-width: 2; }
    .mono { font-family: ui-monospace, 'Ubuntu Mono', Consolas, monospace; font-size: 12px; }
    .head { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .line { stroke: #9aa1ab; } .box { fill: #20232a; stroke: #9aa1ab; }
      .ecu { fill: #33240f; } .pc { fill: #16283b; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a9099"/>
    </marker>
  </defs>

  <!-- ECU side -->
  <rect x="20" y="20" width="380" height="290" rx="8" class="box"/>
  <text x="210" y="46" text-anchor="middle" class="fg head">In the ECU</text>
  <rect x="40" y="62" width="340" height="60" rx="6" class="ecu"/>
  <text x="210" y="86" text-anchor="middle" class="fg head">Working memory</text>
  <text x="210" y="108" text-anchor="middle" class="fg">what the engine runs on; your edits land here</text>
  <rect x="40" y="140" width="340" height="60" rx="6" class="ecu"/>
  <text x="210" y="164" text-anchor="middle" class="fg head">Flash (two banks)</text>
  <text x="210" y="186" text-anchor="middle" class="fg">kept through power-off, after Burn</text>
  <rect x="40" y="218" width="340" height="76" rx="6" class="ecu"/>
  <text x="210" y="242" text-anchor="middle" class="fg head">SD card</text>
  <text x="210" y="264" text-anchor="middle" class="mono fg">ecucfg.bin  learn*.jlt  dtc.bin</text>
  <text x="210" y="284" text-anchor="middle" class="fg">the descriptor and pages for other studios</text>
  <path d="M210 122 V138" class="line" marker-end="url(#a)"/>
  <text x="222" y="134" class="muted">Burn</text>

  <!-- PC side -->
  <rect x="520" y="20" width="560" height="290" rx="8" class="box"/>
  <text x="800" y="46" text-anchor="middle" class="fg head">In the studio's data folder, for each ECU</text>
  <text x="800" y="66" text-anchor="middle" class="mono fg">ecus/&lt;ECU id&gt;/</text>
  <rect x="540" y="80" width="250" height="100" rx="6" class="pc"/>
  <text x="665" y="104" text-anchor="middle" class="mono fg head">tunes/</text>
  <text x="665" y="126" text-anchor="middle" class="fg">your named tunes;</text>
  <text x="665" y="146" text-anchor="middle" class="fg">saved on disconnect and close</text>
  <text x="665" y="166" text-anchor="middle" class="muted">File ▸ Save Tune</text>
  <rect x="810" y="80" width="250" height="100" rx="6" class="pc"/>
  <text x="935" y="104" text-anchor="middle" class="mono fg head">restore/</text>
  <text x="935" y="126" text-anchor="middle" class="fg">the ECU's tune as it</text>
  <text x="935" y="146" text-anchor="middle" class="fg">was at each connect</text>
  <text x="935" y="166" text-anchor="middle" class="muted">File ▸ Open Tune…</text>
  <rect x="540" y="196" width="250" height="100" rx="6" class="pc"/>
  <text x="665" y="220" text-anchor="middle" class="mono fg head">backups/</text>
  <text x="665" y="242" text-anchor="middle" class="fg">taken before each</text>
  <text x="665" y="262" text-anchor="middle" class="fg">firmware update</text>
  <rect x="810" y="196" width="250" height="100" rx="6" class="pc"/>
  <text x="935" y="220" text-anchor="middle" class="mono fg head">dashboard.gui</text>
  <text x="935" y="242" text-anchor="middle" class="fg">this ECU's page</text>
  <text x="935" y="262" text-anchor="middle" class="fg">layout</text>

  <path d="M400 92 H518" class="line" marker-end="url(#a)"/>
  <path d="M518 110 H402" class="line" marker-end="url(#a)"/>
  <text x="460" y="84" text-anchor="middle" class="muted">connect</text>
  <text x="460" y="128" text-anchor="middle" class="muted">edits</text>
</svg>
