<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>Closed-loop lambda signal flow</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .line { stroke: #5f6670; stroke-width: 2; fill: none; }
    .box  { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .tgt  { fill: #e8f1fb; stroke: #3b82c4; stroke-width: 2; }
    .ff   { fill: #fdf0e3; stroke: #d9822b; stroke-width: 2; }
    .pid  { fill: #eef7ee; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fbeaea; stroke: #c8412d; stroke-width: 2; }
    .node { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .mono { font-family: ui-monospace, 'Ubuntu Mono', Consolas, monospace; font-size: 12px; }
    .head { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .line { stroke: #9aa1ab; } .box, .node { fill: #20232a; stroke: #9aa1ab; }
      .tgt { fill: #16283b; } .ff { fill: #33240f; } .pid { fill: #13291a; } .safe { fill: #361512; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a9099"/>
    </marker>
  </defs>

  <!-- 1 short-term -->
  <text x="20" y="28" class="muted head">1 · Short-term trim  (fast, never stored)</text>
  <rect x="20" y="42" width="190" height="64" rx="6" class="box"/>
  <text x="115" y="67" text-anchor="middle" class="fg head">O2 sensor</text>
  <text x="115" y="89" text-anchor="middle" class="muted">chosen by O2 Control</text>
  <rect x="20" y="130" width="190" height="64" rx="6" class="tgt"/>
  <text x="115" y="155" text-anchor="middle" class="fg head">Target Lambda</text>
  <text x="115" y="177" text-anchor="middle" class="muted">± oscillation</text>
  <circle cx="270" cy="118" r="20" class="node"/>
  <text x="270" y="124" text-anchor="middle" class="fg" font-size="20">−</text>
  <path d="M210 74 H270 V96" class="line" marker-end="url(#a)"/>
  <path d="M210 162 H270 V140" class="line" marker-end="url(#a)"/>
  <rect x="330" y="86" width="210" height="64" rx="6" class="pid"/>
  <text x="435" y="111" text-anchor="middle" class="fg head">PI controller</text>
  <text x="435" y="133" text-anchor="middle" class="muted">gains by RPM × MAP</text>
  <path d="M290 118 H328" class="line" marker-end="url(#a)"/>
  <rect x="580" y="86" width="200" height="64" rx="6" class="safe"/>
  <text x="680" y="111" text-anchor="middle" class="fg head">STFT limits</text>
  <text x="680" y="133" text-anchor="middle" class="muted">max enrich / disenrich</text>
  <path d="M540 118 H578" class="line" marker-end="url(#a)"/>
  <rect x="860" y="86" width="210" height="64" rx="6" class="box"/>
  <text x="965" y="111" text-anchor="middle" class="fg head">Fuel calculation</text>
  <text x="965" y="133" text-anchor="middle" class="muted">× (1 + STFT) × (1 + LTFT)</text>
  <path d="M780 118 H858" class="line" marker-end="url(#a)"/>
  <text x="790" y="108" class="mono muted">stft_pct</text>
  <rect x="330" y="200" width="450" height="46" rx="6" class="safe"/>
  <text x="555" y="228" text-anchor="middle" class="muted">held during fuel cut, just after start, cold, or a reading out of range</text>

  <!-- 2 long-term -->
  <text x="20" y="292" class="muted head">2 · Long-term trim  (learned, saved)</text>
  <rect x="20" y="306" width="230" height="64" rx="6" class="safe"/>
  <text x="135" y="331" text-anchor="middle" class="fg head">Learn gate</text>
  <text x="135" y="353" text-anchor="middle" class="muted">warm, steady, + Learn While</text>
  <rect x="290" y="306" width="230" height="64" rx="6" class="tgt"/>
  <text x="405" y="331" text-anchor="middle" class="fg head">Lambda Delay</text>
  <text x="405" y="353" text-anchor="middle" class="muted">which cell made this gas</text>
  <rect x="560" y="306" width="230" height="64" rx="6" class="ff"/>
  <text x="675" y="331" text-anchor="middle" class="fg head">Long Term Fuel Trim</text>
  <text x="675" y="353" text-anchor="middle" class="muted">same grid as the VE table</text>
  <path d="M680 150 V180 H820 V338 H792" class="line" marker-end="url(#a)"/>
  <text x="828" y="262" class="muted">STFT handed over</text>
  <path d="M250 338 H288" class="line" marker-end="url(#a)"/>
  <path d="M520 338 H558" class="line" marker-end="url(#a)"/>
  <path d="M790 322 H965 V152" class="line" marker-end="url(#a)"/>
  <text x="872" y="314" class="mono muted">ltft_pct</text>
  <rect x="560" y="400" width="230" height="52" rx="6" class="box"/>
  <text x="675" y="425" text-anchor="middle" class="fg head">Apply to Base Table</text>
  <text x="675" y="443" text-anchor="middle" class="muted">folds it into VE, resets it</text>
  <path d="M675 370 V398" class="line" marker-end="url(#a)"/>
</svg>
