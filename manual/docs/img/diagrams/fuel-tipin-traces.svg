<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>Reading a tip-in on the lambda trace</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .axis { stroke: #5f6670; stroke-width: 1.5; fill: none; }
    .tps  { stroke: #d9822b; stroke-width: 2.5; fill: none; }
    .lam  { stroke: #3b82c4; stroke-width: 2.5; fill: none; }
    .tgt  { stroke: #2e9d4f; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .head { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; } .axis { stroke: #9aa1ab; }
    }
  </style>

  <!-- three panels, each 320 wide: throttle top (y 60..110), lambda below (y 140..280, target at 210) -->
  <g>
    <text x="190" y="30" text-anchor="middle" class="fg head">Too little: lean spike</text>
    <path d="M40 110 H120 L140 60 H340" class="tps"/>
    <path d="M40 140 V280 H340" class="axis"/>
    <path d="M40 210 H340" class="tgt"/>
    <path d="M40 210 H140 C 160 210, 165 150, 185 150 C 210 150, 220 205, 260 210 H340" class="lam"/>
    <text x="60" y="165" class="fg">leaner ↑</text>
    <text x="190" y="310" text-anchor="middle" class="fg">more Enrich Rate</text>
  </g>
  <g transform="translate(370 0)">
    <text x="190" y="30" text-anchor="middle" class="fg head">About right</text>
    <path d="M40 110 H120 L140 60 H340" class="tps"/>
    <path d="M40 140 V280 H340" class="axis"/>
    <path d="M40 210 H340" class="tgt"/>
    <path d="M40 210 H140 C 160 210, 165 200, 185 203 C 210 206, 220 212, 260 210 H340" class="lam"/>
    <text x="190" y="310" text-anchor="middle" class="fg">leave it</text>
  </g>
  <g transform="translate(740 0)">
    <text x="170" y="30" text-anchor="middle" class="fg head">Too much: rich dip</text>
    <path d="M20 110 H100 L120 60 H320" class="tps"/>
    <path d="M20 140 V280 H320" class="axis"/>
    <path d="M20 210 H320" class="tgt"/>
    <path d="M20 210 H120 C 140 210, 145 268, 165 268 C 190 268, 200 215, 240 210 H320" class="lam"/>
    <text x="40" y="262" class="fg">richer ↓</text>
    <text x="170" y="310" text-anchor="middle" class="fg">less Enrich Rate</text>
  </g>

  <text x="40" y="54" class="muted">throttle</text>
  <text x="40" y="134" class="muted">lambda</text>
  <text x="560" y="345" text-anchor="middle" class="muted">dashed green: target lambda. A spike that comes late, after the throttle has stopped moving, points at Decay Rate instead.</text>
</svg>
