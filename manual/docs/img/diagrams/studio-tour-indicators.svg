<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>The connection chip and the Burn button, in each of their states</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .line { stroke: #5f6670; stroke-width: 2; fill: none; }
    .box  { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .btn  { fill: #eceef1; stroke: #b9bec6; stroke-width: 1.5; }
    .chipbody { fill: #1d1f23; } .chippin { stroke: #1d1f23; stroke-width: 2.5; }
    .mono { font-family: ui-monospace, 'Ubuntu Mono', Consolas, monospace; font-size: 12px; }
    .head { font-weight: 600; }
    .grey  { stroke: #8b9099; } .amber { stroke: #eeaa3c; } .green { stroke: #46b35a; } .red { stroke: #e0524f; }
    .ring  { fill: none; stroke-width: 4; stroke-linecap: round; }
    .fgrey { fill: none; stroke: #8b9099; stroke-width: 1.5; } .famber { fill: #eeaa3c; } .fgreen { fill: #46b35a; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .line { stroke: #9aa1ab; } .box { fill: #20232a; stroke: #9aa1ab; }
      .btn { fill: #2a2d33; stroke: #4a4f58; }
      .chipbody { fill: #e4e6ea; } .chippin { stroke: #e4e6ea; }
    }
  </style>
  <defs>
    <g id="chip">
      <rect x="-9" y="-9" width="18" height="18" rx="2" class="chipbody"/>
      <path d="M-13 -5.8 H-9 M-13 0 H-9 M-13 5.8 H-9 M9 -5.8 H13 M9 0 H13 M9 5.8 H13" class="chippin"/>
    </g>
  </defs>

  <!-- ===== connection chip ===== -->
  <text x="20" y="30" class="muted head">The connection chip (click it to connect or disconnect)</text>

  <circle cx="135" cy="85" r="24" class="ring grey"/>
  <use href="#chip" x="135" y="85"/>
  <text x="135" y="137" text-anchor="middle" class="fg head">Grey</text>
  <text x="135" y="158" text-anchor="middle" class="muted">not connected</text>

  <path d="M 409 85 A 24 24 0 1 1 385 61" class="ring amber"/>
  <use href="#chip" x="385" y="85"/>
  <text x="385" y="137" text-anchor="middle" class="fg head">Amber, turning</text>
  <text x="385" y="158" text-anchor="middle" class="muted">connecting, reading the tune</text>

  <circle cx="635" cy="85" r="24" class="ring green"/>
  <use href="#chip" x="635" y="85"/>
  <text x="635" y="137" text-anchor="middle" class="fg head">Green</text>
  <text x="635" y="158" text-anchor="middle" class="muted">connected, tune read</text>

  <path d="M 905.8 97 A 24 24 0 1 1 905.8 73" class="ring red"/>
  <use href="#chip" x="885" y="85"/>
  <text x="885" y="137" text-anchor="middle" class="fg head">Red, broken ring</text>
  <text x="885" y="158" text-anchor="middle" class="muted">the link failed or dropped</text>

  <!-- ===== burn button ===== -->
  <text x="20" y="214" class="muted head">The Burn button (the dot says whether flash has your changes)</text>

  <rect x="75" y="244" width="120" height="30" rx="4" class="btn"/>
  <circle cx="92" cy="259" r="4" class="fgrey"/>
  <text x="143" y="264" text-anchor="middle" class="muted">Burn</text>
  <text x="135" y="306" text-anchor="middle" class="fg head">Hollow grey</text>
  <text x="135" y="327" text-anchor="middle" class="muted">nothing to burn (greyed out)</text>

  <rect x="325" y="244" width="120" height="30" rx="4" class="btn" style="stroke:#eeaa3c;stroke-width:2"/>
  <circle cx="342" cy="259" r="4.5" class="famber"/>
  <text x="393" y="264" text-anchor="middle" class="fg">Burn</text>
  <text x="385" y="306" text-anchor="middle" class="fg head">Amber dot and edge</text>
  <text x="385" y="327" text-anchor="middle" class="muted">changes flash does not have</text>

  <rect x="575" y="244" width="120" height="30" rx="4" class="btn"/>
  <circle cx="592" cy="259" r="5" fill="none" stroke="#46b35a" stroke-width="2"/>
  <text x="643" y="264" text-anchor="middle" class="fg">Burn</text>
  <text x="635" y="306" text-anchor="middle" class="fg head">Hollow green ring</text>
  <text x="635" y="327" text-anchor="middle" class="muted">burn sent, not in flash yet</text>

  <rect x="825" y="244" width="120" height="30" rx="4" class="btn"/>
  <circle cx="842" cy="259" r="4.5" class="fgreen"/>
  <text x="893" y="264" text-anchor="middle" class="fg">Burn</text>
  <text x="885" y="306" text-anchor="middle" class="fg head">Solid green</text>
  <text x="885" y="327" text-anchor="middle" class="muted">in flash (shown for about 2 s)</text>
</svg>
