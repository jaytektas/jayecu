  <text x="284.0" y="62.0" class="muted">pickup</text>
  <path d="M260 270 L114.0 270.0" class="grnline"/>
  <text x="165.0" y="290.0" text-anchor="middle" class="fg small head">TDC #1 mark</text>
  <path d="M260 270 L260 124" class="orgline"/>
  <path d="M190.0 270.0 A 70 70 0 0 1 260.0 200.0" class="orgline" marker-end="url(#o)"/>
  <text x="202.0" y="212.0" text-anchor="middle" class="fg head">90°</text>
  <text x="270.0" y="340.0" text-anchor="middle" class="muted small">at this instant the reference</text>
  <text x="270.0" y="358.0" text-anchor="middle" class="muted small">tooth is under the pickup</text>
  <path d="M433.2 370.0 A 200 200 0 0 1 360.0 443.2" class="line" marker-end="url(#a)"/>
  <text x="370.0" y="447.2" class="muted small">turns clockwise</text>
  <text x="520.0" y="70.0" class="fg head">Trigger Offset BTDC</text>
  <text x="520.0" y="96.0" class="fg">How far before TDC #1 the reference passes the pickup.</text>
  <text x="520.0" y="118.0" class="muted">Here the TDC #1 mark still has 90° to turn: the offset is 90.</text>
  <rect x="520" y="150" width="500" height="120" rx="6" class="tgt"/>
  <text x="536.0" y="178.0" class="mono fg">engine angle = decoder angle − Trigger Offset BTDC</text>
  <text x="536.0" y="206.0" class="mono fg">reference tooth: decoder 0°  →  engine −90° = 630° (90° BTDC)</text>
  <text x="536.0" y="232.0" class="mono fg">TDC #1:          decoder 90° →  engine 0°</text>
  <text x="536.0" y="256.0" class="muted small">(on a four-stroke, engine angles run 0 … 720°)</text>
  <text x="520.0" y="310.0" class="fg">Positive = the reference comes BEFORE TDC #1.</text>
  <text x="520.0" y="332.0" class="muted">Negative = it comes after. Raising the number tells the ECU</text>
  <text x="520.0" y="352.0" class="muted">TDC is further away, so every event moves later.</text>
  <text x="520.0" y="392.0" class="muted">Pickup Angle only turns the studio's drawing to match the</text>
  <text x="520.0" y="412.0" class="muted">engine. The ECU never uses it.</text>
