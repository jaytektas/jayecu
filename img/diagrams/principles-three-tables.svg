<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>Three tables, three questions</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .line { stroke: #5f6670; stroke-width: 2; fill: none; }
    .box  { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .tgt  { fill: #e8f1fb; stroke: #3b82c4; stroke-width: 2; }
    .ff   { fill: #fdf0e3; stroke: #d9822b; stroke-width: 2; }
    .pid  { fill: #eef7ee; stroke: #2e9d4f; stroke-width: 2; }
    .mono { font-family: ui-monospace, 'Ubuntu Mono', Consolas, monospace; font-size: 12px; }
    .head { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .line { stroke: #9aa1ab; } .box { fill: #20232a; stroke: #9aa1ab; }
      .tgt { fill: #16283b; } .ff { fill: #33240f; } .pid { fill: #13291a; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a9099"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="300" height="80" rx="6" class="tgt"/>
  <text x="170" y="46" text-anchor="middle" class="fg head">VE Table</text>
  <text x="170" y="68" text-anchor="middle" class="fg">How much AIR the engine takes in</text>
  <text x="170" y="88" text-anchor="middle" class="muted">a fact about the engine</text>

  <rect x="20" y="115" width="300" height="80" rx="6" class="tgt"/>
  <text x="170" y="141" text-anchor="middle" class="fg head">Target Lambda</text>
  <text x="170" y="163" text-anchor="middle" class="fg">How RICH you want the mixture</text>
  <text x="170" y="183" text-anchor="middle" class="muted">your choice</text>

  <rect x="20" y="210" width="300" height="80" rx="6" class="tgt"/>
  <text x="170" y="236" text-anchor="middle" class="fg head">Advance Table</text>
  <text x="170" y="258" text-anchor="middle" class="fg">WHEN the spark fires</text>
  <text x="170" y="278" text-anchor="middle" class="muted">your choice, limited by knock</text>

  <path d="M320 60 H418" class="line" marker-end="url(#a)"/>
  <path d="M320 155 H418" class="line" marker-end="url(#a)"/>
  <rect x="420" y="30" width="300" height="160" rx="6" class="ff"/>
  <text x="570" y="62" text-anchor="middle" class="fg head">Fuel</text>
  <text x="570" y="92" text-anchor="middle" class="fg">air mass</text>
  <line x1="480" y1="104" x2="660" y2="104" class="line"/>
  <text x="570" y="124" text-anchor="middle" class="fg">stoich AFR × target lambda</text>
  <text x="570" y="162" text-anchor="middle" class="muted">then the injector's flow and dead time</text>

  <path d="M720 110 H818" class="line" marker-end="url(#a)"/>
  <path d="M320 250 H870 V192" class="line" marker-end="url(#a)"/>
  <rect x="820" y="80" width="260" height="110" rx="6" class="pid"/>
  <text x="950" y="112" text-anchor="middle" class="fg head">The engine</text>
  <text x="950" y="138" text-anchor="middle" class="fg">the wideband measures</text>
  <text x="950" y="160" text-anchor="middle" class="fg">what actually happened</text>
  <text x="950" y="180" text-anchor="middle" class="mono fg">lambda_1</text>
</svg>
