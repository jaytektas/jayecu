<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>The life of a trouble code</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .line { stroke: #5f6670; stroke-width: 2; fill: none; }
    .box  { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .act  { fill: #fbeaea; stroke: #c8412d; stroke-width: 2; }
    .sto  { fill: #fdf0e3; stroke: #d9822b; stroke-width: 2; }
    .ok   { fill: #eef7ee; stroke: #2e9d4f; stroke-width: 2; }
    .head { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .line { stroke: #9aa1ab; } .box { fill: #20232a; stroke: #9aa1ab; }
      .act { fill: #361512; } .sto { fill: #33240f; } .ok { fill: #13291a; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a9099"/>
    </marker>
  </defs>

  <rect x="20" y="40" width="190" height="90" rx="6" class="ok"/>
  <text x="115" y="72" text-anchor="middle" class="fg head">No code</text>
  <text x="115" y="96" text-anchor="middle" class="muted">nothing wrong seen</text>

  <path d="M210 70 H298" class="line" marker-end="url(#a)"/>
  <text x="254" y="60" text-anchor="middle" class="muted">fault seen</text>

  <rect x="300" y="30" width="260" height="110" rx="6" class="act"/>
  <text x="430" y="58" text-anchor="middle" class="fg head">Active + Stored</text>
  <text x="430" y="82" text-anchor="middle" class="fg">happening now; count +1;</text>
  <text x="430" y="104" text-anchor="middle" class="fg">freeze frame taken</text>
  <text x="430" y="126" text-anchor="middle" class="muted">protection level acts (chapter 29)</text>

  <path d="M560 70 H648" class="line" marker-end="url(#a)"/>
  <text x="604" y="60" text-anchor="middle" class="muted">fault gone</text>
  <path d="M648 110 H562" class="line" marker-end="url(#a)"/>
  <text x="604" y="130" text-anchor="middle" class="muted">again</text>

  <rect x="650" y="30" width="230" height="110" rx="6" class="sto"/>
  <text x="765" y="58" text-anchor="middle" class="fg head">Stored</text>
  <text x="765" y="82" text-anchor="middle" class="fg">history; kept on the SD card</text>
  <text x="765" y="104" text-anchor="middle" class="fg">through power-off</text>

  <path d="M880 70 H920 V140" class="line"/>
  <path d="M920 200 V228" class="line" marker-end="url(#a)"/>
  <text x="930" y="152" class="muted">40 clean key cycles,</text>
  <text x="930" y="172" class="muted">or Clear All,</text>
  <text x="930" y="192" class="muted">or OBD mode 04</text>
  <rect x="820" y="230" width="200" height="70" rx="6" class="ok"/>
  <text x="920" y="262" text-anchor="middle" class="fg head">Removed</text>
  <text x="920" y="284" text-anchor="middle" class="muted">from the table</text>

  <!-- severity strip -->
  <rect x="20" y="200" width="760" height="130" rx="6" class="box"/>
  <text x="40" y="228" class="fg head">Every code has a severity, fixed by the ECU:</text>
  <text x="40" y="256" class="fg">Level 1, Level 2 or Level 3 (the most serious). What each level does is yours to set.</text>
  <text x="40" y="284" class="fg">The worst active (or stored, if you choose) severity picks which protection level acts.</text>
  <text x="40" y="310" class="muted">A fault stays active while it keeps being seen; an event (pre-ignition, a script's code) until cleared.</text>
</svg>
