<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 670" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>What the studio does when it connects to an ECU</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .line { stroke: #5f6670; stroke-width: 2; fill: none; }
    .box  { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .tgt  { fill: #e8f1fb; stroke: #3b82c4; stroke-width: 2; }
    .ff   { fill: #fdf0e3; stroke: #d9822b; stroke-width: 2; }
    .pid  { fill: #eef7ee; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fbeaea; stroke: #c8412d; stroke-width: 2; }
    .safeline { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .node { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .mono { font-family: ui-monospace, 'Ubuntu Mono', Consolas, monospace; font-size: 12px; }
    .head { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .line { stroke: #9aa1ab; } .box, .node { fill: #20232a; stroke: #9aa1ab; }
      .tgt { fill: #16283b; } .ff { fill: #33240f; } .pid { fill: #13291a; } .safe { fill: #361512; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a9099"/>
    </marker>
  </defs>

  <!-- 1 · identity -->
  <rect x="20" y="20" width="1060" height="70" rx="6" class="box"/>
  <text x="40" y="47" class="fg head">1 · The ECU says who it is</text>
  <text x="40" y="72" class="mono muted">jayecu &lt;board&gt; &lt;version&gt; &lt;build&gt; &lt;layout_hash&gt; &lt;ECU factory ID&gt; t&lt;live-data frame size&gt;</text>
  <path d="M135 90 V128" class="line" marker-end="url(#a)"/>

  <!-- 2 · firmware offer -->
  <rect x="20" y="130" width="230" height="70" rx="6" class="box"/>
  <text x="135" y="159" text-anchor="middle" class="fg head">2 · Newer firmware?</text>
  <text x="135" y="181" text-anchor="middle" class="muted">a kit the studio holds</text>
  <path d="M250 165 H288" class="line" marker-end="url(#a)"/>
  <rect x="290" y="130" width="320" height="70" rx="6" class="box"/>
  <text x="450" y="159" text-anchor="middle" class="fg">Offer the update</text>
  <text x="450" y="181" text-anchor="middle" class="muted">nothing changes unless you accept</text>
  <path d="M135 200 V238" class="line" marker-end="url(#a)"/>

  <!-- 3 · definition -->
  <rect x="20" y="240" width="230" height="70" rx="6" class="box"/>
  <text x="135" y="269" text-anchor="middle" class="fg head">3 · Find the definition</text>
  <text x="135" y="291" text-anchor="middle" class="muted">matched by layout_hash</text>
  <path d="M250 275 H288" class="line" marker-end="url(#a)"/>
  <rect x="290" y="240" width="220" height="70" rx="6" class="tgt"/>
  <text x="400" y="269" text-anchor="middle" class="fg">In the library</text>
  <text x="400" y="291" text-anchor="middle" class="mono muted">&lt;board&gt; &lt;hash&gt;.meta</text>
  <path d="M510 275 H528" class="line" marker-end="url(#a)"/>
  <rect x="530" y="240" width="220" height="70" rx="6" class="box"/>
  <text x="640" y="269" text-anchor="middle" class="fg">On the ECU's SD card</text>
  <text x="640" y="291" text-anchor="middle" class="muted">fetched, then kept</text>
  <path d="M750 275 H768" class="line" marker-end="url(#a)"/>
  <rect x="770" y="240" width="220" height="70" rx="6" class="box"/>
  <text x="880" y="269" text-anchor="middle" class="fg">Ask you</text>
  <text x="880" y="291" text-anchor="middle" class="muted">pick one, or open a file</text>
  <path d="M135 310 V348" class="line" marker-end="url(#a)"/>

  <!-- 4 · layout -->
  <rect x="20" y="350" width="230" height="70" rx="6" class="box"/>
  <text x="135" y="379" text-anchor="middle" class="fg head">4 · Find the layout</text>
  <text x="135" y="401" text-anchor="middle" class="muted">the pages you will see</text>
  <path d="M250 385 H288" class="line" marker-end="url(#a)"/>
  <rect x="290" y="350" width="185" height="70" rx="6" class="tgt"/>
  <text x="382" y="379" text-anchor="middle" class="fg">This ECU's layout</text>
  <text x="382" y="401" text-anchor="middle" class="mono muted">dashboard.gui</text>
  <path d="M475 385 H488" class="line" marker-end="url(#a)"/>
  <rect x="490" y="350" width="185" height="70" rx="6" class="box"/>
  <text x="582" y="379" text-anchor="middle" class="fg">The board's layout</text>
  <text x="582" y="401" text-anchor="middle" class="mono muted">&lt;board&gt;.gui</text>
  <path d="M675 385 H688" class="line" marker-end="url(#a)"/>
  <rect x="690" y="350" width="185" height="70" rx="6" class="box"/>
  <text x="782" y="379" text-anchor="middle" class="fg">On the ECU's SD card</text>
  <text x="782" y="401" text-anchor="middle" class="mono muted">&lt;board&gt; &lt;hash&gt;.gui</text>
  <path d="M875 385 H888" class="line" marker-end="url(#a)"/>
  <rect x="890" y="350" width="185" height="70" rx="6" class="box"/>
  <text x="982" y="379" text-anchor="middle" class="fg">From the definition</text>
  <text x="982" y="401" text-anchor="middle" class="muted">page tree only</text>
  <path d="M135 420 V458" class="line" marker-end="url(#a)"/>

  <!-- 5 · read the tune -->
  <rect x="20" y="460" width="230" height="70" rx="6" class="box"/>
  <text x="135" y="489" text-anchor="middle" class="fg head">5 · Read the tune</text>
  <text x="135" y="511" text-anchor="middle" class="muted">a read changes nothing</text>
  <path d="M250 495 H288" class="line" marker-end="url(#a)"/>
  <rect x="290" y="460" width="320" height="70" rx="6" class="box"/>
  <text x="450" y="489" text-anchor="middle" class="fg">Saved as a restore point</text>
  <text x="450" y="511" text-anchor="middle" class="mono muted">restore/&lt;tune&gt; &lt;date time&gt;.tune</text>
  <path d="M135 530 V568" class="line" marker-end="url(#a)"/>

  <!-- 6 · compare -->
  <rect x="20" y="570" width="230" height="70" rx="6" class="box"/>
  <text x="135" y="599" text-anchor="middle" class="fg head">6 · Compare</text>
  <text x="135" y="621" text-anchor="middle" class="muted">with your saved tune</text>
  <path d="M250 605 H288" class="line" marker-end="url(#a)"/>
  <rect x="290" y="570" width="220" height="70" rx="6" class="pid"/>
  <text x="400" y="599" text-anchor="middle" class="fg head">Same</text>
  <text x="400" y="621" text-anchor="middle" class="muted">connected, nothing asked</text>
  <text x="535" y="610" text-anchor="middle" class="muted">or</text>
  <rect x="560" y="570" width="400" height="70" rx="6" class="ff"/>
  <text x="760" y="599" text-anchor="middle" class="fg head">Different · you choose</text>
  <text x="760" y="621" text-anchor="middle" class="muted">keep the ECU's tune · push yours · exit</text>
</svg>
