<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>Where each cylinder's TDC falls in the engine cycle: an even-fire four, an odd-fire V-twin and a two-rotor rotary</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .axis { stroke: #5f6670; stroke-width: 2; fill: none; }
    .tick { stroke: #5f6670; stroke-width: 1.5; fill: none; }
    .tgt  { fill: #e8f1fb; stroke: #3b82c4; stroke-width: 2; }
    .alt  { fill: #ffffff; stroke: #3b82c4; stroke-width: 2; stroke-dasharray: 4 3; }
    .pair { stroke: #d9822b; stroke-width: 2; fill: none; }
    .again { fill: none; stroke: #5f6670; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .span { stroke: #3b82c4; stroke-width: 1.5; fill: none; }
    .mono { font-family: ui-monospace, 'Ubuntu Mono', Consolas, monospace; font-size: 12px; }
    .head { font-weight: 600; }
    .orange { fill: #b8661b; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .axis, .tick { stroke: #9aa1ab; } .again { stroke: #9aa1ab; }
      .tgt { fill: #16283b; } .alt { fill: #20232a; }
      .orange { fill: #e59a4f; }
    }
  </style>

  <text x="20" y="40" class="fg head">A · Four-cylinder, firing order 1-3-4-2 · Four-Stroke (720°) · even-fire</text>
  <text x="20" y="60" class="muted">The ECU works out every TDC: position in the order × 720 ÷ 4 = 180° apart.</text>
  <path d="M140 150 H1020" class="axis"/>
  <path d="M140.0 144 V156" class="tick"/>
  <text x="140.0" y="190" text-anchor="middle" class="muted mono">0°</text>
  <path d="M250.0 144 V156" class="tick"/>
  <text x="250.0" y="190" text-anchor="middle" class="muted mono">90°</text>
  <path d="M360.0 144 V156" class="tick"/>
  <text x="360.0" y="190" text-anchor="middle" class="muted mono">180°</text>
  <path d="M470.0 144 V156" class="tick"/>
  <text x="470.0" y="190" text-anchor="middle" class="muted mono">270°</text>
  <path d="M580.0 144 V156" class="tick"/>
  <text x="580.0" y="190" text-anchor="middle" class="muted mono">360°</text>
  <path d="M690.0 144 V156" class="tick"/>
  <text x="690.0" y="190" text-anchor="middle" class="muted mono">450°</text>
  <path d="M800.0 144 V156" class="tick"/>
  <text x="800.0" y="190" text-anchor="middle" class="muted mono">540°</text>
  <path d="M910.0 144 V156" class="tick"/>
  <text x="910.0" y="190" text-anchor="middle" class="muted mono">630°</text>
  <path d="M1020.0 144 V156" class="tick"/>
  <text x="1020.0" y="190" text-anchor="middle" class="muted mono">720°</text>
  <text x="118" y="155" text-anchor="end" class="muted">crank °</text>
  <circle cx="140.0" cy="150" r="15" class="tgt"/>
  <text x="140.0" y="155" text-anchor="middle" class="fg head">1</text>
  <circle cx="360.0" cy="150" r="15" class="tgt"/>
  <text x="360.0" y="155" text-anchor="middle" class="fg head">3</text>
  <circle cx="580.0" cy="150" r="15" class="tgt"/>
  <text x="580.0" y="155" text-anchor="middle" class="fg head">4</text>
  <circle cx="800.0" cy="150" r="15" class="tgt"/>
  <text x="800.0" y="155" text-anchor="middle" class="fg head">2</text>
  <circle cx="1020.0" cy="150" r="15" class="again"/>
  <text x="1020.0" y="155" text-anchor="middle" class="fg head">1</text>
  <path d="M140.0 133 C140.0 88 580.0 88 580.0 133" class="pair"/>
  <path d="M360.0 133 C360.0 100 800.0 100 800.0 133" class="pair"/>
  <text x="730.0" y="106" class="orange">wasted-spark pairs, 360° apart: 1 + 4, 3 + 2</text>
  <text x="140.0" y="212" text-anchor="middle" class="muted">1st</text>
  <text x="360.0" y="212" text-anchor="middle" class="muted">2nd</text>
  <text x="580.0" y="212" text-anchor="middle" class="muted">3rd</text>
  <text x="800.0" y="212" text-anchor="middle" class="muted">4th</text>
  <text x="20" y="252" class="fg head">B · 90° V-twin, firing order 1-2 · Four-Stroke (720°) · odd-fire</text>
  <text x="20" y="272" class="muted">Odd-Fire Engine on: you type each TDC Angle, because the gaps are not equal.</text>
  <path d="M140 340 H1020" class="axis"/>
  <path d="M140.0 334 V346" class="tick"/>
  <text x="140.0" y="380" text-anchor="middle" class="muted mono">0°</text>
  <path d="M250.0 334 V346" class="tick"/>
  <text x="250.0" y="380" text-anchor="middle" class="muted mono">90°</text>
  <path d="M360.0 334 V346" class="tick"/>
  <text x="360.0" y="380" text-anchor="middle" class="muted mono">180°</text>
  <path d="M470.0 334 V346" class="tick"/>
  <text x="470.0" y="380" text-anchor="middle" class="muted mono">270°</text>
  <path d="M580.0 334 V346" class="tick"/>
  <text x="580.0" y="380" text-anchor="middle" class="muted mono">360°</text>
  <path d="M690.0 334 V346" class="tick"/>
  <text x="690.0" y="380" text-anchor="middle" class="muted mono">450°</text>
  <path d="M800.0 334 V346" class="tick"/>
  <text x="800.0" y="380" text-anchor="middle" class="muted mono">540°</text>
  <path d="M910.0 334 V346" class="tick"/>
  <text x="910.0" y="380" text-anchor="middle" class="muted mono">630°</text>
  <path d="M1020.0 334 V346" class="tick"/>
  <text x="1020.0" y="380" text-anchor="middle" class="muted mono">720°</text>
  <text x="118" y="345" text-anchor="end" class="muted">crank °</text>
  <circle cx="140.0" cy="340" r="15" class="tgt"/>
  <text x="140.0" y="345" text-anchor="middle" class="fg head">1</text>
  <circle cx="470.0" cy="340" r="15" class="tgt"/>
  <text x="470.0" y="345" text-anchor="middle" class="fg head">2</text>
  <circle cx="1020.0" cy="340" r="15" class="again"/>
  <text x="1020.0" y="345" text-anchor="middle" class="fg head">1</text>
  <path d="M158.0 314 H452.0" class="span"/>
  <text x="305.0" y="308" text-anchor="middle" class="muted">270°</text>
  <path d="M488.0 314 H1002.0" class="span"/>
  <text x="745.0" y="308" text-anchor="middle" class="muted">450°</text>
  <text x="20" y="442" class="fg head">C · Two-rotor rotary, faces 1-4-2-5-3-6 · Rotary (1080°) · even-fire</text>
  <text x="20" y="462" class="muted">Each rotor face is one “cylinder”: 2 rotors × 3 faces = 6. 1080 ÷ 6 = 180° apart. Faces 1–3 are rotor 1 (solid), 4–6 rotor 2 (dashed).</text>
  <path d="M140 530 H1020" class="axis"/>
  <path d="M140.0 524 V536" class="tick"/>
  <text x="140.0" y="570" text-anchor="middle" class="muted mono">0°</text>
  <path d="M286.7 524 V536" class="tick"/>
  <text x="286.7" y="570" text-anchor="middle" class="muted mono">180°</text>
  <path d="M433.3 524 V536" class="tick"/>
  <text x="433.3" y="570" text-anchor="middle" class="muted mono">360°</text>
  <path d="M580.0 524 V536" class="tick"/>
  <text x="580.0" y="570" text-anchor="middle" class="muted mono">540°</text>
  <path d="M726.7 524 V536" class="tick"/>
  <text x="726.7" y="570" text-anchor="middle" class="muted mono">720°</text>
  <path d="M873.3 524 V536" class="tick"/>
  <text x="873.3" y="570" text-anchor="middle" class="muted mono">900°</text>
  <path d="M1020.0 524 V536" class="tick"/>
  <text x="1020.0" y="570" text-anchor="middle" class="muted mono">1080°</text>
  <text x="118" y="535" text-anchor="end" class="muted">crank °</text>
  <circle cx="140.0" cy="530" r="15" class="tgt"/>
  <text x="140.0" y="535" text-anchor="middle" class="fg head">1</text>
  <circle cx="286.7" cy="530" r="15" class="alt"/>
  <text x="286.7" y="535" text-anchor="middle" class="fg head">4</text>
  <circle cx="433.3" cy="530" r="15" class="tgt"/>
  <text x="433.3" y="535" text-anchor="middle" class="fg head">2</text>
  <circle cx="580.0" cy="530" r="15" class="alt"/>
  <text x="580.0" y="535" text-anchor="middle" class="fg head">5</text>
  <circle cx="726.7" cy="530" r="15" class="tgt"/>
  <text x="726.7" y="535" text-anchor="middle" class="fg head">3</text>
  <circle cx="873.3" cy="530" r="15" class="alt"/>
  <text x="873.3" y="535" text-anchor="middle" class="fg head">6</text>
  <circle cx="1020" cy="530" r="15" class="again"/>
  <text x="1020" y="535" text-anchor="middle" class="muted">1</text>
  <text x="20" y="620" class="muted">Grey dotted circle at the right-hand end: the cycle starts again.</text>
</svg>
