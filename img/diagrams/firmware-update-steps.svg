<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>A firmware update, step by step</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .line { stroke: #5f6670; stroke-width: 2; fill: none; }
    .box  { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .tgt  { fill: #e8f1fb; stroke: #3b82c4; stroke-width: 2; }
    .ff   { fill: #fdf0e3; stroke: #d9822b; stroke-width: 2; }
    .ok   { fill: #eef7ee; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fbeaea; stroke: #c8412d; stroke-width: 2; }
    .head { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .line { stroke: #9aa1ab; } .box { fill: #20232a; stroke: #9aa1ab; }
      .tgt { fill: #16283b; } .ff { fill: #33240f; } .ok { fill: #13291a; } .safe { fill: #361512; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a9099"/>
    </marker>
  </defs>

  <!-- row 1 -->
  <rect x="20"  y="30" width="190" height="90" rx="6" class="tgt"/>
  <text x="115" y="56" text-anchor="middle" class="fg head">1 · Read the tune</text>
  <text x="115" y="80" text-anchor="middle" class="fg">from the ECU</text>
  <text x="115" y="100" text-anchor="middle" class="muted">nothing written</text>

  <rect x="240" y="30" width="200" height="90" rx="6" class="tgt"/>
  <text x="340" y="56" text-anchor="middle" class="fg head">2 · Show the changes</text>
  <text x="340" y="80" text-anchor="middle" class="fg">going out / new in</text>
  <text x="340" y="100" text-anchor="middle" class="fg">Update firmware / Not now</text>

  <rect x="470" y="30" width="190" height="90" rx="6" class="safe"/>
  <text x="565" y="56" text-anchor="middle" class="fg head">3 · Safe?</text>
  <text x="565" y="80" text-anchor="middle" class="fg">ignition off, engine</text>
  <text x="565" y="100" text-anchor="middle" class="fg">stopped, USB only</text>

  <rect x="690" y="30" width="190" height="90" rx="6" class="box"/>
  <text x="785" y="56" text-anchor="middle" class="fg head">Back up the tune</text>
  <text x="785" y="80" text-anchor="middle" class="fg">beside the ECU's</text>
  <text x="785" y="100" text-anchor="middle" class="fg">other tunes</text>

  <rect x="910" y="30" width="170" height="90" rx="6" class="ff"/>
  <text x="995" y="56" text-anchor="middle" class="fg head">4 · Flash</text>
  <text x="995" y="80" text-anchor="middle" class="fg">bootloader; erase,</text>
  <text x="995" y="100" text-anchor="middle" class="fg">write, verify</text>

  <path d="M210 75 H238" class="line" marker-end="url(#a)"/>
  <path d="M440 75 H468" class="line" marker-end="url(#a)"/>
  <path d="M660 75 H688" class="line" marker-end="url(#a)"/>
  <path d="M880 75 H908" class="line" marker-end="url(#a)"/>
  <path d="M995 120 V170 H882" class="line" marker-end="url(#a)"/>

  <!-- row 2 -->
  <rect x="690" y="140" width="190" height="90" rx="6" class="box"/>
  <text x="785" y="166" text-anchor="middle" class="fg head">5 · Check</text>
  <text x="785" y="190" text-anchor="middle" class="fg">reconnect: the new</text>
  <text x="785" y="210" text-anchor="middle" class="fg">version and layout?</text>

  <rect x="470" y="140" width="190" height="90" rx="6" class="ok"/>
  <text x="565" y="166" text-anchor="middle" class="fg head">6 · Put the tune back</text>
  <text x="565" y="190" text-anchor="middle" class="fg">converted, checked,</text>
  <text x="565" y="210" text-anchor="middle" class="fg">burned, reset</text>

  <rect x="240" y="140" width="200" height="90" rx="6" class="ok"/>
  <text x="340" y="166" text-anchor="middle" class="fg head">7 · SD card</text>
  <text x="340" y="190" text-anchor="middle" class="fg">new descriptor and</text>
  <text x="340" y="210" text-anchor="middle" class="fg">pages copied onto it</text>

  <rect x="20" y="140" width="190" height="90" rx="6" class="ok"/>
  <text x="115" y="166" text-anchor="middle" class="fg head">8 · Connected</text>
  <text x="115" y="190" text-anchor="middle" class="fg">studio and ECU</text>
  <text x="115" y="210" text-anchor="middle" class="fg">in step</text>

  <path d="M690 185 H662" class="line" marker-end="url(#a)"/>
  <path d="M470 185 H442" class="line" marker-end="url(#a)"/>
  <path d="M240 185 H212" class="line" marker-end="url(#a)"/>

  <text x="565" y="270" text-anchor="middle" class="muted">Not now, or not safe: nothing is changed.</text>
  <text x="565" y="292" text-anchor="middle" class="muted">A failed flash leaves the ECU waiting in its bootloader: Try again, or Connect later (chapter 47).</text>
</svg>
