<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 440" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>What the ECU fires at each sync level</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .line { stroke: #5f6670; stroke-width: 2; fill: none; }
    .box  { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .tgt  { fill: #e8f1fb; stroke: #3b82c4; stroke-width: 2; }
    .ff   { fill: #fdf0e3; stroke: #d9822b; stroke-width: 2; }
    .pid  { fill: #eef7ee; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fbeaea; stroke: #c8412d; stroke-width: 2; }
    .safeline { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .node { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .mono { font-family: ui-monospace, 'Ubuntu Mono', Consolas, monospace; font-size: 12px; }
    .head { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .line { stroke: #9aa1ab; } .box, .node { fill: #20232a; stroke: #9aa1ab; }
      .tgt { fill: #16283b; } .ff { fill: #33240f; } .pid { fill: #13291a; } .safe { fill: #361512; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a9099"/>
    </marker>
  </defs>

  <!-- ===== Column headers: the three sync levels ===== -->
  <text x="20" y="48" class="muted head">Sync level</text>
  <text x="20" y="68" class="mono muted">sync_level</text>

  <rect x="305" y="20" width="225" height="62" rx="6" class="safe"/>
  <text x="417" y="46" text-anchor="middle" class="fg head">None (0)</text>
  <text x="417" y="68" text-anchor="middle" class="muted">position unknown</text>

  <rect x="560" y="20" width="225" height="62" rx="6" class="tgt"/>
  <text x="672" y="46" text-anchor="middle" class="fg head">Crank (1)</text>
  <text x="672" y="68" text-anchor="middle" class="muted">which tooth, 360° span</text>

  <rect x="815" y="20" width="225" height="62" rx="6" class="pid"/>
  <text x="927" y="46" text-anchor="middle" class="fg head">Phase (2)</text>
  <text x="927" y="68" text-anchor="middle" class="muted">cam says which turn</text>

  <path d="M530 51 H558" class="line" marker-end="url(#a)"/>
  <path d="M785 51 H813" class="line" marker-end="url(#a)"/>
  <text x="545" y="102" text-anchor="middle" class="mono muted">crank pattern found</text>
  <text x="800" y="102" text-anchor="middle" class="mono muted">cam seen</text>

  <!-- ===== Rows ===== -->
  <!-- row 1: rpm -->
  <text x="20" y="143" class="fg head">Engine RPM</text>
  <text x="20" y="163" class="mono muted">rpm</text>
  <rect x="305" y="122" width="225" height="50" rx="6" class="safe"/>
  <text x="417" y="152" text-anchor="middle" class="fg">reads 0</text>
  <rect x="560" y="122" width="225" height="50" rx="6" class="box"/>
  <text x="672" y="152" text-anchor="middle" class="fg">real RPM</text>
  <rect x="815" y="122" width="225" height="50" rx="6" class="box"/>
  <text x="927" y="152" text-anchor="middle" class="fg">real RPM</text>

  <!-- row 2: wasted spark -->
  <text x="20" y="203" class="fg head">Wasted Spark</text>
  <text x="20" y="223" class="muted">one coil per cylinder pair</text>
  <rect x="305" y="182" width="225" height="50" rx="6" class="safe"/>
  <text x="417" y="212" text-anchor="middle" class="fg">nothing fires</text>
  <rect x="560" y="182" width="225" height="50" rx="6" class="ff"/>
  <text x="672" y="212" text-anchor="middle" class="fg">fires each pair</text>
  <rect x="815" y="182" width="225" height="50" rx="6" class="ff"/>
  <text x="927" y="212" text-anchor="middle" class="fg">fires each pair</text>

  <!-- row 3: coil on plug -->
  <text x="20" y="263" class="fg head">Coil-on-Plug</text>
  <text x="20" y="283" class="muted">one coil per cylinder</text>
  <rect x="305" y="242" width="225" height="50" rx="6" class="safe"/>
  <text x="417" y="272" text-anchor="middle" class="fg">nothing fires</text>
  <rect x="560" y="242" width="225" height="50" rx="6" class="ff"/>
  <text x="672" y="272" text-anchor="middle" class="fg">companion pairs together</text>
  <rect x="815" y="242" width="225" height="50" rx="6" class="ff"/>
  <text x="927" y="272" text-anchor="middle" class="fg">each coil on its own</text>

  <!-- row 4: grouped injection -->
  <text x="20" y="323" class="fg head">Semi-Sequential,</text>
  <text x="20" y="343" class="fg head">Multi-Point, Bank</text>
  <rect x="305" y="302" width="225" height="50" rx="6" class="safe"/>
  <text x="417" y="332" text-anchor="middle" class="fg">nothing fires</text>
  <rect x="560" y="302" width="225" height="50" rx="6" class="ff"/>
  <text x="672" y="332" text-anchor="middle" class="fg">fires normally</text>
  <rect x="815" y="302" width="225" height="50" rx="6" class="ff"/>
  <text x="927" y="332" text-anchor="middle" class="fg">fires normally</text>

  <!-- row 5: sequential -->
  <text x="20" y="383" class="fg head">Sequential injection</text>
  <text x="20" y="403" class="muted">one injector per cylinder</text>
  <rect x="305" y="362" width="225" height="50" rx="6" class="safe"/>
  <text x="417" y="392" text-anchor="middle" class="fg">nothing fires</text>
  <rect x="560" y="362" width="225" height="50" rx="6" class="ff"/>
  <text x="672" y="384" text-anchor="middle" class="fg">every turn, half the fuel</text>
  <text x="672" y="403" text-anchor="middle" class="muted">each time</text>
  <rect x="815" y="362" width="225" height="50" rx="6" class="ff"/>
  <text x="927" y="384" text-anchor="middle" class="fg">once per cycle, at its</text>
  <text x="927" y="403" text-anchor="middle" class="muted">own cylinder's TDC</text>
</svg>
