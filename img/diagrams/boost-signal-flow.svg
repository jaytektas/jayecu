<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>Boost control signal flow</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .line { stroke: #5f6670; stroke-width: 2; fill: none; }
    .box  { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .tgt  { fill: #e8f1fb; stroke: #3b82c4; stroke-width: 2; }
    .ff   { fill: #fdf0e3; stroke: #d9822b; stroke-width: 2; }
    .pid  { fill: #eef7ee; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fbeaea; stroke: #c8412d; stroke-width: 2; }
    .safeline { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .node { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .mono { font-family: ui-monospace, 'Ubuntu Mono', Consolas, monospace; font-size: 12px; }
    .head { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .line { stroke: #9aa1ab; } .box, .node { fill: #20232a; stroke: #9aa1ab; }
      .tgt { fill: #16283b; } .ff { fill: #33240f; } .pid { fill: #13291a; } .safe { fill: #361512; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a9099"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8412d"/>
    </marker>
  </defs>

  <!-- ===== 1 · TARGET CHAIN ===== -->
  <text x="20" y="28" class="muted head">1 · What boost to ask for</text>
  <rect x="20"  y="42" width="160" height="58" rx="6" class="tgt"/>
  <text x="100" y="66" text-anchor="middle" class="fg head">Boost Target</text>
  <text x="100" y="87" text-anchor="middle" class="muted">table · rpm (gear)</text>
  <rect x="210" y="42" width="130" height="58" rx="6" class="tgt"/>
  <text x="275" y="66" text-anchor="middle" class="fg">+ Trim knob</text>
  <text x="275" y="87" text-anchor="middle" class="muted">optional</text>
  <rect x="370" y="42" width="130" height="58" rx="6" class="tgt"/>
  <text x="435" y="66" text-anchor="middle" class="fg">+ Scramble</text>
  <text x="435" y="87" text-anchor="middle" class="muted">while active</text>
  <rect x="530" y="42" width="180" height="58" rx="6" class="tgt"/>
  <text x="620" y="66" text-anchor="middle" class="fg">× Target corrections</text>
  <text x="620" y="87" text-anchor="middle" class="muted">slots set to “Target”</text>
  <rect x="740" y="42" width="170" height="58" rx="6" class="safe"/>
  <text x="825" y="66" text-anchor="middle" class="fg">× Protection</text>
  <text x="825" y="87" text-anchor="middle" class="muted">−100 % = no boost</text>
  <path d="M180 71 H208" class="line" marker-end="url(#a)"/>
  <path d="M340 71 H368" class="line" marker-end="url(#a)"/>
  <path d="M500 71 H528" class="line" marker-end="url(#a)"/>
  <path d="M710 71 H738" class="line" marker-end="url(#a)"/>
  <path d="M910 71 H960 V150" class="line" marker-end="url(#a)"/>
  <text x="968" y="116" class="mono muted">boost_target</text>

  <!-- ===== ERROR and PID ===== -->
  <circle cx="960" cy="172" r="20" class="node"/>
  <text x="960" y="178" text-anchor="middle" class="fg" font-size="20">−</text>
  <text x="960" y="210" text-anchor="middle" class="mono muted">boost_error</text>
  <path d="M940 172 H862" class="line" marker-end="url(#a)"/>
  <rect x="650" y="140" width="210" height="64" rx="6" class="pid"/>
  <text x="755" y="165" text-anchor="middle" class="fg head">PID trim</text>
  <text x="755" y="187" text-anchor="middle" class="muted">closed loop, after handover</text>

  <!-- ===== 2 · FEED-FORWARD ===== -->
  <text x="20" y="252" class="muted head">2 · How hard to hold the wastegate shut</text>
  <rect x="20"  y="266" width="190" height="58" rx="6" class="ff"/>
  <text x="115" y="290" text-anchor="middle" class="fg head">Wastegate Base Duty</text>
  <text x="115" y="311" text-anchor="middle" class="muted">table · target (rpm)</text>
  <rect x="240" y="266" width="160" height="58" rx="6" class="ff"/>
  <text x="320" y="290" text-anchor="middle" class="fg">+ Long-term trim</text>
  <text x="320" y="311" text-anchor="middle" class="muted">learned per cell</text>
  <rect x="430" y="266" width="170" height="58" rx="6" class="ff"/>
  <text x="515" y="290" text-anchor="middle" class="fg">+ Duty corrections</text>
  <text x="515" y="311" text-anchor="middle" class="muted">+ scramble duty</text>
  <rect x="630" y="266" width="130" height="58" rx="6" class="safe"/>
  <text x="695" y="290" text-anchor="middle" class="fg">× Protection</text>
  <text x="695" y="311" text-anchor="middle" class="muted">same factor</text>
  <circle cx="800" cy="295" r="20" class="node"/>
  <text x="800" y="301" text-anchor="middle" class="fg" font-size="20">+</text>
  <rect x="850" y="266" width="190" height="58" rx="6" class="box"/>
  <text x="945" y="290" text-anchor="middle" class="fg">Clamp</text>
  <text x="945" y="311" text-anchor="middle" class="muted">min … max duty</text>
  <path d="M210 295 H238" class="line" marker-end="url(#a)"/>
  <path d="M400 295 H428" class="line" marker-end="url(#a)"/>
  <path d="M600 295 H628" class="line" marker-end="url(#a)"/>
  <path d="M760 295 H778" class="line" marker-end="url(#a)"/>
  <path d="M820 295 H848" class="line" marker-end="url(#a)"/>
  <path d="M755 204 V240 H800 V273" class="line" marker-end="url(#a)"/>

  <!-- ===== 3 · HARDWARE ===== -->
  <text x="20" y="372" class="muted head">3 · The hardware, and the pressure it makes</text>
  <path d="M945 324 V352 H650 V384" class="line" marker-end="url(#a)"/>
  <rect x="510" y="386" width="280" height="72" rx="6" class="box"/>
  <text x="650" y="409" text-anchor="middle" class="fg head">Actuator</text>
  <text x="650" y="429" text-anchor="middle" class="muted">Solenoid: <tspan class="mono">wastegate_duty</tspan></text>
  <text x="650" y="448" text-anchor="middle" class="muted">Motorised gate: position loop</text>
  <rect x="280" y="397" width="180" height="50" rx="6" class="box"/>
  <text x="370" y="427" text-anchor="middle" class="fg">Wastegate · turbo</text>
  <rect x="40" y="397" width="170" height="50" rx="6" class="box"/>
  <text x="125" y="427" text-anchor="middle" class="fg">MAP sensor</text>
  <path d="M510 422 H462" class="line" marker-end="url(#a)"/>
  <path d="M280 422 H212" class="line" marker-end="url(#a)"/>

  <!-- feedback: measured MAP back to the error node -->
  <path d="M125 447 V492 H1030 V172 H982" class="line" marker-end="url(#a)"/>
  <text x="580" y="484" text-anchor="middle" class="mono muted">map (measured)</text>

  <!-- ===== OVERBOOST BACKSTOP ===== -->
  <path d="M125 492 V560 H218" class="safeline" marker-end="url(#r)"/>
  <rect x="220" y="532" width="620" height="56" rx="6" class="safe"/>
  <text x="530" y="556" text-anchor="middle" class="fg head">Overboost backstop</text>
  <text x="530" y="577" text-anchor="middle" class="muted">fuel / ignition cut — works on every path, even with boost control switched off</text>
</svg>
