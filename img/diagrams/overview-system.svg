<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>The jayecu system: studio, USB link, ECU and vehicle</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .line { stroke: #5f6670; stroke-width: 2; fill: none; }
    .box  { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .tgt  { fill: #e8f1fb; stroke: #3b82c4; stroke-width: 2; }
    .ff   { fill: #fdf0e3; stroke: #d9822b; stroke-width: 2; }
    .pid  { fill: #eef7ee; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fbeaea; stroke: #c8412d; stroke-width: 2; }
    .safeline { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .node { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .mono { font-family: ui-monospace, 'Ubuntu Mono', Consolas, monospace; font-size: 12px; }
    .head { font-weight: 600; }
    .group { fill: none; stroke: #5f6670; stroke-width: 2; stroke-dasharray: 2 5; }
    .dash { stroke: #5f6670; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .line, .dash { stroke: #9aa1ab; } .box, .node { fill: #20232a; stroke: #9aa1ab; }
      .group { stroke: #9aa1ab; }
      .tgt { fill: #16283b; } .ff { fill: #33240f; } .pid { fill: #13291a; } .safe { fill: #361512; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a9099"/>
    </marker>
  </defs>

  <!-- ===== YOUR COMPUTER ===== -->
  <rect x="20" y="20" width="320" height="500" rx="10" class="group"/>
  <text x="180" y="46" text-anchor="middle" class="fg head">Your computer · jayecu Studio</text>
  <rect x="40" y="70" width="280" height="62" rx="6" class="box"/>
  <text x="180" y="95" text-anchor="middle" class="fg head">Pages, tables and gauges</text>
  <text x="180" y="117" text-anchor="middle" class="muted">the layout · <tspan class="mono">dashboard.gui</tspan></text>
  <rect x="40" y="170" width="280" height="62" rx="6" class="tgt"/>
  <text x="180" y="195" text-anchor="middle" class="fg head">Your tune</text>
  <text x="180" y="217" text-anchor="middle" class="mono muted">tunes/&lt;name&gt;.tune</text>
  <rect x="40" y="270" width="280" height="62" rx="6" class="box"/>
  <text x="180" y="295" text-anchor="middle" class="fg head">Definition library</text>
  <text x="180" y="317" text-anchor="middle" class="mono muted">meta/&lt;board&gt; &lt;layout_hash&gt;.meta</text>
  <rect x="40" y="370" width="280" height="62" rx="6" class="box"/>
  <text x="180" y="395" text-anchor="middle" class="fg head">Restore points</text>
  <text x="180" y="417" text-anchor="middle" class="muted">one saved at every connect</text>
  <text x="180" y="470" text-anchor="middle" class="muted">one folder per ECU,</text>
  <text x="180" y="490" text-anchor="middle" class="muted">named by its factory ID</text>

  <!-- ===== THE USB CABLE ===== -->
  <text x="450" y="178" text-anchor="middle" class="fg head">USB · serial link</text>
  <path d="M342 201 H558" class="line" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="450" y="226" text-anchor="middle" class="mono muted">settings · live data</text>
  <text x="450" y="244" text-anchor="middle" class="mono muted">burn · codes · SD files</text>
  <text x="450" y="408" text-anchor="middle" class="fg head">USB · SD card as a drive</text>
  <path d="M558 431 H342" class="line" marker-end="url(#a)"/>
  <text x="450" y="456" text-anchor="middle" class="muted">only while the key is off</text>

  <!-- ===== THE ECU ===== -->
  <rect x="560" y="20" width="300" height="500" rx="10" class="group"/>
  <text x="710" y="46" text-anchor="middle" class="fg head">The ECU · jaytek_v1</text>
  <rect x="580" y="70" width="260" height="62" rx="6" class="box"/>
  <text x="710" y="95" text-anchor="middle" class="fg head">Firmware</text>
  <text x="710" y="117" text-anchor="middle" class="muted">modules · 1 kHz engine frame</text>
  <rect x="580" y="170" width="260" height="62" rx="6" class="tgt"/>
  <text x="710" y="195" text-anchor="middle" class="fg head">Tune in RAM</text>
  <text x="710" y="217" text-anchor="middle" class="muted">what the engine runs on now</text>
  <rect x="580" y="270" width="260" height="62" rx="6" class="tgt"/>
  <text x="710" y="295" text-anchor="middle" class="fg head">Flash banks A and B</text>
  <text x="710" y="317" text-anchor="middle" class="muted">the burned tune</text>
  <rect x="580" y="370" width="260" height="82" rx="6" class="box"/>
  <text x="710" y="395" text-anchor="middle" class="fg head">SD card</text>
  <text x="710" y="417" text-anchor="middle" class="mono muted">.meta · .gui · logs</text>
  <text x="710" y="437" text-anchor="middle" class="muted">burns made while running</text>
  <!-- RAM feeds the firmware -->
  <path d="M710 170 V134" class="line" marker-end="url(#a)"/>
  <!-- burn down, power-up back -->
  <path d="M650 232 V268" class="line" marker-end="url(#a)"/>
  <text x="642" y="255" text-anchor="end" class="muted">burn</text>
  <path d="M770 270 V234" class="line" marker-end="url(#a)"/>
  <text x="778" y="255" class="muted">power-up</text>
  <path d="M800 370 V334" class="dash" marker-end="url(#a)"/>
  <text x="808" y="357" class="muted">next boot</text>

  <!-- ===== THE VEHICLE ===== -->
  <rect x="890" y="70" width="190" height="62" rx="6" class="box"/>
  <text x="985" y="95" text-anchor="middle" class="fg head">Sensors</text>
  <text x="985" y="117" text-anchor="middle" class="mono muted">AV · AT · VR · DIG · knock</text>
  <path d="M888 90 H842" class="line" marker-end="url(#a)"/>
  <rect x="890" y="170" width="190" height="62" rx="6" class="ff"/>
  <text x="985" y="195" text-anchor="middle" class="fg head">Outputs</text>
  <text x="985" y="217" text-anchor="middle" class="mono muted">IGN · LS · HS · H-bridge</text>
  <path d="M842 110 H870 V201 H888" class="line" marker-end="url(#a)"/>
  <rect x="890" y="270" width="190" height="62" rx="6" class="box"/>
  <text x="985" y="295" text-anchor="middle" class="fg head">CAN1</text>
  <text x="985" y="317" text-anchor="middle" class="muted">dash · scan tool · devices</text>
  <path d="M842 124 H856 V301 H888" class="line" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="890" y="450" width="190" height="62" rx="6" class="safe"/>
  <text x="985" y="475" text-anchor="middle" class="fg head">Battery · key</text>
  <text x="985" y="497" text-anchor="middle" class="muted">key on above 8 V</text>
  <path d="M888 481 H862" class="line" marker-end="url(#a)"/>
</svg>
