    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/>
    </marker>
  </defs>
  <text x="30.0" y="28.0" class="muted head">Cranking starts part-way round a 36-1. Each mark is one tooth; tall = a gap.</text>
