  <path d="M30 110 H1030" class="thin"/>
  <text x="36.0" y="140.0" class="fg small">matcher: ACQUIRING</text>
  <text x="36.0" y="158.0" class="muted small">no position, no rpm</text>
  <path d="M271.9 118 V174" class="dash"/>
  <text x="277.9" y="140.0" class="fg small">1st gap: the count before it is only part of a turn</text>
  <text x="277.9" y="158.0" class="muted small">so it proves nothing yet — counting starts here</text>
  <path d="M836.5 118 V210" class="grnline"/>
  <text x="828.5" y="192.0" text-anchor="end" class="fg small head">2nd gap after exactly 35 teeth:</text>
  <text x="828.5" y="210.0" text-anchor="end" class="fg small head">LOCKED, absolute — this tooth is 0°</text>
  <rect x="30" y="250" width="1000" height="96" rx="6" class="pid"/>
  <text x="46.0" y="278.0" class="fg head">Once locked, every edge must arrive inside a window around the one the pattern predicts.</text>
  <text x="46.0" y="302.0" class="muted">The next tooth is due one pitch after the last tooth — including the tooth after the gap, which is due one pitch</text>
  <text x="46.0" y="322.0" class="muted">after the gap closed, not one gap later. One edge outside the window drops the lock: sync goes to 0 and firing stops.</text>
  <text x="46.0" y="370.0" class="muted"></text>
