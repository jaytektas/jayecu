<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>Wiring a VR crank sensor and a Hall cam sensor</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .line { stroke: #5f6670; stroke-width: 2; fill: none; }
    .thin { stroke: #5f6670; stroke-width: 1.5; fill: none; }
    .dash { stroke: #5f6670; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .box  { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .ecu  { fill: none; stroke: #5f6670; stroke-width: 2; stroke-dasharray: 8 5; }
    .ecufill { fill: #f4f5f7; }
    .part { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .tgt  { fill: #e8f1fb; stroke: #3b82c4; stroke-width: 2; }
    .ff   { fill: #fdf0e3; stroke: #d9822b; stroke-width: 2; }
    .pid  { fill: #eef7ee; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fbeaea; stroke: #c8412d; stroke-width: 2; }
    .pin  { fill: #e8f1fb; stroke: #3b82c4; stroke-width: 2; }
    .sig  { stroke: #3b82c4; stroke-width: 2.5; fill: none; }
    .sig2 { stroke: #d9822b; stroke-width: 2.5; fill: none; }
    .sig3 { stroke: #2e9d4f; stroke-width: 2.5; fill: none; }
    .wout { stroke: #5f6670; stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .shield { stroke: #8d939b; stroke-width: 2; fill: none; stroke-dasharray: 3 3; }
    .node { fill: #5f6670; }
    .mono { font-family: ui-monospace, 'Ubuntu Mono', Consolas, monospace; font-size: 12px; }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .line, .thin, .dash { stroke: #9aa1ab; } .box, .part { fill: #20232a; stroke: #9aa1ab; }
      .ecu { stroke: #9aa1ab; } .ecufill { fill: #1c1f25; }
      .tgt, .pin { fill: #16283b; } .ff { fill: #33240f; } .pid { fill: #13291a; } .safe { fill: #361512; }
      .wout { stroke: #9aa1ab; } .node { fill: #9aa1ab; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a9099"/>
    </marker>
  </defs>
  <text x="20" y="30" text-anchor="start" class="fg head">A · VR crank sensor, two wires + shield</text>
  <text x="20" y="50" text-anchor="start" class="muted small">a coil and magnet: makes its own AC voltage</text>
  <rect x="30" y="90" width="130" height="150" rx="8" class="box"/>
  <text x="95" y="116" text-anchor="middle" class="fg head">VR sensor</text>
  <text x="150" y="145" text-anchor="end" class="muted">+</text>
  <text x="150" y="195" text-anchor="end" class="muted">−</text>
  <rect x="320" y="70" width="170" height="226" rx="8" class="ecufill"/>
  <rect x="320" y="70" width="170" height="226" rx="8" class="ecu"/>
  <text x="480" y="290" text-anchor="end" class="muted small">ECU</text>
  <rect x="335" y="118" width="140" height="44" rx="4" class="pin"/>
  <text x="405.0" y="137" text-anchor="middle" class="fg head mono">CN3-6</text>
  <text x="405.0" y="154" text-anchor="middle" class="muted mono">VR1+</text>
  <rect x="335" y="168" width="140" height="44" rx="4" class="pin"/>
  <text x="405.0" y="187" text-anchor="middle" class="fg head mono">CN3-7</text>
  <text x="405.0" y="204" text-anchor="middle" class="muted mono">VR1−</text>
  <rect x="335" y="232" width="140" height="44" rx="4" class="pin"/>
  <text x="405.0" y="251" text-anchor="middle" class="fg head mono">CN3-10</text>
  <text x="405.0" y="268" text-anchor="middle" class="muted mono">Ground</text>
  <rect x="185" y="124" width="110" height="82" rx="30" class="shield"/>
  <path d="M160 140 H335" class="wout"/>
  <path d="M160 140 H335" stroke="#2f6fd0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M160 190 H335" class="wout"/>
  <path d="M160 190 H335" stroke="#2f6fd0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M160 190 H335" stroke="#1b1b1b" stroke-width="4" fill="none" stroke-dasharray="7 9"/>
  <text x="240" y="118" text-anchor="middle" class="muted small">twisted, shielded</text>
  <path d="M282 206 V254 H335" class="dash"/>
  <text x="200" y="250" text-anchor="middle" class="muted small">drain → ground</text>
  <text x="200" y="268" text-anchor="middle" class="muted small">at the ECU end only</text>
  <text x="20" y="330" text-anchor="start" class="fg small">Keep the sensor's + lead on VR1+. Swapped, the ECU times</text>
  <text x="20" y="348" text-anchor="start" class="fg small">every tooth from the other zero crossing (Figure 11.6).</text>
  <text x="520" y="30" text-anchor="start" class="fg head">B · Hall cam sensor, three wires</text>
  <text x="520" y="50" text-anchor="start" class="muted small">powered; most switch their output to ground</text>
  <rect x="530" y="90" width="130" height="170" rx="8" class="box"/>
  <text x="595" y="116" text-anchor="middle" class="fg head">Hall sensor</text>
  <text x="650" y="145" text-anchor="end" class="muted small">Supply</text>
  <text x="650" y="200" text-anchor="end" class="muted small">Signal</text>
  <text x="650" y="250" text-anchor="end" class="muted small">Ground</text>
  <rect x="820" y="64" width="170" height="232" rx="8" class="ecufill"/>
  <rect x="820" y="64" width="170" height="232" rx="8" class="ecu"/>
  <text x="980" y="290" text-anchor="end" class="muted small">ECU</text>
  <rect x="835" y="118" width="140" height="44" rx="4" class="pin"/>
  <text x="905.0" y="137" text-anchor="middle" class="fg head mono">CN4-15</text>
  <text x="905.0" y="154" text-anchor="middle" class="muted mono">5V Sensor 2</text>
  <path d="M660 140 H835" class="wout"/>
  <path d="M660 140 H835" stroke="#ec8a24" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M660 140 H835" stroke="#f2f2f2" stroke-width="4" fill="none" stroke-dasharray="7 9"/>
  <text x="748" y="128" text-anchor="middle" class="muted small mono">O/W orange/white</text>
  <rect x="835" y="173" width="140" height="44" rx="4" class="pin"/>
  <text x="905.0" y="192" text-anchor="middle" class="fg head mono">CN3-23</text>
  <text x="905.0" y="209" text-anchor="middle" class="muted mono">DIG1</text>
  <path d="M660 195 H835" class="wout"/>
  <path d="M660 195 H835" stroke="#ec8a24" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M660 195 H835" stroke="#1b1b1b" stroke-width="4" fill="none" stroke-dasharray="7 9"/>
  <text x="748" y="183" text-anchor="middle" class="muted small mono">O/B orange/black</text>
  <rect x="835" y="223" width="140" height="44" rx="4" class="pin"/>
  <text x="905.0" y="242" text-anchor="middle" class="fg head mono">CN3-35</text>
  <text x="905.0" y="259" text-anchor="middle" class="muted mono">Ground</text>
  <path d="M660 245 H835" class="wout"/>
  <path d="M660 245 H835" stroke="#1b1b1b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="748" y="233" text-anchor="middle" class="muted small mono">B black</text>
  <text x="520" y="330" text-anchor="start" class="fg small">The board already pulls DIG1 up to 5 V through 2.7 kΩ, so an</text>
  <text x="520" y="348" text-anchor="start" class="fg small">open-collector Hall sensor needs no pull-up of its own.</text>
  <text x="520" y="366" text-anchor="start" class="fg small">Power the sensor with what its maker specifies.</text>
</svg>
