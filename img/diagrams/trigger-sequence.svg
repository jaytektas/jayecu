<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 400" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>A SEQUENCE stream and its ratio matching</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .line { stroke: #5f6670; stroke-width: 2; fill: none; }
    .thin { stroke: #5f6670; stroke-width: 1; fill: none; }
    .dash { stroke: #5f6670; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .box  { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .tgt  { fill: #e8f1fb; stroke: #3b82c4; stroke-width: 2; }
    .ff   { fill: #fdf0e3; stroke: #d9822b; stroke-width: 2; }
    .pid  { fill: #eef7ee; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fbeaea; stroke: #c8412d; stroke-width: 2; }
    .safeline { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .node { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .sig  { stroke: #3b82c4; stroke-width: 2; fill: none; }
    .sig2 { stroke: #d9822b; stroke-width: 2; fill: none; }
    .sig3 { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .tooth { fill: #5f6670; }
    .ref  { fill: #d9822b; }
    .reds { stroke: #c8412d; stroke-width: 2; fill: none; }
    .redf { fill: #c8412d; }
    .band { fill: #eef7ee; stroke: #2e9d4f; stroke-width: 1.5; }
    .blueline { stroke: #3b82c4; stroke-width: 2; fill: none; }
    .grnline { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .orgline { stroke: #d9822b; stroke-width: 2; fill: none; }
    .mono { font-family: ui-monospace, 'Ubuntu Mono', Consolas, monospace; font-size: 12px; }
    .head { font-weight: 600; }
    .small { font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .line, .thin, .dash { stroke: #9aa1ab; } .box, .node { fill: #20232a; stroke: #9aa1ab; }
      .tgt { fill: #16283b; } .ff { fill: #33240f; } .pid { fill: #13291a; } .safe { fill: #361512; }
      .band { fill: #13291a; } .tooth { fill: #9aa1ab; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a9099"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8412d"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/>
    </marker>
  </defs>
  <text x="20.0" y="30.0" class="muted head">A cam SEQUENCE: four rising edges per 720° cycle, spans 180°, 60°, 180°, 300° (cells 1800, 600, 1800, 3000)</text>
  <path d="M40.0 150 H60.0 V100 H99.2 V150 H295.0 V100 H334.2 V150 H373.3 V100 H412.5 V150 H608.3 V100 H647.5 V150 H1000.0 V100 H1013.1" class="sig2"/>
  <path d="M60.0 156 V166" class="line"/>
  <text x="60.0" y="90.0" text-anchor="middle" class="fg small">event 0</text>
  <text x="60.0" y="182.0" text-anchor="middle" class="mono muted">0°</text>
  <path d="M295.0 156 V166" class="line"/>
  <text x="295.0" y="90.0" text-anchor="middle" class="fg small">event 1</text>
  <text x="295.0" y="182.0" text-anchor="middle" class="mono muted">180°</text>
  <path d="M373.3 156 V166" class="line"/>
  <text x="373.3" y="90.0" text-anchor="middle" class="fg small">event 2</text>
  <text x="373.3" y="182.0" text-anchor="middle" class="mono muted">240°</text>
  <path d="M608.3 156 V166" class="line"/>
  <text x="608.3" y="90.0" text-anchor="middle" class="fg small">event 3</text>
  <text x="608.3" y="182.0" text-anchor="middle" class="mono muted">420°</text>
  <path d="M1000.0 156 V166" class="line"/>
  <text x="1000.0" y="90.0" text-anchor="middle" class="fg small">event 0</text>
  <text x="1000.0" y="182.0" text-anchor="middle" class="mono muted">720°</text>
  <path d="M63.0 200 H292.0" class="line"/>
  <text x="177.5" y="220.0" text-anchor="middle" class="mono fg">cell[0] = 1800</text>
  <path d="M298.0 200 H370.3" class="line"/>
  <text x="334.2" y="220.0" text-anchor="middle" class="mono fg">cell[1] = 600</text>
  <path d="M376.3 200 H605.3" class="line"/>
  <text x="490.8" y="220.0" text-anchor="middle" class="mono fg">cell[2] = 1800</text>
  <path d="M611.3 200 H997.0" class="line"/>
  <text x="804.2" y="220.0" text-anchor="middle" class="mono fg">cell[3] = 3000</text>
  <rect x="20" y="260" width="1000" height="118" rx="6" class="tgt"/>
  <text x="36.0" y="288.0" class="fg head">The matcher compares RATIOS of consecutive intervals, so engine speed does not matter:</text>
  <text x="36.0" y="320.0" class="mono fg">60 / 180 = 0.33</text>
  <text x="276.0" y="320.0" class="mono fg">180 / 60 = 3.0</text>
  <text x="516.0" y="320.0" class="mono fg">300 / 180 = 1.67</text>
  <text x="756.0" y="320.0" class="mono fg">180 / 300 = 0.60</text>
  <text x="36.0" y="352.0" class="muted">Each ratio occurs once in the cycle. Three matches in a row, each the next one in the pattern, and the stream is locked</text>
  <text x="36.0" y="370.0" class="muted">absolutely: the event that just arrived is known by name. Event 0 (the start of cell 0) is the stream's 0°.</text>
</svg>
