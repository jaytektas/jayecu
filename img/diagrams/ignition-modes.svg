<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>The three ignition modes on a four-cylinder engine firing 1-3-4-2</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .line { stroke: #5f6670; stroke-width: 2; fill: none; }
    .hv   { stroke: #d9822b; stroke-width: 2; fill: none; }
    .box  { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .ff   { fill: #fdf0e3; stroke: #d9822b; stroke-width: 2; }
    .plug { fill: #ffffff; stroke: #1d1f23; stroke-width: 2; }
    .panel { fill: none; stroke: #d6d9de; stroke-width: 1; }
    .mono { font-family: ui-monospace, 'Ubuntu Mono', Consolas, monospace; font-size: 12px; }
    .head { font-weight: 600; }
    .sub  { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .line { stroke: #9aa1ab; } .box, .plug { fill: #20232a; stroke: #9aa1ab; }
      .ff { fill: #33240f; } .panel { stroke: #2c3038; }
    }
  </style>

  <!-- ===== A · Single coil (distributor) ===== -->
  <rect x="10" y="10" width="350" height="450" rx="8" class="panel"/>
  <text x="185" y="38" text-anchor="middle" class="fg head">Single Coil (distributor)</text>
  <rect x="125" y="60" width="120" height="40" rx="6" class="ff"/>
  <text x="185" y="85" text-anchor="middle" class="mono fg">IGN1 · All</text>
  <line x1="185" y1="100" x2="185" y2="125" class="line"/>
  <rect x="145" y="125" width="80" height="44" rx="6" class="box"/>
  <text x="185" y="152" text-anchor="middle" class="fg">coil</text>
  <line x1="185" y1="169" x2="185" y2="200" class="hv"/>
  <circle cx="185" cy="232" r="32" class="box"/>
  <text x="185" y="237" text-anchor="middle" class="muted sub">rotor</text>
  <line x1="160" y1="252" x2="80"  y2="300" class="hv"/>
  <line x1="175" y1="262" x2="150" y2="300" class="hv"/>
  <line x1="195" y1="262" x2="220" y2="300" class="hv"/>
  <line x1="210" y1="252" x2="290" y2="300" class="hv"/>
  <circle cx="80"  cy="316" r="16" class="plug"/><text x="80"  y="321" text-anchor="middle" class="fg">1</text>
  <circle cx="150" cy="316" r="16" class="plug"/><text x="150" y="321" text-anchor="middle" class="fg">2</text>
  <circle cx="220" cy="316" r="16" class="plug"/><text x="220" y="321" text-anchor="middle" class="fg">3</text>
  <circle cx="290" cy="316" r="16" class="plug"/><text x="290" y="321" text-anchor="middle" class="fg">4</text>
  <text x="30" y="370" class="fg sub">One coil for every cylinder. The rotor</text>
  <text x="30" y="390" class="fg sub">picks the plug.</text>
  <text x="30" y="414" class="muted sub">Crank sync is enough.</text>
  <text x="30" y="436" class="muted sub">Dwell must fit between two sparks.</text>

  <!-- ===== B · Wasted spark ===== -->
  <rect x="375" y="10" width="350" height="450" rx="8" class="panel"/>
  <text x="550" y="38" text-anchor="middle" class="fg head">Wasted Spark</text>
  <rect x="405" y="60" width="130" height="40" rx="6" class="ff"/>
  <text x="470" y="85" text-anchor="middle" class="mono fg">IGN1 · Cyl 1</text>
  <rect x="565" y="60" width="130" height="40" rx="6" class="ff"/>
  <text x="630" y="85" text-anchor="middle" class="mono fg">IGN2 · Cyl 2</text>
  <line x1="470" y1="100" x2="470" y2="125" class="line"/>
  <line x1="630" y1="100" x2="630" y2="125" class="line"/>
  <rect x="425" y="125" width="90" height="44" rx="6" class="box"/>
  <text x="470" y="152" text-anchor="middle" class="fg">coil A</text>
  <rect x="585" y="125" width="90" height="44" rx="6" class="box"/>
  <text x="630" y="152" text-anchor="middle" class="fg">coil B</text>
  <!-- coil A: plugs 1 and 4 -->
  <path d="M450 169 L420 300" class="hv"/>
  <path d="M490 169 L660 300" class="hv"/>
  <!-- coil B: plugs 2 and 3 -->
  <path d="M615 169 L490 300" class="hv"/>
  <path d="M645 169 L590 300" class="hv"/>
  <circle cx="420" cy="316" r="16" class="plug"/><text x="420" y="321" text-anchor="middle" class="fg">1</text>
  <circle cx="490" cy="316" r="16" class="plug"/><text x="490" y="321" text-anchor="middle" class="fg">2</text>
  <circle cx="590" cy="316" r="16" class="plug"/><text x="590" y="321" text-anchor="middle" class="fg">3</text>
  <circle cx="660" cy="316" r="16" class="plug"/><text x="660" y="321" text-anchor="middle" class="fg">4</text>
  <text x="395" y="370" class="fg sub">Each coil names one cylinder and also</text>
  <text x="395" y="390" class="fg sub">fires its companion, half a cycle away.</text>
  <text x="395" y="414" class="muted sub">Crank sync is enough.</text>
  <text x="395" y="436" class="muted sub">Pairs come from the firing order.</text>

  <!-- ===== C · Coil-on-plug ===== -->
  <rect x="740" y="10" width="350" height="450" rx="8" class="panel"/>
  <text x="915" y="38" text-anchor="middle" class="fg head">Coil-on-Plug</text>
  <rect x="760" y="60" width="72" height="40" rx="6" class="ff"/><text x="796" y="85" text-anchor="middle" class="mono fg">IGN1</text>
  <rect x="840" y="60" width="72" height="40" rx="6" class="ff"/><text x="876" y="85" text-anchor="middle" class="mono fg">IGN2</text>
  <rect x="920" y="60" width="72" height="40" rx="6" class="ff"/><text x="956" y="85" text-anchor="middle" class="mono fg">IGN3</text>
  <rect x="1000" y="60" width="72" height="40" rx="6" class="ff"/><text x="1036" y="85" text-anchor="middle" class="mono fg">IGN4</text>
  <line x1="796"  y1="100" x2="796"  y2="125" class="line"/>
  <line x1="876"  y1="100" x2="876"  y2="125" class="line"/>
  <line x1="956"  y1="100" x2="956"  y2="125" class="line"/>
  <line x1="1036" y1="100" x2="1036" y2="125" class="line"/>
  <rect x="766" y="125" width="60" height="44" rx="6" class="box"/><text x="796" y="152" text-anchor="middle" class="fg">coil</text>
  <rect x="846" y="125" width="60" height="44" rx="6" class="box"/><text x="876" y="152" text-anchor="middle" class="fg">coil</text>
  <rect x="926" y="125" width="60" height="44" rx="6" class="box"/><text x="956" y="152" text-anchor="middle" class="fg">coil</text>
  <rect x="1006" y="125" width="60" height="44" rx="6" class="box"/><text x="1036" y="152" text-anchor="middle" class="fg">coil</text>
  <line x1="796"  y1="169" x2="796"  y2="300" class="hv"/>
  <line x1="876"  y1="169" x2="876"  y2="300" class="hv"/>
  <line x1="956"  y1="169" x2="956"  y2="300" class="hv"/>
  <line x1="1036" y1="169" x2="1036" y2="300" class="hv"/>
  <circle cx="796"  cy="316" r="16" class="plug"/><text x="796"  y="321" text-anchor="middle" class="fg">1</text>
  <circle cx="876"  cy="316" r="16" class="plug"/><text x="876"  y="321" text-anchor="middle" class="fg">2</text>
  <circle cx="956"  cy="316" r="16" class="plug"/><text x="956"  y="321" text-anchor="middle" class="fg">3</text>
  <circle cx="1036" cy="316" r="16" class="plug"/><text x="1036" y="321" text-anchor="middle" class="fg">4</text>
  <text x="760" y="370" class="fg sub">One coil output per cylinder.</text>
  <text x="760" y="394" class="muted sub">Sequential needs cam phase sync.</text>
  <text x="760" y="414" class="muted sub">Before phase, companion pairs</text>
  <text x="760" y="434" class="muted sub">(1 and 4, 2 and 3) fire together.</text>
</svg>
