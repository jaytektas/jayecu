  <text x="522" y="84" class="fg">Start Bit <tspan class="mono">7</tspan> = byte 0, bit 7:</text>
  <text x="522" y="102" class="muted">the field's most significant bit</text>
  <path d="M484 124 H514" class="line" marker-start="url(#a)"/>
  <text x="522" y="120" class="fg">…runs down through byte 1 to bit <tspan class="mono">8</tspan></text>
  <text x="522" y="138" class="muted">Bit Length 16 · Big Endian (Motorola)</text>

  <rect x="504" y="170" width="530" height="104" rx="6" class="tgt"/>
  <text x="524" y="196" class="fg head">A reading</text>
  <text x="524" y="220" class="mono fg">bytes 0–1 = 0x04 0x19  →  raw 1049</text>
  <text x="524" y="242" class="mono fg">value = (1049 − 0) ÷ 1024 = 1.024 λ</text>
  <text x="524" y="262" class="muted">Multiplier 1024, Offset 0, as the template sets them</text>

  <rect x="504" y="290" width="530" height="96" rx="6" class="safe"/>
  <text x="524" y="316" class="fg head">Free air</text>
  <text x="524" y="340" class="mono fg">bytes 0–1 = 0x7F 0xFF  →  raw 32767 = No Reading code</text>
  <text x="524" y="362" class="muted">not decoded: the reading goes stale after Valid For (300 ms)</text>
  <text x="524" y="380" class="muted">instead of reading as 32 λ</text>
