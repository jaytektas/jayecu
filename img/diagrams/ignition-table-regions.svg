<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>Where timing usually sits in the Advance Table</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .axis { stroke: #5f6670; stroke-width: 2; fill: none; }
    .idle { fill: #e8f1fb; stroke: #3b82c4; stroke-width: 2; }
    .cru  { fill: #eef7ee; stroke: #2e9d4f; stroke-width: 2; }
    .wot  { fill: #fdf0e3; stroke: #d9822b; stroke-width: 2; }
    .bst  { fill: #fbeaea; stroke: #c8412d; stroke-width: 2; }
    .head { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; } .axis { stroke: #9aa1ab; }
      .idle { fill: #16283b; } .cru { fill: #13291a; } .wot { fill: #33240f; } .bst { fill: #361512; }
    }
  </style>

  <!-- plot area: x 100..760 (RPM), y 40..360 (load, high at top) -->
  <path d="M100 40 V360 H760" class="axis"/>
  <text x="430" y="392" text-anchor="middle" class="fg">engine speed →</text>
  <text x="60" y="200" text-anchor="middle" class="fg" transform="rotate(-90 60 200)">Fuel Load (kPa) →</text>
  <text x="104" y="378" class="muted">idle</text><text x="730" y="378" class="muted">redline</text>
  <text x="92" y="364" text-anchor="end" class="muted">low</text><text x="92" y="50" text-anchor="end" class="muted">high</text>

  <rect x="110" y="120" width="640" height="80" rx="6" class="wot"/>
  <text x="430" y="152" text-anchor="middle" class="fg head">Full load: knock-limited</text>
  <text x="430" y="176" text-anchor="middle" class="fg">least advance for its speed; most care</text>

  <rect x="110" y="44" width="640" height="68" rx="6" class="bst"/>
  <text x="430" y="72" text-anchor="middle" class="fg head">Boost</text>
  <text x="430" y="96" text-anchor="middle" class="fg">less again, falling as boost rises</text>

  <rect x="220" y="210" width="530" height="140" rx="6" class="cru"/>
  <text x="485" y="260" text-anchor="middle" class="fg head">Light load and cruise: the most advance</text>
  <text x="485" y="284" text-anchor="middle" class="fg">a thin, slow-burning charge — MBT is far advanced</text>
  <text x="485" y="308" text-anchor="middle" class="fg">and knock is rare. Economy lives here.</text>

  <rect x="110" y="210" width="100" height="140" rx="6" class="idle"/>
  <text x="160" y="268" text-anchor="middle" class="fg head">Idle</text>
  <text x="160" y="292" text-anchor="middle" class="fg">moderate,</text>
  <text x="160" y="312" text-anchor="middle" class="fg">steady</text>

  <!-- side notes -->
  <text x="790" y="80"  class="fg">Advance rises with speed</text>
  <text x="790" y="100" class="fg">(less time per degree),</text>
  <text x="790" y="120" class="fg">then levels off.</text>
  <text x="790" y="170" class="fg">Advance falls with load</text>
  <text x="790" y="190" class="fg">(denser charge burns</text>
  <text x="790" y="210" class="fg">faster and knocks sooner).</text>
  <text x="790" y="260" class="muted">A general shape to check a table</text>
  <text x="790" y="280" class="muted">against — not numbers for</text>
  <text x="790" y="300" class="muted">your engine.</text>
</svg>
