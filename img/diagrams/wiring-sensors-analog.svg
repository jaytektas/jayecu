<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>Wiring a three-wire 0-5 V sensor and a two-wire thermistor</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .line { stroke: #5f6670; stroke-width: 2; fill: none; }
    .thin { stroke: #5f6670; stroke-width: 1.5; fill: none; }
    .dash { stroke: #5f6670; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .box  { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .ecu  { fill: none; stroke: #5f6670; stroke-width: 2; stroke-dasharray: 8 5; }
    .ecufill { fill: #f4f5f7; }
    .part { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .tgt  { fill: #e8f1fb; stroke: #3b82c4; stroke-width: 2; }
    .ff   { fill: #fdf0e3; stroke: #d9822b; stroke-width: 2; }
    .pid  { fill: #eef7ee; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fbeaea; stroke: #c8412d; stroke-width: 2; }
    .pin  { fill: #e8f1fb; stroke: #3b82c4; stroke-width: 2; }
    .sig  { stroke: #3b82c4; stroke-width: 2.5; fill: none; }
    .sig2 { stroke: #d9822b; stroke-width: 2.5; fill: none; }
    .sig3 { stroke: #2e9d4f; stroke-width: 2.5; fill: none; }
    .wout { stroke: #5f6670; stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .shield { stroke: #8d939b; stroke-width: 2; fill: none; stroke-dasharray: 3 3; }
    .node { fill: #5f6670; }
    .mono { font-family: ui-monospace, 'Ubuntu Mono', Consolas, monospace; font-size: 12px; }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .line, .thin, .dash { stroke: #9aa1ab; } .box, .part { fill: #20232a; stroke: #9aa1ab; }
      .ecu { stroke: #9aa1ab; } .ecufill { fill: #1c1f25; }
      .tgt, .pin { fill: #16283b; } .ff { fill: #33240f; } .pid { fill: #13291a; } .safe { fill: #361512; }
      .wout { stroke: #9aa1ab; } .node { fill: #9aa1ab; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a9099"/>
    </marker>
  </defs>
  <text x="20" y="30" text-anchor="start" class="fg head">A · A 0–5 V sensor, three wires</text>
  <text x="20" y="50" text-anchor="start" class="muted small">MAP, TPS, pressure senders, pedal</text>
  <rect x="30" y="80" width="140" height="200" rx="8" class="box"/>
  <text x="100" y="106" text-anchor="middle" class="fg head">MAP sensor</text>
  <text x="160" y="140" text-anchor="end" class="muted small">5 V</text>
  <text x="160" y="200" text-anchor="end" class="muted small">Signal</text>
  <text x="160" y="260" text-anchor="end" class="muted small">Ground</text>
  <rect x="320" y="68" width="170" height="222" rx="8" class="ecufill"/>
  <rect x="320" y="68" width="170" height="222" rx="8" class="ecu"/>
  <text x="480" y="284" text-anchor="end" class="muted small">ECU</text>
  <rect x="335" y="113" width="140" height="44" rx="4" class="pin"/>
  <text x="405.0" y="132" text-anchor="middle" class="fg head mono">CN4-14</text>
  <text x="405.0" y="149" text-anchor="middle" class="muted mono">5V Sensor 1</text>
  <rect x="335" y="173" width="140" height="44" rx="4" class="pin"/>
  <text x="405.0" y="192" text-anchor="middle" class="fg head mono">CN3-27</text>
  <text x="405.0" y="209" text-anchor="middle" class="muted mono">AV1</text>
  <rect x="335" y="233" width="140" height="44" rx="4" class="pin"/>
  <text x="405.0" y="252" text-anchor="middle" class="fg head mono">CN3-10</text>
  <text x="405.0" y="269" text-anchor="middle" class="muted mono">Ground</text>
  <path d="M170 135 H335" class="wout"/>
  <path d="M170 135 H335" stroke="#ec8a24" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170 135 H335" stroke="#f2f2f2" stroke-width="4" fill="none" stroke-dasharray="7 9"/>
  <text x="252" y="123" text-anchor="middle" class="muted small mono">O/W orange/white</text>
  <path d="M170 195 H335" class="wout"/>
  <path d="M170 195 H335" stroke="#2e9d4f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170 195 H335" stroke="#1b1b1b" stroke-width="4" fill="none" stroke-dasharray="7 9"/>
  <text x="252" y="183" text-anchor="middle" class="muted small mono">G/B green/black</text>
  <path d="M170 255 H335" class="wout"/>
  <path d="M170 255 H335" stroke="#1b1b1b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="252" y="243" text-anchor="middle" class="muted small mono">B black</text>
  <text x="30" y="318" text-anchor="start" class="fg small">The sensor is powered from the ECU's 5 V supply and</text>
  <text x="30" y="336" text-anchor="start" class="fg small">returns to the ECU's ground, so its signal is measured</text>
  <text x="30" y="354" text-anchor="start" class="fg small">against the same 0 V and 5 V the ECU uses.</text>
  <text x="520" y="30" text-anchor="start" class="fg head">B · A thermistor, two wires</text>
  <text x="520" y="50" text-anchor="start" class="muted small">coolant, air, oil and fuel temperature</text>
  <rect x="530" y="120" width="180" height="130" rx="8" class="box"/>
  <text x="620" y="146" text-anchor="middle" class="fg head">Coolant sensor</text>
  <rect x="556" y="165" width="18" height="50" rx="2" class="part"/>
  <path d="M550 209 L580 171" class="thin"/>
  <text x="588" y="188" text-anchor="start" class="muted small">resistance</text>
  <text x="588" y="204" text-anchor="start" class="muted small">falls as it heats</text>
  <path d="M565 165 V155 H710" class="thin"/>
  <path d="M565 215 V225 H710" class="thin"/>
  <rect x="820" y="68" width="170" height="222" rx="8" class="ecufill"/>
  <rect x="820" y="68" width="170" height="222" rx="8" class="ecu"/>
  <text x="980" y="284" text-anchor="end" class="muted small">ECU</text>
  <rect x="835" y="133" width="140" height="44" rx="4" class="pin"/>
  <text x="905.0" y="152" text-anchor="middle" class="fg head mono">CN3-14</text>
  <text x="905.0" y="169" text-anchor="middle" class="muted mono">AT1</text>
  <rect x="835" y="203" width="140" height="44" rx="4" class="pin"/>
  <text x="905.0" y="222" text-anchor="middle" class="fg head mono">CN3-11</text>
  <text x="905.0" y="239" text-anchor="middle" class="muted mono">Ground</text>
  <path d="M710 155 H835" class="wout"/>
  <path d="M710 155 H835" stroke="#8d939b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M710 155 H835" stroke="#1b1b1b" stroke-width="4" fill="none" stroke-dasharray="7 9"/>
  <text x="772" y="143" text-anchor="middle" class="muted small mono">Gy/B grey/black</text>
  <path d="M710 225 H835" class="wout"/>
  <path d="M710 225 H835" stroke="#1b1b1b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="772" y="213" text-anchor="middle" class="muted small mono">B black</text>
  <path d="M965 133 V122" class="line"/>
  <rect x="957" y="94" width="16" height="28" rx="2" class="part"/>
  <path d="M965 94 V86 M953 86 H977" class="line"/>
  <text x="948" y="100" text-anchor="end" class="muted small">to 5V Sensor 1</text>
  <text x="948" y="118" text-anchor="end" class="muted small">2.7 kΩ pull-up</text>
  <rect x="520" y="308" width="470" height="58" rx="6" class="tgt"/>
  <text x="755" y="332" text-anchor="middle" class="fg head">Voltage at AT1 = 5 V × R ÷ (R + 2.7 kΩ)</text>
  <text x="755" y="352" text-anchor="middle" class="muted small">hot sensor = low R = low volts; open circuit = 5 V</text>
</svg>
