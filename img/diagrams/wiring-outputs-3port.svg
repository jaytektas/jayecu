<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>Plumbing a 3-port boost solenoid: de-energised and energised</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .line { stroke: #5f6670; stroke-width: 2; fill: none; }
    .hose { stroke: #5f6670; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .hosein { stroke: #ffffff; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .flow { stroke: #3b82c4; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .box  { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .ff   { fill: #fdf0e3; stroke: #d9822b; stroke-width: 2; }
    .pid  { fill: #eef7ee; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fbeaea; stroke: #c8412d; stroke-width: 2; }
    .blk  { stroke: #c8412d; stroke-width: 3; fill: none; }
    .panel { fill: none; stroke: #c9ced6; stroke-width: 1.5; }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .line, .hose { stroke: #9aa1ab; } .hosein { stroke: #20232a; } .box { fill: #20232a; stroke: #9aa1ab; }
      .panel { stroke: #3a3f48; }
      .ff { fill: #33240f; } .pid { fill: #13291a; } .safe { fill: #361512; }
    }
  </style>

  <!-- ================= LEFT · OFF ================= -->
  <rect x="10" y="10" width="545" height="450" rx="8" class="panel"/>
  <text x="282" y="38" text-anchor="middle" class="fg head">Valve OFF (0 % duty, or no power)</text>
  <text x="282" y="58" text-anchor="middle" class="muted small">boost source connected to the actuator · vent blocked</text>

  <rect x="30" y="96" width="150" height="56" rx="6" class="box"/>
  <text x="105" y="120" text-anchor="middle" class="fg">Boost source</text>
  <text x="105" y="139" text-anchor="middle" class="muted small">compressor outlet</text>
  <rect x="210" y="150" width="150" height="120" rx="8" class="ff"/>
  <text x="285" y="176" text-anchor="middle" class="fg head">3-port valve</text>
  <text x="222" y="240" class="fg small">in</text>
  <text x="328" y="240" class="fg small">out</text>
  <text x="297" y="264" class="fg small">vent</text>
  <path d="M180 124 H195 V210 H210" class="hose"/><path d="M180 124 H195 V210 H210" class="hosein"/>
  <path d="M360 210 H400" class="hose"/><path d="M360 210 H400" class="hosein"/>
  <path d="M285 270 V320" class="hose"/><path d="M285 270 V320" class="hosein"/>
  <path d="M232 210 H338" class="flow"/>
  <path d="M277 244 L293 260 M293 244 L277 260" class="blk"/>
  <rect x="400" y="160" width="130" height="110" rx="10" class="box"/>
  <text x="465" y="186" text-anchor="middle" class="fg head">Wastegate</text>
  <text x="465" y="204" text-anchor="middle" class="fg head">actuator</text>
  <path d="M414 230 H516" class="line"/>
  <path d="M465 230 V262 M455 240 L475 246 L455 252 L475 258" class="line"/>
  <text x="285" y="342" text-anchor="middle" class="muted small">to air, or to the intake before the turbo</text>
  <rect x="30" y="366" width="505" height="78" rx="6" class="safe"/>
  <text x="282" y="392" text-anchor="middle" class="fg">The actuator sees full boost and opens the gate at</text>
  <text x="282" y="412" text-anchor="middle" class="fg">its spring pressure: <tspan class="head">spring boost, the least boost</tspan>.</text>
  <text x="282" y="432" text-anchor="middle" class="muted small">This is the state the output fails to, so it must be the safe one.</text>

  <!-- ================= RIGHT · ON ================= -->
  <rect x="565" y="10" width="545" height="450" rx="8" class="panel"/>
  <text x="837" y="38" text-anchor="middle" class="fg head">Valve ON (energised part of each cycle)</text>
  <text x="837" y="58" text-anchor="middle" class="muted small">actuator connected to the vent · boost source blocked</text>

  <rect x="585" y="96" width="150" height="56" rx="6" class="box"/>
  <text x="660" y="120" text-anchor="middle" class="fg">Boost source</text>
  <text x="660" y="139" text-anchor="middle" class="muted small">compressor outlet</text>
  <rect x="765" y="150" width="150" height="120" rx="8" class="ff"/>
  <text x="840" y="176" text-anchor="middle" class="fg head">3-port valve</text>
  <text x="777" y="240" class="fg small">in</text>
  <text x="883" y="240" class="fg small">out</text>
  <text x="852" y="264" class="fg small">vent</text>
  <path d="M735 124 H750 V210 H765" class="hose"/><path d="M735 124 H750 V210 H765" class="hosein"/>
  <path d="M915 210 H955" class="hose"/><path d="M915 210 H955" class="hosein"/>
  <path d="M840 270 V320" class="hose"/><path d="M840 270 V320" class="hosein"/>
  <path d="M893 210 H840 V300" class="flow"/>
  <path d="M790 202 L806 218 M806 202 L790 218" class="blk"/>
  <rect x="955" y="160" width="130" height="110" rx="10" class="box"/>
  <text x="1020" y="186" text-anchor="middle" class="fg head">Wastegate</text>
  <text x="1020" y="204" text-anchor="middle" class="fg head">actuator</text>
  <path d="M969 230 H1071" class="line"/>
  <path d="M1020 230 V262 M1010 240 L1030 246 L1010 252 L1030 258" class="line"/>
  <text x="840" y="342" text-anchor="middle" class="muted small">to air, or to the intake before the turbo</text>
  <rect x="585" y="366" width="505" height="78" rx="6" class="pid"/>
  <text x="837" y="392" text-anchor="middle" class="fg">The actuator is vented, so the spring holds the gate</text>
  <text x="837" y="412" text-anchor="middle" class="fg">shut. More duty = less pressure on the actuator =</text>
  <text x="837" y="432" text-anchor="middle" class="fg head">more boost.</text>
</svg>
