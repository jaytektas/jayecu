  <text x="1028.0" y="272.0" text-anchor="end" class="muted small">phase-locked to the real teeth</text>
  <text x="150.0" y="300.0" text-anchor="middle" class="mono muted">0°</text>
  <text x="370.0" y="300.0" text-anchor="middle" class="mono muted">90°</text>
  <text x="590.0" y="300.0" text-anchor="middle" class="mono muted">180°</text>
  <text x="810.0" y="300.0" text-anchor="middle" class="mono muted">270°</text>
  <text x="1030.0" y="300.0" text-anchor="middle" class="mono muted">360°</text>
  <rect x="20" y="320" width="1020" height="70" rx="6" class="pid"/>
  <text x="36.0" y="348.0" class="fg small">At crank sync the grid is 36 teeth over 360°; at phase sync, one tooth every 10° over the whole cycle (72 on a four-stroke).</text>
  <text x="36.0" y="370.0" class="fg small">RPM is worked out from the grid's speed, so it reads 0 whenever sync is lost.</text>
