  <text x="1028.0" y="112.0" text-anchor="end" class="muted small">denser than the grid: the grid decimates</text>
  <text x="20.0" y="164.0" class="fg small head">4-1 crank</text>
  <path d="M150.0 172 H1030.0" class="thin"/>
  <path d="M150.0 172 V150" class="sig"/>
  <path d="M370.0 172 V150" class="sig"/>
  <path d="M590.0 172 V150" class="sig"/>
  <text x="1028.0" y="192.0" text-anchor="end" class="muted small">sparser: the grid runs on between teeth</text>
  <text x="20.0" y="244.0" class="fg small head">virtual grid</text>
