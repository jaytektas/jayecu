<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>Fuel calculation signal flow</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .line { stroke: #5f6670; stroke-width: 2; fill: none; }
    .box  { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .tgt  { fill: #e8f1fb; stroke: #3b82c4; stroke-width: 2; }
    .ff   { fill: #fdf0e3; stroke: #d9822b; stroke-width: 2; }
    .pid  { fill: #eef7ee; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fbeaea; stroke: #c8412d; stroke-width: 2; }
    .safeline { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .node { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .mono { font-family: ui-monospace, 'Ubuntu Mono', Consolas, monospace; font-size: 12px; }
    .head { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .line { stroke: #9aa1ab; } .box, .node { fill: #20232a; stroke: #9aa1ab; }
      .tgt { fill: #16283b; } .ff { fill: #33240f; } .pid { fill: #13291a; } .safe { fill: #361512; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a9099"/>
    </marker>
  </defs>

  <!-- ===== 1 · WHAT THE AIR NEEDS ===== -->
  <text x="20" y="26" class="muted head">1 · How much fuel this cylinder's air needs (once per engine cycle)</text>

  <text x="100" y="52" text-anchor="middle" class="muted">MAP · TPS · MAF · VE</text>
  <rect x="20" y="60" width="160" height="62" rx="6" class="tgt"/>
  <text x="100" y="85" text-anchor="middle" class="fg head">Air model</text>
  <text x="100" y="106" text-anchor="middle" class="muted">SD · α-N · MAF · Blend</text>

  <text x="275" y="52" text-anchor="middle" class="muted">charge temp, displacement</text>
  <rect x="200" y="60" width="150" height="62" rx="6" class="tgt"/>
  <text x="275" y="85" text-anchor="middle" class="fg head">Air mass</text>
  <text x="275" y="106" text-anchor="middle" class="mono muted">air_mass (mg)</text>

  <text x="450" y="52" text-anchor="middle" class="muted">Target Lambda, stoich</text>
  <rect x="370" y="60" width="160" height="62" rx="6" class="tgt"/>
  <text x="450" y="85" text-anchor="middle" class="fg head">÷ stoich × λ</text>
  <text x="450" y="106" text-anchor="middle" class="muted">fuel mass (mg)</text>

  <text x="630" y="52" text-anchor="middle" class="muted">Specific Gravity</text>
  <rect x="550" y="60" width="160" height="62" rx="6" class="tgt"/>
  <text x="630" y="85" text-anchor="middle" class="fg head">÷ fuel density</text>
  <text x="630" y="106" text-anchor="middle" class="muted">fuel volume (µl)</text>

  <text x="810" y="52" text-anchor="middle" class="muted">Flow Rate (dP × volts)</text>
  <rect x="730" y="60" width="160" height="62" rx="6" class="tgt"/>
  <text x="810" y="85" text-anchor="middle" class="fg head">÷ injector flow</text>
  <text x="810" y="106" text-anchor="middle" class="muted">time to flow it</text>

  <rect x="910" y="60" width="170" height="62" rx="6" class="box"/>
  <text x="995" y="85" text-anchor="middle" class="fg head">Base fuel pulse</text>
  <text x="995" y="106" text-anchor="middle" class="muted">µs, fuel only</text>

  <line x1="180" y1="91" x2="198" y2="91" class="line" marker-end="url(#a)"/>
  <line x1="350" y1="91" x2="368" y2="91" class="line" marker-end="url(#a)"/>
  <line x1="530" y1="91" x2="548" y2="91" class="line" marker-end="url(#a)"/>
  <line x1="710" y1="91" x2="728" y2="91" class="line" marker-end="url(#a)"/>
  <line x1="890" y1="91" x2="908" y2="91" class="line" marker-end="url(#a)"/>

  <!-- ===== 2 · CORRECTIONS ===== -->
  <text x="20" y="168" class="muted head">2 · Corrections: every one a multiplier, 1.000 changes nothing</text>

  <rect x="20" y="180" width="640" height="150" rx="6" class="ff"/>
  <text x="36" y="203" class="fg head">Fuel's own corrections</text>
  <text x="36" y="228" class="mono fg">fuel_corr_warmup</text>
  <text x="36" y="248" class="mono fg">fuel_corr_cranking</text>
  <text x="36" y="268" class="mono fg">fuel_corr_poststart</text>
  <text x="36" y="288" class="mono fg">fuel_corr_iat</text>
  <text x="36" y="308" class="mono fg">fuel_corr_map</text>
  <text x="250" y="228" class="mono fg">fuel_corr_baro</text>
  <text x="250" y="248" class="mono fg">fuel_corr_fuelcomp</text>
  <text x="250" y="268" class="mono fg">fuel_corr_gear</text>
  <text x="250" y="288" class="mono fg">fuel_corr_revlimit</text>
  <text x="250" y="308" class="mono fg">fuel_corr_overall</text>
  <text x="464" y="228" class="mono fg">fuel_corr_generic1 … 4</text>
  <text x="464" y="248" class="mono fg">fuel_corr_accel</text>
  <text x="464" y="268" class="mono fg">fuel_corr_launch</text>
  <text x="464" y="298" class="muted">transient, launch: other</text>
  <text x="464" y="316" class="muted">modules publish these</text>

  <rect x="680" y="180" width="190" height="66" rx="6" class="pid"/>
  <text x="775" y="203" text-anchor="middle" class="fg head">Closed loop</text>
  <text x="775" y="224" text-anchor="middle" class="mono fg">fuel_corr_stft</text>
  <text x="775" y="240" text-anchor="middle" class="mono fg">fuel_corr_ltft</text>

  <rect x="680" y="264" width="190" height="66" rx="6" class="safe"/>
  <text x="775" y="287" text-anchor="middle" class="fg head">Protection</text>
  <text x="775" y="308" text-anchor="middle" class="mono fg">fuel_corr_protection</text>
  <text x="775" y="324" text-anchor="middle" class="mono fg">fuel_corr_egt</text>

  <rect x="910" y="180" width="170" height="66" rx="6" class="node"/>
  <text x="995" y="206" text-anchor="middle" class="fg head">× product</text>
  <text x="995" y="228" text-anchor="middle" class="muted">clamped 0.1 to 10</text>
  <line x1="995" y1="122" x2="995" y2="178" class="line" marker-end="url(#a)"/>
  <line x1="660" y1="255" x2="890" y2="255" class="line"/>
  <line x1="870" y1="213" x2="890" y2="213" class="line"/>
  <line x1="870" y1="297" x2="890" y2="297" class="line"/>
  <line x1="890" y1="297" x2="890" y2="213" class="line"/>
  <line x1="890" y1="213" x2="908" y2="213" class="line" marker-end="url(#a)"/>

  <rect x="910" y="264" width="170" height="66" rx="6" class="box"/>
  <text x="995" y="290" text-anchor="middle" class="fg head">Wall film</text>
  <text x="995" y="311" text-anchor="middle" class="muted">optional, running only</text>
  <line x1="995" y1="246" x2="995" y2="262" class="line" marker-end="url(#a)"/>

  <!-- ===== 3 · INTO PULSES ===== -->
  <text x="120" y="386" class="muted head">3 · Into injector pulses</text>
  <path d="M995 330 L995 356 L100 356 L100 396" class="line" marker-end="url(#a)"/>

  <rect x="20" y="398" width="160" height="70" rx="6" class="box"/>
  <text x="100" y="424" text-anchor="middle" class="fg head">÷ squirts</text>
  <text x="100" y="446" text-anchor="middle" class="muted">per engine cycle</text>

  <rect x="200" y="398" width="160" height="70" rx="6" class="box"/>
  <text x="280" y="424" text-anchor="middle" class="fg head">Staging split</text>
  <text x="280" y="446" text-anchor="middle" class="muted">stages 1 to 4</text>

  <rect x="380" y="398" width="200" height="70" rx="6" class="tgt"/>
  <text x="480" y="424" text-anchor="middle" class="fg head">+ dead time</text>
  <text x="480" y="446" text-anchor="middle" class="muted">+ short-pulse adder</text>

  <rect x="600" y="398" width="200" height="70" rx="6" class="pid"/>
  <text x="700" y="424" text-anchor="middle" class="fg head">× bank / cylinder</text>
  <text x="700" y="446" text-anchor="middle" class="muted">trim, fuel part only</text>

  <rect x="820" y="398" width="260" height="70" rx="6" class="ff"/>
  <text x="950" y="424" text-anchor="middle" class="fg head">Injector opens</text>
  <text x="950" y="446" text-anchor="middle" class="muted">at the firing angle</text>

  <line x1="180" y1="433" x2="198" y2="433" class="line" marker-end="url(#a)"/>
  <line x1="360" y1="433" x2="378" y2="433" class="line" marker-end="url(#a)"/>
  <line x1="580" y1="433" x2="598" y2="433" class="line" marker-end="url(#a)"/>
  <line x1="800" y1="433" x2="818" y2="433" class="line" marker-end="url(#a)"/>

  <text x="480" y="496" text-anchor="middle" class="mono muted">pw_add_deadtime</text>
  <text x="950" y="496" text-anchor="middle" class="mono muted">inj_pw · base_pw · inj_duty</text>

  <!-- fuel cut note -->
  <line x1="20" y1="530" x2="60" y2="530" class="safeline"/>
  <text x="70" y="535" class="fg">A fuel cut (rev limiter, overrun, flood clear…) stops the injector at the output.</text>
  <text x="70" y="556" class="muted">The calculation keeps running and keeps reporting the pulse it wanted.</text>
</svg>
