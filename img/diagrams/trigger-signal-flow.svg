<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 520" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="14">
  <title>Trigger signal flow</title>
  <style>
    .fg   { fill: #1d1f23; }  .muted { fill: #5f6670; }
    .line { stroke: #5f6670; stroke-width: 2; fill: none; }
    .thin { stroke: #5f6670; stroke-width: 1; fill: none; }
    .dash { stroke: #5f6670; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .box  { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .tgt  { fill: #e8f1fb; stroke: #3b82c4; stroke-width: 2; }
    .ff   { fill: #fdf0e3; stroke: #d9822b; stroke-width: 2; }
    .pid  { fill: #eef7ee; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fbeaea; stroke: #c8412d; stroke-width: 2; }
    .safeline { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .node { fill: #ffffff; stroke: #5f6670; stroke-width: 2; }
    .sig  { stroke: #3b82c4; stroke-width: 2; fill: none; }
    .sig2 { stroke: #d9822b; stroke-width: 2; fill: none; }
    .sig3 { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .tooth { fill: #5f6670; }
    .ref  { fill: #d9822b; }
    .reds { stroke: #c8412d; stroke-width: 2; fill: none; }
    .redf { fill: #c8412d; }
    .band { fill: #eef7ee; stroke: #2e9d4f; stroke-width: 1.5; }
    .blueline { stroke: #3b82c4; stroke-width: 2; fill: none; }
    .grnline { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .orgline { stroke: #d9822b; stroke-width: 2; fill: none; }
    .mono { font-family: ui-monospace, 'Ubuntu Mono', Consolas, monospace; font-size: 12px; }
    .head { font-weight: 600; }
    .small { font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e4e6ea; } .muted { fill: #9aa1ab; }
      .line, .thin, .dash { stroke: #9aa1ab; } .box, .node { fill: #20232a; stroke: #9aa1ab; }
      .tgt { fill: #16283b; } .ff { fill: #33240f; } .pid { fill: #13291a; } .safe { fill: #361512; }
      .band { fill: #13291a; } .tooth { fill: #9aa1ab; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a9099"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8412d"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/>
    </marker>
  </defs>
  <text x="20.0" y="28.0" class="muted head">1 · What the sensors send</text>
  <rect x="20" y="44" width="170" height="58" rx="6" class="box"/>
  <text x="105.0" y="68.0" text-anchor="middle" class="fg head">Crank sensor</text>
  <text x="105.0" y="89.0" text-anchor="middle" class="muted">VR or Hall</text>
  <rect x="20" y="118" width="170" height="58" rx="6" class="box"/>
  <text x="105.0" y="142.0" text-anchor="middle" class="fg head">Cam sensor(s)</text>
  <text x="105.0" y="163.0" text-anchor="middle" class="muted">optional, up to 4</text>
  <rect x="220" y="44" width="170" height="132" rx="6" class="box"/>
  <text x="305.0" y="72.0" text-anchor="middle" class="fg head">Capture inputs</text>
  <text x="305.0" y="94.0" text-anchor="middle" class="muted">VR1 · VR2 · DIG1…8</text>
  <text x="305.0" y="118.0" text-anchor="middle" class="muted">Capture Edge:</text>
  <text x="305.0" y="138.0" text-anchor="middle" class="muted">Rising / Falling / Both</text>
  <path d="M190 73 H218" class="line" marker-end="url(#a)"/>
  <path d="M190 147 H218" class="line" marker-end="url(#a)"/>
  <path d="M305 176 V206" class="dash" marker-end="url(#a)"/>
  <rect x="230" y="208" width="150" height="44" rx="6" class="box"/>
  <text x="305.0" y="235.0" text-anchor="middle" class="muted">Trigger Log (raw)</text>
  <text x="420.0" y="28.0" class="muted head">2 · Decode each stream</text>
  <rect x="420" y="44" width="200" height="54" rx="6" class="tgt"/>
  <text x="520.0" y="67.0" text-anchor="middle" class="fg head">Crank Primary</text>
  <text x="520.0" y="87.0" text-anchor="middle" class="muted">GAP · SEQUENCE · WIDTH</text>
  <path d="M390 73 H418" class="line" marker-end="url(#a)"/>
  <rect x="420" y="110" width="200" height="54" rx="6" class="tgt"/>
  <text x="520.0" y="133.0" text-anchor="middle" class="fg head">Crank Secondary</text>
  <text x="520.0" y="153.0" text-anchor="middle" class="muted">anchors only</text>
  <path d="M390 110 H405 V137 H418" class="line" marker-end="url(#a)"/>
  <rect x="420" y="176" width="200" height="54" rx="6" class="tgt"/>
  <text x="520.0" y="199.0" text-anchor="middle" class="fg head">Cam slots ×4</text>
  <text x="520.0" y="219.0" text-anchor="middle" class="muted">which revolution</text>
  <path d="M390 110 H405 V203 H418" class="line" marker-end="url(#a)"/>
  <text x="640.0" y="28.0" class="muted head">3 · Fuse into one position</text>
  <rect x="650" y="60" width="200" height="150" rx="6" class="pid"/>
  <text x="750.0" y="88.0" text-anchor="middle" class="fg head">Fusion</text>
  <text x="750.0" y="112.0" text-anchor="middle" class="muted">primary crank = clock</text>
  <text x="750.0" y="134.0" text-anchor="middle" class="muted">absolute source = anchor</text>
  <text x="750.0" y="156.0" text-anchor="middle" class="muted">cam = revolution</text>
  <text x="750.0" y="186.0" text-anchor="middle" class="mono muted">sync_level 0 · 1 · 2</text>
  <path d="M620 71 H635 V135 H648" class="line" marker-end="url(#a)"/>
  <path d="M620 137 H635 V135 H648" class="line" marker-end="url(#a)"/>
  <path d="M620 203 H635 V135 H648" class="line" marker-end="url(#a)"/>
  <text x="640.0" y="262.0" class="mono muted">decoder angle 0 … cycle</text>
  <path d="M750 210 V300" class="line" marker-end="url(#a)"/>
  <text x="870.0" y="28.0" class="muted head">4 · Engine angle</text>
  <rect x="700" y="302" width="220" height="58" rx="6" class="tgt"/>
  <text x="810.0" y="326.0" text-anchor="middle" class="fg head">− Trigger Offset BTDC</text>
  <text x="810.0" y="347.0" text-anchor="middle" class="muted">TDC #1 becomes 0°</text>
  <rect x="880" y="60" width="170" height="150" rx="6" class="pid"/>
  <text x="965.0" y="88.0" text-anchor="middle" class="fg head">Virtual grid</text>
  <text x="965.0" y="112.0" text-anchor="middle" class="muted">PLL, one virtual</text>
  <text x="965.0" y="132.0" text-anchor="middle" class="muted">tooth every 10°</text>
  <text x="965.0" y="160.0" text-anchor="middle" class="muted">RPM comes from</text>
  <text x="965.0" y="180.0" text-anchor="middle" class="muted">here</text>
  <path d="M920 331 H965 V212" class="line" marker-end="url(#a)"/>
  <text x="870.0" y="262.0" class="muted"></text>
  <rect x="880" y="400" width="170" height="72" rx="6" class="ff"/>
  <text x="965.0" y="428.0" text-anchor="middle" class="fg head">Scheduler</text>
  <text x="965.0" y="450.0" text-anchor="middle" class="muted">spark · injection</text>
  <path d="M1030 210 V398" class="line" marker-end="url(#a)"/>
  <rect x="20" y="400" width="800" height="72" rx="6" class="safe"/>
  <text x="420.0" y="426.0" text-anchor="middle" class="fg head">Every edge is checked against the one the pattern predicted</text>
  <text x="420.0" y="448.0" text-anchor="middle" class="muted">wrong edge, missing tooth or no signal → sync drops to 0 and firing stops at once</text>
  <path d="M520 252 V398" class="safeline" marker-end="url(#r)"/>
  <path d="M820 436 H878" class="safeline" marker-end="url(#r)"/>
  <text x="20.0" y="506.0" class="muted small">Blue: what the tune describes · Green: what the decoder works out · Orange: what is driven · Red: safety</text>
</svg>
