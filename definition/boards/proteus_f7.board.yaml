---
# Proteus (F7) Board Definition
#
# VERIFIED AGAINST THE SCHEMATIC. The pin map has been checked, net by net, against the
# KiCad source of this open-hardware board at github.com/mck1117/proteus (mcu.kicad_sch, v0.7-era master). The MCU pin↔net map was
# extracted from that schematic mechanically — symbol pin geometry matched to labels — and
# compared with this file: 72 of 74 signals agreed exactly, and the two that did not are
# corrected here. So IGN1-12, LS1-16, HS1-4, AV1-11, AT1-4, DIG1-6, VR1/2, KNOCK1/2, both
# ETBs, both CAN buses, the four LEDs and the battery sense are all schematic-confirmed,
# including their LQFP-144 package pin numbers.
#
# The MCU symbol in that schematic is STM32F767ZITx — so the part and package are confirmed
# too, not inferred as an earlier revision of this file said.
#
# NOTHING HERE HAS BEEN SEEN ON A RIG. The pin map is schematic-confirmed, but the
# ELECTRICAL values are still arithmetic from schematic resistor values rather than
# measurements — and jaytek_v1's own AV inputs turned out to read ~4% low against a meter,
# so expect the same here.
#
# See definition/boards/jaytek_v1.board.yaml for the field vocabulary; this file uses the
# same schema and the same derivation rules (role pools = pins with that cap, in
# declaration order; counts derive from the pools).

board:       proteus_f7
mcu:         STM32F767ZIT6
package:     LQFP-144
ref_designator: U1
description: "Proteus F7 — Proteus on STM32F767, 144-pin"
source:      "github.com/mck1117/proteus mcu.kicad_sch"

# ---------------------------------------------------------------------------
# Clock sources — same crystal arrangement as jaytek_v1 (both F767 at 216 MHz).
# ---------------------------------------------------------------------------
hse_hz:  8000000
# NO LSE. PC14/PC15 are the F767's only OSC32_IN/OSC32_OUT pins, and this board uses them
# as the two POWER-GOOD inputs (see pins: below) — so there is no 32.768 kHz crystal, and
# turning the LSE on would take those pins away from GPIO. 0 means absent: the clock setup
# skips the LSE entirely and the RTC does not tick, which is a real capability difference
# from jaytek_v1 rather than a configuration choice.
lse_hz:  0

# ---------------------------------------------------------------------------
# ADC reference. board_configuration.cpp: engineConfiguration->adcVcc = 3.3f
# ---------------------------------------------------------------------------
adc_vref_mv: 3300

# Analog front-end — ELECTRICALLY IDENTICAL TO jaytek_v1, which the schematic settles.
# quad_analog.kicad_sch carries an MCP6004 with 470k, 10k and 5.6k resistors, and
# quad_analog_pullup.kicad_sch the same with a 2.7k bias in place of the 470k. That is the
# same chain jaytek documents: input 10k/470k = 0.97917, buffer x1, output 5.6k/10k =
# 0.64103, total 0.62768 — a 0-5 V connector range shifted into the ADC's 0-3.3 V.
#
# So this takes jaytek's number rather than one of its own. An earlier revision had 5148,
# from a divider coefficient of 1.56, which accounts for the 5.6k/10k output
# stage and MISSES the 470k/10k input divider ahead of it. 5000 is the clean design intent
# (3.3/0.66); the resistor-nominal works out at 3.3/0.62768 = 5.257 V, and per-sensor
# min_mv/max_mv calibration absorbs the difference — as it does on jaytek.
analog_av_fullscale_mv: 5000
analog_at_fullscale_mv: 5000   # AT bias resistor is 2.7k (PROTEUS_DEFAULT_AT_PULLUP)

# ===========================================================================
# pins — control-relevant pins only. Role pools DERIVE from caps in declaration
# order, and that ordered list IS the firmware index for the role.
# ===========================================================================
pins:

  # ---- Analog voltage inputs (AV1-11) — all on ADC1 -----------------------
  # Proteus has ELEVEN voltage inputs, not sixteen, and every one is an ADC1 channel.
  # That is the whole of "some ADC3 pins do not exist here": ADC3 carries knock alone,
  # so it runs no background scan and the knock burst simply owns the converter.
  - { pin: 26, gpio: PC0, signal: AV1,  caps: [ANALOG_VOLTAGE], mode: analog, adc: {unit: ADC1, channel: 10}, note: "white35-13, suggested MAP" }
  - { pin: 27, gpio: PC1, signal: AV2,  caps: [ANALOG_VOLTAGE], mode: analog, adc: {unit: ADC1, channel: 11}, note: "white35-24, suggested TPS1" }
  - { pin: 28, gpio: PC2, signal: AV3,  caps: [ANALOG_VOLTAGE], mode: analog, adc: {unit: ADC1, channel: 12}, note: "white35-14, suggested TPS1_2" }
  - { pin: 29, gpio: PC3, signal: AV4,  caps: [ANALOG_VOLTAGE], mode: analog, adc: {unit: ADC1, channel: 13}, note: "white35-25" }
  - { pin: 34, gpio: PA0, signal: AV5,  caps: [ANALOG_VOLTAGE], mode: analog, adc: {unit: ADC1, channel: 0},  note: "white35-15" }
  - { pin: 35, gpio: PA1, signal: AV6,  caps: [ANALOG_VOLTAGE], mode: analog, adc: {unit: ADC1, channel: 1},  note: "white35-26" }
  - { pin: 36, gpio: PA2, signal: AV7,  caps: [ANALOG_VOLTAGE], mode: analog, adc: {unit: ADC1, channel: 2},  note: "white35-16, suggested PPS2" }
  - { pin: 37, gpio: PA3, signal: AV8,  caps: [ANALOG_VOLTAGE], mode: analog, adc: {unit: ADC1, channel: 3},  note: "white35-27" }
  - { pin: 40, gpio: PA4, signal: AV9,  caps: [ANALOG_VOLTAGE], mode: analog, adc: {unit: ADC1, channel: 4},  note: "white35-17, suggested PPS1" }
  - { pin: 41, gpio: PA5, signal: AV10, caps: [ANALOG_VOLTAGE], mode: analog, adc: {unit: ADC1, channel: 5},  note: "white35-28, suggested wideband" }
  - { pin: 42, gpio: PA6, signal: AV11, caps: [ANALOG_VOLTAGE], mode: analog, adc: {unit: ADC1, channel: 6},  note: "white35-18" }

  # ---- Battery sense — fixed input, not user-assignable -------------------
  # SCHEMATIC-CONFIRMED: mcu.kicad_sch carries a single 82k/10k divider from 12V_SENSE to
  # 12V_DIVIDED on PA7, with NO op-amp on that sheet — so unlike the AV/AT pins the battery
  # does NOT pass through the MCP6004 front end. Total attenuation 10/(82+10) = 0.1087,
  # i.e. ~30.4 V full scale (a divider coefficient of 9.2).
  - { pin: 43, gpio: PA7, signal: AV12, caps: [ANALOG_VOLTAGE], mode: analog, adc: {unit: ADC1, channel: 7},
      net: 12V_DIVIDED, divider: 0.1087, assignable: false, note: "battery voltage sense (fixed input), black23-18" }

  # ---- Analog temperature inputs (AT1-4) — ADC1 ---------------------------
  # PROTEUS_DEFAULT_AT_PULLUP = 2700 ohm bias resistor (proteus_meta.h).
  - { pin: 44, gpio: PC4, signal: AT1, caps: [ANALOG_TEMP], mode: analog, adc: {unit: ADC1, channel: 14}, note: "white35-19" }
  - { pin: 45, gpio: PC5, signal: AT2, caps: [ANALOG_TEMP], mode: analog, adc: {unit: ADC1, channel: 15}, note: "white35-30, suggested IAT" }
  - { pin: 46, gpio: PB0, signal: AT3, caps: [ANALOG_TEMP], mode: analog, adc: {unit: ADC1, channel: 8},  note: "white35-20, suggested CLT" }
  - { pin: 47, gpio: PB1, signal: AT4, caps: [ANALOG_TEMP], mode: analog, adc: {unit: ADC1, channel: 9},  note: "white35-31" }

  # ---- Knock inputs — ADC3, board-routed (not user-assignable) ------------
  # knock_config.h: KNOCK_PIN_CH1 = F4 / IN14, KNOCK_PIN_CH2 = F5 / IN15. IDENTICAL to
  # jaytek_v1, including the channels — so the burst path ports with no change at all.
  - { pin: 14, gpio: PF4, signal: KNOCK1, caps: [KNOCK_INPUT], mode: analog, adc: {unit: ADC3, channel: 14}, assignable: false, note: "white35-34" }
  - { pin: 15, gpio: PF5, signal: KNOCK2, caps: [KNOCK_INPUT], mode: analog, adc: {unit: ADC3, channel: 15}, assignable: false, note: "white35-35" }

  # ---- Trigger / capture inputs -------------------------------------------
  # VR pins do edge roles but have no clean static level, so NOT DIGITAL_INPUT.
  # Every capture pin is on a DISTINCT EXTI line (7, 8, 6, 11, 12, 14, 13, 15) — which the
  # capture layer requires, since a line carries one pin. Note DIG4/DIG5 are E14/E13: the
  # SIGNAL order and the line order disagree, which is exactly the transcription mistake
  # the generator's line==bit lint exists to catch.
  - { pin: 58, gpio: PE7, signal: VR1, caps: [TRIGGER_INPUT, FREQUENCY_INPUT], mode: input, exti: {line: 7}, note: "black23-5/13 (+/-), crank" }
  - { pin: 59, gpio: PE8, signal: VR2, caps: [TRIGGER_INPUT, FREQUENCY_INPUT], mode: input, exti: {line: 8}, note: "black23-4/12 (+/-)" }
  - { pin: 96, gpio: PC6,  signal: DIG1, caps: [TRIGGER_INPUT, DIGITAL_INPUT, FREQUENCY_INPUT, SENT_INPUT], mode: input, exti: {line: 6},  note: "black23-10" }
  - { pin: 64, gpio: PE11, signal: DIG2, caps: [TRIGGER_INPUT, DIGITAL_INPUT, FREQUENCY_INPUT, SENT_INPUT], mode: input, exti: {line: 11}, note: "black23-1, suggested cam" }
  - { pin: 65, gpio: PE12, signal: DIG3, caps: [TRIGGER_INPUT, DIGITAL_INPUT, FREQUENCY_INPUT, SENT_INPUT], mode: input, exti: {line: 12}, note: "black23-2, suggested VSS" }
  - { pin: 67, gpio: PE14, signal: DIG4, caps: [TRIGGER_INPUT, DIGITAL_INPUT, FREQUENCY_INPUT, SENT_INPUT], mode: input, exti: {line: 14}, note: "black23-3" }
  - { pin: 66, gpio: PE13, signal: DIG5, caps: [TRIGGER_INPUT, DIGITAL_INPUT, FREQUENCY_INPUT, SENT_INPUT], mode: input, exti: {line: 13}, note: "black23-9" }
  - { pin: 68, gpio: PE15, signal: DIG6, caps: [TRIGGER_INPUT, DIGITAL_INPUT, FREQUENCY_INPUT, SENT_INPUT], mode: input, exti: {line: 15}, note: "black23-11" }

  # ---- Ignition outputs (IGN1-12) -----------------------------------------
  - { pin: 118, gpio: PD4,  signal: IGN1,  caps: [IGNITION_OUT, TACH_OUTPUT], mode: output, note: "black35-35" }
  - { pin: 117, gpio: PD3,  signal: IGN2,  caps: [IGNITION_OUT, TACH_OUTPUT], mode: output, note: "black35-34" }
  - { pin: 99,  gpio: PC9,  signal: IGN3,  caps: [IGNITION_OUT, TACH_OUTPUT], mode: output, note: "black35-22" }
  - { pin: 98,  gpio: PC8,  signal: IGN4,  caps: [IGNITION_OUT, TACH_OUTPUT], mode: output, note: "black35-33" }
  - { pin: 97,  gpio: PC7,  signal: IGN5,  caps: [IGNITION_OUT, TACH_OUTPUT], mode: output, note: "black35-32" }
  - { pin: 93,  gpio: PG8,  signal: IGN6,  caps: [IGNITION_OUT, TACH_OUTPUT], mode: output, note: "black35-31" }
  - { pin: 92,  gpio: PG7,  signal: IGN7,  caps: [IGNITION_OUT, TACH_OUTPUT], mode: output, note: "black35-30" }
  - { pin: 91,  gpio: PG6,  signal: IGN8,  caps: [IGNITION_OUT, TACH_OUTPUT], mode: output, note: "black35-29" }
  - { pin: 90,  gpio: PG5,  signal: IGN9,  caps: [IGNITION_OUT, TACH_OUTPUT], mode: output, note: "black35-28" }
  - { pin: 89,  gpio: PG4,  signal: IGN10, caps: [IGNITION_OUT, TACH_OUTPUT], mode: output, note: "black35-27" }
  - { pin: 88,  gpio: PG3,  signal: IGN11, caps: [IGNITION_OUT, TACH_OUTPUT], mode: output, note: "black35-26" }
  - { pin: 87,  gpio: PG2,  signal: IGN12, caps: [IGNITION_OUT, TACH_OUTPUT], mode: output, note: "black35-25" }

  # ---- Low-side outputs (LS1-16) ------------------------------------------
  # Proteus has SIXTEEN, against jaytek's twenty-two. The count derives from this list.
  - { pin: 123, gpio: PD7,  signal: LS1,  caps: [LOWSIDE_OUT, PWM_OUT, TACH_OUTPUT], mode: output, note: "black35-3" }
  - { pin: 124,  gpio: PG9,  signal: LS2,  caps: [LOWSIDE_OUT, PWM_OUT, TACH_OUTPUT], mode: output, note: "black35-15" }
  - { pin: 125,  gpio: PG10, signal: LS3,  caps: [LOWSIDE_OUT, PWM_OUT, TACH_OUTPUT], mode: output, note: "black35-4" }
  - { pin: 126,  gpio: PG11, signal: LS4,  caps: [LOWSIDE_OUT, PWM_OUT, TACH_OUTPUT], mode: output, note: "black35-16" }
  - { pin: 127,  gpio: PG12, signal: LS5,  caps: [LOWSIDE_OUT, PWM_OUT, TACH_OUTPUT], mode: output, note: "black35-5" }
  - { pin: 128,  gpio: PG13, signal: LS6,  caps: [LOWSIDE_OUT, PWM_OUT, TACH_OUTPUT], mode: output, note: "black35-6" }
  - { pin: 129,  gpio: PG14, signal: LS7,  caps: [LOWSIDE_OUT, PWM_OUT, TACH_OUTPUT], mode: output, note: "black35-7" }
  - { pin: 134, gpio: PB4,  signal: LS8,  caps: [LOWSIDE_OUT, PWM_OUT, TACH_OUTPUT], mode: output, note: "black35-19" }
  - { pin: 135, gpio: PB5,  signal: LS9,  caps: [LOWSIDE_OUT, PWM_OUT, TACH_OUTPUT], mode: output, note: "black35-8" }
  - { pin: 136, gpio: PB6,  signal: LS10, caps: [LOWSIDE_OUT, PWM_OUT, TACH_OUTPUT], mode: output, note: "black35-20, suggested fuel pump" }
  - { pin: 137, gpio: PB7,  signal: LS11, caps: [LOWSIDE_OUT, PWM_OUT, TACH_OUTPUT], mode: output, note: "black35-9, suggested radiator fan" }
  - { pin: 139, gpio: PB8,  signal: LS12, caps: [LOWSIDE_OUT, PWM_OUT, TACH_OUTPUT], mode: output, note: "black35-21, suggested main relay" }
  - { pin: 140, gpio: PB9,  signal: LS13, caps: [LOWSIDE_OUT, PWM_OUT, TACH_OUTPUT], mode: output, note: "black35-10" }
  - { pin: 141, gpio: PE0,  signal: LS14, caps: [LOWSIDE_OUT, PWM_OUT, TACH_OUTPUT], mode: output, note: "black35-11, suggested starter" }
  - { pin: 142, gpio: PE1,  signal: LS15, caps: [LOWSIDE_OUT, PWM_OUT, TACH_OUTPUT], mode: output, note: "black35-12" }
  - { pin: 1,   gpio: PE2,  signal: LS16, caps: [LOWSIDE_OUT, PWM_OUT, TACH_OUTPUT], mode: output, note: "black35-23" }

  # ---- High-side outputs (HS1-4) ------------------------------------------
  # FOUR, against jaytek's eight.
  - { pin: 101, gpio: PA9,  signal: HS1, caps: [HIGHSIDE_OUT, TACH_OUTPUT], mode: output, note: "black35-2" }
  - { pin: 100,  gpio: PA8,  signal: HS2, caps: [HIGHSIDE_OUT, TACH_OUTPUT], mode: output, note: "black35-1" }
  - { pin: 86, gpio: PD15, signal: HS3, caps: [HIGHSIDE_OUT, TACH_OUTPUT], mode: output, note: "black35-13" }
  - { pin: 85, gpio: PD14, signal: HS4, caps: [HIGHSIDE_OUT, TACH_OUTPUT], mode: output, note: "black35-14" }

  # ---- H-bridge / electronic throttle — TLE9201, board-locked -------------
  # SCHEMATIC-CONFIRMED (etb-9201.kicad_sch): TLE9201SG, one per bridge, with the DIR/DIS/PWM
  # triple and DIS LOW = enabled — the same control shape as jaytek's IFX9201.
  # PD12/PD13 DO have a timer AF (TIM4 CH1/CH2), but
  # TIM4 is the SoftPwm tick, so the magnitude is driven the same way jaytek drives its
  # AF-less PD6/PD3: TIM1 -> DMA -> GPIOD BSRR. Same port, so it is bit numbers.
  - { pin: 81, gpio: PD12, signal: HBRIDGE1_PWM, caps: [HBRIDGE_PWM],    mode: output, assignable: false, driver: TLE9201, note: "ETB1 PWM, black23-7/6 (+/-)" }
  - { pin: 79, gpio: PD10, signal: HBRIDGE1_DIR, caps: [HBRIDGE_DIR],    mode: output, assignable: false, driver: TLE9201 }
  - { pin: 80, gpio: PD11, signal: HBRIDGE1_DIS, caps: [HBRIDGE_ENABLE], mode: output, assignable: false, driver: TLE9201, active_low: true, note: "DIS: LOW = enabled" }
  - { pin: 82, gpio: PD13, signal: HBRIDGE2_PWM, caps: [HBRIDGE_PWM],    mode: output, assignable: false, driver: TLE9201, note: "ETB2 PWM, black23-15/8 (+/-)" }
  - { pin: 78, gpio: PD9,  signal: HBRIDGE2_DIR, caps: [HBRIDGE_DIR],    mode: output, assignable: false, driver: TLE9201 }
  - { pin: 77, gpio: PD8,  signal: HBRIDGE2_DIS, caps: [HBRIDGE_ENABLE], mode: output, assignable: false, driver: TLE9201, active_low: true, note: "DIS: LOW = enabled" }

  # ---- Power-good monitors ------------------------------------------------
  # The 5 V follower supplies' power-good lines, on the pins an LSE crystal would otherwise
  # occupy — which is why this board declares lse_hz 0.
  #
  # THE PAIR IS THE OTHER WAY ROUND from the first cut of this file: psu.kicad_sch names the
  # nets 5V_SENSOR_1_PG and 5V_SENSOR_2_PG, and mcu.kicad_sch lands them on PC15 and PC14
  # respectively (labels sit directly on the pins, so the match is exact). Index 0 is
  # "5V Sensor 1" to platform_read_power_good(), so having them swapped would have reported a
  # fault on the wrong rail.
  #
  # The part is a TLS115 (psu.kicad_sch) — the same family as jaytek's TLS115D0LD, so
  # open-drain with an external pull to VDD, HIGH = good, and no internal pull. That was an
  # assumption before; it is now the schematic's answer.
  - { pin: 9, gpio: PC15, signal: 5V_SENSOR1_PG, caps: [POWER_GOOD], mode: input, assignable: false, note: "power-good monitor, 5V follower 1" }
  - { pin: 8, gpio: PC14, signal: 5V_SENSOR2_PG, caps: [POWER_GOOD], mode: input, assignable: false, note: "power-good monitor, 5V follower 2" }

  # ---- Status LEDs --------------------------------------------------------
  # board_configuration.cpp + board.mk (LED_CRITICAL_ERROR_BRAIN_PIN=E3). Declared in PIN
  # order, which puts ERROR first — a DIFFERENT order from jaytek, where RUNNING is first.
  # The firmware takes each role's index from these signal NAMES, so the order is free.
  - { pin: 2, gpio: PE3, signal: ERROR,   caps: [STATUS_LED], mode: output, active_low: false, assignable: false, note: "status LED" }
  - { pin: 3, gpio: PE4, signal: COMMS,   caps: [STATUS_LED], mode: output, active_low: false, assignable: false, note: "status LED" }
  - { pin: 4, gpio: PE5, signal: RUNNING, caps: [STATUS_LED], mode: output, active_low: false, assignable: false, note: "status LED" }
  - { pin: 5, gpio: PE6, signal: WARNING, caps: [STATUS_LED], mode: output, active_low: false, assignable: false, note: "status LED" }

  # ---- CAN ----------------------------------------------------------------
  # canRxPin = D0 / canTxPin = D1; can2RxPin = B12 / can2TxPin = B13. Same pins as
  # jaytek_v1, so Stm32CanChannel needs no change.
  - { pin: 114,  gpio: PD0,  signal: CAN1_RX, caps: [CAN_RX], mode: alternate, af: {num: 9, signal: CAN1_RX}, note: "black23-17 (H) / 16 (L)" }
  - { pin: 115,  gpio: PD1,  signal: CAN1_TX, caps: [CAN_TX], mode: alternate, af: {num: 9, signal: CAN1_TX} }
  - { pin: 73,  gpio: PB12, signal: CAN2_RX, caps: [CAN_RX], mode: alternate, af: {num: 9, signal: CAN2_RX}, note: "black23-22 (H) / 21 (L)" }
  - { pin: 74,  gpio: PB13, signal: CAN2_TX, caps: [CAN_TX], mode: alternate, af: {num: 9, signal: CAN2_TX} }

# ===========================================================================
# resources — only what caps cannot derive: the timebase and compound devices.
# ===========================================================================
resources:
  timebase: { timer: TIM5, ticks_per_second: 1000000 }

  can: [ {name: CAN1, rx: CAN1_RX, tx: CAN1_TX},
         {name: CAN2, rx: CAN2_RX, tx: CAN2_TX} ]

  hbridge: [ {name: HBRIDGE1, pwm: HBRIDGE1_PWM, dir: HBRIDGE1_DIR, dis: HBRIDGE1_DIS},
             {name: HBRIDGE2, pwm: HBRIDGE2_PWM, dir: HBRIDGE2_DIR, dis: HBRIDGE2_DIS} ]

# ===========================================================================
# connectors — the board's connector terminal maps. Terminals carrying a
# passive role (ground / power / sensor supply) have no `signal`.
# ===========================================================================
connectors:

  - id: BLACK35
    color: black
    desc: "Ignitions, low-sides, high-sides"
    terminals:
      - { pin: 1,  signal: HS2 }
      - { pin: 2,  signal: HS1 }
      - { pin: 3,  signal: LS1 }
      - { pin: 4,  signal: LS3 }
      - { pin: 5,  signal: LS5 }
      - { pin: 6,  signal: LS6 }
      - { pin: 7,  signal: LS7 }
      - { pin: 8,  signal: LS9 }
      - { pin: 9,  signal: LS11 }
      - { pin: 10, signal: LS13 }
      - { pin: 11, signal: LS14 }
      - { pin: 12, signal: LS15 }
      - { pin: 13, signal: HS3 }
      - { pin: 14, signal: HS4 }
      - { pin: 15, signal: LS2 }
      - { pin: 16, signal: LS4 }
      - { pin: 17, role: ground }
      - { pin: 18, role: ground }
      - { pin: 19, signal: LS8 }
      - { pin: 20, signal: LS10 }
      - { pin: 21, signal: LS12 }
      - { pin: 22, signal: IGN3 }
      - { pin: 23, signal: LS16 }
      - { pin: 24, role: ground }
      - { pin: 25, signal: IGN12 }
      - { pin: 26, signal: IGN11 }
      - { pin: 27, signal: IGN10 }
      - { pin: 28, signal: IGN9 }
      - { pin: 29, signal: IGN8 }
      - { pin: 30, signal: IGN7 }
      - { pin: 31, signal: IGN6 }
      - { pin: 32, signal: IGN5 }
      - { pin: 33, signal: IGN4 }
      - { pin: 34, signal: IGN2 }
      - { pin: 35, signal: IGN1 }

  - id: WHITE35
    color: white
    desc: "Analog, temperature, knock, sensor supplies"
    terminals:
      - { pin: 1,  role: ground }
      - { pin: 2,  role: ground }
      - { pin: 3,  role: ground }
      - { pin: 4,  role: ground }
      - { pin: 5,  role: ground }
      - { pin: 6,  role: ground }
      - { pin: 7,  role: ground }
      - { pin: 8,  role: ground }
      - { pin: 9,  role: sensor_supply, voltage: 5 }
      - { pin: 10, role: sensor_supply, voltage: 5 }
      - { pin: 11, role: power, voltage: 12 }
      - { pin: 12, role: power, voltage: 12 }
      - { pin: 13, signal: AV1 }
      - { pin: 14, signal: AV3 }
      - { pin: 15, signal: AV5 }
      - { pin: 16, signal: AV7 }
      - { pin: 17, signal: AV9 }
      - { pin: 18, signal: AV11 }
      - { pin: 19, signal: AT1 }
      - { pin: 20, signal: AT3 }
      - { pin: 21, role: sensor_supply, voltage: 5 }
      - { pin: 22, role: sensor_supply, voltage: 5 }
      - { pin: 23, role: ground }
      - { pin: 24, signal: AV2 }
      - { pin: 25, signal: AV4 }
      - { pin: 26, signal: AV6 }
      - { pin: 27, signal: AV8 }
      - { pin: 28, signal: AV10 }
      - { pin: 29, role: ground }
      - { pin: 30, signal: AT2 }
      - { pin: 31, signal: AT4 }
      - { pin: 32, role: sensor_supply, voltage: 5 }
      - { pin: 33, role: sensor_supply, voltage: 5 }
      - { pin: 34, signal: KNOCK1 }
      - { pin: 35, signal: KNOCK2 }

  - id: BLACK23
    color: black
    desc: "Triggers, digital inputs, ETB, CAN, power"
    terminals:
      - { pin: 1,  signal: DIG2 }
      - { pin: 2,  signal: DIG3 }
      - { pin: 3,  signal: DIG4 }
      - { pin: 4,  signal: VR2, line: "+" }
      - { pin: 5,  signal: VR1, line: "+" }
      - { pin: 6,  signal: HBRIDGE1_PWM, line: "-" }
      - { pin: 7,  signal: HBRIDGE1_PWM, line: "+" }
      - { pin: 8,  signal: HBRIDGE2_PWM, line: "-" }
