# The unifying fuel-load signal: the per-air-model load (SD->MAP kPa, Alpha-N->TPS %, Blend->effective
# MAP) that the VE + target-lambda tables index on. Published so those tables are channel-driven (the
# table engine reads bus.get(fuel_table_y_src)); also the natural datalog/gauge for "what load is the
# fuel map seeing right now". Real units (kPa for the MAP-based models).
- {id: fuel_load, label: "Fuel Load", units: 'kPa', scale: 0.1, telem_type: uint16, min: 0.0, max: 400.0, category: "FuelCalculator", bus_type: float, datalog: true, owner: firmware}
# CHARGE LOAD — the air in the cylinder as a % of a full charge (100 % VE at the current baro and charge
# temperature). The one load every air model produces in the same terms — speed-density, Alpha-N, MAF and
# Blend — and smooth through Blend's crossover because it is taken AFTER the air masses are mixed. What
# timing and target lambda actually depend on, so it is the load axis a Blend or MAF tune points them at.
- {id: charge_load, label: "Charge Load", units: '%', scale: 0.1, telem_type: uint16, min: 0.0, max: 300.0, category: "FuelCalculator", bus_type: float, datalog: true, owner: firmware}
