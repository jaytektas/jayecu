# THE ADVANCE ITSELF, not a retard. Launch's ignition table is the timing the engine runs on while
# launch is active — Ignition takes it as the BASE in place of the main map, the way the cranking
# table does — so what belongs on the bus is an angle, not an amount pulled. (This id was
# `launch_retard`, a scalar amount subtracted; the table replaced it and the slot was reused.)
- {id: launch_ign_adv, label: "Launch Ignition Advance", units: 'deg', scale: 0.1, telem_type: int16, min: -50.0, max: 50.0, category: "Launch", bus_type: float, datalog: true, owner: firmware}
