- {id: frame_load_max_pct, label: "Engine Frame Load Peak", units: '%', scale: 1.0, telem_type: uint8, min: 0.0, max: 255.0, category: "Engine", bus_type: float, datalog: true, owner: firmware, gauge: {min: 0, max: 100, hi_warn: 70, hi_bad: 90}}   # the worst single frame since boot — what decides whether one is ever late
- {id: uptime_s, label: "ECU Uptime", units: 's', scale: 1.0, telem_type: uint32, min: 0.0, max: 4000000.0, category: "Engine", bus_type: float, datalog: false, owner: firmware}
# A COUNT, so no units — and deliberately: what a condition asks of this channel is its AGE, and
# age() answers in milliseconds whatever it was asked about (expr_units::unitOf). Giving the count
# itself a time unit would make "age(trigger_teeth) < 1500ms" convert against the wrong thing.
- {id: trigger_teeth, label: "Trigger Edges", units: '', scale: 1.0, telem_type: uint32, min: 0.0, max: 4000000000.0, category: "Trigger", bus_type: uint32, datalog: false, owner: firmware}
