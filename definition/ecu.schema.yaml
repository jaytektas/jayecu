# KEY STATE, ON THE WIRE. key_on gates every non-bootstrap sensor — Sensors.cpp: `if (!key_on_ &&
# !is_bootstrap) continue;` — so with the key off nothing is built, nothing is read, and every channel
# sits at zero. That is correct, and from the studio it is indistinguishable from a dead sensor, a bad
# calibration or an unassigned pin. An afternoon went into diagnosing a wideband reading 0 for exactly
# this reason.
#
# Its own channel rather than a bit of something existing: prot_status is composed and written whole by
# EngineProtection (a second writer would be clobbered), sd_msc_active is OWNERSHIP not key — it is
# also true under a comms MSC override and false while the card drains on ECU_RELEASING — and battery
# is the input the latch is computed FROM, not the latch, so a reader would have to re-derive the
# hysteresis and could still disagree with the ECU across the 7.0-8.0 V band.
- {id: key_on, label: "Key On", units: '', scale: 1.0, telem_type: uint8, min: 0.0, max: 1.0, category: "Diagnostics", bus_type: float, datalog: true, enum: bool_active, owner: firmware}
# The two 5 V sensor references' power-good lines, read by Sensors while the key is on (with the key off
# USB back-feeds the followers through a diode, so their state means nothing then and these go stale).
# 1 = OK. EITHER reading Fault makes EVERY pin-read sensor invalid at once — not only the ones on that
# rail: the ECU does not know which reference each sensor is wired to, and running on half the sensors
# is not a state worth trying to engineer. The battery (its own divider), on-board and CAN inputs stay.
- {id: sensor_supply_1, label: "5V Sensor 1 Supply", units: '', scale: 1.0, telem_type: uint8, min: 0.0, max: 1.0, category: "Diagnostics", bus_type: float, datalog: true, enum: supply_state, owner: firmware}
- {id: sensor_supply_2, label: "5V Sensor 2 Supply", units: '', scale: 1.0, telem_type: uint8, min: 0.0, max: 1.0, category: "Diagnostics", bus_type: float, datalog: true, enum: supply_state, owner: firmware}
