      # MAP PREDICTION — the predicted-MAP table's ONE job: transients, while the throttle moves and the
      # sensor lags. (The Blend air model no longer reads this table; it has its own Alpha-N VE map.)
      # This is about the SENSOR being late.
      #
      # A MAP reading has to be averaged over at least a cylinder period — the manifold breathes with
      # every intake stroke — so it necessarily lags. Snap the throttle open at idle and the plenum
      # fills in milliseconds while the averaged signal is still reporting vacuum, and the fuel for
      # those cycles is computed from a number that is simply out of date. So: while the throttle is
      # MOVING fast (its derivative, against the scaling table), take the HIGHER of measured and
      # predicted for a short hold, then hand back to the sensor.
      #
      # It pairs with the wall-film model, and the pair is the alternative to classic transient
      # throttle: prediction fixes the measurement, the film model fixes the fuel. Rate tables fix
      # both at once by feel, which is why they need retuning every time something else changes.
      - name: map_predict_scale_table
        min: 0
        max: 20000
        label: Transient TPS Scaling
        units: '%/s'
        type: uint16
        scale: 1.0           # cell stores %/s directly
        default: 300         # the throttle rate at which prediction is fully in
        # RISING WITH RPM: a MAP reading is averaged over a cylinder period, so its lag is ~30 ms at
        # 1000 rpm (4 cyl) and ~5 ms at 6000 — at speed the sensor keeps up with all but a faster stab.
        # 300 %/s at 2000 rpm; every throttle row the same until the optional TPS axis is used.
        default_values: [150, 200, 250, 300, 400, 500, 600, 700, 150, 200, 250, 300, 400, 500, 600, 700, 150, 200, 250, 300, 400, 500, 600, 700, 150, 200, 250, 300, 400, 500, 600, 700]
        rows: 4              # Y = TPS bins (optional; off by default -> one curve over RPM)
        cols: 8              # X = RPM bins
        x_axis: mps_rpm_axis
        y_axis: mps_tps_axis
        y_optional: true
        x_channel: rpm
        y_channel: tps
        help: 'The throttle rate (percent per second) at which the full predicted MAP is used. Below it, the throttle rate as a fraction of this value decides how far the estimate moves from measured MAP towards predicted: half this rate, half way. Under a tenth of it is treated as noise and ignored. A gentle squeeze is barely predicted and a stab is entirely. Set it about ten times the rate the throttle channel wanders at while your foot is still — otherwise noise triggers it at constant throttle.'
      - {name: mps_rpm_axis, label: TPS Scaling RPM Axis, units: RPM, type: float, size: 8, max_size: 16, default_values: [500, 1000, 1500, 2000, 3000, 4000, 5000, 6000], help: 'RPM breakpoints for the throttle-rate threshold. A fast idle transient and a fast 6000 rpm transient are not the same event.'}
      - {name: mps_tps_axis, label: TPS Scaling TPS Axis, units: '%', type: float, size: 4, max_size: 16, default_values: [0, 20, 50, 100], help: 'Optional throttle-position breakpoints for the rate threshold, off by default. The first few degrees off the stop move the manifold far more than the last few do.'}
      - name: predicted_map_table
        min: 0
        max: 10000
        label: Predicted MAP (rpm x TPS)
        units: kPa
        type: uint16
        scale: 0.1           # cell stores kPa x10
        # A GENERIC NATURALLY-ASPIRATED ESTIMATE, not flat atmospheric: 100·(1 − e^(−0.096·(TPS+1.5)·
        # (1000/rpm)^0.8)), floored at 25 kPa — ~33 kPa at a 2 % idle, atmospheric at wide-open throttle.
        # Read ONLY by MAP prediction, during a throttle transient with prediction switched on. It is not a
        # failover (a failed MAP reads atmosphere and raises its fault) and not the Blend model's load.
