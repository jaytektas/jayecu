      - {name: stage4_fuel_press_ratio, type: uint8, label: Stage 4 Rising Rate Ratio, units: ':1', scale: 0.1, min: 10, max: 200, digits: 1, default: 10, help: 'How much stage 4''s rail pressure climbs per unit of boost, for a Rising Rate regulator. 1.0:1 is a manifold-REFERENCED regulator: the rail follows the manifold exactly, so the differential never moves and the injectors flow the same at 2 bar of boost as at idle — that is what a stock returnless system does. Above 1.0 the rail climbs FASTER than the manifold and the differential rises with boost, which is what an aftermarket rising-rate regulator is for: 6.0:1 adds five units of differential per unit of boost. The rail tracks the manifold BOTH ways — put vacuum on the hose and the rail pressure drops, boost and it rises — which is the same thing as saying the differential holds: the rail is the differential plus the manifold. Under vacuum the ratio stops amplifying and the regulator behaves as 1.0:1, because multiplying vacuum by the ratio would drive the differential below zero and no regulator flows fuel backwards.'}
      - {name: stage4_fuel_press_src, type: uint8, label: Stage 4 Fuel Pressure Source, units: '', scale: 1.0, min: 0, max: 254, default: 0, help: 'Which signal reports stage 4''s rail pressure, when its mode is Sensor. A stage on its own rail with its own transducer names that sensor here — any channel will do, so a generic or auxiliary input wired to a pressure sender is a valid answer. Ignored in the other two modes.'}
      # PER-STAGE FUEL. Staged injection is often a second fuel as well as a second set of injectors —
      # port petrol with a secondary on E85 or methanol — so what a stage's fuel IS lives with the stage:
      # its stoich ratio, whether it is flex (ethanol measured), which sensor measures it, and the ethanol
      # content to use when there is no reading. Every source is a signal selection, so two stages on one
      # fuel system point at the same flex sensor. The charge the cylinder burns is the stages' fuels
      # mixed by the mass each delivers (FuelCalculator); flex_ethanol is that blend.
      - {name: stage1_flex_enabled, type: uint8, label: Stage 1 Flex Fuel, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'Stage 1''s ethanol content is MEASURED by a flex sensor (its Ethanol Source). Off, the stage runs a fixed blend: its Ethanol % is used as-is, and its fuel-composition correction is not applied. Stages sharing one fuel system can point at the same sensor.'}
      - {name: stage1_ethanol_src, type: uint8, label: Stage 1 Ethanol Source, units: '', scale: 1.0, min: 0, max: 254, default: ethanol, help: 'Which signal reports stage 1''s ethanol content, when Flex Fuel is on. Several stages may use the same sensor.'}
      - {name: stage1_ethanol_pct, type: uint8, label: Stage 1 Ethanol %, units: '%', scale: 1.0, min: 0, max: 100, default: 0, help: 'Flex Fuel OFF: the ethanol content of stage 1''s fuel, used all the time (0 petrol, 85 E85). Flex Fuel ON: what to fuel for until the sensor has given one good reading since power-up — after that a dropout holds the LAST GOOD reading, because the tank does not change mid-drive. Set it to what the car normally runs: a dead sensor read as 0 % fuels an ethanol engine as petrol, about a third lean.'}
      - {name: stage1_stoich_x10, type: uint16, label: Stage 1 Stoich AFR, units: '', scale: 0.1, min: 10, max: 300, digits: 1, default: 147, help: 'The stoichiometric ratio of stage 1''s BASE fuel — the fuel at 0 % ethanol. 14.7 for petrol; 6.4 for methanol, which is set here with Ethanol % at 0.'}
      - {name: stage1_stoich_ethanol_x10, type: uint16, label: Stage 1 Stoich AFR (Ethanol), units: '', scale: 0.1, min: 10, max: 300, digits: 1, default: 90, help: 'The stoichiometric ratio of pure ethanol, around 9.0. Stage 1''s working ratio is blended between its base fuel and this by its ethanol content.'}
      - {name: stage1_film_enabled, type: uint8, label: Stage 1 Port Film, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'Stage 1''s fuel wets the intake port, so the fuel film model tracks a film for it (when Fuel Film is on). Turn it off for a DIRECT-injected stage: its fuel goes straight into the cylinder and never touches a port wall.'}
      - {name: stage2_flex_enabled, type: uint8, label: Stage 2 Flex Fuel, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Stage 2''s ethanol content is MEASURED by a flex sensor (its Ethanol Source). Off, the stage runs a fixed blend: its Ethanol % is used as-is, and its fuel-composition correction is not applied. Stages sharing one fuel system can point at the same sensor.'}
      - {name: stage2_ethanol_src, type: uint8, label: Stage 2 Ethanol Source, units: '', scale: 1.0, min: 0, max: 254, default: ethanol, help: 'Which signal reports stage 2''s ethanol content, when Flex Fuel is on. Several stages may use the same sensor.'}
      - {name: stage2_ethanol_pct, type: uint8, label: Stage 2 Ethanol %, units: '%', scale: 1.0, min: 0, max: 100, default: 0, help: 'Flex Fuel OFF: the ethanol content of stage 2''s fuel, used all the time (0 petrol, 85 E85). Flex Fuel ON: what to fuel for until the sensor has given one good reading since power-up — after that a dropout holds the LAST GOOD reading, because the tank does not change mid-drive. Set it to what the car normally runs: a dead sensor read as 0 % fuels an ethanol engine as petrol, about a third lean.'}
      - {name: stage2_stoich_x10, type: uint16, label: Stage 2 Stoich AFR, units: '', scale: 0.1, min: 10, max: 300, digits: 1, default: 147, help: 'The stoichiometric ratio of stage 2''s BASE fuel — the fuel at 0 % ethanol. 14.7 for petrol; 6.4 for methanol, which is set here with Ethanol % at 0.'}
      - {name: stage2_stoich_ethanol_x10, type: uint16, label: Stage 2 Stoich AFR (Ethanol), units: '', scale: 0.1, min: 10, max: 300, digits: 1, default: 90, help: 'The stoichiometric ratio of pure ethanol, around 9.0. Stage 2''s working ratio is blended between its base fuel and this by its ethanol content.'}
      - {name: stage2_film_enabled, type: uint8, label: Stage 2 Port Film, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'Stage 2''s fuel wets the intake port, so the fuel film model tracks a film for it (when Fuel Film is on). Turn it off for a DIRECT-injected stage: its fuel goes straight into the cylinder and never touches a port wall.'}
      - {name: stage3_flex_enabled, type: uint8, label: Stage 3 Flex Fuel, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Stage 3''s ethanol content is MEASURED by a flex sensor (its Ethanol Source). Off, the stage runs a fixed blend: its Ethanol % is used as-is, and its fuel-composition correction is not applied. Stages sharing one fuel system can point at the same sensor.'}
