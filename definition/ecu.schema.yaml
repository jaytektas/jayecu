# Config write generation — bumped by any FIRMWARE-authored g_config write (ETB autocal, fillff, …). NOT a
# bus producer; packed_frame() overrides it straight from ::g_config_generation. The studio watches it as a
# LEVEL: when it moves, a fired command's volatile sections are re-read (scoped refresh). Kept LAST in the
# signal list so its SignalId is appended (adding it shifts no existing SIG_* id / config-source default).
- {id: config_gen, label: "Config Generation", units: '', scale: 1.0, telem_type: uint16, min: 0.0, max: 65535.0, category: "Diagnostics", bus_type: uint32, datalog: true, owner: firmware, bus_producer: false}
# UNBURNED-CHANGES indicator: 1 while the live RAM config differs from what is persisted. Derived in
# packed_frame() as (g_config_generation != g_config_generation_saved), where the save task records
# the generation it actually wrote. DERIVED, not a flag anyone has to remember to set: every path
# that mutates config already bumps the generation, so there is nothing to invalidate and no way
# for a write to slip through without marking the tune dirty. Appended after config_gen so it
# shifts no existing SignalId.
- {id: config_dirty, label: "Unburned Changes", units: '', scale: 1.0, telem_type: uint8, min: 0.0, max: 1.0, category: "Diagnostics", bus_type: uint32, datalog: true, owner: firmware, bus_producer: false}
# THE ECU HAS NO TUNE. It rejected its stored tune at boot (wrong layout after a firmware update that
# never put the tune back, or a damaged bank) and is running disabled: engine task not started, every
# output off. Nothing on the bus says so — every other channel just reads 0 — so without this the studio
# could only infer it, and before it did, it showed the state as KEY OFF. Set by the comms layer from
# g_no_tune, same pattern as config_dirty. Clears only on a reset after a valid tune is burned.
- {id: no_tune, label: "No Tune", units: '', scale: 1.0, telem_type: uint8, min: 0.0, max: 1.0, category: "Diagnostics", bus_type: uint32, datalog: true, enum: bool_active, owner: firmware, bus_producer: false}
# Bench-command status — (op<<2 | phase), set by the ETB/App modules, overridden into telemetry from
# ::g_command_state (no bus producer, like config_gen). LEVEL-valued: reads RUNNING for the whole routine,
# then OK/FAIL. The studio watches it to re-read exactly the cal a routine wrote — no completion-window guess.
# Follows config_gen so only the codegen-appended hw_* raw ids shift (runtime-derived, not stored). See CommandState.h.
- {id: command_state, label: "Command State", units: '', scale: 1.0, telem_type: uint16, min: 0.0, max: 65535.0, category: "Diagnostics", bus_type: uint32, datalog: true, owner: firmware, bus_producer: false}
# SD CARD STATE, on the frame rather than behind a command. The studio needs to know whether onboard
# logging is even possible — a card fitted, the ECU holding it, a log actually running — and asking
# with a 0x23 round trip four times a minute is a poll for something that arrives with every frame
# anyway. It is also what makes "the card is on the PC" a state the UI can show instead of infer:
# at key-off the ECU hands its SD to USB, which is precisely when a tuner wants to collect logs.
# No bus producer; overridden into telemetry from g_sd_arb / SdCard_IsAvailable / sd::is_logging,
# the same way config_gen and command_state are. Appended, so no existing SignalId moves.
- {id: sd_present, label: "SD Card Present", units: '', scale: 1.0, telem_type: uint8, min: 0.0, max: 1.0, category: "Diagnostics", bus_type: uint32, datalog: true, owner: firmware, bus_producer: false}
- {id: sd_msc_active, label: "SD Card On USB", units: '', scale: 1.0, telem_type: uint8, min: 0.0, max: 1.0, category: "Diagnostics", bus_type: uint32, datalog: true, owner: firmware, bus_producer: false}
- {id: sd_logging, label: "SD Logging", units: '', scale: 1.0, telem_type: uint8, min: 0.0, max: 1.0, category: "Diagnostics", bus_type: uint32, datalog: true, owner: firmware, bus_producer: false}
# EngineProtection -> RevLimiter/Boost hand-offs, moved off the per-frame EngineFrame onto the bus (with ttl)
# so EngineProtection/RevLimiter/Boost can run at independent cadences. Published only while a protection
# level is active; RevLimiter/Boost read them with a safe default when absent/expired. Appended at the END
# so no existing SignalId shifts (stored tune selectors stay valid).
- {id: prot_rev_limit, label: "Protection Rev Limit", units: 'RPM', scale: 1.0, telem_type: uint16, min: 0.0, max: 12000.0, category: "EngineProtection", bus_type: float, owner: firmware}
- {id: prot_rev_cut_fuel, label: "Protection Rev Cut Fuel", units: '', scale: 1.0, telem_type: uint8, min: 0.0, max: 1.0, category: "EngineProtection", bus_type: float, enum: bool_active, owner: firmware}
- {id: prot_boost_corr, label: "Protection Boost Corr", units: '%', scale: 1.0, telem_type: int16, min: -100.0, max: 100.0, category: "EngineProtection", bus_type: float, owner: firmware}
# Per-scope closed-loop trims (multi-wideband). Lambda publishes STFT + LTFT % for the overall bulk (stft_pct/
# ltft_pct above), each bank, and each cylinder; FuelCalculator reads the bank/cyl values to trim per cylinder.
# All dataloggable so a tuner sees every scope's contribution. Placed at the TAIL of the signals list because
# they are firmware telemetry, not selectors — the 254-id precondition ceiling that once made their position
# load-bearing is gone (precond signal is uint16). Zero-centred OFFSETS from the overall bulk.
- {id: stft_bank_1_pct, label: "STFT Bank 1", units: '%', scale: 0.01, telem_type: int16, min: -50.0, max: 50.0, category: "Lambda", bus_type: float, datalog: true, owner: firmware}
- {id: stft_bank_2_pct, label: "STFT Bank 2", units: '%', scale: 0.01, telem_type: int16, min: -50.0, max: 50.0, category: "Lambda", bus_type: float, datalog: true, owner: firmware}
- {id: ltft_bank_1_pct, label: "LTFT Bank 1", units: '%', scale: 0.01, telem_type: int16, min: -50.0, max: 50.0, category: "Lambda", bus_type: float, datalog: true, owner: firmware}
- {id: ltft_bank_2_pct, label: "LTFT Bank 2", units: '%', scale: 0.01, telem_type: int16, min: -50.0, max: 50.0, category: "Lambda", bus_type: float, datalog: true, owner: firmware}

# Pure-virtual channels — not produced by a physical sensor. Lua gauges + a few
# derived/estimated values. Appended after the catalog-derived channels.
# telem_type makes the int-ish ones compact in telemetry (no need for 4-byte floats);
# an undeclared channel (the Lua gauges) stays raw float since its value is arbitrary.
# ---------------------------------------------------------------------------
# CAN device library — frame decoders for off-the-shelf CAN sensors/devices.  A sensor whose
# interface is "CAN Bus" reuses its `source` byte as the device index here; the firmware finds
# the device's signal entry matching the sensor's primary channel and composes a CAN pipeline
# (acquire_can_frame -> decode_linear -> [sentinel] -> [conditions] -> publish).  The frame
# addressing + transform are intrinsic to the device — nobody calibrates a wideband.
# CAN SENSORS are not a device table any more either. A sensor whose interface is CAN reads a generic
# CAN receive FIELD, named by the FRAME (`can_frame`, the bus/ext/id key) and the field's START BIT
# (`can_bit`) — so the frame addressing and the transform live in the tune beside every other frame
# and are shared with the transmit side — one decode, and the sensor adds the calibration, the
# operating window and its own P-codes on top. The known devices ship as receive templates in
# definition/can_templates/.

# The CAN protocol library used to live here as a flash table. It does not any more: a published
# protocol is a TEMPLATE the studio loads into the tune's generic CAN pool (`Can.gc_frame` /
# `gc_field`), so the ECU only ever carries the one protocol this car actually speaks and a frame
# that turns out to be wrong is a tune edit rather than a firmware release. The templates live in
# definition/can_templates/*.json and are installed alongside the meta.

dtc_indicators:
  # P0216 dropped — SAE J2012DA defines it as "Injection Timing Control", not a coolant
  # warning; the warning is now mfr P1217. Intake over-temp is mfr P1098 (no SAE code).
- {bit: 2, id: map_boost, label: "MAP / Boost", codes: [P0105-P0109, P0234-P0238, P0243-P0250, P0299]}
- {bit: 3, id: maf, label: "Mass Air Flow", codes: [P0100-P0104]}
- {bit: 4, id: throttle, label: "Throttle / Pedal", codes: [P0120-P0124, P0220-P0229, P0638, P2100-P2140]}
- {bit: 5, id: o2_mixture, label: "O2 / Mixture", codes: [P0130-P0175, P2237-P2255]}
- {bit: 6, id: fuel_press, label: "Fuel Pressure", codes: [P0087-P0089, P0190-P0194, P0230-P0233]}
- {bit: 7, id: injector, label: "Injector Circuit", codes: [P0200-P0214, P0261-P0296]}
- {bit: 8, id: oil, label: "Oil Pressure / Temp", codes: [P0195-P0199, P0520-P0524]}
- {bit: 9, id: knock, label: "Knock", codes: [P0324-P0334]}
- {bit: 10, id: trigger, label: "Crank/Cam Position", codes: [P0335-P0349]}
- {bit: 11, id: misfire, label: "Misfire", codes: [P0300-P0314]}
- {bit: 12, id: ignition, label: "Ignition", codes: [P0320-P0323, P0350-P0379]}
- {bit: 13, id: vvt, label: "VVT / Cam Timing", codes: [P0010-P0028]}
- {bit: 14, id: battery, label: "Battery / Charging", codes: [P0560-P0563, P0620-P0622]}
- {bit: 15, id: vehicle, label: "Vehicle Speed / Idle", codes: [P0500-P0507]}
- {bit: 16, id: emissions, label: "Emissions / EVAP", codes: [P0400-P0499]}
- {bit: 17, id: ecu_internal, label: "ECU Internal", codes: [P0600-P0606, P0610-P0612]}
- {bit: 18, id: config_err, label: "Configuration Error", codes: [P1600-P164F]}
- {bit: 19, id: pin_conflict, label: "Pin / Output Conflict", codes: [P1650, P0645-P0650, P0652-P06A0]}
# The ECU's own 5 V sensor references (power-good low). P0651 used to fall inside the pin-conflict range
# above, which would have lit "Pin / Output Conflict" for a reference that had failed; it is carved out
# of that range so the one light says the one thing.
- {bit: 22, id: sensor_supply, label: "Sensor Supply", codes: [P0641, P0651]}
# Sensor diagnostics that no SAE code covers — the manufacturer block codegen allocates, one code per
# (sensor, check), laid out as P1000 + index*8 + slot. Without a category these codes would be raised and
# light nothing: the fault detected, and the user none the wiser. Sensors whose faults DO have standard
# codes still bucket into their own subsystem category above; this catches the rest.
# P1000 + index*8 + slot, so the block grows with the catalogue: 128 rows filled P1000-P13FF exactly and the
# 129th (cruise_sw) started at P1400. Sized to P15FF — room for 192 rows — below the config codes at P1600.
- {bit: 21, id: sensor_diag, label: "Sensor Diagnostics", codes: [P1000-P15FF]}
  # Fuel composition (flex-fuel / ethanol content) sensor — SAE P0176-P0179. It sat in the gap between
  # o2_mixture (…P0175) and fuel_press (P0190…), so every flex_fuel DTC lit no indicator at all. Its own
  # class, not an O2 or fuel-pressure fault: a bad ethanol reading skews fuelling and spark on its own terms.
- {bit: 20, id: fuel_comp, label: "Fuel Composition", codes: [P0176-P0179]}
- bit: 0
  id: clt
  label: Coolant Temp
  codes:
  - P0115-P0119
  - P0125
  - P0128
  - P0217
  - P1217
- bit: 1
  id: iat
  label: Intake Air Temp
  codes:
  - P0095-P0099
  - P0110-P0114
  - P1098

# Control-module signal-validity DTCs (DtcSource::MODULE = 207, Dtc.h:66). One unique P-code per
# (module, required input): a consumer raises it when a bus signal it NEEDS is invalid/missing,
# and heals it when the signal returns. Codegen emits generated/module_dtc.h (the `name`d
# namespace constants the firmware raises) AND the studio meta `dtc_descriptions` (hover text).
# These are mfr-specific P17xx codes — keep them out of the standard OBD ranges above.
# `invalid_sev` (level1/level2/level3, default level2) = severity when the signal is CONFIGURED but goes
# invalid at runtime (a signal you depend on dropped out). An UNCONFIGURED slot (sentinel 255)
# always raises level 1 — it's a tuning gap, not a live fault. Mark soft signals (graceful fallback)
# `level1`; leave hard signals (no safe substitute) at the level2 default.
# Codes raised by firmware LOGIC rather than by a sensor's diagnostic pipeline or a module's
# signal-validity check: engine-protection trips, structural configuration errors, throttle plate
# faults. Description-only -- the constant itself is declared at the raise site, where the check that
# raises it lives; this list is what gives the studio's DTC dock its hover text. Without an entry the
# dock shows a bare P-code and the technician is left guessing, which is how P0234 (a level 3
# overboost) read as an unlabelled number. tests/test_dtc_descriptions guards the pairing: every
# P-code the firmware declares must appear here or the build fails.
firmware_dtc:
- {code: P0107, label: "Protection: MAP signal timed out"}
- {code: P0117, label: "Protection: coolant-temp signal timed out"}
- {code: P0122, label: "Protection: TPS signal timed out"}
- {code: P0131, label: "Protection: lambda signal timed out"}
- {code: P0217, label: "Protection: engine coolant over-temperature"}
- {code: P0234, label: "Protection: overboost"}
- {code: P0335, label: "Trigger: crank synchronisation lost"}
- {code: P0336, label: "Trigger: unexpected tooth count"}
- {code: P0337, label: "Trigger: missing-tooth gap not found"}
- {code: P0338, label: "Trigger: no signal — the wheel has stopped or the wire is gone"}
- {code: P0339, label: "Trigger: noise — edges arriving too soon to be teeth"}
- {code: P0341, label: "Trigger: cam not where the crank says it should be, or overdue (phase lost)"}
- {code: P0560, label: "Protection: battery-voltage signal timed out"}
- {code: P0641, label: "Sensor supply: 5V Sensor 1 reference fault (power-good low)"}
- {code: P0651, label: "Sensor supply: 5V Sensor 2 reference fault (power-good low)"}
- {code: P1098, label: "Protection: intake-air over-temperature"}
- {code: P1217, label: "Protection: coolant-temperature warning"}
- {code: P1650, label: "Config: pin / output conflict (one pin claimed by two functions)"}
- {code: P1651, label: "Config: invalid firing order (duplicate or missing cylinder)"}
- {code: P1652, label: "Config: trigger cannot establish position — no absolute reference, or a single even wheel not set up as a distributor (Ignition Mode Distributor, injection Multi-Point or Sequential any sync)"}
- {code: P1653, label: "Config: a cylinder in the firing order has no coil output"}
- {code: P1654, label: "Config: a cylinder in the firing order has no stage 1 injector output"}
# A broadcast on a bus running at the wrong rate is the cruellest failure on CAN: no frame ever
# completes, the controller retries, the error counters climb and the bus goes off — and on the wire
# that is indistinguishable from an unplugged cable. The protocol states its own rate, so the ECU can
# simply check, refuse to broadcast, and say which of the two is wrong.
- {code: P1655, label: "Config: a generic CAN frame cannot run — a transmit frame on a listen-only bus, or a pool index out of range"}
- {code: P1656, label: "Config: two producers claim one channel — a generic CAN receive field and a sensor both write it"}
- {code: P1657, label: "CAN1: cannot complete a frame — see Last Error: a stuff or form error is a bit-rate disagreement, no acknowledgement means nothing else is on this bus"}
- {code: P1658, label: "CAN2: cannot complete a frame — see Last Error: a stuff or form error is a bit-rate disagreement, no acknowledgement means nothing else is on this bus"}
- {code: P2111, label: "Throttle: plate stuck open (commanded closed, no movement)"}
- {code: P2112, label: "Throttle: plate stuck closed (commanded open, no movement)"}
- {code: P2135, label: "Throttle: TPS A/B correlation lost (feedback untrustworthy)"}

module_dtc:
- {name: FUEL_MAP,   code: P1700, label: "Fuel: MAP signal missing (Speed-Density / MAF / Blend)"}
- {name: FUEL_TPS,   code: P1701, label: "Fuel: TPS signal missing (Alpha-N / Blend)"}
- {name: FUEL_CLT,   code: P1702, label: "Fuel: coolant-temp signal missing"}
- {name: FUEL_IAT,   code: P1703, label: "Fuel: intake-air-temp signal missing", invalid_sev: level1}
- {name: FUEL_MAF,   code: P1704, label: "Fuel: MAF signal missing (MAF mode)"}
- {name: BOOST_MAP,  code: P1710, label: "Boost: MAP signal missing"}
- {name: TT_LOAD,    code: P1720, label: "Transient Throttle: load-source signal missing", invalid_sev: level1}
- {name: STEP_IN,    code: P1730, label: "Stepper: input-demand signal missing"}
# The speed and throttle gates became one Arm When expression, so the two codes for a missing gate
# signal became one code for a gate that cannot be ASKED: a condition that failed to compile arms
# nothing, and must say so rather than read as "the driver is not launching".
- {name: LAUNCH_EXPR, code: P1740, label: "Launch: the Arm When condition failed to compile (launch control off)", invalid_sev: level1}
- {name: KNOCK_1,    code: P1750, label: "Knock: sensor 1 signal missing", invalid_sev: level1}
- {name: KNOCK_2,    code: P1751, label: "Knock: sensor 2 signal missing", invalid_sev: level1}
# Knock gates EVERY measurement on TPS (suppress_min_tps) and the suppressed path discards the burst
# worker's queue without classifying it — so with no valid TPS, knock and pre-ignition detection are
# entirely inert. Silently. Found on the bench, where an unassigned TPS made a working classifier
# read as a dead one. "Protection is off" and "the engine is not knocking" must never look identical.
- {name: KNOCK_TPS,  code: P1752, label: "Knock: TPS signal missing (knock/pre-ignition detection suppressed)", invalid_sev: level1}
# CLOSED LOOP WITH NOTHING TO LISTEN TO. The switch is on, the page says Closed-Loop Enabled, and the
# loop publishes x1.000 for ever because no enabled sensor measures lambda — the same trap as KNOCK_TPS
# above, in the same words: "correction is off" and "the mixture is correct" must never look identical.
# Raised when the loop is enabled and no wideband is READABLE, which covers both having none configured
# and having one that is unassigned, unheated or reading outside the lambda domain.
# A CONFIGURATION THE ECU HAS REFUSED. Distinct from P1753, which is "the sensor is not reading":
# this is "what you asked for does not make sense" — a source that resolves to no sensor, a banked pair
# split across a narrowband and a wideband (two loops whose errors are not in the same units), the same
# sensor named for both banks, or two widebands claiming one job. The loop is HELD OFF while it holds,
# because the alternative is worse than not correcting: a half-valid pair still corrects, from readings
# that do not mean what the controller thinks they mean.
#
# CONFIG source deliberately — the one category raise() still accepts while the system is inactive, and
# configuring is exactly what you do on the bench with the engine stopped. A code nobody could raise
# until the engine ran would be silent for the entire time it was useful.
- {name: LAMBDA_CONFIG, code: P1754, label: "O2 Control: source configuration invalid (closed loop held off)", invalid_sev: level1}
- {name: LAMBDA_NO_SENSOR, code: P1753, label: "O2 Control: closed loop enabled but no O2 sensor is reading (no correction is being made)", invalid_sev: level1}
# THE PEDAL CUT. App zeroes pedal_demand when the redundant pedal pair disagrees past the debounce or
# when the primary track is gone — and from the driver's seat, and from the dash, that is indistinguishable
# from a foot off the pedal. Two causes, two codes, so a stored fault says which: a disagreement is the
# standard APP A/B correlation code, a missing primary is a signal-missing fault like every other here.
# Kept apart from the ETB's P2135 (TPS A/B) so pedal and throttle can never be confused for each other.
- {name: APP_CORRELATION,  code: P2138, label: "App: pedal A/B correlation lost (demand cut to zero)"}
- {name: APP_A_MISSING,    code: P1780, label: "App: pedal A signal missing (demand cut to zero)"}
- {name: HBRIDGE_A_DEMAND, code: P1760, label: "H-Bridge A: demand signal missing"}
- {name: HBRIDGE_A_ENABLE, code: P1761, label: "H-Bridge A: enable signal unconfigured/missing"}
- {name: HBRIDGE_B_DEMAND, code: P1762, label: "H-Bridge B: demand signal missing"}
- {name: HBRIDGE_B_ENABLE, code: P1763, label: "H-Bridge B: enable signal unconfigured/missing"}
# EGT over-temp, PER PROBE. The protection itself acts on the hottest probe and does not care which one
# — but the person holding the spanner does, and a stored code is what they have when there is no datalog.
# One code per probe so the fault itself says where to look, instead of leaving twelve cylinders to guess.
# PRE-IGNITION, PER CYLINDER. Not a variant of knock and not reported as one: knock is end-gas
# autoignition AFTER the spark and answers to timing retard, while pre-ignition is the charge lighting
# BEFORE it from a hot spot — retarding does not address the cause and can worsen it. The response is a
# CUT, so these are level 3, and they name the cylinder because that is the one thing that tells a
# person which piston to look at. No standard OBD code exists for pre-ignition, hence the mfr range.
- {name: PREIGN_CYL_1,  code: P1790, label: "Pre-ignition: cylinder 1", invalid_sev: level3}
- {name: PREIGN_CYL_2,  code: P1791, label: "Pre-ignition: cylinder 2", invalid_sev: level3}
- {name: PREIGN_CYL_3,  code: P1792, label: "Pre-ignition: cylinder 3", invalid_sev: level3}
- {name: PREIGN_CYL_4,  code: P1793, label: "Pre-ignition: cylinder 4", invalid_sev: level3}
- {name: PREIGN_CYL_5,  code: P1794, label: "Pre-ignition: cylinder 5", invalid_sev: level3}
- {name: PREIGN_CYL_6,  code: P1795, label: "Pre-ignition: cylinder 6", invalid_sev: level3}
- {name: PREIGN_CYL_7,  code: P1796, label: "Pre-ignition: cylinder 7", invalid_sev: level3}
- {name: PREIGN_CYL_8,  code: P1797, label: "Pre-ignition: cylinder 8", invalid_sev: level3}
- {name: PREIGN_CYL_9,  code: P1798, label: "Pre-ignition: cylinder 9", invalid_sev: level3}
- {name: PREIGN_CYL_10, code: P1799, label: "Pre-ignition: cylinder 10", invalid_sev: level3}
- {name: PREIGN_CYL_11, code: P179A, label: "Pre-ignition: cylinder 11", invalid_sev: level3}
- {name: PREIGN_CYL_12, code: P179B, label: "Pre-ignition: cylinder 12", invalid_sev: level3}
- {name: EGT_OVERTEMP_1, code: P1770, label: "EGT: probe 1 over-temperature (protection cut)", invalid_sev: level3}
- {name: EGT_OVERTEMP_2, code: P1771, label: "EGT: probe 2 over-temperature (protection cut)", invalid_sev: level3}
- {name: EGT_OVERTEMP_3, code: P1772, label: "EGT: probe 3 over-temperature (protection cut)", invalid_sev: level3}
- {name: EGT_OVERTEMP_4, code: P1773, label: "EGT: probe 4 over-temperature (protection cut)", invalid_sev: level3}
- {name: EGT_OVERTEMP_5, code: P1774, label: "EGT: probe 5 over-temperature (protection cut)", invalid_sev: level3}
- {name: EGT_OVERTEMP_6, code: P1775, label: "EGT: probe 6 over-temperature (protection cut)", invalid_sev: level3}
- {name: EGT_OVERTEMP_7, code: P1776, label: "EGT: probe 7 over-temperature (protection cut)", invalid_sev: level3}
- {name: EGT_OVERTEMP_8, code: P1777, label: "EGT: probe 8 over-temperature (protection cut)", invalid_sev: level3}
- {name: EGT_OVERTEMP_9, code: P1778, label: "EGT: probe 9 over-temperature (protection cut)", invalid_sev: level3}
- {name: EGT_OVERTEMP_10, code: P1779, label: "EGT: probe 10 over-temperature (protection cut)", invalid_sev: level3}
- {name: EGT_OVERTEMP_11, code: P177A, label: "EGT: probe 11 over-temperature (protection cut)", invalid_sev: level3}
- {name: EGT_OVERTEMP_12, code: P177B, label: "EGT: probe 12 over-temperature (protection cut)", invalid_sev: level3}
# A THRESHOLD MONITOR THAT CANNOT BE ASKED is disarmed rather than allowed to cut, and says so here:
# a protection whose question is broken must not answer "cut", and must not fail silently either.
- {name: MONITOR_EXPR, code: P17C0, label: "Protection: a threshold monitor's condition failed to compile (that monitor is disarmed)", invalid_sev: level1}
# CRUISE CONTROL, its own decade. ALL LEVEL 1, and deliberately so: `level2` is this list's default and it
# is wrong for every one of these. The severity selects the protection level that reacts, and nothing
# about a dead cruise stalk justifies a higher level's engine protection — the correct response to any of these is to drop
# cruise, which the module does itself. The code is here so the driver learns WHY it dropped.
- {name: CRUISE_VSS,         code: P17A0, label: "Cruise: vehicle-speed signal missing or stale (cruise held off)", invalid_sev: level1}
- {name: CRUISE_VSS_IMPL,    code: P17A1, label: "Cruise: vehicle speed implausible (step or over-range) — cruise cancelled", invalid_sev: level1}
# The MODULE cannot say WHY the switch is untrustworthy — no band, raw low, raw high, stuck, a
# lost reference. The sensor raises the code that names the cause; this one says cruise stopped.
- {name: CRUISE_SW,          code: P17A2, label: "Cruise: switch signal not trustworthy (cruise held off)", invalid_sev: level1}
# P17A3 was CRUISE_SW_STUCK, and is deliberately left vacant rather than reused — a code is a
# published identifier. The module timed how long a button was held and faulted past a limit,
# which is a check only it could make and still could not make well: accelerating from 30 to
# 200 kph is a hold of nearly two minutes, and the limit fired a third of the way there. A
# jammed rung pins the pin at one voltage so no other stalk button can be seen, but the brake
# and the clutch cancel regardless and are the reflex a driver already has. The check bought
# nothing they do not, and cost a fault on ordinary driving.
- {name: CRUISE_RUNAWAY,     code: P17A4, label: "Cruise: speed error beyond the control-error limit — cruise cancelled", invalid_sev: level1}
- {name: CRUISE_WHEEL_DIFF,  code: P17A5, label: "Cruise: wheel speeds disagree beyond the limit — cruise cancelled", invalid_sev: level1}
- {name: CRUISE_PEDAL,       code: P17A6, label: "Cruise: accelerator pedal fault — cruise held off", invalid_sev: level1}
- {name: CRUISE_EXPR,        code: P17A7, label: "Cruise: a button condition failed to compile (cruise held off)", invalid_sev: level1}
- {name: CRUISE_UNMONITORED, code: P17A8, label: "Cruise: a brake/clutch/handbrake input has no fault checks enabled (cruise held off)", invalid_sev: level1}
- {name: CRUISE_NO_BRAKE,    code: P17A9, label: "Cruise: no brake input assigned (cruise held off)", invalid_sev: level1}
# Traction control, P17B0-P17B3. All `warn`: traction control backing off is not a reason to put the
# ENGINE in limp — it is a reason to say why the car is not being held, and to stop pretending it is.
- {name: TRACTION_NO_REF,    code: P17B0, label: "Traction: no reference speed — slip cannot be measured (traction control off)", invalid_sev: level1}
- {name: TRACTION_NO_DRIVEN, code: P17B1, label: "Traction: driven-wheel speed missing (traction control off)", invalid_sev: level1}
- {name: TRACTION_AXLE_CAL,  code: P17B2, label: "Traction: steady slip at cruise — the two axles' pulses/km disagree", invalid_sev: level1}
- {name: TRACTION_EXPR,      code: P17B3, label: "Traction: the Active When condition failed to compile (traction control off)", invalid_sev: level1}
modules:
  System:
    config:
      scalars: []
  # SD datalogger config (consumed by CommsManager, not an EngineModule). Off by default — a
  # raw-binary telemetry record is appended to a new LOGnnnn.BIN file while the engine runs and the
  # ECU owns the SD card. Enable + bench-validate before relying on it.
  Datalog:
    config:
      # WHICH CHANNELS the card records, one bit per telemetry channel (452 today -> 57 bytes). It is a
      # TUNE field and not a build-time list because what a car logs is a tuning decision: a fuel
      # session and a misfire hunt want different columns, and neither is worth a reflash.
      #
      # ALL ZERO MEANS "AS SHIPPED" — the definition's own `datalog:` set. That is what makes the
      # default correct without encoding 57 bytes of defaults here, and it means a tune that predates
      # the feature logs the sensible thing rather than nothing at all.
      arrays:
      - name: mask
        count: 57
        label: Channel
        element:
        - {name: bits, type: uint8, label: Channel Bits, default: 0, help: 'Eight channels per byte, in telemetry-descriptor order, LSB first. Edited through the studio''s channel picker rather than by hand — the bit order is the meta''s field order, which is not something to count on paper.'}
      scalars:
      - {name: enabled, type: uint8, label: SD Datalog Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Log raw telemetry to SD while running (needs the ECU to own the card).'}
      - {name: rate_hz, type: uint16, label: SD Datalog Rate, units: Hz, scale: 1.0, min: 1, max: 1000, default: 10, help: 'How often a record is written to the SD card. Sampled by a dedicated task on the 1 kHz system tick, so 1000 Hz is the ceiling and the period is 1000/rate whole milliseconds — a rate that does not divide 1000 lands on the nearest tick (300 Hz logs every 3 ms, so 333 Hz). HIGH RATES ARE FOR DIAGNOSTICS, NOT FOR DRIVING: what they cost is card space and columns, and the two multiply. Twenty channels at 1 kHz is 151 MB/hour and about 2.5% of the CPU; the standard 364-channel set at the same rate is 2.4 GB/hour and would saturate the card. Pick a small channel set before picking a high rate.'}
      # ---- WHEN IT LOGS ---------------------------------------------------------------------------
      # The trigger was `rpm > 100`, compiled into CommsManager. A reasonable default and a poor rule:
      # it cannot say "only the pulls", "only when something is wrong", or "only while warming up", and
      # changing it meant a reflash. It is an expression now, for the same reason an output's condition
      # is one — the VM is already there, it is already pure, and the comms task already holds the bus.
      #
      # TWO conditions, because the deadband matters MORE here than on a fan. An output that chatters
      # at a threshold wastes relay life; a logger that chatters at one opens a NEW FILE every
      # transition, header and all. Written as "rpm > 4000" on and "rpm < 3000" off, a pull logger
      # captures the pull instead of fragmenting across it.
      #
      # BOTH EMPTY = the built-in gate (the engine is turning), so a tune that predates this logs
      # exactly what it used to — the same "unset means as shipped" rule the channel mask follows.
      - {name: log_when, type: expression, length: 64, label: Log While, help: 'The condition that starts and sustains logging. Empty means the built-in rule: log whenever the engine is turning. Reads any bus channel and any config setting — "rpm > 4000" for the pulls only, "dtc_worst_sev > 0" for a fault recorder, "clt < 40 and rpm > 500" for warm-up work.'}
      - {name: log_until, type: expression, length: 64, label: Stop When, help: 'The condition that stops it. Empty means "when Log While stops being true", which is right for a plain rule; a separate condition is how hysteresis is written — start above 4000, stop below 3000 — and it is the difference between one log of a pull and nine logs of the same pull.'}
      - {name: min_on_ms, type: uint16, label: Minimum Log Time, units: ms, scale: 1.0, min: 0, max: 65535, default: 0, help: 'Once logging, keep logging at least this long. A file per second is a card full of headers and no data, and this is the floor under how short a log can be.'}
      - {name: min_off_ms, type: uint16, label: Minimum Gap, units: ms, scale: 1.0, min: 0, max: 65535, default: 0, help: 'How long to stay stopped before a new file may start. It is what decides whether a stall-and-restart continues as one session or begins another.'}
      - {name: max_on_ms, type: uint16, label: Maximum Log Time, units: ms, scale: 1.0, min: 0, max: 65535, default: 0, help: 'A hard limit on one file; 0 = no limit. With a zero Re-Arm Delay this is file ROLLING — the file closes and the next opens on the following tick, at the cost of the records in that tick.'}
      - {name: rearm_ms, type: uint16, label: Re-Arm Delay, units: ms, scale: 1.0, min: 0, max: 65535, default: 0, help: 'How long to wait after the maximum time trips before logging again. 0 rolls straight into the next file; anything else is a rate limit on a condition that keeps asking.'}
      - name: on_invalid
        type: enum
        label: If Unanswerable
        options: ['Off', 'On', Hold]
        default: 1
        help: 'What to do when the condition cannot be evaluated — a channel it names is dead, absent or never assigned. A LOGGER wants the opposite default to an output: a channel going dark is exactly the moment a recording is worth having, so this fails ON where a starter or a fuel pump must fail off.'
  # The unified DTC table's telemetry view — packed each frame by the Diagnostics
  # module from DtcManager. This is the ONLY place error state reaches TS.
  Diagnostics:
    provides:        # ids -> signals: catalog (the value bus); encoding lives there
    - dtc_active
    - dtc_stored
    - dtc_worst_sev
    - dtc_worst_code
    - dtc_indicators
    config:
      scalars: []
  Lambda:
    cadence_hz: 30    # control cadence (firmware constant, not a tune field)
    requires: [lambda_1, lambda_target, clt, rpm, map]
    provides:
    - fuel_corr_stft
    - fuel_corr_ltft
    - stft_pct
    - ltft_pct
    - lambda_overall
    - lambda_bank_1
    - lambda_bank_2
    config:
      scalars:
      # `enabled` IS THE MODULE'S SWITCH, like every other feature's, and it runs the fast loop.
      # `ltft_enabled` is the second mechanism on top — the same shape idle uses (enabled +
      # ltt_enabled), because they are the same relationship: a controller, and whether it also
      # remembers. Both off is open loop; the learned surface can be applied with the fast loop
      # stopped, which is how you measure how wrong the tables are.
      #
      # DISABLING ZEROES THE CORRECTION, IT DOES NOT FREEZE IT. A trim that is switched off but still
      # applying its last value is the worst of both: the engine is being corrected by something the
      # tuner believes is off, and anything measuring the mixture — an autotune measuring the VE
      # table's own error — reads an error that has already been partly hidden. Off means 1.000.
      - {name: enabled, type: uint8, label: Closed-Loop Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'The FAST correction: move the mixture toward the target now, from what the widebands are reading. Off, nothing corrects for a wideband and the fuel calculation is whatever the tables say — which is exactly what is wanted while measuring how wrong those tables are. Turning it off zeroes the correction and clears the integrator, so re-enabling starts from nothing rather than from a stale wind-up. Short-term trim is never stored: it dies with the key.'}
      - {name: ltft_enabled, type: uint8, label: Long-Term Trim, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'The LEARNED correction: a stored surface of what the short-term trim keeps having to do, applied from the moment the engine starts — before a wideband has even warmed up, which is where its value is. Off, the surface is retained but not applied; this switch never clears what was learned. Learning INTO it additionally needs the short-term trim running, because what it learns is whatever that trim settles on.'}
      # --- NARROWBAND CLOSED LOOP -------------------------------------------------------------------
      # A DIFFERENT CONTROL LAW, because it is a different measurement. A narrowband reports which SIDE
      # of stoichiometry the mixture is on and nothing about how far, so there is no error to be
      # proportional to: the loop RAMPS until the sensor switches, jumps, and ramps back. The mixture
      # deliberately oscillates about stoich and the AVERAGE of that limit cycle is the correction —
      # which is also why a three-way cat wants it, the alternating O2 storage and release being what
      # lets it reduce NOx and oxidise CO/HC at once.
      #
      # These are only consulted when a narrowband is actually driving the loop: a wideband, when one is
      # readable, always wins, because it measures the quantity rather than bracketing it.
      # WHICH SENSOR DRIVES THE LOOP — CHOSEN, NOT INFERRED. This used to be automatic: any readable
      # wideband won, and a narrowband ran only when none was. That is defensible and it is invisible.
      # With both fitted you could not tell what was driving the mixture without interrogating a state
      # channel, and "which sensor is my closed loop actually using" is not a question a tuner should
      # have to ask the telemetry. Pick it, and the answer is on the page.
      #
      # It also decides the ERROR DOMAIN, which is why Target Voltage and Warm Voltage below apply to a
      # narrowband and not to a wideband: a wideband measures lambda and takes its target from the
      # lambda table, a narrowband reports volts about stoichiometry and nothing else. The firmware
      # reads the chosen channel's sensor TYPE and follows it — so the two cannot disagree.
      #
      # -1 = Disabled: no fast loop at all. The learned trim still applies, which is the whole point of
      # it being a separate switch.
      # WHICH SENSOR CLOSES THE LOOP, chosen rather than inferred, and named by the JOB where a job
      # exists. "Wideband bank 1" and "Wideband overall" resolve through the assignment list, so
      # re-plumbing a sensor is one edit there; "Wideband N" names one sensor outright, for a rig where
      # the role machinery is more ceremony than help.
      #
      # BANK 2 IS THE BANKED/UNBANKED SWITCH. Left Disabled, there is ONE loop and it uses this source
      # for the whole engine — which is why this field is called Unbanked/Bank 1 rather than Bank 1.
      # Set it, and each bank gets its own loop on its own source.
      #
      # "WIDEBAND OVERALL" IS LAST, AND ONLY HERE. It is the one option that asserts "this sensor sees
      # everything", so it cannot be a BANK's source: two loops must measure two different things or
      # they are correcting the same gas from the same reading and will chase each other. It sits at
      # the END of the list so bank 2's list is this one minus its final entry — every other option
      # therefore means the same number in both fields, which is what stops the two encodings drifting
      # apart the first time somebody inserts an option in the middle.
      - {name: o2_src_1, type: enum, label: Unbanked/Bank 1, default: 0, options: ["Disabled", "Narrowband 1", "Narrowband 2", "Wideband Bank 1", "Wideband 1", "Wideband 2", "Wideband 3", "Wideband 4", "Wideband 5", "Wideband 6", "Wideband 7", "Wideband 8", "Wideband 9", "Wideband 10", "Wideband 11", "Wideband 12", "Wideband 13", "Wideband 14", "Wideband 15", "Wideband Overall"], help: 'The O2 sensor the closed loop listens to. Bank and overall resolve through the wideband assignment list — whichever ENABLED sensor holds that job — so re-plumbing is one edit there rather than two in different places; Wideband N names one sensor directly. A wideband is compared against the target lambda table; a narrowband reports only which side of stoichiometry the mixture is on, is compared against Target Voltage, and can close the loop only where the target IS stoichiometry. Disabled stops the fast correction entirely, and the learned long-term trim is a separate switch that still applies. A role nothing is assigned to leaves the loop with nothing to hear, which raises P1753 rather than silently correcting nothing.'}
      - {name: o2_src_2, type: enum, label: Bank 2, default: 0, options: ["Disabled", "Narrowband 1", "Narrowband 2", "Wideband Bank 2", "Wideband 1", "Wideband 2", "Wideband 3", "Wideband 4", "Wideband 5", "Wideband 6", "Wideband 7", "Wideband 8", "Wideband 9", "Wideband 10", "Wideband 11", "Wideband 12", "Wideband 13", "Wideband 14", "Wideband 15"], help: 'The second bank''s source, and the switch between unbanked and banked control. Disabled means ONE loop for the whole engine on the Unbanked/Bank 1 source. Set it, and bank 1 and bank 2 each run their own correction from their own sensor — which is what a V engine with a sensor per bank wants, because the two banks genuinely do run differently. It cannot be set while Bank 1 is Disabled: there is no second bank without a first.'}
      - {name: nb_target_mv, type: uint16, label: Target Voltage, units: mV, scale: 1.0, min: 100, max: 900, default: 450, help: 'The sensor voltage the loop drives towards, and with it the point that divides rich from lean. A zirconia cell switches almost vertically through stoichiometry, so the exact figure matters far less than it looks — 450 mV is the convention, and it drifts a little with heat and age. Above it the mixture is rich and fuel comes out; below it, lean and fuel goes in. Ignored on a wideband, which is measuring lambda and takes its target from the lambda table.'}
      - {name: nb_warm_mv, type: uint16, label: Warm Voltage, units: mV, scale: 1.0, min: 0, max: 900, default: 600, help: 'The voltage a narrowband must have reached at least once before it is believed. A cold Nernst cell cannot source much EMF, so "has it ever got this high" is a direct readiness test needing no timer and no heater feedback — and it closes the trap where a warming sensor sits near the switch point looking exactly like a live signal that happens to be at stoich.'}
      - {name: osc_amplitude, type: uint16, label: Target Oscillation Amplitude, units: '', scale: 0.001, min: 0, max: 500, default: 0, help: 'A deliberate swing added to the target — in VOLTS on a narrowband, in LAMBDA on a wideband. On a narrowband it alternates each time the sensor crosses it; on a wideband the target steps to the other side once the reading has reached it, so 0.02 cycles the mixture between about 0.98 and 1.02. Zero means hold the target still. It is not a tolerance: a three-way catalyst wants the mixture cycling, because alternating oxygen storage and release is what lets one brick reduce NOx and oxidise CO and HC at the same time. On a narrowband the loop will cycle anyway (a switching sensor gives it nothing to settle on); this is how you ask for that swing rather than inherit whatever the gains happen to produce.'}
      - {name: nb_stoich_band, type: uint16, label: NB Stoich Band, units: 'λ', scale: 0.001, min: 0, max: 200, default: 20, help: 'How far the TARGET may sit from lambda 1.00 and still be closed-loop on a narrowband. Outside this the sensor is pinned to one rail and reports nothing useful, so the loop opens rather than chasing a saturated reading — a target of 0.85 under boost is open loop, and no narrowband setting changes that.'}
      - {name: nb_bias_pct, type: int16, label: NB Bias, units: '%', scale: 0.01, min: -500, max: 500, default: 0, help: 'A deliberate offset applied to the averaged correction, positive richer. The only mixture adjustment a narrowband can actually give you: the sensor still switches at stoich, so this biases where the oscillation sits about it rather than moving the target.'}
      # AUTHORITY IS TWO NUMBERS, NOT ONE. Adding fuel and removing it are not equally dangerous: a
      # wideband that fails lean will pull fuel until something melts, so the disenrich bound is a
      # safety limit while the enrich bound is merely a sanity one. A single symmetric clamp cannot
      # say that.
      #
      # AND THE LIMIT IS THE TUNER'S, NOT THE SCHEMA'S. `default:` here is a starting tune, nothing
      # more. The `max:` is the only thing the definition is entitled to decide, and it states a
      # PHYSICAL bound rather than an opinion about how much trim is reasonable: 320 % is what an
      # int16 cell at 0.01 % can hold. Someone running an unusual injector or a half-built engine can
      # configure whatever they need without the definition arguing about it.
      - {name: stft_max_enrich, type: uint16, label: STFT Max Enrich, units: '%', scale: 0.1, min: 0, max: 3200, default: 200, help: 'How much FUEL the short-term trim may add, in percent. Wide enough to cover real variation, narrow enough that one bad reading cannot do damage.'}
      - {name: stft_max_disenrich, type: uint16, label: STFT Max Disenrich, units: '%', scale: 0.1, min: 0, max: 3200, default: 150, help: 'How much fuel the short-term trim may REMOVE. Deliberately tighter than the enrich limit by default: a sensor reading falsely rich leans the engine out, which is the direction that destroys pistons.'}
      - {name: ltft_max_enrich, type: uint16, label: LTFT Max Enrich, units: '%', scale: 0.1, min: 0, max: 3200, default: 150, help: 'How much fuel the LEARNED trim may add. If real trims sit pinned at this limit the base fuel table is wrong and should be corrected — with Apply to Base Table — rather than the limit raised.'}
      - {name: ltft_max_disenrich, type: uint16, label: LTFT Max Disenrich, units: '%', scale: 0.1, min: 0, max: 3200, default: 150, help: 'How much fuel the learned trim may remove. Same reasoning as the short-term disenrich limit: leaning out is the dangerous direction, and a learned lean correction persists across a key cycle.'}
      - {name: ltft_gain, type: uint8, label: LTFT Learn Rate, units: '', scale: 1.0, min: 0, max: 255, default: 30, help: 'How fast the settled short-term trim migrates into the learned table. Larger learns faster and can oscillate; smaller follows slowly and is barely moved by one bad cell. Only what the clamp and the cell resolution actually accept is removed from the short-term trim, so the total correction is preserved either way.'}
      # ONE EXPRESSION INSTEAD OF TEN SCALARS. When learning is allowed is a CONDITION, and this ECU
      # already has a stack VM that evaluates conditions against any bus channel or config field. A
      # fixed list of min/max scalars could only ever express what someone thought of in advance —
      # and it still could not say "not while the nitrous is armed" or "not in this gear". It also
      # replaces the gain map the reference uses to keep learning out of idle: `rpm > 1200` says that
      # directly, rather than spending a whole table saying it slowly.
      # --- WHEN LEARNING IS ALLOWED --------------------------------------------------------------
      # THESE GOVERN ONLY WHAT GETS BAKED IN. The short-term trim still corrects whenever it is
      # enabled; this decides whether that correction may become a permanent stored cell. So a gate
      # that is too loose is not a driveability fault — it is a slow corruption of the surface.
      #
      # The question each one asks is the same: does the error RIGHT NOW belong to the axes it is
      # about to be filed under? LTFT stores against rpm x load and only learns when there IS an
      # error, so an error caused by anything else gets recorded in the wrong place and stays there.
      #   warm-up      — the error belongs to COOLANT TEMPERATURE. Warm-up enrichment is large, so a
      #                  modest percentage error in that curve is a big absolute one, and it lands in
      #                  the idle and light-cruise cells you sit in while warming and use most.
      #   cranking     — fuelling comes from the cranking table and prime pulse and bears no relation
      #                  to the VE model; rpm and load barely mean anything and the sensor is not lit.
      #   a tip-in     — accel enrichment error belongs to dTPS. Transport delay makes it worse: the
      #                  gas being smelled was made before the tip-in, and the engine has already
      #                  moved cells.
      #
      # They were promised before they existed: this rule used to read "not in a fuel cut, and past
      # post-start", while its own comment and the Learn While help both claimed "warm, running, past
      # post-start". Two comments asserting a guard that was not there.
      #
      # Every one is a NUMBER rather than a hard-coded constant, because they are per-engine. A
      # threshold set to its neutral value simply does not gate — Min Coolant Temp at 0 is how an
      # engine with no coolant sensor configured still learns, with no special case in the firmware.
      - {name: cl_start_delay_s, type: uint8, label: Closed Loop After Start, units: s, scale: 1.0, min: 0, max: 120, default: 3, help: 'How long the engine must have been running before the fast trim may correct. Straight after start the mixture is carried by cranking and post-start enrichment, and the trim would only learn to fight them.'}
      - {name: cl_after_cut_ms, type: uint16, label: Closed Loop After Fuel Cut, units: ms, scale: 1.0, min: 0, max: 10000, default: 1000, help: 'After ANY fuel cut ends (overrun, rev limiter, a protection) the fast trim stays frozen this long while the exhaust refills. During the cut itself it is always frozen: the wideband sweeps lean on air, and correcting that added fuel on every overrun.'}
      - {name: cl_min_clt, type: int16, label: Closed Loop Min Coolant, units: C, scale: 1.0, min: -40, max: 150, default: -40, help: 'Coolant below which the fast trim is frozen. -40 = no coolant condition. A cold engine is fuelled by warm-up enrichment on purpose, and a trim chasing stoichiometry there works against it.'}
      - {name: learn_min_clt, type: int16, label: Min Coolant Temp, units: C, scale: 1.0, min: -40, max: 150, default: 60, help: 'Coolant temperature below which nothing is learned. Warm-up enrichment is a correction against COOLANT, and any error in it would otherwise be stored against rpm and load, where it is wrong the moment the engine is warm. Set to the temperature at which warm-up enrichment has essentially finished. At -40 it never gates, which is also what to use when no coolant sensor is configured.'}
      - {name: learn_min_rpm, type: uint16, label: Min RPM, units: RPM, scale: 1.0, min: 0, max: 3000, default: 450, help: 'Below this the engine is cranking or stalling, not running: fuelling comes from the cranking table rather than the VE model, and the sensor is usually not lit. Nothing learned here describes the running engine.'}
      - {name: learn_max_rpm, type: uint16, label: Max RPM, units: RPM, scale: 1.0, min: 1000, max: 12000, default: 10000, help: 'Above this, learning stops. The useful ceiling is wherever the mixture stops being steady enough for a stored cell to mean anything — and on a narrowband it is well below the point where the target leaves stoichiometry anyway.'}
      - {name: learn_run_time_s, type: uint8, label: Initial Engine Running Time, units: s, scale: 1.0, min: 0, max: 120, default: 5, help: 'How long the engine must have been RUNNING before learning may start, measured from the transition into running. It covers the settling that post-start enrichment alone does not: a sensor coming up to temperature, and a fuel system finding its pressure. Distinct from the post-start correction, which is about fuelling rather than about time.'}
      - {name: learn_tps_rate_limit, type: uint16, label: Transient Throttle Rate Limit, units: '%/sec', scale: 0.1, min: 0, max: 20000, default: 2000, help: 'How fast the throttle may be moving and still allow learning. A tip-in is corrected by accel enrichment, whose error belongs to the RATE of the throttle rather than to the operating point — and by the time the exhaust reaches the sensor the engine has moved cells, so what would be stored is an error attributed to the wrong place entirely. At 0 it never gates.'}
      - {name: learn_max_tps_en, type: uint8, label: Enable Max TPS, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Opt in to an upper throttle limit for learning. Off by default because the sensible ceiling is engine-specific and the target usually leaves stoichiometry before throttle alone becomes the problem.'}
      - {name: learn_max_tps, type: uint16, label: Max TPS, units: '%', scale: 0.1, min: 0, max: 1000, default: 300, help: 'Throttle above which nothing is learned, when the limit is enabled. A way of keeping the surface to the part-throttle region a closed loop can actually measure.'}
      - {name: learn_max_map_en, type: uint8, label: Enable Max MAP, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Opt in to an upper manifold-pressure limit for learning.'}
      - {name: learn_max_map, type: int16, label: Max MAP, units: kPa, scale: 0.1, min: -1000, max: 4000, default: 1000, help: 'Manifold pressure above which nothing is learned, when the limit is enabled. On a boosted engine this is the honest way to keep learning out of the region where the target is not stoichiometric and, on a narrowband, cannot be measured at all.'}
      - {name: ltft_learn_when, type: expression, length: 64, label: Learn While, help: 'An extra condition the learned trim must also meet before it absorbs correction. It is ADDED to the built-in rule (warm, running, past post-start enrichment, not in a fuel cut, and the limits on this page), so it can only narrow learning, never widen it; empty adds nothing. Reads any bus channel and any config setting — "clt > 60 and rpm > 1200" keeps learning out of idle and warm-up, "and not dfco_active" keeps it out of overrun, "and tps > 2" keeps it off a closed throttle. The short-term trim still corrects whenever it is enabled; this governs only what gets BAKED IN.'}

      tables:
      # GAIN IS NOT ONE NUMBER, IT IS A SURFACE. The plant this loop drives changes enormously with
      # mass flow: at idle the exhaust takes the better part of a second to reach the sensor, so the
      # loop must be gentle or it winds up blind and overshoots; at load the delay collapses and that
      # same gentleness is uselessly slow. One scalar is therefore always a compromise between idle and
      # full load — which is why these are indexed on RPM and manifold pressure, the two things mass
      # flow is made of. Expect a surface that roughly DOUBLES from idle to full load rather than a
      # flat field.
      #
      # Units are % of fuel per unit of ERROR, and the error is in whatever the sensor speaks: lambda
      # for a wideband, volts for a narrowband. One loop, one set of gains, two domains.
      - name: stft_kp_table
        label: Proportional Gain
        units: '%'
        type: uint16
        scale: 0.1
        min: 0
        max: 20000
        rows: 8
        cols: 8
        x_axis: lambda_gain_rpm_axis
        y_axis: lambda_gain_map_axis
        x_channel: rpm
        y_channel: map
        default_row: [500, 500, 500, 500, 500, 500, 500, 500]
        help: 'How hard the correction reacts to the error as it stands, per RPM and manifold pressure. It is the term that recovers from a step: raise it and the loop responds faster, raise it past what the transport delay allows and the mixture hunts, because the loop is still reacting to gas that left the cylinder a moment ago.'
      - name: stft_ki_table
        label: Integral Gain
        units: '%'
        type: uint16
        scale: 0.1
        min: 0
        max: 20000
        rows: 8
        cols: 8
        x_axis: lambda_gain_rpm_axis
        y_axis: lambda_gain_map_axis
        x_channel: rpm
        y_channel: map
        default_row: [800, 800, 800, 800, 800, 800, 800, 800]
        help: 'How fast the correction accumulates while an error persists, per RPM and manifold pressure. This is the term that actually removes a steady error rather than merely reducing it — and on a narrowband it is very nearly the whole controller, because a switching sensor offers nothing to be proportional to once it has saturated. It is also what migrates into the learned trim, so the stored surface ends up holding whatever this converges on.'
      - name: lambda_gain_rpm_axis
        label: Gain RPM Axis
        units: RPM
        type: float
        size: 8
        max_size: 8
        default_values: [750, 1000, 2000, 3000, 4000, 5000, 6000, 8000]
        help: 'The RPM breakpoints the closed-loop gains are looked up on. Concentrate them at the low end, where exhaust transport delay is actually changing: the difference between 750 and 2000 RPM matters far more to this loop than the difference between 6000 and 8000.'
      - name: lambda_gain_map_axis
        label: Gain MAP Axis
        units: kPa
        type: float
        size: 8
        max_size: 8
        default_values: [0, 25, 50, 75, 100, 150, 200, 300]
        help: 'The manifold-pressure breakpoints (ABSOLUTE kPa: 100 is atmospheric) the closed-loop gains are looked up on. With RPM these stand in for mass flow, which is what sets how long the loop must wait to hear the result of what it just did.'
      # THE READING IS OLD, SO SHIFT IT BACK IN TIME. A wideband reports gas that left the cylinder
      # tens to hundreds of milliseconds ago: exhaust transport, which falls as mass flow rises, plus
      # the sensor's own ~100 ms response. So a sample arriving now describes where the engine WAS.
      #
      # The cheap answer is to refuse to learn until the operating point stops moving. That answer is
      # useless here: a fast forced-induction engine spends the interesting part of its life in a
      # hard pull, and the whole boost region would be permanently unlearnable — precisely the cells
      # a tuner most wants filled. So instead the engine's recent positions are kept and the sample is
      # credited to the cell it actually came from, which lets the map learn DURING the pull.
      - name: ltft_delay_table
        label: Lambda Delay
        units: ms
        type: uint16
        scale: 1.0
        min: 0
        max: 1000
        rows: 8
        cols: 8
        # The axes read the same CHANNELS as the fuel table but carry their own coarse breakpoints —
        # transport delay is a smooth monotonic function of mass flow, so it does not need the fuel
        # map's resolution and a tuner cannot measure that finely anyway.
        # 8x8 IS THE CEILING, not 16x16. Transport delay is smooth and monotonic in mass flow — the
        # reference implementation indexes it on RPM ALONE, over seven live cells — so allocating 256
        # of them reserved config for resolution nobody can measure and nobody would fill.
        x_axis: {signal: rpm,       max: 8, values: [500, 1500, 2500, 3500, 4500, 5500, 6500, 8000]}
        y_axis: {signal: fuel_load, max: 8, units: kPa, values: [20, 50, 80, 110, 140, 180, 220, 250]}
        # Row-major, load ascending. Interpolated from the reference implementation's own 3x3 surface
        # (650/2295/7000 RPM against 10/59/160 kPa) so these are measured numbers resampled, not
        # invented ones: largest at low flow where transport is slow, falling toward the sensor's own
        # ~100 ms response at high RPM and load.
        default_values: [330, 298, 265, 246, 227, 208, 189, 180,
                         268, 221, 175, 162, 150, 137, 125, 118,
                         240, 185, 131, 122, 112, 102,  92,  88,
                         225, 165, 108,  99,  91,  82,  74,  70,
                         210, 146,  84,  77,  70,  63,  55,  52,
                         200, 133,  69,  62,  56,  50,  43,  40,
                         200, 133,  69,  62,  56,  50,  43,  40,
                         200, 133,  69,  62,  56,  50,  43,  40]
        help: 'How long ago the gas a wideband is reading now actually left the cylinder — exhaust transport time plus the sensor''s own response. It falls as mass flow rises, so it is largest at idle and low load and smallest at high RPM under boost. The trim uses it to credit a reading to the cell the engine was in when that gas was made, which is what lets the map learn through a hard pull instead of only at steady state. Too small and corrections land in cells ahead of where they belong; too large and they land behind.'

      arrays:
      # SCOPE, per wideband — the only sensors that HAVE one. Row i is the i-th lambda input in catalog
      # order (Wideband O2 1..15), so a row and its sensor line up with no mapping table.
      # This lived on the shared sensor element, which gave a coolant probe an "Assignment" it can never
      # exercise: a scope belongs to a wideband, not to every sensor that happens to exist.
      # Overall = the whole engine; Bank = one cylinder bank (assign_to 1-2); Cylinder = one cylinder
      # (assign_to 1..cylinders). Banks are implicitly 1-2 (no bank-count knob).
      - name: wb
        label: Wideband Scope
        count: 15
        element:
        # NAMED THE WAY THE CONTROL NAMES IT. "Wideband Bank 1" here and "Wideband Bank 1" on O2
        # Control are the same job, so they are the same words — someone matching the list against the
        # selector should not have to notice that "Bank 1" and "Wideband bank 1" mean one thing. A
        # cylinder keeps its plain name because it is not a job the control can select: it says which
        # exhaust this sensor watches, for its own trim table.
        #
        # ONE CONTROL, ONE ANSWER. This was two fields — a mode, and a number meaning "bank or cylinder"
        # depending on the mode — so the same 2 meant bank 2 or cylinder 2 according to the cell beside
        # it, and Overall left the number sitting there meaning nothing at all. A job is one fact and it
        # gets one field: 0 Unassigned, 1 Overall, 2..3 Bank 1..2, 4.. Cylinder 1..12.
        #
        # UNASSIGNED IS THE DEFAULT because a sensor that is merely enabled has not been told what it is
        # looking at. OVERALL sees the whole engine and feeds the global trim; BANK sees one bank and
        # drives that bank's offset; CYLINDER sees one cylinder. The scopes telescope — bank and
        # cylinder correct only the RESIDUAL after the overall trim — so adding a per-cylinder sensor
        # refines the correction rather than duplicating it.
        - {name: assign, type: enum, label: Assignment, default: 0, options: ["Unassigned", "Wideband Overall", "Wideband Bank 1", "Wideband Bank 2", "Cylinder 1", "Cylinder 2", "Cylinder 3", "Cylinder 4", "Cylinder 5", "Cylinder 6", "Cylinder 7", "Cylinder 8", "Cylinder 9", "Cylinder 10", "Cylinder 11", "Cylinder 12"], help: 'What this wideband is measuring, and therefore which job O2 Control can point at. Unassigned means it is fitted and read but drives nothing — the right answer for a reference probe. Overall feeds the global trim; a Bank drives that bank''s offset; a Cylinder is read for its own trim table. ONE sensor may hold each job: assign the same one twice and the rows turn red, because a role names a single sensor and the ECU checks it on every config change.'}
  # Alternator (charge-voltage) control. Closed-loop PI on battery voltage to a target, driving the
  # alternator field/regulator via an abstract duty demand (alternator_duty %) — no pin here; a generic
  # `outputs:` slot (cand=alternator_duty) realises it. Gated on engine RUNNING + rpm >= min_rpm. Optional
  # load-shed above off_above_tps (back off charging at WOT to free a little power) and a soft-start ramp
  # so the field comes on gently after start. Publishes nothing when disabled/shed so the output failsafes.
  Alternator:
    cadence_hz: 50    # control cadence (firmware constant, not a tune field)
    requires: [rpm, battery, tps]
    provides:
    - alternator_duty
    config:
      scalars:
      - {name: enabled, type: uint8, label: Alternator Control Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Regulate the alternator field directly instead of leaving it to the alternator''s internal regulator, so charge voltage becomes a tunable. Requires an alternator whose field is externally accessible; on a self-regulating unit this has nothing to act on.'}
      - {name: target_voltage, type: uint16, label: Target Voltage, units: V, scale: 0.01, min: 1000, max: 1600, default: 1440, help: 'The battery voltage being regulated to. The controller trims the field to hold it, so this is the single number that decides charge rate — too low undercharges, too high boils the battery and shortens the life of everything else on the rail.'}
      - {name: min_rpm, type: uint16, label: Enable Above RPM, units: RPM, scale: 1.0, min: 0, max: 3000, default: 400, help: 'Do not drive the field below this RPM, and only once the engine is RUNNING rather than merely turning. At cranking speed the alternator cannot make its target anyway, and loading the field there just makes the engine harder to start.'}
      - {name: kp, type: uint16, label: Kp, units: '%/V', scale: 0.001, min: 0, max: 60000, default: 30000, help: 'Proportional gain: field duty per volt of error, applied immediately. It sets the response to a load stepping on. Too high and the voltage rings as the controller chases each change.'}
      - {name: ki, type: uint16, label: Ki, units: '%/V/s', scale: 0.001, min: 0, max: 60000, default: 15000, help: 'Integral gain: field duty per volt of error per second. It is what removes a standing offset, so the rail settles on target rather than near it. The integrator is reset whenever charging disengages, so re-engaging always starts clean instead of slamming in a wound-up duty.'}
      - {name: max_duty_pct, type: uint16, label: Max Field Duty, units: '%', scale: 0.1, min: 0, max: 1000, default: 1000, help: 'Ceiling on field duty. It is also what the soft-start ramps UP TO after engaging, so the field is never applied as a step — this is the protection against a full-field slam into a cold alternator or a weak belt.'}
      - {name: off_above_tps, type: uint16, label: Disable Above TPS, units: '%', scale: 0.1, min: 0, max: 1000, default: 0, help: 'Back off charging above this throttle (0 = always on). Frees a little power at WOT.'}
      - {name: soft_start_s, type: uint8, label: Soft-Start Ramp, units: s, scale: 0.1, min: 0, max: 250, default: 30, help: 'After engaging, ramp the field-duty ceiling from 0 to max over this time so the load comes on gently (0 = instant).'}
  # Closed-loop wastegate boost control. PI(+D) on (boost_target - map) plus a feed-forward base-duty
  # table, driving an abstract wastegate-solenoid demand (wastegate_duty %) — no pin here; a generic
  # `outputs:` slot (cand=wastegate_duty, PinOwner::BOOST) realises it. Gated on rpm >= activation_rpm AND
  # map >= activation_kpa. Target/feed-forward are pulled back by frame.prot_boost_corr_pct. Overboost
  # backstop requests a hard fuel/ign cut above overboost_limit_kpa (complements the P0234 DTC path).
  Boost:
    cadence_hz: 50    # bus+ttl cut chain decouples it — safe to decimate
    requires: [rpm, map]
    provides:
    - wastegate_duty
    - boost_target
    - boost_error
    - boost_ltt_pct
    - wastegate_pos_target
    - wastegate_pos_duty
    config:
      scalars:
      - {name: enabled, type: uint8, label: Boost Control Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Control boost by modulating the wastegate. Off, nothing is published for the wastegate at all, so the output falls to its failsafe and the turbo runs on spring pressure alone — which is the safe state, not a broken one.'}
      - name: mode
        type: enum
        label: Mode
        options:
        - Open Loop
        - Closed Loop
        units: ''
        scale: 1.0
        min: 0
        max: 1
        default: 0
        help: 'OPEN LOOP applies the base duty table and nothing else: predictable, entirely dependent on the table being right, and it drifts with air temperature and altitude. CLOSED LOOP adds a PID trim on the error between target and measured MAP, so it holds the target through conditions the table never saw. The base table still matters in closed loop — it is the feed-forward the trim works around, and a good one means the trim barely has to act.'
      - {name: activation_rpm, type: uint16, label: Activation RPM, units: RPM, scale: 1.0, min: 0, max: 12000, default: 2000, help: 'Below this RPM the controller does not act and the loop is held reset. There is nothing to control down there — the turbo is not making boost and driving the wastegate solenoid just fights the spring.'}
      - {name: activation_kpa, type: uint16, label: Activation MAP, units: kPa, scale: 0.1, min: 0, max: 6000, default: 1100, help: 'Manifold pressure floor for acting. Together with the RPM gate it defines "actually on boost": below it the wastegate is already shut by its spring, so any duty is wasted and the integrator would wind up against a limit it cannot move.'}
      # THE HANDOVER — where the closed loop takes over from the feed-forward, which is a different
      # question from whether the module acts at all. Activation above is the second; this is the first.
      #
      # Without it the loop engaged the instant map passed activation_kpa and ran the PID on the whole
      # error from there, so on anything with a real spool the integrator sat pinned at its anti-windup
      # clamp for the entire climb and was STILL pinned at the moment boost reached target — maximum
      # duty at exactly the point it should have been backing off. That is where the overshoot came from.
      - {name: control_point_kpa, type: uint16, label: Control Point Offset, units: kPa, scale: 0.1, min: 0, max: 4000, default: 500, help: 'How far below target the closed loop stays out of it. While manifold pressure is more than this under target, the PID does not act and the output rests on the base duty alone — the spool is the feed-forward table''s job, and a loop that tries to help during it can only wind up. Set too high the loop grabs control early and fights the last of the spool; set too low, and with Spool Assist on especially, the gate is still held hard shut when boost arrives and it sails past target.'}
      - {name: spool_assist, type: uint8, label: Spool Assist, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Below the control point, hold the wastegate fully shut instead of resting on the base duty. It is the fastest way to the target and the least forgiving: the gate is at 100 % right up to the handover, so everything then depends on the control point being far enough out for the loop to catch it. Start with it off and a good base table.'}
      - {name: start_delay_en, type: uint8, label: Use Controller Start Delay, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Hold the closed loop off for a time after activation, on top of the control point. The delay is a curve against RPM because it stands in for spool time, which is not one number — a gate that comes alive at 2000 rpm has seconds to wait, at 7000 rpm almost none.'}
      - {name: kp, type: uint16, label: Kp, units: '%/kPa', scale: 0.001, min: 0, max: 60000, default: 500, help: 'Proportional gain: wastegate duty per kPa of boost error, applied immediately. The first thing to raise if boost sits below target, the first thing to lower if it oscillates around it.'}
      - {name: ki, type: uint16, label: Ki, units: '%/kPa/s', scale: 0.001, min: 0, max: 60000, default: 2000, help: 'Integral gain: duty per kPa of error per second. It removes the steady offset the feed-forward table leaves behind, so boost settles ON target instead of near it. Its authority is deliberately the headroom around the base duty, so anti-windup matches the final clamp and the integrator cannot store demand it will never be allowed to apply.'}
      - {name: ki_sched_en, type: uint8, label: Schedule Ki On Error, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Take the integral gain from a curve against boost error instead of the single Ki above. It is the one gain worth scheduling: near target you want the integrator gentle, or it hunts around a setpoint it has already reached, and far from target you want it decisive, because that is a real offset the feed-forward failed to cover. One number cannot be both. Kp and Kd stay scalars until something proves otherwise.'}
      - {name: kd, type: uint16, label: Kd, units: '%*s/kPa', scale: 0.001, min: 0, max: 60000, default: 0, help: 'Derivative gain: duty per kPa-per-second of error. It damps the approach to target, which is what tames a spike on a fast-spooling turbo. It amplifies MAP noise, so it is the term to leave at zero unless overshoot is the actual problem.'}
      - {name: max_duty_pct, type: uint16, label: Max Wastegate Duty, units: '%', scale: 0.1, min: 0, max: 1000, default: 900, help: 'Ceiling on wastegate duty, and also the top of the PID''s authority. It is the mechanical safety on this loop: no combination of table and trim can command more than this, so a wound-up or mistuned controller cannot hold the gate shut indefinitely.'}
      # THE FLOOR, and it is scaled by the protection correction rather than sitting under it. A floor
      # holds the gate partly shut, which makes MORE boost — so a fixed one would have answered a
      # protection event demanding less boost by refusing to go below it, and at kill-boost it would
      # have been driving the solenoid while the correction said stop. Scaled, it falls with the
      # correction and reaches zero exactly when the correction does.
      - {name: min_duty_pct, type: uint16, label: Min Wastegate Duty, units: '%', scale: 0.1, min: 0, max: 1000, default: 0, help: 'Floor on wastegate duty while the module is active. Most setups want 0 — the gate should be free to open completely. It earns its keep on a valve that needs some duty before it does anything at all, where a floor keeps the controller out of the dead band at the bottom of its range. Protection scales it down with everything else, so it can never hold the gate shut against a correction asking for less boost.'}
      - {name: iterm_max_pct, type: uint16, label: Integrator Ceiling, units: '%', scale: 0.1, min: 0, max: 1000, default: 1000, help: 'How much duty the integral term alone may ask for (0 = only the loop''s own authority limits it). The anti-windup already stops the integrator exceeding what the output can deliver; this is the tighter, separate question of how much of the answer should come from accumulated error rather than from the base table. Winding it down forces the feed-forward to be right — a loop leaning on a large integrator is one that is correcting for a base table nobody finished.'}
      - {name: max_deriv_kpa_s, type: uint16, label: Derivative Ceiling, units: kPa/s, scale: 0.1, min: 0, max: 20000, default: 1000, help: 'The fastest rate of change the derivative term is allowed to believe (0 = no limit). D amplifies noise by definition — it differentiates — and a single ragged MAP sample on a fast-spooling turbo can otherwise produce a duty spike out of nothing. Clamping the RATE rather than the term means the limit is in units you can reason about from a log.'}
      - {name: min_tps_pct, type: uint16, label: Closed Loop Min TPS, units: '%', scale: 0.1, min: 0, max: 1000, default: 0, help: 'Throttle floor for closing the loop (0 = no throttle gate). Below it the output rests on the base duty, exactly as it does below the control point. It is for the part-throttle cruise where manifold pressure is nowhere near target through no fault of the wastegate — the loop would read that as a large standing error and wind up against it. A gate that is set but cannot be read (no throttle signal) keeps the loop OUT, which is the same safe state.'}
      - {name: overboost_limit_kpa, type: uint16, label: Overboost Cut Limit, units: kPa, scale: 0.1, min: 0, max: 6000, default: 2500, help: 'MAP above which a hard fuel/ign cut is requested (0 = disabled). An ABSOLUTE ceiling: it is the number the engine cannot survive, so it does not move with the target and a low-gear or protection-reduced target does not lower it.'}
      # THE OTHER OVERBOOST QUESTION. The absolute limit asks "is this more than the engine can take";
      # this asks "is this much more than was asked for", which is the one that catches a stuck gate or
      # a split hose while the target is low. They are different faults and both are worth having.
      #
      # It needs a real target to be relative to, so it is skipped whenever the target is below the
      # activation pressure — otherwise a protection event that zeroes the target would make every
      # kilopascal of residual boost an infinite overshoot and request a cut on the spot.
      - {name: overboost_offset_kpa, type: uint16, label: Overboost Offset, units: kPa, scale: 0.1, min: 0, max: 2000, default: 0, help: 'How far OVER the target manifold pressure may go before a cut is requested (0 = disabled). Unlike the absolute limit this tracks the target down, so it still protects in the low gears and under a protection pull-back where a fixed ceiling is miles away. Leave enough room for the overshoot a healthy loop makes on a fast spool, or it will cut on a good pull.'}
      - {name: overboost_hyst_kpa, type: uint16, label: Overboost Release Margin, units: kPa, scale: 0.1, min: 0, max: 500, default: 50, help: 'Once the overboost cut has tripped it holds until manifold pressure is this far BELOW the limit. Without a margin the cut chatters on and off at the limit every frame, which is harder on the engine than either state.'}
      - name: overboost_cut_method
        type: enum
        label: Overboost Cut
        options:
        - Fuel
        - Ignition
        - Both
        units: ''
        scale: 1.0
        min: 0
        max: 2
        default: 0
        help: 'What gets cut when the hard overboost limit is exceeded. This is a LAST RESORT backstop, in addition to the DTC path — by the time it acts the boost control has already failed, so choose the cut that stops boost fastest for the hardware rather than the one that is kindest.'
      # ---- THE DRIVER'S OWN CONTROLS ---------------------------------------------------------------
      #
      # An arm switch, a trim knob and a scramble button. All three are bus signals rather than pins,
      # so any of them can equally be a condition — an expression, a CAN frame, a steering-wheel button
      # off the dash — without this module knowing the difference.
      #
      # UNASSIGNED IS -1, not 0. Selector defaults of 0 named signal id 0 (ABS mode), which is a real
      # channel: harmless only for as long as nothing publishes it, and a phantom scramble on the day
      # something does.
      - {name: arm_sig, type: uint8, label: Arm Switch Signal, units: '', scale: 1.0, min: -1, max: 254, default: -1, help: 'A signal that must be asserted for boost control to act at all (-1 = always armed). Unarmed, nothing is published for the wastegate and the turbo runs on spring pressure — the same safe state as switching the module off, but on a switch the driver can reach. It is a gate, not a mode: everything else about the tune is unchanged while it is open.'}
      - {name: trim_sig, type: uint8, label: Boost Trim Signal, units: '', scale: 1.0, min: -1, max: 254, default: -1, help: 'An analog input, read as 0-100 %, that moves the boost target by up to Trim Authority (-1 = no trim). A dashboard knob, in other words. At 0 % it does nothing, so the knob''s off position is its own bottom stop rather than some midpoint nobody can find by feel.'}
      - {name: trim_max_kpa, type: int16, label: Trim Authority, units: kPa, scale: 0.1, min: -2000, max: 2000, default: -1000, help: 'How far the trim knob may move the target at full travel. NEGATIVE is the sensible direction and the shipped one: the knob then only ever takes boost away, so a knob that has been left somewhere, or an input that has failed high, cannot ask the engine for more than the tune says. A positive value means the driver can add boost the map never authorised, which is a decision rather than a default.'}
      - {name: scramble_sig, type: uint8, label: Scramble Input Signal, units: '', scale: 1.0, min: -1, max: 254, default: -1, help: 'A momentary 0/1 signal that bumps boost while it is active (-1 = none). The bump is not simply "while held" — see the hold, maximum and rest times, which together make a button that can be tapped and cannot be leant on.'}
      - {name: scramble_kpa, type: uint16, label: Scramble Boost Bump, units: kPa, scale: 0.1, min: 0, max: 2000, default: 300, help: 'How much the boost target is raised while scramble is active. It adds to whatever the target table gives, so the shape of the map is preserved and only the level moves.'}
      - {name: scramble_base_pct, type: uint16, label: Scramble Duty Bump, units: '%', scale: 0.1, min: 0, max: 1000, default: 0, help: 'Extra wastegate duty while scramble is active, on top of the target bump. The target bump says what to aim for and the loop takes time to get there; this puts duty in immediately, which is what makes the button feel like it did something. Useless in open loop, where the target bump does nothing and this is the whole effect.'}
      - {name: scramble_hold_s, type: uint16, label: Scramble Hold Time, units: s, scale: 0.1, min: 0, max: 600, default: 50, help: 'The shortest a scramble lasts once it starts, however briefly the button was pressed. It is what turns a momentary switch into a TAP: press and let go, and the bump still runs its course instead of ending with your thumb.'}
      - {name: scramble_max_s, type: uint16, label: Scramble Maximum Time, units: s, scale: 0.1, min: 0, max: 600, default: 100, help: 'The longest one scramble may last, however long the button is held (0 = no limit). This is the half that stops the button being a permanent boost switch — hold it down and the bump ends anyway, and cannot start again until the rest time has passed.'}
      - {name: scramble_rest_s, type: uint16, label: Scramble Rest Time, units: s, scale: 0.1, min: 0, max: 600, default: 0, help: 'How long scramble is locked out after it has run its maximum time. It only applies to a bump that was ENDED by the maximum — a normal press that finishes on its own re-arms immediately — so this is the cool-down between sustained uses, not a delay between taps.'}
      # ---- THE ACTUATOR ----------------------------------------------------------------------------
      #
      # A solenoid takes a duty; a motorised gate takes a POSITION, and the difference runs deeper than
      # the units. Everything above this point is unchanged either way — the target, the feed-forward,
      # the corrections, the trim, the handover — because all of it is about how much boost to ask for.
      # What changes is only what the answer is given TO.
      #
      # So the loop stays a pressure loop and the gate adds an inner position loop underneath it: the
      # outer answer, which is "hold the gate this shut", becomes a position demand, and a second PID
      # drives the motor until the valve is there. That is the ETB arrangement, for the same reason —
      # a motor against a spring is a servo problem, and a pressure loop cannot see a stuck valve.
      - name: output_mode
        type: enum
        label: Actuator
        options:
        - Solenoid
        - Motorised Gate
        units: ''
        scale: 1.0
        min: 0
        max: 1
        default: 0
        help: 'What is on the end of the wiring. A SOLENOID is given a duty and the wastegate spring does the rest, which is what the whole of the rest of this module is expressed in. A MOTORISED GATE is given a position instead, and an inner loop drives the motor until the valve reaches it — that needs a position sensor and an H-bridge, and the gate must be spring-OPEN, because an unpowered motor holding a shut valve is the one failure this cannot protect you from.'
      - {name: gate_pos_sig, type: uint8, label: Gate Position Signal, units: '', scale: 1.0, min: -1, max: 254, default: -1, help: 'The sensor the inner loop closes on, reading 0-100 % of valve travel (-1 = none, and a motorised gate without one does not run at all). It is the difference between a servo and an open-loop guess: without feedback nothing knows whether the valve moved, and a gate jammed shut looks exactly like a gate doing its job.'}
      - {name: gate_min_pos_pct, type: uint16, label: Gate Minimum Position, units: '%', scale: 0.1, min: 0, max: 1000, default: 0, help: 'The most SHUT the valve may be commanded. Above zero it keeps the motor off its hard closed stop, which is where a position loop stalls against something it cannot move and winds up trying.'}
      - {name: gate_max_pos_pct, type: uint16, label: Gate Maximum Position, units: '%', scale: 0.1, min: 0, max: 1000, default: 1000, help: 'The most OPEN the valve may be commanded. Reducing it is not a safety measure — less opening is more boost — so it is only for keeping the motor off its other hard stop.'}
      - {name: gate_rate_pct_s, type: uint16, label: Gate Slew Limit, units: '%/s', scale: 1.0, min: 0, max: 10000, default: 0, help: 'How fast the commanded position may move (0 = no limit). It damps a step demand so the valve ramps rather than slamming, which matters more here than on a throttle: the gate is in the exhaust stream and the loop above it can change its mind quickly.'}
      - {name: gate_kp, type: uint16, label: Gate Position Kp, units: '%/%', scale: 0.001, min: 0, max: 60000, default: 2000, help: 'Proportional gain of the inner position loop: motor duty per per cent of position error. The first thing to raise if the valve is slow to arrive, the first to lower if it buzzes around its target.'}
      - {name: gate_ki, type: uint16, label: Gate Position Ki, units: '%/%/s', scale: 0.001, min: 0, max: 60000, default: 4000, help: 'Integral gain of the inner position loop. It is what gets the valve the last per cent against its spring, which proportional gain alone will always leave short.'}
      - {name: gate_kd, type: uint16, label: Gate Position Kd, units: '%*s/%', scale: 0.001, min: 0, max: 60000, default: 0, help: 'Derivative gain of the inner position loop, damping the approach. Leave it at zero unless the valve overshoots its target — position feedback is noisy and this differentiates it.'}
      - {name: gate_iterm_max_pct, type: uint16, label: Gate Integral Clamp, units: '%', scale: 0.1, min: 0, max: 1000, default: 500, help: 'Anti-windup for the inner loop: the integral term is held to this much motor duty. It is what stops a valve jammed by carbon from accumulating full drive against something it is never going to move.'}

      # ---- LONG-TERM TRIM --------------------------------------------------------------------------
      #
      # What the closed loop keeps having to correct is a base table that is not finished. The trim
      # migrates that standing correction out of the integrator and into a cell, so next time the
      # feed-forward already knows and the loop starts from nothing.
      #
      # The gates decide WHEN a reading is worth keeping and are the whole safety of it: learning at
      # part throttle, off boost, or in a gear where the target is deliberately lowered writes a
      # correction that belongs to a condition, not to the engine. The Idle module's trim works the
      # same way, and these are its knobs by the same names.
      - {name: ltt_en, type: uint8, label: Long-Term Trim Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Learn the standing part of the closed-loop correction into a table, so the feed-forward improves instead of the loop re-discovering the same offset on every pull. Off, the learned table is still applied — switching learning off freezes what it knows rather than discarding it.'}
      - {name: ltt_min_tps_pct, type: uint16, label: Learn Above TPS, units: '%', scale: 0.1, min: 0, max: 1000, default: 800, help: 'Throttle floor for learning. Below it the manifold is nowhere near target for reasons that have nothing to do with the wastegate, and anything learned there is a correction for the driver''s right foot.'}
      - {name: ltt_min_rpm, type: uint16, label: Learn Above RPM, units: RPM, scale: 1.0, min: 0, max: 12000, default: 2500, help: 'Bottom of the rpm window in which learning is allowed. Below it the turbo is still coming up and the loop is correcting for spool, which is not a persistent property of anything.'}
      - {name: ltt_max_rpm, type: uint16, label: Learn Below RPM, units: RPM, scale: 1.0, min: 0, max: 12000, default: 7000, help: 'Top of the rpm window. Near the limiter the picture is contaminated by cuts and by whatever protection is doing, so a reading there is not the wastegate''s fault either.'}
      - {name: ltt_min_gear, type: uint8, label: Learn Above Gear, units: '', scale: 1.0, min: 0, max: 10, default: 0, help: 'Lowest gear in which learning is allowed (0 = any, and any is right on a car with no gear signal). The low gears are where the target is deliberately reduced and where the tyres are doing something other than holding the car straight, so they are the worst place to be drawing conclusions about the turbo.'}
      - {name: ltt_dwell_ms, type: uint16, label: Learn Dwell, units: ms, scale: 1.0, min: 0, max: 60000, default: 1500, help: 'How long the operating point must sit in one cell before anything is written to it. It is what stops a sweep through the map smearing one cell''s correction across all of them — the loop needs time to settle before its integrator means what it says.'}
      - {name: ltt_learn_pct, type: uint16, label: Learn Rate, units: '%', scale: 0.1, min: 0, max: 1000, default: 250, help: 'How much of the integrator migrates into the cell each time the dwell completes. Not all of it: the integrator is a noisy estimate of a steady offset, so a fraction at a time averages several visits and a full transfer would let one bad pull rewrite the cell.'}
      - {name: ltt_authority_pct, type: uint16, label: Trim Authority, units: '%', scale: 0.1, min: 0, max: 1000, default: 150, help: 'The most any one learned cell may hold, either way. It is the limit on how wrong the base table is allowed to be before somebody has to go and fix it properly — a trim quietly carrying 30 points of duty is not a trim, it is the tune.'}

      # ---- CORRECTION SLOTS ----------------------------------------------------------------------
      #
      # Four slots, and a slot is three things: a channel to read, a curve to read it on, and which of
      # the two numbers it trims. That is the whole object. Air temperature, coolant, gear, throttle,
      # ethanol and anything nobody has thought of are all the same shape, so they are the same
      # mechanism rather than a named table each — the alternative grows a table every time somebody
      # wants to correct on something new, and half of them sit at zero in every tune.
      #
      # WHICH NUMBER IT TRIMS is the part worth understanding. Correcting the TARGET only means
      # something in closed loop, and correcting the DUTY only really means something in open loop:
      # close the loop and the integrator unwinds a duty correction, so steady-state boost is
      # unchanged and all it shaped was the approach. Both are offered because both are the right
      # answer somewhere, but a tune wants one family or the other, not both.
      #
      # The curve is in PER CENT either way, and each is the natural operation for what it trims:
      # a target correction MULTIPLIES (so -10 % means the same thing at 120 kPa and at 250, and it
      # matches how the protection pull-back already works), a duty correction ADDS (duty is already
      # a percentage, so +5 % is five points of it).
      #
      # The axes carry no units, deliberately. A slot is whatever it is pointed at, and a declared
      # unit would be right for the shipped channel and a lie after the first re-point — which for a
      # convertible quantity is worse than silence, because the studio would convert by it.
      - {name: corr1_en, type: uint8, label: Correction 1 Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Read correction slot 1 and apply it. Off, the curve is not evaluated at all — which is a different thing from a curve of zeroes, and the page says so rather than leaving you to infer it from the cells.'}
      - name: corr1_applies
        type: enum
        label: Correction 1 Applies To
        options:
        - Target
        - Duty
        units: ''
        scale: 1.0
        min: 0
        max: 1
        default: 0
        help: 'Whether slot 1 trims the boost TARGET or the wastegate DUTY. Target is the closed-loop answer: it changes what the engine is asked for and the loop then goes and gets it. Duty is the open-loop answer: it changes what the valve is driven with. In closed loop a duty correction is unwound by the integrator within a second or two, so it shapes the approach and not the boost — if you want less boost when it is hot, correct the target.'
      - {name: corr2_en, type: uint8, label: Correction 2 Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Read correction slot 2 and apply it. Off, the curve is not evaluated at all — which is a different thing from a curve of zeroes, and the page says so rather than leaving you to infer it from the cells.'}
      - name: corr2_applies
        type: enum
        label: Correction 2 Applies To
        options:
        - Target
        - Duty
        units: ''
        scale: 1.0
        min: 0
        max: 1
        default: 0
        help: 'Whether slot 2 trims the boost TARGET or the wastegate DUTY. Target is the closed-loop answer: it changes what the engine is asked for and the loop then goes and gets it. Duty is the open-loop answer: it changes what the valve is driven with. In closed loop a duty correction is unwound by the integrator within a second or two, so it shapes the approach and not the boost — if you want less boost when it is hot, correct the target.'
      - {name: corr3_en, type: uint8, label: Correction 3 Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Read correction slot 3 and apply it. Off, the curve is not evaluated at all — which is a different thing from a curve of zeroes, and the page says so rather than leaving you to infer it from the cells.'}
      - name: corr3_applies
        type: enum
        label: Correction 3 Applies To
        options:
        - Target
        - Duty
        units: ''
        scale: 1.0
        min: 0
        max: 1
        default: 0
        help: 'Whether slot 3 trims the boost TARGET or the wastegate DUTY. Target is the closed-loop answer: it changes what the engine is asked for and the loop then goes and gets it. Duty is the open-loop answer: it changes what the valve is driven with. In closed loop a duty correction is unwound by the integrator within a second or two, so it shapes the approach and not the boost — if you want less boost when it is hot, correct the target.'
      - {name: corr4_en, type: uint8, label: Correction 4 Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Read correction slot 4 and apply it. Off, the curve is not evaluated at all — which is a different thing from a curve of zeroes, and the page says so rather than leaving you to infer it from the cells.'}
      - name: corr4_applies
        type: enum
        label: Correction 4 Applies To
        options:
        - Target
        - Duty
        units: ''
        scale: 1.0
        min: 0
        max: 1
        default: 0
        help: 'Whether slot 4 trims the boost TARGET or the wastegate DUTY. Target is the closed-loop answer: it changes what the engine is asked for and the loop then goes and gets it. Duty is the open-loop answer: it changes what the valve is driven with. In closed loop a duty correction is unwound by the integrator within a second or two, so it shapes the approach and not the boost — if you want less boost when it is hot, correct the target.'
      tables:
      - name: boost_target_table
        min: 0
        max: 10000
        label: Boost Target
        units: kPa
        type: uint16
        scale: 0.1
        rows: 8
        cols: 8
        x_axis: boost_rpm_axis
        y_axis: boost_gear_axis
        y_optional: true
        x_channel: rpm
        y_channel: gear
        default_row: [1000, 1000, 1500, 1800, 2000, 2000, 1900, 1800]
        help: 'The boost being asked for at each operating point. Everything else in this module serves this table: closed loop drives the error against it, and the protection correction scales it down. It is a TARGET, not a limit — the overboost cut is what enforces a ceiling.'
      # INDEXED BY WHAT IS BEING ASKED FOR, not by rpm. This was rpm x gear, and rpm alone cannot say
      # what duty a target needs: the same 4000 rpm asking for 120 kPa and for 230 kPa wants two very
      # different numbers, and a table whose axis is rpm has one cell for both. Against TARGET the
      # table says the thing it is for — "this much duty gets you that much boost" — and the rpm axis
      # underneath it carries what is left, which is that the same target costs more duty where there
      # is less exhaust energy to work with.
      #
      # The target it reads is the CORRECTED one the module has already published this frame, so
      # protection pulling the target back walks the feed-forward down the table with it instead of
      # leaving it asking for a duty that belongs to a boost level nobody is allowed to make.
      - name: base_boost_duty_table
        min: 0
        max: 1000
        label: Wastegate Base Duty
        units: '%'
        type: uint16
        scale: 0.1
        rows: 8
        cols: 16
        x_axis: base_targ_axis
        y_axis: base_rpm_axis
        y_optional: true
        x_channel: boost_target
        y_channel: rpm
        default_row: [0, 50, 120, 200, 280, 350, 420, 480, 540, 600, 650, 700, 750, 800, 850, 900]
        help: 'The wastegate duty that gets close to target on its own, before any closed-loop trim. In open loop this IS the control. In closed loop it is the feed-forward, and getting it approximately right is what lets the PID run gentle gains and still respond quickly — a good base table means the trim only ever corrects for the day''s weather. It is read against the TARGET, so every cell answers one question: what duty does this much boost take. The RPM axis is there for the part the target cannot explain — the same boost costs more duty where there is less exhaust energy — and is off by default, because a dimension nobody calibrates is a set of duplicate rows that still has to be kept in step.'
      # THE START DELAY, as a curve rather than a number. It stands in for spool time and spool time is
      # not one number: a turbo that comes alive at 2000 rpm has seconds to wait before the loop can do
      # anything useful, and at 7000 rpm it has almost none. A scalar here would be tuned for one end of
      # the range and wrong at the other.
      - name: start_delay_table
        min: 0
        max: 300
        label: Controller Start Delay
        units: s
        type: uint16
        rows: 1
        cols: 8
        scale: 0.01
        x_axis: delay_rpm_axis
        x_channel: rpm
        default_row: [300, 250, 200, 150, 100, 100, 100, 100]
        help: 'How long after activation the closed loop stays out of it, against the RPM the gate came alive at. It is measured from activation, runs alongside the control point rather than instead of it, and whichever is still unsatisfied keeps the loop out — so a gate that reaches the control point early still waits, and one that never reaches it is never handed over however long the delay was.'
      - name: delay_rpm_axis
        label: Start Delay RPM Axis
        units: RPM
        type: float
        size: 8
        max_size: 16
        default_values: [2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000]
        help: 'RPM breakpoints for the start delay. Worth concentrating where the turbo actually comes alive, since that is the only region where the delay differs from its floor.'
      - name: boost_rpm_axis
        label: Boost RPM Axis
        units: RPM
        type: float
        size: 8
        max_size: 16
        default_values: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000]
        help: 'RPM breakpoints for the boost target table. Worth concentrating through the spool-up region, where the achievable target changes fastest.'
      - name: boost_gear_axis
        label: Boost 2nd Axis (Gear — off by default)
        units: ''
        type: float
        size: 8
        max_size: 8
        default_values: [1, 2, 3, 4, 5, 6, 7, 8]
        help: 'Optional second axis for the boost target — gear by default, and off by default. Enabling it is how boost is limited in the low gears where the tyres cannot take full torque, without touching the target anywhere else.'
      - name: base_targ_axis
        label: Base Duty Target Axis
        units: kPa
        type: float
        size: 16
        max_size: 16
        default_values: [100, 110, 120, 130, 140, 150, 160, 170, 180, 190, 200, 210, 220, 230, 240, 250]
        help: 'Target-pressure breakpoints for the base duty table, absolute. The bottom wants to sit at or just under atmospheric so the table has somewhere to say "asking for nothing, drive nothing"; the top wants to reach past the most this engine will ever be asked for, because a table cannot extrapolate — it holds its end cell, and an end cell short of the target is a feed-forward that quietly stops growing.'
      - name: base_rpm_axis
        label: Base Duty RPM Axis
        units: RPM
        type: float
        size: 8
        max_size: 16
        default_values: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000]
        help: 'RPM breakpoints for the base duty table. It is a separate axis from the target table''s on purpose: what the wastegate needs is shaped by the turbo and the gate, not by what is being asked for.'
      - name: ki_table
        min: 0
        max: 60000
        label: Integral Gain vs Error
        units: '%/kPa/s'
        type: uint16
        rows: 1
        cols: 8
        scale: 0.001
        x_axis: ki_err_axis
        x_channel: boost_error
        default_row: [4000, 3000, 2000, 1000, 1000, 2000, 3000, 4000]
        help: 'Integral gain against how far boost is from target, used in place of the Ki scalar while scheduling is on. Gentle in the middle and firmer at the ends is the shape that matters: close to target a large Ki hunts, because it keeps integrating a difference that is mostly noise, while a long way from target the same difference is a real offset the feed-forward did not cover and there is nothing to be gained by creeping up on it. The shipped curve is that shape around the scalar default, not a measured tune.'
      - name: ki_err_axis
        label: Ki Error Axis
        units: kPa
        type: float
        size: 8
        max_size: 16
        default_values: [-100, -50, -20, -5, 5, 20, 50, 100]
        help: 'Boost error breakpoints for the integral gain curve — target minus manifold pressure, so NEGATIVE is over target. Worth keeping a pair of bins close either side of zero: that gap is what decides how near the setpoint the loop stops pushing, and it is where hunting is either designed out or designed in.'
      - name: corr1_table
        min: -1000
        max: 1000
        label: Correction 1
        units: '%'
        type: int16
        rows: 1
        cols: 8
        scale: 0.1
        x_axis: corr1_axis
        x_channel: iat
        default_row: [0, 0, 0, 0, 0, 0, 0, 0]
        help: 'Correction slot 1, shipped pointed at air temperature and correcting nothing. Per cent: on the target it multiplies (-10 % asks for a tenth less boost, whatever the target was), on the duty it adds (+5 % is five more points of duty). Re-point its channel and it is a correction on something else entirely — the curve does not care what it is reading.'
      - name: corr1_axis
        label: Correction 1 Axis
        units: ''
        type: float
        size: 8
        max_size: 16
        default_values: [-20, 0, 20, 40, 60, 80, 100, 120]
        help: 'Breakpoints for correction slot 1, in whatever units its channel publishes — the axis carries none of its own, because the slot is whatever it is pointed at. Shipped for air temperature; re-point the channel and these want redrawing for the new one''s range.'
      - name: corr2_table
        min: -1000
        max: 1000
        label: Correction 2
        units: '%'
        type: int16
        rows: 1
        cols: 8
        scale: 0.1
        x_axis: corr2_axis
        x_channel: clt
        default_row: [0, 0, 0, 0, 0, 0, 0, 0]
        help: 'Correction slot 2, shipped pointed at coolant temperature and correcting nothing. Per cent: on the target it multiplies (-10 % asks for a tenth less boost, whatever the target was), on the duty it adds (+5 % is five more points of duty). Re-point its channel and it is a correction on something else entirely — the curve does not care what it is reading.'
      - name: corr2_axis
        label: Correction 2 Axis
        units: ''
        type: float
        size: 8
        max_size: 16
        default_values: [-20, 0, 20, 40, 60, 80, 100, 120]
        help: 'Breakpoints for correction slot 2, in whatever units its channel publishes — the axis carries none of its own, because the slot is whatever it is pointed at. Shipped for coolant temperature; re-point the channel and these want redrawing for the new one''s range.'
      - name: corr3_table
        min: -1000
        max: 1000
        label: Correction 3
        units: '%'
        type: int16
        rows: 1
        cols: 8
        scale: 0.1
        x_axis: corr3_axis
        x_channel: gear
        default_row: [0, 0, 0, 0, 0, 0, 0, 0]
        help: 'Correction slot 3, shipped pointed at gear and correcting nothing. Per cent: on the target it multiplies (-10 % asks for a tenth less boost, whatever the target was), on the duty it adds (+5 % is five more points of duty). Re-point its channel and it is a correction on something else entirely — the curve does not care what it is reading.'
      - name: corr3_axis
        label: Correction 3 Axis
        units: ''
        type: float
        size: 8
        max_size: 16
        default_values: [1, 2, 3, 4, 5, 6, 7, 8]
        help: 'Breakpoints for correction slot 3, in whatever units its channel publishes — the axis carries none of its own, because the slot is whatever it is pointed at. Shipped for gear; re-point the channel and these want redrawing for the new one''s range.'
      - name: corr4_table
        min: -1000
        max: 1000
        label: Correction 4
        units: '%'
        type: int16
        rows: 1
        cols: 8
        scale: 0.1
        x_axis: corr4_axis
        x_channel: tps
        default_row: [0, 0, 0, 0, 0, 0, 0, 0]
        help: 'Correction slot 4, shipped pointed at throttle position and correcting nothing. Per cent: on the target it multiplies (-10 % asks for a tenth less boost, whatever the target was), on the duty it adds (+5 % is five more points of duty). Re-point its channel and it is a correction on something else entirely — the curve does not care what it is reading.'
      - name: corr4_axis
        label: Correction 4 Axis
        units: ''
        type: float
        size: 8
        max_size: 16
        default_values: [0, 15, 30, 45, 60, 75, 90, 100]
        help: 'Breakpoints for correction slot 4, in whatever units its channel publishes — the axis carries none of its own, because the slot is whatever it is pointed at. Shipped for throttle position; re-point the channel and these want redrawing for the new one''s range.'
  # Launch control — the second RPM limiter that holds the engine at the line, and the calibration the
  # engine runs on while it does. Armed by a condition you write; disarmed it does nothing and the
  # primary RevLimiter still owns the hard over-rev cut.
  #
  # ARMING IS ONE EXPRESSION. It used to be a signal selector, a speed gate and a throttle gate — three
  # fields spelling out one sentence, and still unable to say "the launch switch AND the brake is
  # released". `arm_expr` is the mechanism traction control and cruise already use: a condition reading
  # any bus channel or config field, so the reference's five wiring positions (always on, launch switch,
  # clutch, brake, trans brake) and its four validations (coolant, pedal, road speed, and everything
  # they do not offer) are all one line. It fails to FALSE, which for arming is the safe direction.
  #
  # THE LIMIT IS A TABLE: `end_rpm_table` is the RPM at which the cut is total. Its axes are load and
  # road speed, both OFF by default, so out of the box it is one number and behaves exactly like the
  # scalar it replaces — switch one on and the limit moves with boost, or with a car that has started
  # to roll. Below it lies the soft band (`cut_range_rpm`), where the cut is a DUTY spread frame by
  # frame (CutDuty, as RevLimiter's soft limiter does) rather than an on/off bounce.
  #
  # WHILE IT HOLDS, THE ENGINE RUNS ON THE LAUNCH MAPS. `ign_advance_table` is the ABSOLUTE advance —
  # Ignition takes it in place of the main map, the way the cranking table does, with every retard
  # still subtracting underneath — and `fuel_corr_table` trims fuel around it. Away from the launch
  # cell both should read like the normal calibration, because the engine still runs through them on
  # the way there and on the way back.
  Launch:
    cadence_hz: 200    # bus+ttl cut chain decouples it — safe to decimate
    requires: [rpm, fuel_load]
    provides:
    - launch_active
    - launch_end_rpm
    - launch_cut_pct
    - launch_ign_adv
    - fuel_corr_launch
    config:
      scalars:
      - {name: enabled, type: uint8, label: Launch Control Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Hold RPM against a closed clutch or a trans brake so the engine is on boost at the line, and run the launch fuel and ignition maps while it does. Off, none of it exists: no cut, no maps, and the ignition and fuel calibrations are the ordinary ones.'}
      # THE ARM CONDITION. Empty means the built-in rule — armed while standing still (road speed < 5 km/h),
      # never without a road speed. It used to mean "always armed", which put the launch maps in charge of
      # the first half-minute of every drive. Everything that used to be a gate of its own is written here.
      - {name: arm_expr, type: expression, length: 64, label: Arm When, help: 'The condition that arms launch control. Empty = the built-in rule: armed while the car is STANDING STILL (road speed below 5 km/h) WITH THE THROTTLE OPEN (above 20 %: the pedal on drive-by-wire, the throttle position otherwise), and never without a road speed and a throttle signal — so idling at a stop runs the normal maps. This is where every interlock lives, because they are all the same kind of statement: `launch_sw` for a dedicated button, `clutch_sw and vehicle_spd < 5` for the clutch-and-stationary rule, `launch_sw and clt > 60 and pedal_demand > 50` for the full set of validations, `trans_brake_sw` for a trans brake. A program that cannot be answered arms NOTHING and raises a code — the safe direction for a limiter that cuts the engine.'}
      - {name: timeout_s, type: uint16, label: Launch Timeout, units: s, scale: 1.0, min: 0, max: 600, default: 30, help: 'How long one launch may hold before the module gives up and disarms (0 = no limit). A timer is not a condition, which is why it is here and not in the arm expression: something has to end a launch that is being held against a stuck switch, and holding a cut at 5000 rpm indefinitely cooks the exhaust. Re-arms only when the arm condition goes false and true again, so it cannot simply resume.'}
      - name: cut_method
        type: enum
        label: Cut Method
        options:
        - Fuel
        - Ignition
        - Both
        units: ''
        scale: 1.0
        min: 0
        max: 2
        default: 1
        help: 'What gets cut to hold the launch RPM. IGNITION keeps the turbo lit and makes the noise, at the cost of exhaust heat for as long as the launch is held — it is what a two-step is for. FUEL is far kinder to the turbine and builds less boost. BOTH is the most positive hold, and is the only setting where the stagger below does anything.'
      # THE STAGGER. The reference offers five cut methods, which are really three plus the question of
      # WHICH of the two cuts leads when both are used — "ignition with injection 100 rpm above" is
      # Both, ignition leading, adder 100. Written that way it is two more fields instead of a fourth
      # and fifth ordering of an enum six modules share; that enum already existed in two orders once,
      # and it cost a flat-shift bug to find.
      - {name: cut_adder_rpm, type: uint16, label: Cut Off Adder, units: RPM, scale: 1.0, min: 0, max: 1000, default: 0, help: 'How far ABOVE the leading cut the second one engages, when the cut method is Both (0 = both at the same RPM). Staggering them gives the hold a graded feel: the lead cut catches the rise on its own, and the second only joins if the engine is still climbing past it.'}
      - name: cut_lead
        type: enum
        label: Leading Cut
        options:
        - Ignition
        - Fuel
        units: ''
        scale: 1.0
        min: 0
        max: 1
        default: 0
        help: 'Which of the two cuts engages FIRST when the method is Both and the adder is non-zero; the other follows that many RPM higher. Ignition leading is the usual choice — it holds boost while it works, and fuel is the harder backstop above it.'
      - name: cut_type
        type: enum
        label: Cut Type
        options:
        - Hard Cut
        - Soft Cut
        units: ''
        scale: 1.0
        min: 0
        max: 1
        default: 1
        help: 'HARD CUT is the classic two-step: nothing until the End RPM, then everything, releasing a resume band below it. SOFT CUT ramps the cut in across the range below the End RPM as a percentage delivered frame by frame, so the engine leans on the limiter instead of bouncing off it — steadier at the line and easier on the drivetrain.'
      - {name: cut_range_rpm, type: uint16, label: Cut Off RPM Range, units: RPM, scale: 1.0, min: 0, max: 2000, default: 500, help: 'How far below the End RPM the soft cut starts. Across that range the cut goes from nothing to total, so a wide range is a gentle approach that starts pulling early and a narrow one is nearly a hard cut. Ignored entirely in Hard Cut.'}
      - {name: resume_band_rpm, type: uint16, label: Resume Band, units: RPM, scale: 1.0, min: 0, max: 500, default: 200, help: 'How far RPM must fall below the End RPM before a HARD cut releases. It sets how coarse the bounce is: a narrow band holds the RPM tightly but cuts constantly, a wide one is gentler and less precise. The soft cut needs none of this — its duty already falls away as the RPM does.'}
      tables:
      # THE LIMIT. One cell out of the box, because for most cars it is one number; its axes exist for
      # the two things that genuinely move it — boost, and a car that has started to move.
      - {name: end_rpm_table, min: 500, max: 20000, label: Launch End RPM, units: RPM, type: uint16, scale: 1.0, rows: 8, cols: 8, x_axis: end_load_axis, y_axis: end_speed_axis, x_optional: true, y_optional: true, x_channel: fuel_load, y_channel: vehicle_spd, default: 5000, help: 'The RPM at which every cylinder is cut — the launch limit itself. A single cell by default, which is the scalar launch RPM this replaces. Switch on the load axis to hold a lower RPM until boost arrives, or the speed axis to let the limit climb as the car leaves the line; resize either and this stops being one number.'}
      - {name: end_load_axis, label: Launch End RPM Load Axis, units: kPa, type: float, size: 8, max_size: 8, default_values: [0, 50, 75, 100, 150, 200, 250, 300], help: 'Load breakpoints for the End RPM table, absolute manifold pressure. The axis is OFF by default, so the table is one cell until you switch it on — the breakpoints are already drawn so that switching it on gives a populated table rather than a grid of zeroes to fill in before the launch limiter is safe to use again.'}
      - {name: end_speed_axis, label: Launch End RPM Speed Axis, units: km/h, type: float, size: 8, max_size: 8, default_values: [0, 5, 10, 20, 30, 40, 60, 80], help: 'Road-speed breakpoints for the End RPM table, off by default. Switched on, it is how a launch is let out progressively instead of dropped: the limit climbs as the car starts to roll, so the tyres see the torque arriving over a few km/h rather than all at once.'}
      # THE ADVANCE ITSELF, not a correction. Ignition reads this INSTEAD of the main map while launch
      # is active, so every cell has to be a timing figure the engine can actually run on — the corners
      # away from the launch point are passed through on every launch and on every release.
      - name: ign_advance_table
        min: -500
        max: 500
        label: Launch Ignition Advance
        units: deg
        type: int16
        scale: 0.1
        rows: 8
        cols: 8
        x_axis: launch_rpm_axis
        y_axis: launch_load_axis
        x_channel: rpm
        y_channel: fuel_load
        # Row-major, Y = load rows ascending (0..300 kPa absolute), X = RPM cols ascending, deg x10.
        # Normal-looking advance off boost, winding into retard as load and RPM climb into the corner a
        # launch is actually held in — retard is what puts the heat in the exhaust and the boost against
        # the clutch. Deliberately milder than a race calibration: this is where a tuner starts.
        default_values:
        - [150, 200, 240, 280, 300, 300, 300, 300]   #   0 kPa
        - [150, 200, 240, 280, 300, 300, 300, 300]   #  50 kPa
        - [140, 180, 220, 250, 270, 280, 280, 280]   #  75 kPa
        - [120, 150, 180, 200, 220, 220, 220, 220]   # 100 kPa
        - [100, 120, 130, 120, 100,  80,  60,  50]   # 150 kPa
        - [ 80,  90,  90,  60,  20, -50, -80,-100]   # 200 kPa
        - [ 60,  70,  60,  20, -50,-120,-150,-150]   # 250 kPa
        - [ 40,  50,  40,   0,-100,-150,-150,-150]   # 300 kPa
        help: 'The ignition timing the engine runs on while launch control is active — the actual advance, NOT a correction on the base map. Away from the RPM and load a launch is held at it should read like the normal calibration, because the engine runs through these cells on the way to the limiter and on the way out; at the launch point it is typically well retarded, which is what heats the exhaust and builds boost against a closed clutch. Every retard (knock, protection, traction, anti-lag) still subtracts from this, and the ignition module''s own min/max advance clamps still apply.'
      - name: fuel_corr_table
        min: -1000
        max: 1000
        label: Launch Fuel Correction
        units: '%'
        type: int16
        scale: 0.1
        rows: 8
        cols: 8
        x_axis: launch_rpm_axis
        y_axis: launch_load_axis
        x_channel: rpm
        y_channel: fuel_load
        default_row: [0, 0, 0, 0, 0, 0, 0, 0]
        help: 'Fuel added or taken away while launch control is active, as a percentage of the calculated charge. Zero everywhere is the right starting point and the right value everywhere except the launch point itself: away from it the mixture should be whatever the fuel table says. At the launch point extra fuel cools the charge and feeds the retarded burn into the exhaust — it goes with the timing in the map beside it, not on its own.'
      - {name: launch_rpm_axis, label: Launch Map RPM Axis, units: RPM, type: float, size: 8, max_size: 8, default_values: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000], help: 'RPM breakpoints shared by the launch ignition and fuel maps. Worth concentrating around the End RPM, which is the only region a launch is actually held in — the rest of the range is transit.'}
      - {name: launch_load_axis, label: Launch Map Load Axis, units: kPa, type: float, size: 8, max_size: 8, default_values: [0, 50, 75, 100, 150, 200, 250, 300], help: 'Load breakpoints shared by the launch ignition and fuel maps, absolute manifold pressure. The top of the range is where the launch itself sits — boost against a held car — so it is worth more resolution than the vacuum end, which the engine only passes through.'}
  # DFCO — deceleration (overrun) fuel cut. On a closed throttle, warm engine, above rpm_high, cut fuel
  # (economy, emissions, engine braking, decel backfire); resume below rpm_low or when the throttle opens
  # (RPM hysteresis so it doesn't chatter). ORs into wk::fuel_cut.
  Dfco:
    cadence_hz: 50    # bus+ttl cut chain decouples it — safe to decimate
    requires: [rpm, tps, clt]
    provides:
    - dfco_active
    config:
      scalars:
      - {name: enabled, type: uint8, label: DFCO (Overrun Cut) Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Deceleration Fuel Cut-Off: stop injecting on a closed throttle overrun and resume before the engine loads up again. Off, the module publishes nothing at all and leaves the fuel cut entirely to whoever else claims it. On, it also becomes the signal other modules read as "the engine is not making power" — the knock floor learner, for one, refuses to learn while it is cutting.'}
      - {name: max_tps, type: uint16, label: Closed-Throttle Below TPS, units: '%', scale: 0.1, min: 0, max: 1000, default: 20, help: 'Cut only when TPS is below this (throttle closed).'}
      - {name: min_clt, type: int16, label: Warm Above CLT, units: degC, scale: 1.0, min: -40, max: 150, default: 60, help: 'Cut only when coolant is above this (never on a cold engine).'}
      - {name: rpm_high, type: uint16, label: Cut Above RPM, units: RPM, scale: 1.0, min: 0, max: 12000, default: 1600, help: 'Enter overrun cut above this RPM.'}
      - {name: rpm_low, type: uint16, label: Resume Below RPM, units: RPM, scale: 1.0, min: 0, max: 12000, default: 1200, help: 'Resume fuel below this RPM (hysteresis vs rpm_high).'}
  # LambdaProtect — lean-protection cut. If lambda stays leaner than max_lambda while under load (TPS +
  # RPM above the monitor thresholds) for longer than timeout_ms, cut fuel to stop a lean burndown;
  # the cut holds until the driver lifts (load drops). ORs into wk::fuel_cut.
  LambdaProtect:
    cadence_hz: 50    # bus+ttl cut chain decouples it — safe to decimate
    requires: [rpm, tps, lambda_1]
    provides:
    - lambda_protect_active
    config:
      scalars:
      - {name: enabled, type: uint8, label: Lambda Protection Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Cut fuel if the engine stays lean under load — the last line against a fuel-supply failure at high load, where a lean mixture destroys pistons in seconds. It only monitors inside the RPM and throttle window; outside it (a lift, or idle) the latch releases on its own.'}
      - {name: max_lambda, type: uint16, label: Lean Limit (lambda), units: '', scale: 0.001, min: 800, max: 2000, default: 1100, help: 'Cut if measured lambda exceeds this (leaner) under load, whatever the target. Every wideband holding a job (Overall, Bank 1, Bank 2) is watched and the leanest counts.'}
      - {name: min_tps, type: uint16, label: Monitor Above TPS, units: '%', scale: 0.1, min: 0, max: 1000, default: 600, help: 'Only monitor above this load (lean sensing is meaningless off-throttle).'}
      - {name: min_rpm, type: uint16, label: Monitor Above RPM, units: RPM, scale: 1.0, min: 0, max: 12000, default: 2000, help: 'Only monitor above this RPM. Together with the throttle floor it defines "under load", which is the only condition where a lean reading means danger — a lean idle or an overrun is normal and must not trip this.'}
      - {name: timeout_ms, type: uint16, label: Lean Timeout, units: ms, scale: 1.0, min: 0, max: 5000, default: 500, help: 'How long lean-under-load is tolerated before the cut.'}
      - {name: lean_margin_pct, type: uint16, label: Lean Margin vs Target, units: '%', scale: 0.1, min: 0, max: 500, default: 100, help: 'Also cut when measured lambda is this much LEANER THAN THE TARGET — 10 % means 0.78 target, 0.86 measured. The fixed Lean Limit alone cannot protect a boosted engine: at a 0.78 target a reading of 1.05 is dangerously lean and still under 1.10. 0 = judge by the fixed limit only.'}
  # VehicleSpeed — turn the speed pickups into a road speed. Each pickup publishes raw Hz; this decides
  # which one the car believes, converts it with that sensor's pulses-per-kilometre, and derives the
  # driven/undriven pair that traction control compares.
  #
  # It exists because `vehicle_spd` was a FREQUENCY. Every consumer of it — launch, pit limiter, cruise,
  # gear detection — compares it against a threshold named in kph, and there was no calibration anywhere
  # in the schema or the firmware to make it one, so all four were reading Hz as though it were km/h.
  #
  # Pulses/km is per sensor because it is a property of the car, not of the ECU: tyre circumference and
  # the tooth count of whatever the pickup is looking at. Set it by driving at a known speed and dividing
  # (the studio's Calibrate does exactly that from the live reading and the calibration speed).
  VehicleSpeed:
    cadence_hz: 50    # control cadence (firmware constant, not a tune field)
    requires: [wheel_hz_fl, wheel_hz_fr, wheel_hz_rl, wheel_hz_rr, shaft_hz, gps_hz]
    provides:
    - vehicle_spd
    - shaft_spd
    - gps_spd
    - wheel_fl
    - wheel_fr
    - wheel_rl
    - wheel_rr
    config:
      scalars:
      - {name: enabled, type: uint8, label: Vehicle Speed Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Publish a road speed from the wheel or driveshaft pickups. Off, the module publishes NOTHING rather than zero, so a speed arriving over CAN or set by Lua is left alone — a disabled producer must not stomp another source.'}
      # THE SOURCE NAMES THE SENSORS, AND NOTHING ELSE. It used to say "Driven Wheels" / "Undriven
      # Wheels", which is not a source but a source plus a lookup — you read Driven Axle to find out
      # which two wheels you had asked for, then Driven Wheel Method to find out how they combined. And
      # the two channels that came out of it were consumed by NOTHING: traction control works front and
      # rear out for itself from the four wheel speeds, and never reads a road speed at all. The axle
      # concept lives in one place now, the one place it is real — traction_control.driven_axle, where
      # slip genuinely has to know which end the engine turns.
      #
      # HOW THEY COMBINE IS NOT A CHOICE EITHER. There was an Average / Fastest / Slowest for each set,
      # and every one of them is worse than the middle value in the situations that actually occur: the
      # mean is dragged by a spinning wheel under power AND by a locking one under braking, the fastest
      # IS the spinning wheel, and the slowest is the locking one (and in a corner, the inside wheel,
      # which genuinely turns slower). A median rejects both ends at once. With four wheels that is the
      # mean of the middle two; with three, the middle one; with two, their mean; with one, itself.
      #
      # The first six options are PICKUPS and index the calibration array directly; the last three name
      # a set of corners.
      - {name: main_source, type: enum, label: Main Source, units: '', scale: 1.0, min: 0, max: 8, default: 0, options: ["Drive Train", "Front Left", "Front Right", "Rear Left", "Rear Right", "GPS", "Front Axle", "Rear Axle", "All Wheels"], help: 'Which sensors the road speed comes from — that is the only question here, because how they combine is not a matter of taste. A set takes the MIDDLE value of whichever of its wheels are calibrated and reading, which rejects a wheel spinning under power and one locking under braking at the same time. A drive train sensor reads the average of the driven wheels through the diff, so it inherits their wheelspin. A GPS speedometer module is a pulse train like any other pickup, calibrated in pulses/km the same way — and on a four-wheel-drive car it is the only road speed in the system that the engine does not turn.'}
      - {name: calibration_speed, type: uint16, label: Calibration Speed, units: 'km/h', scale: 0.1, min: 0, max: 4000, default: 600, help: 'The speed to hold while calibrating. Drive at exactly this — by a GPS, not by the car''s own speedometer, which is the thing being calibrated — and Calibrate divides the live pulse rate by it to get pulses/km.'}
      # SHAFT RPM NEEDS ITS OWN NUMBER. The per-sensor calibration below is pulses/km, which is the
      # pickup, the diff ratio and the rolling radius multiplied together and measured as one — useful
      # for road speed and impossible to take apart. Drive shaft RPM is a different question and has to
      # be asked separately. 0 = not known, and the RPM channel publishes nothing.
      - {name: shaft_ppr, type: uint8, label: Drive Shaft Pulses per Rev, units: '', scale: 1.0, min: 0, max: 60, default: 0, help: 'Pulses the drive shaft pickup produces per SHAFT revolution — teeth on the tone ring, or magnets on the yoke. Only needed to report shaft RPM; road speed uses the pulses/km calibration below and does not care. 0 leaves the RPM channel unpublished.'}
      - {name: max_kph, type: uint16, label: Implausible Above, units: 'km/h', scale: 0.1, min: 0, max: 6000, default: 4000, help: 'A reading above this is treated as noise and dropped rather than published. A frequency input with a floating wire reads megahertz, and a road speed of nine thousand is worse than no road speed for anything acting on it.'}
      arrays:
      - name: source
        label: Per-Sensor Calibration
        count: 6
        element:
        - {name: pulses_per_km, type: uint16, label: Calibration, units: 'pulses/km', scale: 1.0, min: 0, max: 65535, default: 0, help: 'How many pulses this pickup produces per unit distance travelled. 0 = not calibrated, and the source publishes nothing. Stored per kilometre and shown per kilometre or per mile to match the unit system, so the number you type is the one you measured. Order matches the first six Main Source options: drive shaft, then FL, FR, RL, RR, then GPS.'}
  # GearDetect — derive the current gear from the RPM/speed ratio (rpm / vehicle_spd), matched to each
  # gear's configured ratio within a tolerance. Publishes `gear` (1..N, 0=unknown), which fuel/ignition/
  # boost/launch already use as a table axis but nothing produced.
  GearDetect:
    cadence_hz: 50    # control cadence (firmware constant, not a tune field)
    requires: [rpm, vehicle_spd]
    provides:
    - gear
    config:
      scalars:
      - {name: enabled, type: uint8, label: Gear Detection Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Work out the gear from the RPM-to-road-speed ratio and publish `gear`. Off, the module publishes NOTHING rather than zero, so a gear set by Lua or arriving over CAN is left alone — a disabled detector must not stomp on another source.'}
      - {name: gear_count, type: uint8, label: Number of Gears, units: '', scale: 1.0, min: 1, max: 8, default: 5, help: 'How many forward ratios to test. Only this many of the ratio entries are considered, so a shorter gearbox does not accidentally match a leftover ratio from a longer one still sitting in the table.'}
      - {name: tol_pct, type: uint8, label: Ratio Tolerance, units: '%', scale: 1.0, min: 1, max: 50, default: 12, help: 'A gear matches when the measured ratio is within this % of its configured ratio.'}
      - {name: min_rpm, type: uint16, label: Detect Above RPM, units: RPM, scale: 1.0, min: 0, max: 12000, default: 500, help: 'Below this RPM the ratio is not believed and the gear reports unknown (0). RPM divided by road speed is meaningless when the clutch is slipping or the car is coasting to a stop, and a wrong gear is worse than no gear for anything downstream that acts on it.'}
      - {name: min_vss, type: uint8, label: Detect Above Speed, units: 'km/h', scale: 1.0, min: 0, max: 255, default: 3, help: 'Below this speed gear is reported as 0 (unknown/neutral).'}
      arrays:
      - name: gear_ratio
        label: Per-Gear Ratio
        count: 8
        element:
        - {name: rpm_per_kph, type: uint16, label: Ratio, units: 'RPM/km/h', scale: 0.1, min: 0, max: 3000, default: 0, help: 'Expected engine RPM per unit of road speed in this gear (rpm / vehicle_spd). Stored per km/h and shown per km/h or per mph to match the unit system. 0 = gear unused.'}
  # FlatShift — clutchless / full-throttle upshift cut. While the shift trigger (clutch switch or a shift
  # button) is active at high RPM + throttle, cut ignition (or fuel/both) to unload the drivetrain so the
  # next gear engages. Time-limited per shift so a stuck trigger can't hold the cut.
  FlatShift:
    cadence_hz: 200    # bus+ttl cut chain decouples it — safe to decimate
    requires: [rpm, tps, clutch_sw]
    provides:
    - shift_cut_active
    config:
      scalars:
      - {name: enabled, type: uint8, label: Flat-Shift Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Cut on a shift trigger so the throttle can stay open through a gear change. The cut is held only while the trigger is asserted AND the RPM/throttle conditions hold, and it re-arms on release — a stuck-on trigger cannot cut indefinitely because the time limit ends it.'}
      - {name: trigger_sig, type: uint8, label: Shift Trigger Signal, units: '', scale: 1.0, min: 0, max: 255, default: clutch_sw, help: 'Bus signal that requests the shift cut (active = pressed): clutch switch or a shift button.'}
      - {name: min_rpm, type: uint16, label: Cut Above RPM, units: RPM, scale: 1.0, min: 0, max: 12000, default: 3000, help: 'Only cut above this RPM. It stops a clutch dip at idle or in traffic reading as a shift, which is the failure a bare trigger input has.'}
      - {name: min_tps, type: uint16, label: Cut Above TPS, units: '%', scale: 0.1, min: 0, max: 1000, default: 700, help: 'Only cut at high throttle (a full-throttle upshift).'}
      - {name: max_cut_ms, type: uint16, label: Max Cut Time, units: ms, scale: 1.0, min: 0, max: 2000, default: 250, help: 'Max continuous cut per shift — a stuck trigger releases the cut after this (safety).'}
      # ONE ORDER FOR ONE ENUM. Six modules cut fuel or ignition and two of them listed the choices the
      # other way round, so "1" meant Ignition on the flat shift and Fuel on the rev limiter — the same
      # word, the same control, a different result. Fuel first everywhere now (it was four modules to
      # two); this module's DEFAULT moves to 1 so a flat shift still cuts ignition, which is what holds
      # boost through the shift.
      - name: cut_method
        type: enum
        label: Cut Method
        options:
        - Fuel
        - Ignition
        - Both
        units: ''
        scale: 1.0
        min: 0
        max: 2
        default: 1
        help: 'What gets cut. IGNITION keeps fuel flowing — unburnt charge in a hot exhaust, which is where the bang comes from and also where turbine damage comes from. FUEL is gentler on the exhaust but recovers more slowly, since the manifold has to refill. BOTH is the hardest cut and the harshest.'
  # TractionControl — wheel-slip throttle cap. Compares driven-axle vs reference-axle wheel speed;
  # when slip exceeds the target it publishes traction_cap (a throttle %) that the ElectronicThrottle
  # reads via its traction_cap_src hook to pull throttle. The hook existed with no producer — this fills it.
  TractionControl:
    cadence_hz: 200    # control cadence (firmware constant, not a tune field)
    requires: [wheel_fl, wheel_fr, wheel_rl, wheel_rr, vehicle_spd]
    provides:
    - traction_cap
    - traction_slip
    - traction_slip_err
    - traction_retard
    - traction_cut_pct
    config:
      scalars:
      - {name: enabled, type: uint8, label: Traction Control Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Pull engine output when the driven wheels outrun the road. Slip is the faster driven wheel measured against the road speed — whichever sensors Vehicle Speed''s Main Source names, so on a four-wheel-drive car point that at GPS and this works too. It answers through three paths that can be used together: a throttle ceiling, a timing retard, and a cut.'}
      # ACTIVE WHEN, not a switch plus an input mode plus a condition editor. The expression VM already
      # answers "is this true right now", so a dash button, a CAN flag, a stalk position or a compound
      # rule (`tc_switch and gear > 1`) are all the same one field — the shape cruise control uses.
      # Empty = always active while enabled. A program that fails to validate holds traction control OFF
      # and raises TRACTION_EXPR: a broken gate must never read as "condition not met".
      - {name: enable_expr, type: expression, length: 64, label: Active When, help: 'Leave empty for always on. Otherwise a condition that must be true for traction control to act — a dash switch, a CAN flag, a stalk position, or a rule combining them. While it is false the module publishes no cap, no retard and no cut.'}
      # WHAT IS SPINNING, AND WHAT THE ROAD IS DOING. The driven speed is the FASTEST driven wheel, with
      # no option: an open diff lets one wheel spin while the other grips, and averaging the pair reports
      # half the slip that is actually happening. On a locked or limited-slip axle both wheels agree and
      # the fastest IS the average, so the honest answer is the same one in both cases.
      # WHICH SENSOR MEASURES THE DRIVEN SIDE. This is NOT the reference question wearing a different
      # hat: the road speed has one answer and it lives in Vehicle Speed's Main Source, while THIS is
      # "what is the engine turning", which only this module asks. The common cheap install is a gearbox
      # pickup and one undriven wheel — a drive train sensor reads the average of the driven wheels
      # through the diff, so it IS the driven speed — and without this that car got no traction control
      # at all, with a code saying its driven wheels were missing.
      - {name: driven_src, type: enum, label: Driven Speed From, default: 0, options: ["Driven Wheels", "Drive Train"], help: 'Which sensor says how fast the engine is turning the wheels. Driven Wheels takes the FASTER of the driven pair, because an open diff lets one spin while the other grips and an average would report half the slip. Drive Train uses the gearbox or driveshaft pickup, which reads the driven wheels averaged through the diff — the setup to pick when the driven axle has no wheel pickups of its own.'}
      - {name: driven_axle, type: enum, label: Driven Axle, default: 1, options: ["Front", "Rear"], help: 'Which axle the engine drives. Only read when Driven Speed From is Driven Wheels. Its faster wheel is the one that spins, and slip is measured against the reference below. Get this backwards and the measurement inverts: the module reads wheelspin as the driven axle running slow, and does nothing at all.'}
      # THE REFERENCE IS THE ROAD SPEED, full stop. This used to be its own setting — Undriven Axle /
      # Vehicle Speed / Slowest Wheel — which was a SECOND ANSWER to a question the ECU already answers
      # once: Vehicle Speed's Main Source names the sensors the road speed comes from, and "the undriven
      # axle" is just Front Axle or Rear Axle in that list. Two settings for one fact means they can
      # disagree, and nothing would have said which was right.
      #
      # It costs nothing to remove, because the right Main Source is the same one for BOTH jobs: on a
      # two-wheel-drive car the undriven axle is the honest road speed AND the honest slip reference, and
      # on four-wheel drive the only engine-independent speed is GPS, which is a pickup like any other.
      # Where the two DO differ — a gearbox pickup, which inherits the driven wheels' spin — there are no
      # wheel speeds to compare it against anyway, so traction control has nothing to do.
      - {name: min_speed_kph, type: uint8, label: Active Above Speed, units: 'km/h', scale: 1.0, min: 0, max: 255, default: 5, help: 'Below this road speed traction control does nothing. A slip percentage is a division by the road speed, so near zero it is noise divided by noise.'}
      # HOW HARD IT HOLDS. The throttle path is a PI loop because a proportional-only cap cannot HOLD a
      # slip target — it settles at whatever offset its gain happens to give and hunts on the way in.
      # The integral is what makes the car sit at the target instead of near it.
      - {name: kp, type: uint16, label: Proportional Gain, units: '%/%', scale: 0.01, min: 0, max: 2000, default: 300, help: 'Throttle percent pulled per percent of slip over target, the moment it appears. This is the reflex: too little and the wheels are already spinning before anything happens, too much and the car bogs then surges.'}
      - {name: ki, type: uint16, label: Integral Gain, units: '%/(%-s)', scale: 0.01, min: 0, max: 2000, default: 100, help: 'Throttle percent per percent of slip per second, accumulating while the slip refuses to come back. This is what removes a steady overslip that the proportional term alone would live with.'}
      - {name: cap_min_pct, type: uint16, label: Min Throttle Cap, units: '%', scale: 0.1, min: 0, max: 1000, default: 300, help: 'The throttle ceiling never goes below this. A floor exists so a bad reading cannot shut the engine down: at zero, one implausible wheel speed closes the throttle completely.'}
      # AND HOW IT LETS GO. Snapping the ceiling back to 100% the instant slip drops under target hands
      # the engine full throttle into wheels that have only just stopped spinning, which starts the next
      # slip — the cycling that makes bad traction control worse than none. It is a RATE in %/s, not a
      # choice of Soft/Moderate/Aggressive: a named preset hides the number that actually decides this.
      - {name: release_pct_s, type: uint16, label: Release Rate, units: '%/s', scale: 1.0, min: 1, max: 2000, default: 150, help: 'How fast the throttle ceiling is given back once slip is under target. Pulling throttle is immediate; giving it back is not, because full throttle into wheels that have just stopped spinning is how the next slip starts. Higher is more responsive and more likely to cycle.'}
      # THE FAST PATHS. Tables, not gains, because the response is not linear in slip: 1% of slip and 50%
      # of slip do not want proportional answers, and a table says exactly what each is worth. Both sit on
      # the same slip-error axis, which is what a tuner is actually looking at.
      - {name: cut_method, type: enum, label: Cut Method, default: 1, options: ["Fuel", "Ignition", "Both"], help: 'Which cut the Cut Percentage table uses. Ignition is instant and puts unburnt fuel into the exhaust; fuel is gentler on the engine and slower to come back because the cylinder has to fill again. Both is the hardest available.'}
      tables:
      - {name: slip_tgt_axis, type: float, size: 8, label: Target Slip Axis (Speed), units: 'km/h', min: 0.0, max: 400.0, default_values: [0, 20, 40, 60, 80, 120, 160, 200], help: 'The speed breakpoints the target slip is scheduled against.'}
      # HOW MUCH SLIP IS WANTED, which is not one number. A standing start wants far more slip than a
      # corner exit at 100 km/h — the tyre makes its best longitudinal grip a few percent into slip, and
      # the margin for getting it wrong shrinks with speed. The axis channel is selectable, so a car that
      # would rather schedule this on gear, or on a dash trim knob (rotary_trim_1..6 are catalogued
      # sensors), points it at that instead.
      - {name: slip_target, min: 0, max: 1000, label: Target Slip, units: '%', type: uint16, scale: 0.1, size: 8, x_axis: slip_tgt_axis, x_channel: vehicle_spd, default_values: [150, 120, 100, 80, 60, 50, 40, 40], help: 'The slip the system tries to hold, per road speed. More at low speed, where slip is how a car accelerates off the line; less at speed, where it is how a car leaves the road.'}
      - {name: slip_err_axis, type: float, size: 8, label: Response Axis (Slip Error), units: '%', min: 0.0, max: 200.0, default_values: [0, 1, 2, 5, 10, 20, 50, 100], help: 'The slip-error breakpoints the retard and cut tables are read against — how far over target the slip is, in percent.'}
      - {name: retard_deg, min: 0, max: 400, label: Timing Retard, units: 'deg', type: uint16, scale: 0.1, size: 8, x_axis: slip_err_axis, x_channel: traction_slip_err, default_values: [0, 0, 20, 50, 100, 150, 200, 200], help: 'Timing pulled out at each slip error. This is the fast path: retard reaches the crank on the next spark where a throttle plate takes tenths of a second, so it is what catches a wheel that has already let go.'}
      - {name: cut_pct, min: 0, max: 1000, label: Cut Percentage, units: '%', type: uint16, scale: 0.1, size: 8, x_axis: slip_err_axis, x_channel: traction_slip_err, default_values: [0, 0, 0, 0, 0, 100, 400, 700], help: 'How much of the ignition or fuel is cut at each slip error, delivered as a duty. Zero across the low end on purpose: a cut is the bluntest thing here and belongs to slip the throttle and the timing have already failed to hold.'}

  # VvtControl — closed-loop cam phasing (intake cam 1). PID drives the VVT solenoid duty from the
  # error between the target cam advance (a rpm x load table) and the measured cam angle (vvt_angle_1).
  # Publishes vvt_duty_1 for an Outputs PWM pin. jayecu already measured cam angle; this adds the actuation.
  # VvtControl — closed-loop cam phasing for up to 4 cams (Intake/Exhaust × banks 1-2):
  # a mode (Intake / Exhaust / both), a bank count (1-2), a per-type target table + PID gains, a per-bank
  # base (feed-forward) duty, and a target-angle slew limit (deg/s). Each ACTIVE loop drives a solenoid
  # duty (vvt_duty_1..4) = base_duty + PID(slew-limited target − measured cam angle). Signal map by cam
  # role order: Intake B1→(angle_1,duty_1), Exhaust B1→2, Intake B2→3, Exhaust B2→4.
  VvtControl:
    cadence_hz: 200    # control cadence (firmware constant, not a tune field)
    requires: [rpm, map, vvt_angle_1]
    provides:
    - vvt_duty_1
    - vvt_duty_2
    - vvt_duty_3
    - vvt_duty_4
    config:
      scalars:
      - {name: enabled, type: uint8, label: VVT Control Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Close a position loop on each camshaft and drive its phaser solenoid. Off, nothing is published for the VVT duties and the cams sit wherever their springs park them, which is the safe mechanical default.'}
      - {name: num_banks, type: uint8, label: Number of Banks, units: '', scale: 1.0, min: 1, max: 2, default: 1, help: 'How many cylinder banks have phasers. One per bank means a V engine runs two independent loops per cam type — they share the tables and gains but not their integrators, because the two banks genuinely do not track each other.'}
      - {name: mode, type: enum, label: Mode, default: 2, options: ["Intake", "Exhaust", "Intake and Exhaust"], help: 'Which camshafts are controlled: intake only, exhaust only, or both. It decides which loops run at all, so setting it wider than the hardware means driving solenoids that are not there; setting it narrower leaves a fitted phaser uncontrolled.'}
      - {name: max_delta_rate, type: uint16, label: Target Angle Max Delta Rate, units: deg/s, scale: 0.1, min: 0, max: 20000, default: 500, help: 'Slew limit on the commanded cam target (0 = no limit).'}
      # --- Intake scalars (gains + base duty are now Coolant-temp tables, below) ---
      - {name: intake_duty_min, type: uint16, label: Intake Duty Cycle Min, units: '%', scale: 0.1, min: 0, max: 1000, default: 0, help: 'Lowest duty the intake solenoid may be commanded. It is also the bottom of the final clamp, so the whole loop — base duty, learned trim and PID together — cannot go below it. A phaser that must never be fully unpowered is held above its floor here.'}
      - {name: intake_duty_max, type: uint16, label: Intake Duty Cycle Max, units: '%', scale: 0.1, min: 0, max: 1000, default: 1000, help: 'Highest duty for the intake solenoid, and also the bound on the PID''s authority either way. It is the mechanical ceiling: no combination of base duty, trim and integral can exceed it, so a wound-up loop cannot hold the solenoid at full power.'}
      - {name: intake_direction, type: enum, label: Intake Cam Direction, default: 0, options: ["Advance", "Retard"], help: 'Which way more duty moves the cam — flips the control-loop sign.'}
      - {name: intake_dead_band, type: uint16, label: Intake Controller Dead Band, units: deg, scale: 0.1, min: 0, max: 100, default: 0, help: 'No correction while |target − measured| is within this band (anti-hunt).'}
      - {name: intake_overall_corr, type: int16, label: Intake Overall Correction, units: deg, scale: 0.1, min: -600, max: 600, default: 0, help: 'Fixed degrees added to the intake target.'}
      # --- Exhaust scalars ---
      - {name: exhaust_duty_min, type: uint16, label: Exhaust Duty Cycle Min, units: '%', scale: 0.1, min: 0, max: 1000, default: 0, help: 'Lowest duty for the exhaust solenoid — see the intake equivalent. Exhaust phasers frequently need a different floor from intake ones because they work against different oil pressure and spring loads.'}
      - {name: exhaust_duty_max, type: uint16, label: Exhaust Duty Cycle Max, units: '%', scale: 0.1, min: 0, max: 1000, default: 1000, help: 'Highest duty for the exhaust solenoid, and the bound on its PID authority.'}
      - {name: exhaust_direction, type: enum, label: Exhaust Cam Direction, default: 1, options: ["Advance", "Retard"], help: 'Which way more duty moves the cam — flips the control-loop sign. Retard by default: a typical exhaust phaser parks fully advanced and duty moves it later.'}
      - {name: exhaust_dead_band, type: uint16, label: Exhaust Controller Dead Band, units: deg, scale: 0.1, min: 0, max: 100, default: 0, help: 'No correction while |target − measured| is within this band (anti-hunt).'}
      - {name: exhaust_overall_corr, type: int16, label: Exhaust Overall Correction, units: deg, scale: 0.1, min: -600, max: 600, default: 0, help: 'Fixed degrees added to the exhaust target.'}
      # --- Long Term Trim (learned per-cam in battery-backed RAM; applied on top of the base duty) ---
      - {name: enable_ltt, type: uint8, label: Enable Long Term Trim, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Learn the duty each cam needs to HOLD its target, so the feed-forward improves over time and the PID integral can recentre. It only learns while the cam is settled close to target, and what it learns is persisted across power cycles — so a warmed-up engine starts from what it learned last time instead of relearning every trip.'}
      - {name: ltt_authority_pct, type: uint16, label: LTT Authority, units: '%', scale: 0.1, min: 0, max: 1000, default: 200, help: 'Max learned duty correction per cam per cell.'}
      - {name: intake_ltt_gain, type: uint16, label: Intake LTT Gain, units: '', scale: 0.01, min: 0, max: 10000, default: 30, help: 'Learn rate: fraction of the PI hold-trim migrated into the learned table per second.'}
      - {name: exhaust_ltt_gain, type: uint16, label: Exhaust LTT Gain, units: '', scale: 0.01, min: 0, max: 10000, default: 30, help: 'How quickly the exhaust long-term trim absorbs the PID''s holding integral. Low means it converges slowly and is barely moved by a bad moment; high follows quickly and follows mistakes just as quickly. Only what the authority clamp accepts is taken out of the integral, so the total correction is preserved either way.'}
      tables:
      # --- Target tables (rpm × load → cam advance °) ---
      - {name: intake_target_table,  min: 0, max: 600, label: Intake Target (cam advance),  units: deg, type: uint16, scale: 0.1, rows: 8, cols: 8, depth: 2, x_axis: vvt_rpm_axis, y_axis: vvt_load_axis, z_axis: vvt_ct_axis, y_optional: true, z_optional: true, x_channel: rpm, y_channel: map, z_channel: clt, default_row: [0, 100, 200, 250, 250, 200, 100, 0], help: 'Where the intake cam should be, in degrees of advance from its parked (fully retarded) position, at each operating point. This is the map that actually makes the power — everything else here exists to get the cam to this number and hold it.'}
      - {name: exhaust_target_table, min: -600, max: 600, label: Exhaust Target (cam advance), units: deg, type: int16, scale: 0.1, rows: 8, cols: 8, depth: 2, x_axis: vvt_rpm_axis, y_axis: vvt_load_axis, z_axis: vvt_ct_axis, y_optional: true, z_optional: true, x_channel: rpm, y_channel: map, z_channel: clt, default_row: [0, -80, -150, -200, -200, -150, -80, 0], help: 'Where the exhaust cam should be, in degrees of ADVANCE from its parked position, at each operating point. Signed, because an exhaust phaser usually parks fully advanced and moves the other way: -20 is 20 degrees of retard from home. Exhaust phasing is mostly about internal EGR and scavenging rather than peak torque, so its map usually has a very different shape from the intake''s.'}
      # --- Intake gains + base duty (Coolant-temp × optional RPM). Gains scale 0.001, duty scale 0.1. ---
      - {name: intake_p_gain,      min: 0, max: 30000, label: Intake P Gain, units: '%/deg',   type: uint16, scale: 0.001, rows: 8, cols: 8, x_axis: vvt_clt_axis, y_axis: vvt_aux_rpm_axis, y_optional: true, x_channel: clt, y_channel: rpm, default_row: [80, 100, 140, 150, 150, 150, 150, 150], help: 'Intake proportional gain against coolant temperature: duty per degree of cam error. Scheduled on temperature because a phaser is driven by engine oil, and cold oil is a completely different actuator from hot oil — one set of gains cannot serve both.'}
      - {name: intake_i_gain,      min: 0, max: 30000, label: Intake I Gain, units: '%/deg/s', type: uint16, scale: 0.001, rows: 8, cols: 8, x_axis: vvt_clt_axis, y_axis: vvt_aux_rpm_axis, y_optional: true, x_channel: clt, y_channel: rpm, default_row: [40, 50, 60, 70, 70, 70, 70, 70], help: 'Intake integral gain versus coolant temperature: duty per degree of error per second. It supplies the holding duty the base table does not, and when long-term trim is on it is this integral that gets migrated into the learned table.'}
      - {name: intake_d_gain,      min: 0, max: 30000, label: Intake D Gain, units: '%*s/deg', type: uint16, scale: 0.001, rows: 8, cols: 8, x_axis: vvt_clt_axis, y_axis: vvt_aux_rpm_axis, y_optional: true, x_channel: clt, y_channel: rpm, default_row: [5, 6, 8, 10, 10, 10, 10, 10], help: 'Intake derivative gain versus coolant temperature: duty per degree-per-second. It damps the approach so the cam settles rather than overshooting past target and coming back.'}
      - {name: intake_base_duty_1, min: 0, max: 1000,  label: Intake 1 Base Duty, units: '%',  type: uint16, scale: 0.1,   rows: 8, cols: 8, x_axis: vvt_clt_axis, y_axis: vvt_aux_rpm_axis, y_optional: true, x_channel: clt, y_channel: rpm, default_row: [300, 300, 300, 300, 300, 300, 300, 300], help: 'Bank 1 intake feed-forward: roughly the duty needed to hold the cam, before the loop corrects anything. A good base table means the PID only ever handles the difference, which is what keeps the cam steady instead of hunting.'}
      - {name: intake_base_duty_2, min: 0, max: 1000,  label: Intake 2 Base Duty, units: '%',  type: uint16, scale: 0.1,   rows: 8, cols: 8, x_axis: vvt_clt_axis, y_axis: vvt_aux_rpm_axis, y_optional: true, x_channel: clt, y_channel: rpm, default_row: [300, 300, 300, 300, 300, 300, 300, 300], help: 'Bank 2 intake feed-forward. Separate from bank 1 because the two phasers see different oil galleries and wear differently — forcing them to share one number makes at least one of them work harder than it should.'}
      # --- Exhaust gains + base duty ---
      - {name: exhaust_p_gain,      min: 0, max: 30000, label: Exhaust P Gain, units: '%/deg',   type: uint16, scale: 0.001, rows: 8, cols: 8, x_axis: vvt_clt_axis, y_axis: vvt_aux_rpm_axis, y_optional: true, x_channel: clt, y_channel: rpm, default_row: [80, 100, 140, 150, 150, 150, 150, 150], help: 'Exhaust proportional gain versus coolant temperature — see the intake equivalent.'}
      - {name: exhaust_i_gain,      min: 0, max: 30000, label: Exhaust I Gain, units: '%/deg/s', type: uint16, scale: 0.001, rows: 8, cols: 8, x_axis: vvt_clt_axis, y_axis: vvt_aux_rpm_axis, y_optional: true, x_channel: clt, y_channel: rpm, default_row: [40, 50, 60, 70, 70, 70, 70, 70], help: 'Exhaust integral gain versus coolant temperature.'}
      - {name: exhaust_d_gain,      min: 0, max: 30000, label: Exhaust D Gain, units: '%*s/deg', type: uint16, scale: 0.001, rows: 8, cols: 8, x_axis: vvt_clt_axis, y_axis: vvt_aux_rpm_axis, y_optional: true, x_channel: clt, y_channel: rpm, default_row: [5, 6, 8, 10, 10, 10, 10, 10], help: 'Exhaust derivative gain versus coolant temperature.'}
      - {name: exhaust_base_duty_1, min: 0, max: 1000,  label: Exhaust 1 Base Duty, units: '%',  type: uint16, scale: 0.1,   rows: 8, cols: 8, x_axis: vvt_clt_axis, y_axis: vvt_aux_rpm_axis, y_optional: true, x_channel: clt, y_channel: rpm, default_row: [300, 300, 300, 300, 300, 300, 300, 300], help: 'Bank 1 exhaust feed-forward duty.'}
      - {name: exhaust_base_duty_2, min: 0, max: 1000,  label: Exhaust 2 Base Duty, units: '%',  type: uint16, scale: 0.1,   rows: 8, cols: 8, x_axis: vvt_clt_axis, y_axis: vvt_aux_rpm_axis, y_optional: true, x_channel: clt, y_channel: rpm, default_row: [300, 300, 300, 300, 300, 300, 300, 300], help: 'Bank 2 exhaust feed-forward duty.'}
      # --- Shared target scalar: a warm-up ramp (Coolant-temp → % of cam-control output) ---
      - {name: target_scalar, min: 0, max: 1000, label: Cam Target Scalar, units: '%', type: uint16, scale: 0.1, rows: 1, cols: 8, x_axis: vvt_scalar_clt_axis, y_axis: vvt_scalar_yaxis, y_optional: true, x_channel: clt, y_channel: clt, default_row: [0, 100, 500, 1000, 1000, 1000, 1000, 1000], help: 'A final multiplier on the commanded duty, scheduled on coolant temperature — the warm-up ramp. Cold oil will not move a phaser cleanly however hard the solenoid is driven, so this scales the whole authority back until the engine is warm rather than letting the loop fight the oil and wind up.'}
      # --- Axes ---
      - {name: vvt_rpm_axis,  label: VVT RPM Axis,  units: RPM, type: float, size: 8, max_size: 32, default_values: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000], help: 'RPM breakpoints for the cam target tables. Worth concentrating where the cam timing changes fastest, which is usually the transition out of the low-speed region.'}
      - {name: vvt_load_axis, label: VVT Load Axis (MAP), units: kPa, type: float, size: 8, max_size: 32, default_values: [20, 40, 60, 80, 100, 120, 150, 200], help: 'Load (MAP) breakpoints for the cam target tables. Cam phasing is strongly load-dependent — the overlap that is right at part throttle is wrong at full — so this axis carries most of the map''s shape.'}
      - {name: vvt_clt_axis,  label: VVT Coolant Axis, units: degC, type: float, size: 8, max_size: 8, default_values: [20, 40, 60, 80, 90, 100, 110, 120], help: 'Coolant breakpoints for the gain and base-duty tables. This is the axis that makes cold-oil behaviour tunable independently of hot.'}
      - {name: vvt_aux_rpm_axis, label: VVT Aux RPM Axis, units: RPM, type: float, size: 8, max_size: 8, default_values: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000], help: 'RPM breakpoints for the auxiliary VVT tables, kept separate so the feed-forward and the target maps do not have to share breakpoints.'}
      - {name: vvt_scalar_clt_axis, label: Target Scalar Coolant Axis, units: degC, type: float, size: 8, max_size: 8, default_values: [20, 30, 40, 50, 60, 70, 80, 90], help: 'Coolant breakpoints for the target scalar — the warm-up ramp''s X axis. Where these sit decides how quickly the phasers are given full authority as the engine warms.'}
      - {name: vvt_scalar_yaxis, label: Target Scalar Y (reserved), units: '', type: float, size: 1, max_size: 1, default_values: [0], help: 'Reserved — the target scalar is a one-dimensional coolant curve and this second axis is not used.'}
      - {name: vvt_ct_axis, label: VVT Target Coolant Axis, units: degC, type: float, size: 2, max_size: 2, default_values: [40, 90], help: 'Coolant breakpoints for the cam target tables, for engines whose target phasing should differ cold from hot.'}
  # PitLimiter — vehicle-speed limiter (pit lane / rolling). While engaged (arm signal, or always when
  # enabled), cut fuel/ignition above the speed limit with a hysteresis band. Distinct from rev/launch.
  PitLimiter:
    cadence_hz: 100    # bus+ttl cut chain decouples it — safe to decimate
    requires: [vehicle_spd]
    provides:
    - pit_limit_active
    config:
      scalars:
      - {name: enabled, type: uint8, label: Pit/Speed Limiter Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Hold the car at a set road speed by cutting — a pit-lane limiter. It acts on VEHICLE SPEED, not RPM, so the limit holds in whatever gear the driver happens to be in.'}
      - {name: arm_sig, type: uint8, label: Engage Signal, units: '', scale: 1.0, min: 0, max: 255, default: 255, help: 'Bus signal (button) that engages the limiter. Not assigned = always engaged when enabled.'}
      - {name: speed_kph, type: uint16, label: Speed Limit, units: 'km/h', scale: 1.0, min: 0, max: 400, default: 60, help: 'The speed being held. The cut engages ABOVE this and stays engaged until the speed falls a full Resume Band below it, so the limiter settles into a slow cycle around the limit rather than chattering on and off at it.'}
      - {name: hyst_kph, type: uint8, label: Resume Band, units: 'km/h', scale: 1.0, min: 0, max: 50, default: 3, help: 'How far below the limit the speed must fall before the cut releases. Too small and the limiter chatters at the threshold, which is unpleasant and hard on the exhaust; too large and the car slows noticeably below the limit before pulling again.'}
      - name: cut_method
        type: enum
        label: Cut Method
        options:
        - Fuel
        - Ignition
        - Both
        units: ''
        scale: 1.0
        min: 0
        max: 2
        default: 2
        help: 'What gets cut. FUEL is the gentler choice for a limiter that may be held for a long time — an ignition cut pumps unburnt fuel into a hot exhaust for the whole pit lane. IGNITION recovers faster. BOTH is the most positive and the harshest.'
  # Nitrous — single-stage dry nitrous control. When armed at wide-open throttle in the RPM window with
  # adequate bottle pressure, energise the nitrous solenoid (nitrous_active -> an Outputs pin) and pull
  # ignition timing (nitrous_retard, which Ignition subtracts). Wire fuel enrichment via a table if wet.
  Nitrous:
    cadence_hz: 100    # control cadence (firmware constant, not a tune field)
    requires: [rpm, tps]
    provides:
    - nitrous_active
    - nitrous_retard
    config:
      scalars:
      - {name: enabled, type: uint8, label: Nitrous Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Arm the nitrous system: publishes `nitrous_active` for the solenoid and `nitrous_retard` for the timing pull. Every gate below is ANDed, so the system only opens inside the whole window at once — and the timing retard is published from the same condition, so the solenoid can never open without the retard following it.'}
      - {name: arm_sig, type: uint8, label: Arm Signal, units: '', scale: 1.0, min: 0, max: 255, default: 255, help: 'Arming switch. Not assigned = always armed when enabled.'}
      - {name: min_rpm, type: uint16, label: Activate Above RPM, units: RPM, scale: 1.0, min: 0, max: 12000, default: 3000, help: 'Do not spray below this RPM. Nitrous adds cylinder pressure faster than anything else available, and at low RPM the engine has neither the airflow nor the rod speed to survive it — this is a mechanical limit, not a driveability preference.'}
      - {name: max_rpm, type: uint16, label: Cut Off Above RPM, units: RPM, scale: 1.0, min: 0, max: 12000, default: 7000, help: 'Stop spraying above this RPM. Beyond it the bottle cannot keep up with the engine''s demand and the mixture leans out under the extra oxygen, which is the classic way a nitrous engine is destroyed at the top of a run.'}
      - {name: min_tps, type: uint16, label: Activate Above TPS, units: '%', scale: 0.1, min: 0, max: 1000, default: 800, help: 'Nitrous only at (near) wide-open throttle.'}
      - {name: pressure_src, type: uint8, label: Bottle Pressure Signal, units: '', scale: 1.0, min: 0, max: 255, default: 255, help: 'Bottle pressure sensor. Not assigned = no pressure check.'}
      - {name: min_pressure_kpa, type: uint16, label: Min Bottle Pressure, units: kPa, scale: 1.0, min: 0, max: 30000, default: 5500, help: 'Refuse to spray below this bottle pressure. A nitrous bottle is normally run at about 900-1000 psi (6200-6900 kPa); below roughly 800 psi (5500 kPa) the flow falls away and the mixture goes lean, which is the dangerous direction. Only checked when a Bottle Pressure Signal is assigned.'}
      - {name: retard_deg, type: uint16, label: Nitrous Timing Retard, units: deg, scale: 0.1, min: 0, max: 300, default: 30, help: 'Timing pulled the whole time nitrous is active. The extra oxygen makes the charge burn far faster, so the timing that was correct on petrol alone is now far too advanced — this retard is what keeps peak pressure after TDC. It is published from the same condition as the solenoid, so it can never be forgotten.'}
  # Wmi - water/methanol injection. Above a boost (MAP) threshold at load, run the WMI pump with a duty
  # that ramps from min_duty at min_map_kpa to 100% at full_map_kpa. Publishes wmi_active (pump enable ->
  # an Outputs pin) + wmi_duty (a PWM %). A flow-failsafe (measured flow sensor) is a later refinement.
  Wmi:
    cadence_hz: 50    # control cadence (firmware constant, not a tune field)
    requires: [map, tps]
    provides:
    - wmi_active
    - wmi_duty
    config:
      scalars:
      - {name: enabled, type: uint8, label: WMI Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Water/methanol injection: a duty ramped with manifold pressure, gated on throttle. The module publishes `wmi_active` and `wmi_duty` only — the pump or solenoid is driven by mapping an output to them.'}
      - {name: min_map_kpa, type: uint16, label: Activate Above MAP, units: kPa, scale: 0.1, min: 0, max: 6000, default: 1200, help: 'Boost onset (MAP) where injection starts.'}
      - {name: full_map_kpa, type: uint16, label: Full Flow MAP, units: kPa, scale: 0.1, min: 0, max: 6000, default: 2000, help: 'MAP at which duty reaches 100%.'}
      - {name: min_tps, type: uint16, label: Activate Above TPS, units: '%', scale: 0.1, min: 0, max: 1000, default: 600, help: 'Throttle floor for injecting at all. It is a plain gate ANDed with the MAP threshold, not part of the ramp: below it the duty is zero however high the boost, which keeps the system off during an overrun spike where the pressure is momentarily up but the engine is not being asked for anything.'}
      - {name: min_duty_pct, type: uint16, label: Min Pump Duty, units: '%', scale: 0.1, min: 0, max: 1000, default: 200, help: 'Duty at the boost-onset threshold (ramps to 100% at Full Flow MAP).'}
  # AntiLag - anti-lag (ALS). While armed OFF-throttle (closed) above the RPM floor, hold heavy ignition
  # retard to keep the exhaust hot and the turbo spooled between shifts / on overrun. Time-limited per
  # spool (max_time_ms) so it can't cook the turbo. Publishes antilag_retard (Ignition subtracts) +
  # antilag_active. (Wet fuel-add + throttle-crack are later refinements.)
  AntiLag:
    cadence_hz: 100    # control cadence (firmware constant, not a tune field)
    requires: [rpm, tps]
    provides:
    - antilag_active
    - antilag_retard
    config:
      scalars:
      - {name: enabled, type: uint8, label: Anti-Lag Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Keep the turbo spooled off-throttle by retarding ignition hard, so combustion finishes in the exhaust. Destructive by nature — it dumps heat into the turbine and exhaust valves — hence the arming signal and the hard time limit; treat both as required, not optional.'}
      - {name: arm_sig, type: uint8, label: Arm Signal, units: '', scale: 1.0, min: 0, max: 255, default: 255, help: 'Arming switch. Not assigned = always armed when enabled.'}
      - {name: min_rpm, type: uint16, label: Active Above RPM, units: RPM, scale: 1.0, min: 0, max: 12000, default: 3500, help: 'Only hold anti-lag above this RPM. Below it there is not enough exhaust energy for the trick to work and the retard is simply an engine trying to stall, so the module releases instead.'}
      - {name: max_tps, type: uint16, label: Off-Throttle Below TPS, units: '%', scale: 0.1, min: 0, max: 1000, default: 100, help: 'Only when the throttle is (near) closed.'}
      - {name: retard_deg, type: uint16, label: Anti-Lag Retard, units: deg, scale: 0.1, min: 0, max: 500, default: 250, help: 'How much timing is pulled while anti-lag holds. This is the whole mechanism: retard moves the burn late enough that it is still going when the exhaust valve opens. More retard spools harder and heats the turbine faster — this number and the time limit are the same trade-off seen from two ends.'}
      - {name: max_time_ms, type: uint16, label: Max Anti-Lag Time, units: ms, scale: 1.0, min: 0, max: 20000, default: 5000, help: 'Max continuous anti-lag per activation (turbo protection).'}
  # VVL - variable valve lift / VTEC-style high-lift cam engagement. Discrete solenoid: engage above the
  # on-RPM once past a load floor and warm enough; disengage below off-RPM (RPM hysteresis stops chatter
  # around the crossover). Publishes vvl_active (drive the solenoid via a generic Outputs pin).
  VVL:
    cadence_hz: 50    # control cadence (firmware constant, not a tune field)
    requires: [rpm, map, clt]
    provides:
    - vvl_active
    config:
      scalars:
      - {name: enabled, type: uint8, label: VVL Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Variable valve LIFT: a solenoid-switched high-lift cam profile, engaged by RPM with load and temperature as preconditions. The module only publishes `vvl_active` — the solenoid itself is driven by mapping a generic output to that signal, so the wiring is not fixed here.'}
      - {name: on_rpm, type: uint16, label: Engage Above RPM, units: RPM, scale: 1.0, min: 0, max: 12000, default: 4500, help: 'Engage the high-lift profile at or above this RPM, provided the load and coolant preconditions also hold. Disengagement is a SEPARATE, lower RPM (Disengage Below): the gap between the two is what stops the solenoid chattering as the engine hunts across the crossover.'}
      - {name: off_rpm, type: uint16, label: Disengage Below RPM, units: RPM, scale: 1.0, min: 0, max: 12000, default: 4200, help: 'Below on_rpm for hysteresis around the crossover.'}
      - {name: min_load_kpa, type: uint16, label: Engage Above MAP, units: kPa, scale: 0.1, min: 0, max: 6000, default: 400, help: 'Load floor (MAP) below which the high cam stays disengaged.'}
      - {name: min_clt_c, type: int16, label: Min Coolant Temp, units: degC, scale: 0.1, min: -400, max: 2000, default: 400, help: 'Stay on the low cam until warm.'}
  # EgtProtect - exhaust gas temperature protection. Two-stage: above enrich_c ramp in fuel enrichment
  # (linearly to max_enrich_pct at cut_c) to cool the exhaust; at cut_c apply a hard fuel cut (latched
  # until EGT falls back below enrich_c). Publishes fuel_corr_egt (FuelCalculator multiplies) +
  # egt_protect_active. Guards turbo / exhaust-valve / manifold temps on a single shared EGT probe.
  EgtProtect:
    cadence_hz: 20    # bus+ttl cut chain decouples it — safe to decimate
    requires: [egt_1]
    provides:
    - fuel_corr_egt
    - egt_protect_active
    - fuel_cut
    config:
      scalars:
      - {name: enabled, type: uint8, label: EGT Protect Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Watch exhaust gas temperature and act on it: enrich progressively from Enrich Above, then cut fuel at Cut Above. It protects on the HOTTEST assigned probe, whichever cylinder that is, and names that probe in the DTC it raises — so a stored code points at a cylinder instead of leaving twelve to guess.'}
      - {name: enrich_c, type: int16, label: Enrich Above EGT, units: degC, scale: 1.0, min: 0, max: 1200, default: 850, help: 'EGT where protective enrichment begins.'}
      - {name: cut_c, type: int16, label: Cut Above EGT, units: degC, scale: 1.0, min: 0, max: 1300, default: 950, help: 'EGT where a hard fuel cut engages (also full enrichment).'}
      - {name: max_enrich_pct, type: uint16, label: Max Enrichment, units: '%', scale: 1.0, min: 0, max: 100, default: 20, help: 'Enrichment added at cut_c (ramps linearly from enrich_c).'}
  # CruiseControl - closed-loop road-speed hold, driven by CONDITIONS you write.
  #
  # Each action (Set, Resume, Cancel, Enable, Disable, +, -) is an expression, so one button can carry
  # several meanings by appearing in several of them: `cruise_sw == 2` in BOTH Set When and Speed Down
  # When is a Set/Coast stalk position, exactly. A per-position function list would instead have to
  # pre-enumerate every COMBINATION of meanings a button might have, and would still only describe a
  # ladder — these same fields serve a resistor-ladder stalk, a plain digital button, a CAN flag, or a
  # compound rule, through one path.
  #
  # Brake, clutch and handbrake are deliberately NOT expressions. An expression fails to FALSE when its
  # inputs cannot be trusted, which is right for Set (a dead stalk must not engage cruise) and exactly
  # wrong for a brake switch whose wire has fallen off. They are plain signal selectors, and an INVALID
  # one reads as PRESSED.
  #
  # State: Off -> Disabled <-> Ready <-> Cruising, with Fault blocking engagement. Cancel keeps the set
  # speed for Resume; Disable and Fault throw it away. Publishes cruise_demand (ElectronicThrottle takes
  # it as a floor UNDER the pedal, so the driver always overrides by pressing harder), cruise_active,
  # cruise_target, cruise_state, cruise_error_kph (the gain curves' X axis) and cruise_inhibit - a bit
  # per reason it will not engage, which is the only channel that answers "nothing happened when I
  # pressed Set". This module never touches an output itself.
  CruiseControl:
    cadence_hz: 50    # control cadence (firmware constant, not a tune field)
    requires: [vehicle_spd, cruise_sw]
    provides:
    - cruise_active
    - cruise_demand
    - cruise_target
    - cruise_state
    - cruise_inhibit
    - cruise_error_kph
    config:
      scalars:
      - {name: enabled, type: uint8, label: Cruise Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, subcat: Setup, help: 'Hold a road speed by asking the throttle for it. It needs the drive-by-wire throttle to consume that request — this module never drives an output itself.'}
      - {name: power_on_state, type: enum, label: State At Power-On, options: ["Disabled", "Ready"], units: '', scale: 1.0, min: 0, max: 1, default: 0, subcat: Setup, help: 'Where the system starts after a key cycle. Disabled needs an Enable condition to arm it, which is what a stalk with a main On/Off position gives you. Ready is for a stalk that has no main switch at all — without it, buttons that only Set and Resume could never leave Disabled.'}

      # --- the conditions -------------------------------------------------------------------------
      - {name: enable_expr, type: expression, length: 64, label: Enable When, subcat: Buttons, help: 'Arms the system: Disabled becomes Ready. A stalk main switch is `cruise_sw == 1`. Read on the RELEASE of a press, so holding a button does not re-arm repeatedly.'}
      - {name: disable_expr, type: expression, length: 64, label: Disable When, subcat: Buttons, help: 'Switches the system off from any state and throws away the set speed. A Resume after a Disable has nothing to resume to, deliberately.'}
      - {name: enable_disable_expr, type: expression, length: 64, label: Enable/Disable When, subcat: Buttons, help: 'One momentary button that TOGGLES between Disabled and Ready, which is what most stalk main buttons actually are. Use this or the separate Enable/Disable pair, not both.'}
      - {name: set_expr, type: expression, length: 64, label: Set When, subcat: Buttons, help: 'Engages at the road speed you are doing now, if nothing is inhibiting it. Pressed again while cruising it re-latches the set speed to the current speed.'}
      - {name: resume_expr, type: expression, length: 64, label: Resume When, subcat: Buttons, help: 'Re-engages at the speed kept from the last Cancel. Does nothing when there is no kept speed.'}
      - {name: cancel_expr, type: expression, length: 64, label: Cancel When, subcat: Buttons, help: 'Pauses cruise and KEEPS the set speed. This only ADDS reasons to cancel — the brake, clutch and handbrake inputs cancel on their own and cannot be switched off from here.'}
      - {name: bump_up_expr, type: expression, length: 64, label: Speed Up When, subcat: Buttons, help: 'Tapped, raises the set speed by one increment. Held past the Long Press Time, accelerates continuously at the Accelerate Rate until released.'}
      - {name: bump_down_expr, type: expression, length: 64, label: Speed Down When, subcat: Buttons, help: 'Tapped, lowers the set speed by one increment. Held, coasts down at the Coast Rate.'}
      - {name: long_press_ms, type: uint16, label: Long Press Time, units: ms, scale: 1.0, min: 100, max: 5000, default: 500, subcat: Buttons, help: 'How long a press must be held before it counts as a hold rather than a tap. A tap is acted on when the button is RELEASED, which is what stops one press from being both.'}

      # --- the inputs that cancel. NOT expressions, on purpose - see the block comment above. -------
      - {name: brake_sig, type: uint8, label: Brake Signal, units: '', scale: 1.0, min: 0, max: 255, default: brake_sw, subcat: Interlocks, help: 'Cancels the moment it reads pressed, and cancels if it goes INVALID — a brake switch that has stopped reporting must never be mistaken for a foot off the brake. Cruise will not arm at all with this unassigned: a system whose only way out is a button has no reflex behind it.'}
      # UNASSIGNED BY DEFAULT, unlike the brake. An invalid cancel input reads as PRESSED — that is the
      # whole fail-safe — so defaulting this to the clutch switch left every car WITHOUT one, an
      # automatic among them, permanently inhibited by a pedal it does not have.
      - {name: clutch_sig, type: uint8, label: Clutch Signal, units: '', scale: 1.0, min: 0, max: 255, default: 255, subcat: Interlocks, help: 'Cancels on clutch press, under the same fail-safe rule as the brake. Leave it unassigned on an automatic, or on anything with no clutch switch fitted: assigning an input that never reports reads as a pedal held down for ever, and cruise will not engage at all.'}
      - {name: handbrake_sig, type: uint8, label: Handbrake Signal, units: '', scale: 1.0, min: 0, max: 255, default: 255, subcat: Interlocks, help: 'Optional, and unassigned by default for the same reason as the clutch: assign it only if the switch is actually there and reporting.'}

      # --- the window it may operate in ------------------------------------------------------------
      - {name: min_speed_kph, type: uint16, label: Minimum Speed, units: 'km/h', scale: 0.1, min: 0, max: 4000, default: 300, subcat: Range, help: 'Below this speed cruise cancels and will not engage. It keeps the system out of the range where holding a speed is a low-gear crawl and a small speed error is a large throttle error.'}
      - {name: max_speed_kph, type: uint16, label: Maximum Speed, units: 'km/h', scale: 0.1, min: 0, max: 4000, default: 1400, subcat: Range, help: 'Above this speed cruise cancels and will not engage. With the minimum it defines the only window the system may operate in; leaving that window is treated exactly like a brake press, except that the demand is bled out rather than dropped.'}
      - {name: speed_increment_kph, type: uint16, label: Speed +/- Increment, units: 'km/h', scale: 0.1, min: 1, max: 200, default: 10, subcat: Range, help: 'How far one tap of Speed Up or Speed Down moves the set speed.'}
      - {name: accel_rate_kph_s, type: uint16, label: Accelerate Rate, units: 'km/h/s', scale: 0.1, min: 1, max: 500, default: 20, subcat: Range, help: 'How fast the set speed climbs while Speed Up is HELD. This is the closest thing to an acceleration limit: the throttle chases the set speed, so how briskly that speed moves is how briskly the car does.'}
      - {name: coast_rate_kph_s, type: uint16, label: Coast Rate, units: 'km/h/s', scale: 0.1, min: 1, max: 500, default: 20, subcat: Range, help: 'How fast the set speed falls while Speed Down is HELD. Releasing leaves the set speed where the ramp had reached, rather than snapping it to the current speed.'}
      - {name: min_rpm, type: uint16, label: Minimum RPM, units: RPM, scale: 1.0, min: 0, max: 12000, default: 1000, subcat: Range, help: 'Cruise cancels and will not engage below this engine speed. 0 turns the RPM gate off.'}
      - {name: max_rpm, type: uint16, label: Maximum RPM, units: RPM, scale: 1.0, min: 0, max: 12000, default: 5000, subcat: Range, help: 'Cruise cancels and will not engage above this engine speed. 0 turns the RPM gate off.'}
      - {name: gear_check_enabled, type: uint8, label: Require A Known Gear, units: '', scale: 1.0, min: 0, max: 1, default: 0, subcat: Range, help: 'Refuse to engage, and cancel, unless gear detection reports a real gear at or above the minimum. Neutral and "not known" both read as gear 0 and are treated the same, because holding a road speed with the box out of gear is holding an ENGINE speed, which is not what was asked for.'}
      - {name: min_gear, type: uint8, label: Minimum Gear, units: '', scale: 1.0, min: 1, max: 8, default: 2, subcat: Range, help: 'The lowest gear cruise will hold a speed in, when Require A Known Gear is on.'}

      # --- the controller ---------------------------------------------------------------------------
      - {name: max_demand_pct, type: uint16, label: Maximum Throttle Demand, units: '%', scale: 0.1, min: 0, max: 1000, default: 600, subcat: Tuning, help: 'Ceiling on the cruise throttle floor, and also the limit of the integrator''s authority — the anti-windup is set to exactly this, so the loop cannot quietly accumulate demand it will never be allowed to apply.'}
      - {name: max_ramp_pct_s, type: uint16, label: Max Throttle Ramp Rate, units: '%/s', scale: 0.1, min: 0, max: 10000, default: 200, subcat: Tuning, help: 'How fast the cruise throttle floor may move. It does NOT apply at the instant of engagement — the floor starts exactly where the pedal already was, so the hand-over is seamless; this limits everything after that.'}
      - {name: cancel_decay_s, type: uint16, label: Cancel Decay Time, units: s, scale: 0.001, min: 0, max: 5000, default: 500, subcat: Tuning, help: 'How long the throttle floor takes to bleed away after a button cancel or a speed-window exit. It does NOT apply to a brake, clutch or handbrake cancel, or to a fault: those go to zero on the same frame, because a residual throttle floor is the last thing a driver reaching for the brake wants.'}

      # --- what makes it give up --------------------------------------------------------------------
      - {name: max_error_kph, type: uint16, label: Max Control System Error, units: 'km/h', scale: 0.1, min: 0, max: 500, default: 50, subcat: Safety, help: 'How far the road speed may sit from the set speed before cruise gives up. A loop that cannot reach its target is a loop fighting something it does not know about, and holding the throttle open into that is how a cruise system runs away. 0 disables.'}
      - {name: max_error_ms, type: uint16, label: Max Error Time, units: ms, scale: 1.0, min: 0, max: 20000, default: 3000, subcat: Safety, help: 'The error has to exceed the limit for THIS LONG before cruise gives up. Without a time, every steep hill and every headwind gust trips it — a magnitude on its own is a false-alarm generator, not a safety check.'}
      - {name: max_wheel_diff_kph, type: uint16, label: Max Wheel Speed Difference, units: 'km/h', scale: 0.1, min: 0, max: 500, default: 100, subcat: Safety, help: 'Cancel when the four wheel speeds disagree by more than this — one wheel spinning or locked means the road speed is not what any single sensor says. Checked only when ALL FOUR wheel speeds are reading, so a car with fewer sensors skips the check rather than being permanently held off by it. 0 disables.'}
      - {name: spd_max_age_ms, type: uint16, label: Speed Signal Timeout, units: ms, scale: 1.0, min: 20, max: 5000, default: 250, subcat: Safety, help: 'How stale the road-speed signal may be and still be believed. A speed that has stopped updating is not a speed of zero, and a controller that treats it as one holds the throttle exactly where it was.'}
      - {name: max_accel_kph_s, type: uint16, label: Max Plausible Acceleration, units: 'km/h/s', scale: 0.1, min: 0, max: 2000, default: 300, subcat: Safety, help: 'A road speed that changes faster than this did not come from a car. The reading is not believed and cruise cancels. 0 disables.'}
      - {name: sw_fault_ms, type: uint16, label: Switch Fault Time, units: ms, scale: 1.0, min: 0, max: 5000, default: 300, subcat: Safety, help: 'How long the cruise switch may read in NO calibrated band before it counts as a fault. Checked only when the Cruise Control Switch sensor is enabled; cruise driven from separate buttons or CAN flags has no stalk to fault. The band decoder already allows time for crossing between positions, so this sits above that; it also covers the moment after power-up when nothing has settled yet.'}

      tables:
      # GAIN SCHEDULED ON THE ERROR ITSELF — one curve each for P, I and D against speed error, sharing
      # one axis so all three are always read at the same point. Scheduling on the error is what lets a
      # 1 kph drift be answered gently and a 10 kph hill be met hard, out of one set of curves.
      #
      # Two things about the shipped shape. The curves are ASYMMETRIC about zero because this module may
      # only ever ADD throttle — being slow is something it can fix, being fast is something it can only
      # stop contributing to — so the slow side is answered harder. And P is ZERO at zero error while I
      # is at its MAXIMUM there: on target the loop is purely integral, which is what makes it sit still
      # instead of hunting about the set speed.
      - {name: cruise_p_gain, min: 0, max: 3000, label: Cruise Proportional Gain, units: '', type: uint16, scale: 0.01, size: 8, x_axis: cruise_err_axis, x_channel: cruise_error_kph, default_values: [300, 200, 80, 0, 80, 200, 500, 800], help: 'Throttle percent per kph of speed error, applied the moment the error appears. It sets how hard the system answers a hill arriving. Too much and the car surges: it overshoots, backs off, and does it again.'}
      - {name: cruise_i_gain, min: 0, max: 3000, label: Cruise Integral Gain, units: '', type: uint16, scale: 0.01, size: 8, x_axis: cruise_err_axis, x_channel: cruise_error_kph, default_values: [0, 30, 80, 100, 80, 40, 20, 5], help: 'Throttle percent per kph of error per second, accumulating while the error refuses to go away. This is what removes the last of a steady error so the car settles ON the set speed rather than a little under it up a grade. Highest at zero error and falling away, because out at a large error the proportional term is already doing the work and this would only wind up.'}
      - {name: cruise_d_gain, min: 0, max: 3000, label: Cruise Derivative Gain, units: '', type: uint16, scale: 0.01, size: 8, x_axis: cruise_err_axis, x_channel: cruise_error_kph, default_values: [80, 50, 15, 6, 20, 60, 100, 160], help: 'Throttle percent per kph-per-second of error CHANGE — the brake on an overshoot. It answers how fast the gap is opening or closing rather than how big it is, which is what lets the other two be set hard enough to actually hold a speed.'}
      - {name: cruise_err_axis, label: Gain X Axis (Cruise Speed Error), units: 'km/h', type: float, size: 8, max_size: 16, default_values: [-5, -2, -1, 0, 1, 2, 5, 10], help: 'Speed-error breakpoints for all three gain curves, as set speed MINUS road speed: positive means you are below the set speed and the system should add throttle. Zero must sit ON a breakpoint, or the gains either side of the target are an interpolation of two things nobody asked for.'}
  # TorqueModel - table-based engine brake-torque estimate. A calibratable torque map (rpm x load)
  # gives reference brake torque at each operating point; power
  # follows as T*omega. Publishes engine_torque_nm + engine_power_kw for telemetry/logging and as the
  # building block a future torque-based throttle map would invert. Off (disabled) publishes zeros.
  TorqueModel:
    cadence_hz: 50    # control cadence (firmware constant, not a tune field)
    requires: [rpm, map]
    provides:
    - engine_torque_nm
    - engine_power_kw
    - lambda_torque_ratio
    config:
      scalars:
      - {name: enabled, type: uint8, label: Torque Model Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Estimate engine brake torque from a calibrated map and publish it, with power following as torque times angular velocity. It is an ESTIMATE for logging and for anything downstream that wants to think in torque; nothing is measured. Disabled, it publishes zeros rather than nothing.'}
      # Best-torque (peak-power) lambda for the current fuel — the reference the base torque table is
      # calibrated at. The lambda trim curve is indexed by lambda/best_torque_lambda (peaks at 1.0), so
      # this scalar retargets the peak per fuel (~0.88 gasoline, richer for E85/methanol) without
      # recalibrating the curve.
      - {name: best_torque_lambda, type: uint16, label: Best-Torque Lambda, units: '', scale: 0.001, min: 700, max: 1050, default: 880, help: 'The lambda at which this engine makes its best torque — richer than stoichiometric on a petrol engine, typically around 0.88. It is the reference the lambda-ratio trim is measured against, so the trim''s axis is "how far from best-torque mixture" rather than an absolute lambda, and the map stays valid across fuels.'}
      tables:
      # --- Trim curves (base table collapsed to one row + an axis). torque = base x spark_eff x lambda_eff.
      - name: torque_spark_trim
        min: 0
        max: 100
        label: Torque vs Timing Retard
        units: '%'
        type: uint16
        scale: 1.0
        rows: 1
        cols: 8
        x_axis: torque_spark_axis
        y_axis: torque_spark_yaxis
        y_optional: true
        x_channel: spark_below_map
        y_channel: spark_retard_total
        default_row: [100, 97, 91, 83, 73, 61, 48, 25]
        help: 'How much of the reference torque survives at a given timing retard from optimum. Pulling timing costs torque, steeply at first; this curve is what lets the estimate follow knock retard, protection retard and idle timing rather than assuming the engine is always at its best timing.'
      - name: torque_spark_axis
        label: Timing Retard Axis
        units: deg
        type: float
        size: 8
        max_size: 8
        default_values: [0, 5, 10, 15, 20, 25, 30, 40]
        help: 'Retard-from-optimum breakpoints, in degrees, for the spark trim curve. 0 is best timing; the curve should read 100% there by definition.'
      - name: torque_spark_yaxis
        label: Torque Spark Y (reserved)
        units: ''
        type: float
        size: 1
        max_size: 1
        default_values: [0]
        help: 'Reserved — the spark trim is a one-dimensional curve and this second axis is not used. Left in place so the table can gain a second dimension without moving in the layout.'
      - name: torque_lambda_trim
        min: 0
        max: 100
        label: Torque vs Lambda Ratio
        units: '%'
        type: uint16
        scale: 1.0
        rows: 1
        cols: 8
        x_axis: torque_lambda_axis
        y_axis: torque_lambda_yaxis
        y_optional: true
        x_channel: lambda_torque_ratio
        y_channel: lambda_torque_ratio
        default_row: [85, 95, 99, 100, 96, 85, 65, 45]
        help: 'How much of the reference torque survives at a given distance from best-torque lambda. Both leaner and richer than best-torque cost torque, so this curve normally peaks in the middle at 100%.'
      - name: torque_lambda_axis
        label: Lambda Ratio Axis (lambda/best-torque)
        units: 'x'
        type: float
        size: 8
        max_size: 8
        default_values: [0.70, 0.85, 0.95, 1.00, 1.10, 1.25, 1.50, 1.80]
        help: 'Breakpoints for the lambda trim, expressed as a RATIO of actual lambda to best-torque lambda. A ratio rather than an absolute lambda so the curve does not have to be redrawn when the fuel changes; 1.0 is best-torque and should read 100%.'
      - name: torque_lambda_yaxis
        label: Torque Lambda Y (reserved)
        units: ''
        type: float
        size: 1
        max_size: 1
        default_values: [0]
        help: 'Reserved — the lambda trim is a one-dimensional curve and this second axis is not used.'
      - name: torque_table
        min: 0
        max: 1500
        label: Engine Torque (rpm x load)
        units: Nm
        type: uint16
        scale: 1.0
        rows: 8
        cols: 8
        x_axis: torque_rpm_axis
        y_axis: torque_load_axis
        y_optional: false
        x_channel: rpm
        y_channel: map
        # TORQUE FOLLOWS MANIFOLD PRESSURE. A default flat in load claimed the full-load torque at idle
        # vacuum; this one scales a typical 2-litre curve (at 100 kPa) by MAP/100. A placeholder either
        # way — the real numbers come from a dyno sheet.
        default_values:
          - [4, 12, 22, 32, 38, 40, 38, 30]   # 20 kPa
          - [8, 24, 44, 64, 76, 80, 76, 60]   # 40 kPa
          - [12, 36, 66, 96, 114, 120, 114, 90]   # 60 kPa
          - [16, 48, 88, 128, 152, 160, 152, 120]   # 80 kPa
          - [20, 60, 110, 160, 190, 200, 190, 150]   # 100 kPa
          - [30, 90, 165, 240, 285, 300, 285, 225]   # 150 kPa
          - [40, 120, 220, 320, 380, 400, 380, 300]   # 200 kPa
          - [50, 150, 275, 400, 475, 500, 475, 375]   # 250 kPa
        help: 'Reference brake torque at each RPM and load, with the engine at best timing and best-torque lambda. Everything else in this module trims DOWN from here, so this map defines the engine''s ceiling — it comes from a dyno sheet or a published curve, not from a guess.'
      - name: torque_rpm_axis
        label: Torque RPM Axis
        units: RPM
        type: float
        size: 8
        max_size: 16
        default_values: [800, 1500, 2500, 3500, 4500, 5500, 6500, 7500]
        help: 'RPM breakpoints for the torque map. Worth concentrating around the torque peak, where the curve has the most shape to capture.'
      - name: torque_load_axis
        label: Torque Load Axis (MAP)
        units: kPa
        type: float
        size: 8
        max_size: 8
        default_values: [20, 40, 60, 80, 100, 150, 200, 250]
        help: 'Load (MAP) breakpoints for the torque map. Torque tracks manifold pressure closely, so this is the axis that carries most of the map''s range.'
  RevLimiter:
    cadence_hz: 200    # bus+ttl cut chain decouples it — safe to decimate
    requires: [rpm]
    provides:        # ids -> signals: catalog (the value bus); encoding lives there
    - soft_cut_pct
    - fuel_cut
    - ign_cut
    config:
      scalars:
      - name: enabled
        type: uint8
        label: Rev Limit Enabled
        units: ''
        scale: 1.0
        min: 0
        max: 1
        default: 1
        help: 'The engine''s RPM ceiling. Turning it OFF does not remove every limit: the protection rev limit that EngineProtection asks for over the bus is still enforced, because a DTC-driven limp home cannot be defeated by a tuning switch. What this disables is the SOFT and HARD limits configured here.'
      - name: hard_limit_rpm
        type: uint16
        label: Hard RPM Limit
        units: RPM
        scale: 1.0
        min: 0
        max: 12000
        default: 7000
        help: 'The cut. At or above this RPM the configured cut is applied outright and held until the RPM falls into the resume band. This is the number that must be under the engine''s mechanical limit with real margin — it is reached under load, in anger, with a heavy foot.'
      - name: soft_limit_rpm
        type: uint16
        label: Soft RPM Limit
        units: RPM
        scale: 1.0
        min: 0
        max: 12000
        default: 6500
        help: 'Where the progressive cut begins, below the hard limit. Between soft and hard the cut duty ramps from nothing to everything, so the engine meets a wall that grows rather than a wall that appears — better for the drivetrain and far more controllable at the top of a gear. Set it equal to or above the hard limit and there is no soft stage at all.'
      - name: cut_method
        type: enum
        label: Cut Method
        options:
        - Fuel
        - Ignition
        - Both
        units: ''
        scale: 1.0
        min: 0
        max: 2
        default: 0
        help: 'What gets cut at the hard limit. FUEL is the kindest to the exhaust — no unburnt charge reaches it — but recovers slightly more slowly. IGNITION recovers instantly and is what makes the bang; sustained, it can melt a turbine or a catalyst. BOTH is the most positive.'
      - name: resume_band_rpm
        type: uint16
        label: Resume Band
        units: RPM
        scale: 1.0
        min: 0
        max: 500
        default: 150
        help: 'How far below the hard limit the RPM must fall before the cut releases. Without it the engine would sit exactly on the limit switching the cut on and off every cycle; this band converts that into a slower, survivable bounce.'
  # Knock control — adaptive knock retard. A per-cylinder knock LEVEL (dB) arrives via on_knock_sense:
  # source=onboard drives it per crank-angle window from the ADC3 burst-DSP (windowing = Stage C);
  # source=external reads external_intensity_sig off the bus (no ADC3 use at all). Per-cylinder
  # sensor bank + gain trim live in cyl_bank[]. On threshold exceedance it accumulates an ignition
  # retard (fixed step/event, clamped to max), decaying back at the recovery rate; suppressed below a
  # min TPS; handed to Ignition::apply_knock_retard(). See docs/knock-control-design.md.
  Knock:
    cadence_hz: 100    # control cadence (firmware constant, not a tune field)
    requires: [rpm, tps]
    provides:
    - knock_level
    - knock_count
    config:
      scalars:
      - {name: enabled, type: uint8, label: Knock Control Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Listen for knock on the knock sensor input, judge each combustion event against a learned per-cylinder noise floor, and act on it. Off, no sampling is done at all — the ADC is not even re-tasked for it.'}
      - {name: source, type: enum, label: Detection Source, default: 0, options: ["Onboard (ADC3 burst)", "External (bus signal)"], help: 'Onboard: per-cylinder crank-angle-windowed ADC3 burst + DSP. The burst borrows ADC3 from the AV13-16 scan and hands it straight back, so those four inputs keep reading — but they update only between bursts, and on a many-cylinder engine at high rpm those gaps get short. External: a normalized intensity (dB) signal off the bus, which touches ADC3 not at all.'}
      - {name: knock_frequency, type: uint16, label: Knock Frequency, units: Hz, scale: 1.0, min: 0, max: 25000, default: 0, help: 'Centre of the knock bandpass. 0 = derive it from the engine''s Bore (900 / (pi x bore/2) kHz), or a generic 7 kHz if no bore is entered. A knocking cylinder rings at a frequency set by its bore, so a band in the wrong place is partly deaf to knock while looking configured.'}
      - {name: window_before_spark_deg, type: uint16, label: Window Start (before spark), units: deg, scale: 1.0, min: 0, max: 60, default: 10, help: 'How far BEFORE each cylinder''s own spark its knock window opens, so the window follows the timing wherever it is: a 20 deg spark and 10 here opens it at 30 deg BTDC. It opens before the spark because pre-ignition lights the charge at or before it, and a window that opened after the spark could only hear knock. Never earlier than 85 deg BTDC (the point the window is armed from).'}
      - {name: window_length_deg, type: uint16, label: Window Duration, units: deg, scale: 1.0, min: 1, max: 180, default: 80, help: 'How long the window listens, in crank degrees from where it opens. It opens before the spark, so it must run well past TDC to hear knock, which rings through the expansion stroke: the default 80 reaches 30-60 deg ATDC across 10-40 deg of advance. Longer lets in valve noise. At low RPM a long window can outlast the sample buffer; the rest is dropped and counted (knk).'}
      - {name: external_intensity_sig, type: uint8, label: External Intensity Signal, units: '', scale: 1.0, min: 0, max: 255, default: 255, help: 'source=External: the bus signal (dB) to threshold as the global knock level. Unassigned = none.'}
      - {name: retard_step_deg, type: uint16, label: Retard Step per Event, units: deg, scale: 0.01, min: 0, max: 1000, default: 50, help: 'How much timing is pulled per knocking event. It is a STEP, applied each time an event is judged as knock, so a persistently knocking cylinder walks back quickly while a single event costs one step. Too small and the retard cannot outrun the knock; too large and one false detection dumps a large chunk of timing.'}
      - {name: retard_reapply_rate, type: uint16, label: Retard Recovery Rate, units: deg/s, scale: 0.01, min: 0, max: 2000, default: 100, help: 'How fast the accumulated retard is given back once the knocking stops, in degrees per second. Slow is safe: it keeps a margin after the event rather than walking straight back into the condition that caused it. Fast recovers power sooner and risks a knock-retard-knock cycle.'}
      - {name: suppress_min_tps, type: uint16, label: Knock Suppress Below TPS, units: '%', scale: 0.1, min: 0, max: 1000, default: 0, help: 'OPT-IN throttle gate; 0 = off, which is the default. Detection is already suppressed during overrun by wk::fuel_cut (DFCO), which is the precise "no combustion" condition, and the per-cylinder learned noise floor handles light-load mechanical noise by construction. Set this only if you want an additional throttle threshold — and note that on a drive-by-wire engine the ETB does idle control, so the plate sits at a few percent AT IDLE and a small value here will straddle the idle point.'}
      # --- Noise-floor learning. The threshold is a RATIO over each cylinder's own learned background,
      #     not an absolute level, so these govern how that background is acquired. See
      #     docs/combustion-monitoring-design.md for why an absolute threshold cannot work.
      - {name: noise_seed_db, type: int16, label: Noise Floor Seed, units: dB, scale: 0.1, min: -600, max: 200, default: -350, help: 'The level shown for a cell that has never been learned. It does not judge anything: a cell with no learned samples cannot report knock at all, and its first reading taken while learning is allowed becomes its floor. So a fresh engine hears knock in a cell only after it has run there once, gently, with learning on.'}
      - {name: learn_rate, type: uint16, label: Noise Learn Rate, units: '', scale: 0.001, min: 0, max: 1000, default: 50, help: 'EMA weight applied to each clean cycle once a cell is established (0.05 = a cell follows a slow change over ~20 cycles). Higher tracks a changing engine faster and forgets a real noise floor faster.'}
      - {name: learn_fast_n, type: uint8, label: Fast-Learn Cycles, units: '', scale: 1.0, min: 0, max: 200, default: 20, help: 'While a cell has fewer than this many clean samples it averages 1/n instead of the EMA rate, so a fresh cell converges in a few cycles rather than crawling up from the seed.'}
      - {name: learn_dwell_ms, type: uint16, label: Noise Learn Dwell, units: ms, scale: 1.0, min: 0, max: 5000, default: 200, help: 'The operating point must sit in one cell this long before it learns — a transient sweeping across cells would otherwise smear one cell''s noise into its neighbours.'}
      - {name: quiet_check_en, type: uint8, label: Detect a Quiet (Disconnected) Sensor, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Report a knock sensor that reads too QUIET on a running engine. A disconnected sensor still produces a reading — the input samples its own noise — so it looks present and simply never hears knock. Off by default: set Quiet Level first.'}
      - {name: quiet_db, type: int16, label: Quiet Level, units: dB, scale: 0.1, min: -1200, max: 200, default: -600, help: 'Below this level for a second, with the engine running above the learn floor, the sensor is reported as missing. Set it from a log: the knock level at idle with the sensor connected, and again with it unplugged — put this between the two, nearer the unplugged reading.'}
      - {name: learn_min_rpm, type: uint16, label: Noise Learn Min RPM, units: RPM, scale: 1.0, min: 0, max: 10000, default: 500, help: 'Below this the engine is cranking or stalling and the background is not representative.'}
      # --- Pre-ignition. A DIFFERENT FAULT with a different answer: knock is end-gas autoignition
      #     after the spark and responds to retard; pre-ignition is the charge lighting BEFORE the
      #     spark, which retard cannot fix and can worsen. Detection is a conjunction (phase AND
      #     magnitude) because either alone false-positives on a signal this noisy — except at extreme
      #     magnitude, where the safe error is to treat it as pre-ignition whatever the phase.
      - {name: preign_enabled, type: uint8, label: Pre-Ignition Detection, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Needs a window that opens BEFORE the spark (negative Window Start) — with an ATDC-only window there is nothing to see.'}
      - {name: preign_pre_frac, type: uint8, label: Pre-Spark Energy Fraction, units: '%', scale: 1.0, min: 0, max: 100, default: 35, help: 'How much of the window''s energy must sit BEFORE the spark to call it pre-ignition. Normal combustion puts almost none there.'}
      - {name: preign_margin_db, type: uint16, label: Pre-Ignition Margin, units: dB, scale: 0.1, min: 0, max: 600, default: 60, help: 'How far above the KNOCK threshold the event must also be. Pre-ignition is violent; this keeps ordinary knock with a little pre-spark leakage from being reported as one.'}
      - {name: preign_extreme_db, type: uint16, label: Pre-Ignition Extreme Level, units: dB, scale: 0.1, min: 0, max: 900, default: 300, help: 'Intensity over the noise floor above which an event is treated as pre-ignition REGARDLESS of phase. Fail toward the protective response: if we cannot tell, cutting is the safe error.'}
      - {name: preign_events_to_act, type: uint8, label: Events Before Action, units: '', scale: 1.0, min: 1, max: 50, default: 2, help: 'Confirmed events on one cylinder before the DTC is raised and the cut applied. 1 acts on a single event; higher rides out a lone false positive.'}
      - {name: preign_cut_fuel, type: uint8, label: Cut Fuel on Pre-Ignition, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'Cut the offending cylinder''s injector. The correct protective action — and on a wasted-spark engine the only one that isolates a single cylinder, since two share a coil.'}
      - {name: preign_cut_spark, type: uint8, label: Cut Spark on Pre-Ignition, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Also cut the cylinder''s coil. On wasted spark this necessarily kills its companion cylinder''s spark too, so it is off by default.'}
      - {name: preign_clear_s, type: uint16, label: Pre-Ignition Cut Hold, units: s, scale: 1.0, min: 0, max: 3600, default: 0, help: 'Seconds of silence before a cut cylinder is restored. 0 = latch until engine stop, which is the conservative choice for a fault that destroys pistons.'}
      tables:
      # THRESHOLD IS A RATIO — dB ABOVE this cylinder's learned noise floor, not an absolute level.
      # The floor itself rises steeply with rpm and load (valve seating, injector actuation, piston
      # slap), so an absolute surface is really a hand-fitted noise floor that has to be re-fitted per
      # engine, per sensor and per mounting torque. Dividing the floor out first leaves a far flatter
      # surface: this table is "how far above its own normal does this cylinder have to be".
      # Axes deliberately match ign_table (rpm x fuel_load) so a tuner is in the coordinate system they
      # already shaped their spark surface in.
      - name: knock_threshold_table
        label: Knock Threshold (over noise floor)
        units: dB
        type: int16
        scale: 0.1
        min: 0
        max: 600
        rows: 8
        cols: 8
        x_axis: knock_rpm_axis
        y_axis: knock_load_axis
        x_channel: rpm
        y_channel: fuel_load
        default_row: [120, 120, 120, 120, 120, 120, 120, 120]   # 12.0 dB over floor, flat until tuned
        help: 'How far ABOVE the learned noise floor a measurement has to be before it counts as knock, per RPM and load. It is a margin, not an absolute level, which is what makes it portable: the floor already carries the engine''s own mechanical noise at that operating point, so this number is purely how much louder than normal is abnormal. Too low and mechanical noise reads as knock; too high and real knock passes unremarked.'
      - name: knock_max_retard_table
        label: Max Knock Retard
        units: deg
        type: uint16
        scale: 0.1
        min: 0
        max: 300
        rows: 8
        cols: 8
        x_axis: knock_rpm_axis
        y_axis: knock_load_axis
        x_channel: rpm
        y_channel: fuel_load
        default_row: [80, 80, 80, 80, 80, 80, 80, 80]           # 8.0 deg
        help: 'The most timing knock control may pull at each RPM and load, whatever it hears. It is the floor under the authority: it bounds how far a runaway detection — a loose sensor, a noisy accessory — can retard the engine, and it stops the controller from retarding into a condition worse than the knock it was chasing.'
      - name: knock_rpm_axis
        label: Knock RPM Axis
        units: RPM
        type: float
        size: 8
        max_size: 16
        default_values: [800, 1500, 2500, 3500, 4500, 5500, 6500, 7500]
        help: 'The RPM breakpoints the knock threshold and max-retard tables are looked up on. Knock sensitivity is strongly RPM-dependent, because both the engine''s noise and its knock frequency move with speed — concentrate breakpoints where the engine actually spends its time under load.'
      - name: knock_load_axis
        label: Knock Load Axis
        units: kPa
        type: float
        size: 8
        max_size: 16
        default_values: [20, 40, 60, 80, 120, 160, 200, 250]
        help: 'The load breakpoints for the knock tables. Knock is a load phenomenon above all, so this axis is what lets a cruise cell be judged differently from a full-throttle one; it matches the load axis the ignition tables use so the two are read at the same operating point.'
      arrays:
      # WHICH PHYSICAL INPUT hears this cylinder — KNOCK1 or KNOCK2. It was called cyl_bank, which
      # invited reading it as a second declaration of the engine bank a cylinder already declares
      # under Engine. It is not that: SENSOR COUNT AND BANK COUNT ARE INDEPENDENT.
      #
      #   I6 with two sensors   1 bank,  2 sensors  <- bank cannot express it; the second sensor would
      #                                                simply never be read
      #   V6 with one sensor    2 banks, 1 sensor   <- bank would send half the cylinders to a sensor
      #                                                that is not fitted
      #
      # So it stays configurable — but AUTO is the default and derives it from the bank the cylinder
      # already declares, which is right for every engine where the two do coincide. Nobody declares
      # anything twice unless their engine genuinely needs them to differ.
      - name: cyl_sensor
        label: Per-Cylinder Knock Input
        count: 12
        element:
        - {name: input, type: enum, label: Knock Input, options: ["Knock 1", "Knock 2", "Auto (from cylinder bank)"], default: 2, help: 'Which physical knock input hears this cylinder. Auto derives it from the cylinder''s bank under Engine (bank 1 -> Knock 1, bank 2 -> Knock 2), which is correct whenever sensors and banks line up. Set it explicitly for an inline engine with two sensors (one bank, two inputs) or a V with a single sensor.'}
        - {name: gain, type: int16, label: Sensor Gain, units: dB, scale: 0.1, min: -200, max: 200, default: 0, help: 'Per-cylinder dB trim added to the measured level before thresholding (compensate sensor distance / channel response).'}
  # MISFIRE — did the cylinder fire at all? The opposite question to knock, from a different
  # instrument: crank SEGMENT TIMING. A cylinder that fires accelerates the crank through its
  # expansion stroke; one that does not, does not. SegmentTimer (scheduler domain) measures the time
  # to cross each cylinder's segment from the REAL teeth; this module decides what a long one means.
  #
  # Everything here is RELATIVE. A segment's absolute time depends on rpm, so the metric is deviation
  # from the running mean of recent segments — which also makes a whole-engine acceleration cancel,
  # since it lengthens or shortens every segment together. Only a segment that is long RELATIVE TO ITS
  # NEIGHBOURS is a misfire.
  Misfire:
    cadence_hz: 100
    requires: [rpm]
    provides:
    - misfire_rough
    - misfire_count
    config:
      scalars:
      - {name: enabled, type: uint8, label: Misfire Detection, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Needs PHASE sync (a cam) and a wheel with enough teeth per segment — SegmentTimer decides availability and reports nothing at all below the floor.'}
      - {name: threshold_pct, type: uint16, label: Misfire Threshold, units: '%', scale: 0.1, min: 0, max: 1000, default: 80, help: 'How much longer than the running mean a segment must be to count as a misfire. 8% is a starting point, not a measured value — a real engine''s torsional variation sets the real floor.'}
      - {name: min_rpm, type: uint16, label: Misfire Min RPM, units: RPM, scale: 1.0, min: 0, max: 10000, default: 600, help: 'Below this the crank is cranking or stalling and segment-to-segment variation is dominated by the starter.'}
      - {name: max_rpm, type: uint16, label: Misfire Max RPM, units: RPM, scale: 1.0, min: 0, max: 12000, default: 7000, help: 'Above this the segments get short enough that timing resolution and torsional resonance swamp the combustion signal.'}
      - {name: events_to_dtc, type: uint8, label: Events Before DTC, units: '', scale: 1.0, min: 1, max: 200, default: 20, help: 'Misfires on one cylinder within the evaluation window before its P030x is raised. One bad cycle is not a fault.'}
      - {name: window_cycles, type: uint16, label: Evaluation Window, units: cycles, scale: 1.0, min: 1, max: 10000, default: 200, help: 'Engine cycles the event tally is counted over before it decays. The OBD monitors use 200 and 1000 revolution windows for the same job.'}
      - {name: multi_cyl_for_p0300, type: uint8, label: Cylinders for P0300, units: '', scale: 1.0, min: 2, max: 12, default: 2, help: 'How many cylinders must be over threshold at once before the fault is reported as RANDOM/MULTIPLE (P0300) rather than per-cylinder.'}
      - {name: learn_enabled, type: uint8, label: Learn Segment Correction, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'Learn per-cylinder wheel/TDC geometry error during overrun fuel cut, when nothing is firing and every segment SHOULD be identical. Without it a narrow tooth reads as a permanently misfiring cylinder.'}
      - {name: learn_rate, type: uint16, label: Correction Learn Rate, units: '', scale: 0.001, min: 0, max: 1000, default: 100, help: 'EMA weight per overrun segment.'}
      - {name: cut_fuel, type: uint8, label: Cut Fuel to a Dead Cylinder, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Stop injecting into a cylinder whose P030x is raised. Protects the catalyst from raw fuel; off by default because it is a decision about the engine, not a diagnostic.'}

  # Idle control (Stage 1b: hardware-agnostic open-loop base + closed-loop PI). Reads rpm/clt/tps off
  # the bus, detects the idle condition, and PUBLISHES an abstract air demand (idle_duty %) — it never
  # touches a pin. The actuator is the generic `outputs:` / HBridge pipeline (candidate idle_duty).
  #   duty = clamp( base_duty(clt[,vss]) + start_base_offset(run_time) + PI(+D) trim ,
  #                 min_output(rpm) , max_duty )
  # Closed loop: target = target_rpm(clt[,vss]) + start_target_offset(run_time); error = target - rpm
  # (published as idle_rpm_error, the gain-table axis); gain-scheduled PI(+D) gains read off the
  # P/I/D tables vs that error, gated on idle_active + Closed-Loop mode + the activation offset.
  # Cross-domain extras (ign-corr spark trim, throttle-follower dashpot, long-term trim, decel/stall
  # offsets, boost-close, vehicle-speed gating) are deferred to Stage 1c — they touch other consumers.
  Idle:
    cadence_hz: 100    # control cadence (firmware constant, not a tune field)
    requires: [rpm, clt, tps]
    provides:        # ids -> signals: catalog (the value bus)
    - idle_duty
    - idle_active
    - idle_state
    - idle_target_rpm
    - idle_rpm_error
    - idle_ign_corr
    - idle_follower
    - idle_ltt_pct
    config:
      scalars:
      - {name: enabled, type: uint8, label: Idle Control Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Control idle air. Off, nothing is published for the idle valve and the engine idles on whatever the throttle stop or the ETB idle floor gives it.'}
      - name: mode
        type: enum
        label: Mode
        options:
        - Open Loop
        - Closed Loop
        units: ''
        scale: 1.0
        min: 0
        max: 1
        default: 0
        help: Open = base table only. Closed = base + PI(+D) trim driving RPM to the target table.
      - {name: tps_closed_pct, type: uint16, label: Closed-Throttle Threshold, units: '%', scale: 0.1, min: 0, max: 200, default: 20, help: 'Below this the driver counts as OFF THE THROTTLE, which is the condition idle control acts on. It also arms the decel kick on the falling edge. On drive-by-wire it is the PEDAL that is compared (the plate is held open at idle by the idle floor, so it can never read closed); on a cable throttle it is the throttle position. Set it above the closed reading with a little margin.'}
      - {name: idle_lockout_rpm, type: uint16, label: Idle Lockout RPM, units: RPM, scale: 1.0, min: 0, max: 5000, default: 2000, help: Above this RPM the engine is off-idle (closed loop disengages).}
      - {name: cl_activation_offset_rpm, type: uint16, label: Closed Loop Activation Offset, units: RPM, scale: 1.0, min: 0, max: 2000, default: 150, help: Closed loop engages only once RPM falls to within this margin above target (lets a blip free-fall before the loop grabs it).}
      - {name: pid_scaler_pct, type: uint16, label: PID Scaler, units: '%', scale: 0.1, min: 0, max: 2500, default: 1000, help: Overall gain trim applied to P/I/D (100 = table values as-is).}
      - {name: max_duty_pct, type: uint16, label: Max Duty (Output Max), units: '%', scale: 0.1, min: 0, max: 1000, default: 900, help: 'Ceiling on idle valve output, and also the top of the PI''s authority. The integrator''s anti-windup is set to exactly this headroom, so the loop cannot accumulate demand it will never be allowed to apply.'}
      - {name: throttle_follower_enabled, type: uint8, label: Throttle Follower (Dashpot) Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: Feedforward dashpot — follows TPS x RPM, decays back to idle on tip-out so the engine does not stall.: null}
      # Long-term trim: while idling in closed loop, slowly migrate the steady PI trim into a per-CLT
      # learned table (battery-backed BKPSRAM) so base+LTT self-corrects and the PI trim recenters —
      # the idle analogue of LTFT. Learned values live in NV (telemetered as idle_ltt_pct), not config.
      - {name: ltt_enabled, type: uint8, label: Long-Term Trim Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Learn a per-coolant-temperature correction to the base air, so a valve that has drifted or an engine that has aged stops needing the same manual correction every time. It learns only while idling, after a minimum run time and once settled in one temperature cell; the result persists across power cycles.'}
      - {name: ltt_authority_pct, type: uint16, label: LTT Authority, units: '%', scale: 0.1, min: 0, max: 500, default: 150, help: Max magnitude (+/-) of the learned per-CLT base correction.}
      - {name: ltt_learn_pct, type: uint16, label: LTT Learn Rate, units: '%', scale: 0.1, min: 0, max: 1000, default: 200, help: Fraction of the current PI trim migrated into the learned cell each dwell.}
      - {name: ltt_dwell_ms, type: uint16, label: LTT Dwell, units: ms, scale: 1.0, min: 0, max: 60000, default: 2000, help: Time held in a CLT cell (closed-loop, warmed) before a learn step.: null}
      - {name: ltt_min_runtime_s, type: uint16, label: LTT Min Run Time, units: s, scale: 1.0, min: 0, max: 600, default: 20, help: Do not learn until the engine has run this long (avoids learning during warm-up transients).}
      # Controller dynamics (Stage 1c refinements). All default 0 = disabled (backward-compatible).
      - {name: rpm_rate_rising_limit, type: uint16, label: Target Rise Rate Limit, units: RPM/s, scale: 1.0, min: 0, max: 5000, default: 0, help: 'Max rate the idle target may RISE; slews the effective target so the PI does not chase a step. 0 = instant.'}
      - {name: rpm_rate_falling_limit, type: uint16, label: Target Fall Rate Limit, units: RPM/s, scale: 1.0, min: 0, max: 5000, default: 0, help: 'Max rate (magnitude) the idle target may FALL. 0 = instant.'}
      - {name: decel_offset_pct, type: uint16, label: Decel Offset, units: '%', scale: 0.1, min: 0, max: 1000, default: 0, help: 'Extra base duty applied on a throttle tip-out, decaying to 0 over Decel Decay (sums with the throttle follower).'}
      - {name: decel_decay_ms, type: uint16, label: Decel Decay, units: ms, scale: 1.0, min: 0, max: 60000, default: 1500, help: 'Time for the decel offset to bleed to 0 after a tip-out.'}
      - {name: stall_offset_rpm, type: uint16, label: Stall Save RPM, units: RPM, scale: 1.0, min: 0, max: 5000, default: 0, help: 'If running RPM falls below this, drive the idle valve full open to catch the stall. 0 = disabled.'}
      - {name: vss_check_enabled, type: uint8, label: Vehicle Speed Check, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Force idle control off (not idling) when the vehicle-speed signal exceeds Max Vehicle Speed.'}
      - {name: max_vehicle_speed, type: uint16, label: Max Vehicle Speed, units: 'km/h', scale: 1.0, min: 0, max: 1000, default: 10, help: 'Above this vehicle speed, idle_active is forced off (gates closed-loop / learn / ign-corr).'}
      - {name: close_on_boost_enabled, type: uint8, label: Close Idle Valve On Boost, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Drive the idle valve fully closed (duty 0) once MAP exceeds the boost threshold.'}
      - {name: close_on_boost_kpa, type: uint16, label: Boost Close Threshold, units: kPa, scale: 1.0, min: 0, max: 600, default: 105, help: 'MAP above which the idle valve is forced closed.'}
      tables:
      # All idle tables follow a conventional idle-control map layout cell-for-cell, including the TRUE
      # maximum dimensions + depth read off each map's axis setup (so the flash layout never
      # needs re-laying-out as features land). Each is 2D-capable: the X axis is the primary, the optional
      # 2nd axis is reserved at its max and defaults OFF -> out of the box every table is its 1D X
      # curve. Where the 2nd-axis channel doesn't exist in jayecu yet (Air Con State / A/C CompOut —
      # idle-up compensation, lands with the Idle Up stage) it's defaulted to CLT and left off; the depth
      # is what matters and that's reserved.

      # --- Open-loop base position: %duty vs CLT (base output, CLT max 16 x Air Con State max 4)
      - name: base_duty_table
        min: 0
        max: 1000
        label: Base Duty Table
        units: '%'
        type: uint16         # %duty x0.1 (base resolution; finer for ETB idle)
        scale: 0.1
        rows: 4              # Y depth reserved to the max (Air Con State); off by default
        cols: 8             # X = live CLT bins (resizable up to idle_x_axis max 16)
        x_axis: idle_x_axis
        y_axis: idle_y_axis
        y_optional: true     # auto base_duty_table_y_en (default off -> 1D CLT curve)
        x_channel: clt
        y_channel: clt
        default_row:          # base curve over CLT (8 live bins, exact 0.1% cells)
        - 830
        - 720
        - 577
        - 455
        - 351
        - 319
        - 286
        - 301
        help: 'The open-loop air the engine needs to idle at each coolant temperature — the foundation everything else adds to. Get this right and closed loop barely has to act; get it wrong and the loop spends its whole authority covering for it, leaving nothing for real disturbances.'
      - name: idle_x_axis
        label: Idle Base X Axis (CLT °C)
        units: 'C'
        type: float
        size: 8              # live bins (resizable)
        max_size: 16         # reserved storage (max 16)
        default_values: [-30, -10, 10, 30, 50, 70, 85, 100]
        help: 'Coolant breakpoints for the base duty table. Concentrate them through the warm-up range, where the required air changes fastest.'
      - name: idle_y_axis
        label: Idle Base 2nd Axis (Air Con State — idle-up, off)
        units: ''
        type: float
        size: 4
        max_size: 4
        default_values: [0, 1, 2, 3]   # only used when base_duty_table_y_en=1

        help: 'Optional second axis for base duty — air-conditioning state, off by default. Normally left off, since the idle-up slots handle accessory loads more directly.'
      # --- Closed-loop target RPM: RPM vs CLT (max 8) x Vehicle Speed (max 4, 0/25 km/h).
      # Default surface = the stationary (0 km/h) row; VSS axis reserved + OFF (jayecu vehicle_spd is raw
      # Hz, not km/h-scaled, and the bench has no VSS — enable once a km/h speed channel exists).
      - name: target_rpm_table
        min: 0
        max: 10000
        label: Idle Target RPM
        units: RPM
        type: uint16
        scale: 1.0
        rows: 4
        cols: 8
        x_axis: target_clt_axis
        y_axis: target_vss_axis
        y_optional: true
        x_channel: clt
        y_channel: vehicle_spd
        default_row: [1400, 1350, 1200, 950, 950, 950, 950, 950]   # stationary target vs CLT
        help: 'The idle RPM being aimed for at each coolant temperature. Cold engines want a higher idle for stability and catalyst warm-up; this curve is what walks it down as the engine warms.'
      - name: target_clt_axis
        label: Target RPM X Axis (CLT °C)
        units: 'C'
        type: float
        size: 8
        max_size: 8
        default_values: [-10, 0, 20, 40, 60, 70, 80, 100]
        help: 'Coolant breakpoints for the target RPM curve.'
      - name: target_vss_axis
        label: Target RPM 2nd Axis (Vehicle Speed — off)
        units: 'km/h'
        type: float
        size: 4
        max_size: 4
        default_values: [0, 25, 50, 75]

        help: 'Optional second axis for target RPM — vehicle speed, off by default. Enabling it raises idle while rolling, which helps a manual car coast to a stop without dipping.'
      # --- Start offsets (decay over engine run-time). Start target offset (RPM, added to the
      # target) + start base offset (%, added to base duty), both vs Engine Running Time (max 8) x CLT
      # (max 4, off). Both share the run-time X axis + CLT Y axis (one set of breakpoints).
      - name: start_target_offset_table
        min: -5000
        max: 5000
        label: Idle Start Target Offset
        units: RPM
        # SIGNED. It is added to the idle target, and the declared range has always said -5000..5000 —
        # but it was stored unsigned, so the negative half was unreachable and a schema that promised it
        # would have clamped to the promise and wrapped on the way in. Pulling the target DOWN is a real
        # need (a hot restart), not a theoretical one.
        type: int16
        scale: 1.0
        rows: 4
        cols: 6
        x_axis: start_runtime_axis
        y_axis: start_clt_axis
        y_optional: true
        x_channel: run_time
        y_channel: clt
        default_row: [350, 350, 300, 100, 50, 0]
        help: 'Extra idle RPM just after starting, decaying with engine run time. A cold start wants a deliberately high idle for a few seconds; this is what adds it without distorting the steady-state target curve.'
      - name: start_base_offset_table
        min: -100
        max: 100
        label: Idle Start Base Offset
        units: '%'
        type: int16          # %duty x0.1 — SIGNED, for the same reason as the target offset above
        scale: 0.1
        rows: 4
        cols: 6
        x_axis: start_runtime_axis
        y_axis: start_clt_axis
        y_optional: true
        x_channel: run_time
        y_channel: clt
        default_row: [40, 20, 20, 10, 10, 0]
        help: 'Extra idle AIR just after starting, decaying with run time. It works with the target offset: the target says what RPM to aim for, this gives the loop a head start on the air needed to get there instead of making it integrate up from nothing.'
      - name: start_runtime_axis
        label: Start Offset X Axis (Engine Run Time s)
        units: 's'
        type: float
        size: 6
        max_size: 8
        default_values: [0, 2, 4, 6, 8, 10]
        help: 'Engine run time breakpoints, in seconds, for both start offsets. These decide how long the after-start enrichment of air and target lasts.'
      - name: start_clt_axis
        label: Start Offset 2nd Axis (CLT °C — off)
        units: 'C'
        type: float
        size: 4
        max_size: 4
        default_values: [0, 40, 80, 100]

        help: 'Optional second axis for the start offsets — coolant, off by default. Turn it on when a cold start needs a much longer or larger offset than a warm restart.'
      # --- Min output floor: minimum %duty vs RPM (min output, RPM max 16 x A/C CompOut max 4,
      # off). Replaces the old scalar min_duty.
      - name: min_output_table
        min: 0
        max: 1000
        label: Idle Min Output
        units: '%'
        type: uint16         # %duty x0.1
        scale: 0.1
        rows: 4
        cols: 7
        x_axis: min_rpm_axis
        y_axis: min_clt_axis
        y_optional: true
        x_channel: rpm
        y_channel: clt
        default_row: [0, 50, 100, 150, 200, 300, 450]
        help: 'The floor under idle output at each RPM — the minimum air the engine is ever given. It is also the bottom of the PI''s authority, so the loop cannot pull air below it however far RPM overshoots. This is the setting that stops an over-correcting loop from stalling the engine.'
      - name: min_rpm_axis
        label: Min Output X Axis (RPM)
        units: RPM
        type: float
        size: 7
        max_size: 16
        default_values: [1000, 1500, 2000, 3000, 4000, 6000, 8000]
        help: 'RPM breakpoints for the minimum output floor.'
      - name: min_clt_axis
        label: Min Output 2nd Axis (CLT °C — off)
        units: 'C'
        type: float
        size: 4
        max_size: 4
        default_values: [0, 40, 80, 100]

        help: 'Optional second axis for the minimum output — coolant, off by default. Useful when a cold engine needs a higher floor than a hot one to stay running.'
      # --- Gain-scheduled PI(+D): gain vs Idle RPM error (proportional/integral/derivative gain,
      # error max 8 x CLT max 8, off). P = %/100RPM, I = %/(100RPM·s), D = %/(100RPM/s). All three share
      # the error X axis + the CLT Y axis. D ships 0 (off).
      - name: p_gain_table
        label: Idle Proportional Gain
        units: ''            # % per 100 RPM error (×0.01)
        type: uint16
        scale: 0.01
        rows: 8
        cols: 7
        x_axis: gain_err_axis
        y_axis: gain_clt_axis
        y_optional: true
        x_channel: idle_rpm_error
        y_channel: clt
        default_row: [20, 20, 20, 20, 20, 20, 20]
        help: 'Proportional gain scheduled on idle RPM ERROR, in percent per 100 RPM. Scheduling on the error itself is what lets a small deviation be corrected gently and a large one — a stall in progress — be met hard, from one curve. It is also where a DEADBAND is written: zero the cells either side of zero error and the loop holds its trim across that band instead of chasing the RPM wander every engine has.'
      - name: i_gain_table
        label: Idle Integral Gain
        units: ''            # % per (100 RPM·s) (×0.01)
        type: uint16
        scale: 0.01
        rows: 8
        cols: 7
        x_axis: gain_err_axis
        y_axis: gain_clt_axis
        y_optional: true
        x_channel: idle_rpm_error
        y_channel: clt
        default_row: [500, 250, 150, 100, 150, 250, 500]
        help: 'Integral gain versus RPM error, in percent per 100 RPM per second. This is what removes the standing error so the engine actually sits on target, and it is the term that most often causes a slow hunt if it is too high — so it is gentlest at the centre, where the engine already is, and strongest at the edges, where something has gone wrong. Zeroing the centre cells turns that gentleness into an outright deadband.'
      - name: d_gain_table
        label: Idle Derivative Gain
        units: ''            # % per (100 RPM/s) (×0.01); 0 = off (default)
        type: uint16
        scale: 0.01
        rows: 8
        cols: 7
        x_axis: gain_err_axis
        y_axis: gain_clt_axis
        y_optional: true
        x_channel: idle_rpm_error
        y_channel: clt
        default_row: [0, 0, 0, 0, 0, 0, 0]
        help: 'Derivative gain versus RPM error. It damps the approach to target, which is what stops the loop overshooting after a disturbance and setting up an oscillation.'
      - name: gain_err_axis
        label: Gain X Axis (Idle RPM Error)
        units: RPM
        type: float
        size: 7
        max_size: 8
        default_values: [-250, -50, -20, 0, 20, 50, 250]
        help: 'Idle RPM error breakpoints for the gain tables. Zero error sits ON a breakpoint, so the gain the engine actually runs on — the one at target — is the number that was typed rather than whatever the two cells either side average to. It is also what makes a deadband expressible: zero the -20/0/+20 cells and the gain is zero across that whole span and ramps back in by +/-50, with no step at the edge.'
      - name: gain_clt_axis
        label: Gain 2nd Axis (CLT °C — off)
        units: 'C'
        type: float
        size: 8
        max_size: 8
        default_values: [0, 20, 40, 60, 70, 80, 90, 100]
        help: 'Optional second axis for the gain tables — coolant, off by default.'
      # Idle ignition correction (Stage 1c): spark trim vs idle RPM error -> SIG_IDLE_IGN_CORR, added to
      # advance by Ignition while idling. Ignition correction (RPMerror8 x CLT4).
      # NOTE sign: jayecu idle_rpm_error = target - rpm (rpm LOW -> +error), the opposite of a
      # rpm-target axis, so the surface is re-expressed here: rpm low (+error) -> +advance (raises RPM),
      # rpm high (-error) -> retard. Own error axis (ign-corr breakpoints differ from the gains).
      - name: idle_ign_corr_table
        min: -600
        max: 600
        label: Idle Ignition Correction
        units: deg
        type: int16
        scale: 0.1
        rows: 4
        cols: 7
        x_axis: igncorr_err_axis
        y_axis: igncorr_clt_axis
        x_optional: true        # X can be turned off too -> with Y off the table is a 1x1 constant
        x_en_default: 1         # but default ON, so the default tune keeps the 1D rpm-error curve
        y_optional: true
        x_channel: idle_rpm_error
        y_channel: clt
        default_row: [-50, -20, -10, -2, 2, 20, 60]   # deg x0.1; rpm low(+err)->advance, high(-err)->retard
        help: 'Timing correction versus idle RPM error. Spark is a far faster idle actuator than air: advancing timing raises torque within one combustion event, where an air change takes several. This curve is what catches a dip before the valve can respond, and it is the main tool for a rock-steady idle.'
      - name: igncorr_err_axis
        label: Ign Corr X Axis (Idle RPM Error)
        units: RPM
        type: float
        size: 7
        max_size: 8
        default_values: [-300, -200, -100, -20, 20, 100, 200]
        help: 'Idle RPM error breakpoints for the ignition correction curve.'
      - name: igncorr_clt_axis
        label: Ign Corr 2nd Axis (CLT °C — off)
        units: 'C'
        type: float
        size: 4
        max_size: 4
        default_values: [0, 40, 80, 100]
        help: 'Optional second axis for the idle ignition correction — coolant, off by default.'
      # Throttle follower / dashpot (Stage 1c): a feedforward follower air %duty vs RPM x TPS (throttle
      # follower target, both axes max 8). The applied follower rises instantly with the
      # target as the throttle opens, and on tip-out decays back at the rate from throttle_follower_decay
      # (%duty/s vs RPM) — bridging the over-run so the engine does not stall. Added to the idle base.
      # NOTE: a per-CYCLE decay factor (~0.9) is re-expressed here as a time-based %/s rate
      # (this module is 1 kHz time-based, not cycle-driven) — same RPM axis, intuitive units.
      - name: throttle_follower_target_table
        min: 0
        max: 1000
        label: Idle Throttle Follower Target
        units: '%'
        type: uint16         # %duty x0.1
        scale: 0.1
        rows: 5              # Y = TPS bins (resizable to 8)
        cols: 8              # X = RPM bins
        x_axis: tf_rpm_axis
        y_axis: tf_tps_axis
        x_channel: rpm
        y_channel: tps
        default_values:       # row-major, y(TPS) outer / x(RPM) inner — the follower surface (x0.1)
        - 0
        - 0
        - 10
        - 20
        - 31
        - 50
        - 70
        - 90
        - 10
        - 16
        - 37
        - 48
        - 74
        - 112
        - 170
        - 190
        - 24
        - 39
        - 61
        - 80
        - 127
        - 190
        - 230
        - 270
        - 55
        - 69
        - 84
        - 99
        - 155
        - 250
        - 280
        - 350
        - 63
        - 86
        - 102
        - 119
        - 175
        - 270
        - 370
        - 450
        help: 'A dashpot: extra idle air versus RPM and throttle, which follows the throttle UP instantly and is bled back down on tip-out. It bridges the overrun so the engine does not fall into a closing valve and stall. It runs whether or not idle control is otherwise active.'
      - name: tf_rpm_axis
        label: Throttle Follower X Axis (RPM)
        units: RPM
        type: float
        size: 8
        max_size: 8
        default_values: [750, 1000, 1500, 2000, 3000, 4000, 5000, 6000]
        help: 'RPM breakpoints for the throttle follower.'
      - name: tf_tps_axis
        label: Throttle Follower Y Axis (TPS %)
        units: '%'
        type: float
        size: 5
        max_size: 8
        default_values: [0, 5, 10, 25, 50]
        help: 'Throttle breakpoints for the throttle follower — how much air is held for a given throttle opening.'
      - name: throttle_follower_decay_table
        min: 0
        max: 1000
        label: Idle Throttle Follower Decay
        units: '%/s'
        type: uint16         # %duty per second x0.1
        scale: 0.1
        rows: 4
        cols: 6
        x_axis: tfd_rpm_axis
        y_axis: tfd_clt_axis
        y_optional: true
        x_channel: rpm
        y_channel: clt
        default_row: [150, 150, 150, 150, 150, 150]   # 15.0 %/s bleed-off (a 45% follower clears in ~3 s)
        help: 'How fast the follower bleeds away after a tip-out, in percent per second, versus RPM. Slow leaves the engine hanging at high RPM after lifting; fast risks the dip the follower exists to prevent.'
      - name: tfd_rpm_axis
        label: Decay X Axis (RPM)
        units: RPM
        type: float
        size: 6
        max_size: 8
        default_values: [1000, 2000, 3000, 4000, 5000, 6000]
        help: 'RPM breakpoints for the follower decay rate.'
      - name: tfd_clt_axis
        label: Decay 2nd Axis (CLT °C — off)
        units: 'C'
        type: float
        size: 4
        max_size: 4
        default_values: [0, 40, 80, 100]
        help: 'Optional second axis for the decay rate — coolant, off by default. A cold engine usually wants a slower bleed.'
      # Long-term-trim CLT breakpoints (the learned-cell axis). Standalone config axis — the learned
      # %duty values themselves live in battery-backed NV (indexed by nearest cell), not config.
      - name: ltt_clt_axis
        label: Long-Term Trim CLT Axis (°C)
        axis: true        # standalone axis (the learned LTT store's breakpoints) — part of that map, not a nav node
        units: 'C'
        type: float
        size: 8
        max_size: 8
        default_values: [-20, 0, 20, 40, 60, 80, 100, 110]
        help: 'The coolant breakpoints the long-term trim learns against — each is one learned cell. Few, well-spaced cells learn quickly and generalise; many cells are more precise but each is visited rarely, so they take far longer to converge.'
      # Idle Up — accessory-load idle compensation (Stage 1c). CONFIG-AGNOSTIC: a pool of identical
      # generic slots instead of hard-coded A/C / power-steering / fan blocks — each slot binds a
      # configurable bus signal (input_sig: a switch/analog input the user mapped) and, while that
      # signal is above threshold, adds rpm_offset to the idle target + base_offset to the idle base
      # %duty. Bind slot 0 to an A/C-request switch, slot 1 to power steering, etc. — the same
      # capability as conventional named+generic idle-ups without baking in accessory assumptions.
      # Transitions ramp: input must hold active for on_delay_ms before engaging (air-pump
      # delay), and the offset decays to 0 over decay_ms on release (no RPM lurch).
      arrays:
      - name: idle_up
        count: 6
        label: Idle Up
        element:
        - {name: enabled, type: uint8, label: Enabled, default: 0, help: 'Apply this idle-up step. Each slot is a load the engine has to carry — air conditioning, power steering, an electric fan — that adds both an RPM bump and an air bump when its signal asserts, so the engine is given the air BEFORE the load arrives rather than sagging and recovering.'}
        - {name: input_sig, type: uint16, label: Input Signal, default: 255, help: Bus signal id whose 'active' (> threshold) triggers this idle-up. Not assigned = unused.}
        - {name: threshold_x10, type: int16, label: Threshold (x10, signal units): null, default: 5, help: Active when input_sig > this/10. Default 0.5 suits a 0/1 switch.}
        - {name: base_offset_x10, type: uint16, label: Base Offset (x10 %duty), default: 0, help: 'Percent duty added to the idle base while active (x0.1).'}
        - {name: rpm_offset, type: uint16, label: RPM Offset, units: RPM, default: 0, help: RPM added to the idle target while active.}
        - {name: on_delay_ms, type: uint16, label: On Delay, units: ms, default: 0, help: Input must hold active this long before the offset engages.}
        - {name: decay_ms, type: uint16, label: Decay, units: ms, default: 0, help: Offset ramps to 0 over this time after the input releases.}
  # App — accelerator-pedal (APP) input for drive-by-wire. The INPUT-side counterpart to the ETB
  # actuator: two ANALOG pedal signals are A/B cross-checked (calibration-aware, so a pedal calibrate
  # doesn't false-fault), then app_a is mapped through the pedal-to-throttle table to publish
  # pedal_demand — the driver's throttle request the Throttle module arbitrates. app_b is the check
  # only. Pedal calibrate is engine-stopped. Counterpart to EtbActuator; shares the A/B + cal pattern.
  App:
    cadence_hz: 200    # control cadence (firmware constant, not a tune field)
    requires: []
    provides:
    - pedal_demand
    config:
      scalars:
      - {name: enabled, type: uint8, label: APP Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Accelerator-pedal input for drive-by-wire: app_1 is the pedal value, app_2 is a cross-check, and the pair publishes `pedal_demand` through the pedal-to-throttle table. Off, nothing publishes pedal demand and the throttle falls to its idle floor.'}
      # NO app_a_src/app_b_src. The APP sensors ARE this module's inputs — app_1 is the value, app_2 the
      # cross-check — so there is nothing to choose and nothing to get wrong. Where a pedal is WIRED stays
      # configurable on the sensor itself (interfaces: analog_voltage / can_device), which is the right
      # place for it. A selector here could aim a calibrating input at an unrelated channel: `pedalcal`
      # resolves its target by primary_channel, so pointing APP A at, say, clt and running it would have
      # written the coolant sensor's calibration from pedal travel.
      # Which way each pedal track runs. This is a property of the PEDAL YOU WIRED, not of how someone
      # moved their foot during a calibration — and it has to be declared, because it cannot be recovered
      # from the signals. A sweep only ever yields the two raw extremes of each track; released->pressed
      # and pressed->released produce the identical set of values, so no procedure (sweep, two buttons,
      # any of it) can say which extreme was the released one. Declaring it takes the question away from
      # the operator entirely: pedalcal then captures the SPAN, which nobody can get wrong, and takes the
      # direction from here. Verify it by watching the live calibration curve while you press: get it
      # backwards and the curve is visibly upside down before the engine ever runs.
      - {name: app1_sense, type: enum, label: APP A Track Sense, default: 0, options: ["Rising (raw up with travel)", "Falling (raw down with travel)"], help: 'Which way track A''s RAW reading moves as the pedal is pressed. This is DECLARED rather than discovered, and it has to be: a calibration sweep sees the same four raw extremes whether the pedal was pressed then released or released then pressed, so no procedure can tell which extreme was the resting one. Getting it backwards gives a track that reads 100% with your foot off.'}
      - {name: app2_sense, type: enum, label: APP B Track Sense, default: 1, options: ["Rising (raw up with travel)", "Falling (raw down with travel)"], help: 'A redundant pedal usually runs its second track the opposite way, so a short between the tracks is detectable. Default Falling.'}
      - {name: match_err_pct, type: uint16, label: APP Match Error Limit, units: '%', scale: 0.1, min: 0, max: 1000, default: 100, help: 'A/B pedal disagreement (%) beyond which pedal_demand fails safe to 0.'}
      - {name: match_ms, type: uint16, label: APP Match Debounce, units: ms, scale: 1.0, min: 0, max: 5000, default: 200, help: 'Disagreement must hold this long before faulting (rejects blips).'}
      - {name: cal_min_span, type: uint16, label: Pedal Calibrate Min Span, units: mV, raw_adc: true, scale: 1.0, min: 0, max: 5000, default: 500, help: 'Released->pressed pedal voltage must move at least this far during pedal calibrate; less => not moved -> abort.'}
      tables:
      # Pedal-to-Throttle target map (moved here from ThrottleControl): Accelerator Pedal x RPM -> plate
      # demand %. X = app_a, Y = rpm. Z (gear) reserved + optional. All-zero default = SAFE (no demand
      # until configured). App maps app_a through this to publish pedal_demand.
      - name: pedal_to_throttle_table
        min: 0
        max: 1000
        label: Pedal to Throttle
        units: '%'
        type: uint16
        scale: 0.1
        default: 0
        # 1:1 out of the box — cell = its own X breakpoint, so 10 % pedal asks for 10 % throttle. An
        # all-zero default meant a freshly flashed ECU had a pedal that commanded nothing at all, which
        # reads as "drive-by-wire is broken" rather than "the map is empty". Raw units (scale 0.1), and
        # the values ARE the x_axis breakpoints below, so the two stay honest together.
        default_row: [0, 50, 100, 150, 200, 300, 400, 500, 600, 700, 800, 850, 900, 950, 980, 1000]
        x_axis: {signal: app_1, max: 16, units: '%', values: [0, 5, 10, 15, 20, 30, 40, 50, 60, 70, 80, 85, 90, 95, 98, 100]}
        y_axis: {signal: rpm, max: 16, values: [0, 800, 1200, 1600, 2000, 2500, 3000, 3500, 4000, 4500, 5000, 5500, 6000, 6500, 7000, 8000]}
        z_axis: {signal: gear, max: 4, optional: true, values: [1, 2, 3, 4]}

        help: 'Pedal position in, throttle demand out — the pedal MAP, and the main character knob for drive-by-wire. A straight 1:1 line makes the pedal literal; a shallow start with a steeper top gives fine control off idle without losing full travel. It is the demand only: what the plate actually does with it is the throttle controller''s business.'
  ElectronicThrottle:
    # 1 kHz control cadence. findlimits, fillff, the relay autotune and the position loop all step
    # on this, and the feedback rate claim (sigrate::need on both TPS channels) follows it.
    cadence_hz: 1000   # control cadence (firmware constant, not a tune field)
    # The whole drive-by-wire throttle: DEMAND arbitration (pedal + idle floor + traction/torque caps ->
    # throttle_demand) AND ETB ACTUATOR control (close the loop to that demand). throttle_demand stays a
    # published bus signal — the arbitration half publishes it, the actuator half consumes it off the bus
    # — so the Lua plane can still intercept between them. (Formerly the separate Throttle + ThrottleControl.)
    requires:
    - pedal_demand
    - idle_duty
    provides:
    - throttle_demand    # arbitrated plate-% setpoint (bus signal -> Lua-interceptable before the actuator)
    - etb_position_1     # resolved/validated A/B plate-% (the canonical throttle pos consumers bind to)
    - etb_position_2
    - etb_duty_1         # PID duty demand (Lua-touchable); HBridge realises it on the bridge
    - etb_duty_2
    - etb_en_1           # fail-safe enable state (1 = drive, 0 = motor cut/spring-return)
    - etb_en_2
    - app_state          # 0=OK 1=CALIBRATING 2=FAULT_CORRELATION 3=FAULT_NO_SIGNAL
    - etb_state_1        # 0=UNCAL 1=AUTOCAL 2=READY 3=FAULT
    - etb_state_2
    config:
      # No module-level enable: a throttle body is live iff its own etb[i].enabled is set. The module's
      # demand arbitration runs whenever ANY instance is enabled — one switch per body, not two.
      scalars:
      - {name: idle_authority, type: uint16, label: Idle Authority, units: '%', scale: 0.1, min: 0, max: 1000, default: 150, help: 'Max throttle the idle controller may command (idle_duty 100% -> this % plate). The idle floor under a closed pedal.'}
      - {name: traction_cap_src, type: uint8, label: Traction Cap Signal, units: '', scale: 1.0, min: 0, max: 255, default: traction_cap, help: 'Wired to traction control by default — it publishes 100 % (no cap) whenever it is not intervening, so the default costs nothing and traction control can actually pull throttle. Bus signal (%) that caps throttle for traction control. Unassigned = none.'}
      - {name: torque_cap_src, type: uint8, label: Torque Cap Signal, units: '', scale: 1.0, min: 0, max: 255, default: 255, help: 'Bus signal (%) that caps throttle for torque management. Unassigned = none.'}
      arrays:
      - name: etb
        count: 2          # = jaytek_v1 H-bridge channel count (HBRIDGE1/2). Firmware derives its array
                          # sizes from the generated ELECTRONIC_THROTTLE_ETB_COUNT — no firmware hardcode.
        label: ETB
        element:
        - {name: enabled, type: uint8, label: Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Run drive-by-wire on this throttle body. It closes a position loop on the TPS pair and drives the plate through an H-bridge; without it the hardware simply holds the plate at its spring rest.'}
        # Two ANALOG TPS feedback signals, both calibrated to plate-% same sense. Cross-check = |A-B|.
        # control:sensor — the picker offers only channels a SENSOR produces. autocal writes the chosen
        # sensor's calibration (ElectronicThrottle::write_cal resolves by primary_channel), so a free
        # choice of any bus signal meant a mis-pick could rewrite an unrelated sensor's cal, or name a
        # channel nothing acquires and read 0 forever.
        - {name: tps_a_src, type: uint8, label: TPS A Signal, units: '', scale: 1.0, min: 0, max: 254, default: [tps, aux_2], help: 'Which signal is throttle position track A — the one the control loop actually closes on. A DBW throttle has two tracks so a failure can be DETECTED; A is the one that is believed while both agree.'}
        - {name: tps_b_src, type: uint8, label: TPS B Signal, units: '', scale: 1.0, min: 0, max: 254, default: [tps_2, aux_3], help: 'Which signal is throttle position track B, the cross-check. It is not a spare: the whole safety argument for drive-by-wire is that two independent tracks must agree, so a single-track install is not a reduced-function ETB, it is an unsafe one.'}
        - {name: tps_match_err_pct, type: uint16, label: TPS Match Error Limit, units: '%', scale: 0.1, min: 0, max: 1000, default: 100, help: 'A/B disagreement (plate-%) beyond which DIS latches. How far the two matched TPS may drift before fail-safe.'}
        - {name: tps_match_ms, type: uint16, label: TPS Match Debounce, units: ms, scale: 1.0, min: 0, max: 5000, default: 200, help: 'Disagreement must hold this long before latching DIS (rejects momentary blips).'}
        # Filter on the RESOLVED plate position (etb_position_N) that control/transient consume — a
        # control-layer filter, separate from each sensor's raw electrical filter_tau_ms. Level 0-6.
        # Filter on the TPS DERIVATIVE (d(position)/dt) — the rate-of-change channel transient uses. Level 0-6.
        # Position PID (target plate-% -> bridge duty). Gains x1000.
        # Gains TRIM around the breakaway feedforward (below) — so they stay gentle. Hot gains alone
        # limit-cycle on a stiction plate; the feedforward does the heavy lifting, these just trim.
        # NO POSITION FILTER on the feedback, deliberately. tps_filter_scale used to sit here, added
        # when this module was read-only to keep TPS noise out of Transient Throttle. But transient binds
        # `tps` directly and nothing ever read etb_position_N, so once the position loop existed it only
        # added phase lag to the servo. Stacked on the 50 ms sensor EMA and the 3 ms ADC IIR (both also
        # gone) it was ~158 degrees at the plant's ultimate frequency, and the loop limit-cycled at 3.4 Hz
        # across 2.5 % of travel with gains that measure correct. Plate position is servoed RAW.
        - {name: kp, type: float, label: Position Kp, units: '%/%', scale: 1.0, min: -10000, max: 10000, default: 1.5, help: 'Position PID Kp gain. Stored as a FLOAT: the old uint16 x0.001 field capped at 60.0 and quantised to a thousandth, coarser than the autotune''s own output.'}
        - {name: ki, type: float, label: Position Ki, units: '%/%/s', scale: 1.0, min: -10000, max: 10000, default: 1.5, help: 'Position PID Ki gain. Stored as a FLOAT: the old uint16 x0.001 field capped at 60.0 and quantised to a thousandth, coarser than the autotune''s own output.'}
        - {name: kd, type: float, label: Position Kd, units: '%*s/%', scale: 1.0, min: -10000, max: 10000, default: 0.3, help: 'Position PID Kd gain. Stored as a FLOAT: the old uint16 x0.001 field capped at 60.0 and quantised to a thousandth, coarser than the autotune''s own output.'}
        # Slew-rate damping on the position command — both directions ramp instead of stepping. OPENING
        # is damped so a step target never flings the plate open; CLOSING is also damped for driveability
        # but can be a touch quicker (it moves toward the spring/limp, the safe direction). Units %/s;
        # 0 = unlimited. A latched-DIS / fail-safe cut bypasses these (the spring closes the plate).
        - {name: open_rate_pct_s, type: uint16, label: Open Rate Limit, units: '%/s', scale: 1.0, min: 0, max: 10000, default: 300, help: 'Max plate OPENING rate (%/s). Damps a step target so it ramps open instead of slamming. 0 = unlimited.'}
        - {name: close_rate_pct_s, type: uint16, label: Close Rate Limit, units: '%/s', scale: 1.0, min: 0, max: 10000, default: 500, help: 'Max plate CLOSING rate (%/s) under normal control. 0 = unlimited. NOTE: a fail-safe DIS cut bypasses this — the spring returns the plate regardless.'}
        # Hard upper clamp on the commanded plate position — the throttle can never be driven past this.
        - {name: min_tps_pct, type: uint16, label: Min TPS, units: '%', scale: 0.1, min: 0, max: 1000, default: 30, help: 'The minimum position the throttle is driven to (clamps the target floor). Default 3% keeps the plate clear of the hard closed stop -- 2% sat close enough that the plate could still touch it, and the feed-forward curve turns sharply negative below about 5% (it takes -34% duty to hold 0%), so a floor down in that region asks the loop to work against the stop rather than sit off it.'}
        - {name: max_tps_pct, type: uint16, label: Max TPS, units: '%', scale: 0.1, min: 0, max: 1000, default: 980, help: 'The maximum position the throttle can move to (clamps the target). Default 98% keeps it just off the open stop.'}
        # Autocal creep (engine-stopped). Ramps duty UP to this ceiling watching for the plate to reach a
        # stop (raw TPS stops changing), then backs off immediately — it must clear the spring breakaway
        # (~35-40%) to move at all; gentleness comes from the slow ramp + stop-detect, NOT a low ceiling.
        - {name: ac_duty_cap_pct, type: uint16, label: Autocal Duty Cap, units: '%', scale: 0.1, min: 0, max: 1000, default: 550, help: 'Duty ceiling for the autocal creep. Must exceed the spring breakaway (~38%) or the plate never moves. The stop-detect backs off the instant motion stalls, so it never dwells at the stop.'}
        - {name: ac_ramp_pct_s, type: uint16, label: Autocal Ramp Rate, units: '%/s', scale: 1.0, min: 0, max: 10000, default: 150, help: 'How fast the DUTY ramps toward the cap during findlimits (its own knob — independent of the runtime open/close position slew). Slower = gentler creep to the stops; faster = the plate lurches once it clears breakaway.'}
        - {name: ac_timeout_ms, type: uint16, label: Autocal Step Timeout, units: ms, scale: 1.0, min: 0, max: 10000, default: 6000, help: 'Max time to reach the open stop before aborting (FAULT). SHARED with the autotune settle phase, which is also its per-breakpoint budget — and that budget includes the setpoint slew, so a jump across most of the travel at at_slew_pct_s can eat half of it before the plate has arrived. 3000 was too tight for both.'}
        - {name: ac_move_min, type: uint16, label: Autocal Motion Min, units: mV, raw_adc: true, scale: 1.0, min: 0, max: 5000, default: 200, help: 'TPS voltage must move at least this far end-to-end; less => stuck/dead/miswired -> abort (FAULT), no cal written.'}
        - {name: iterm_max_pct, type: uint16, label: Integral Clamp, units: '%', scale: 0.1, min: 0, max: 1000, default: 500, help: 'Anti-windup: integral term clamped to +/- this. The FF map does the work; the I-term only trims, so it cannot wind up while the plate is stuck.'}
        # Relay-feedback PID AUTOTUNE knobs — plant-specific, so they are config (no reflash to retune the
        # autotuner for a different throttle). `autotune` settles the plate at each ff bin then relays about
        # the hold duty to measure Ku/Tu. Defaults match the original hardcoded values.
        - {name: at_relay_pct, type: uint16, label: Autotune Relay Amplitude, units: '%', scale: 0.1, min: 10, max: 500, default: 250, help: 'Relay perturbation (+/- duty) about the hold duty during the oscillation phase. Bigger = larger, easier-to-measure limit cycle (lower Ku); smaller = gentler. Tune if points report "no clean oscillation". Default measured on the bench: the plate has a band of duty in which it does not move at all (~11% wide on the jaytek_v1 ETB), so a relay smaller than that never drives it across the setpoint and no point ever oscillates. 12% gave 1 of 16 breakpoints; 25% gives 13 of 16.'}
        - {name: at_settle_band_pct, type: uint16, label: Autotune Settle Band, units: '%', scale: 0.1, min: 1, max: 200, default: 70, help: 'How close (+/-) the plate must hold to the target to count as parked before relaying. Widen if mid-travel points report "could not settle". Measured: the plate parks 2-4% off target and occasionally 7%, so a +/-3% band is one the plate frequently cannot enter and half the breakpoints timed out trying. Widening ALONE makes it worse, not better — the relay counts crossings of the target, so a plate parked 6% away never crosses it. Raise this WITH at_relay_pct or not at all.'}
        - {name: at_settle_dwell_ms, type: uint16, label: Autotune Settle Dwell, units: ms, scale: 1.0, min: 0, max: 5000, default: 300, help: 'How long the plate must stay in-band before the relay phase begins.'}
        - {name: at_cycles, type: uint8, label: Autotune Cycles, units: '', scale: 1.0, min: 3, max: 50, default: 10, help: 'Limit cycles MEASURED per point (2 transient discarded on top). More = tighter Ku/Tu, longer per point.'}
        - {name: at_settle_kp, type: uint16, label: Autotune Settle Kp, units: '', scale: 0.001, min: 0, max: 5000, default: 300, help: 'Proportional gain of the settle controller (parks the plate before relaying). Higher = stiffer approach; too high oscillates and never parks.'}
        - {name: at_settle_ki, type: uint16, label: Autotune Settle Ki, units: '', scale: 0.001, min: 0, max: 5000, default: 800, help: 'Integrator rate of the settle controller (finds the hold duty). Carried across points as a seed.'}
        - {name: at_slew_pct_s, type: uint16, label: Autotune Settle Slew, units: '%/s', scale: 1.0, min: 1, max: 1000, default: 70, help: 'How fast the settle setpoint slews toward each target — gentle so a twitchy plate tracks without slamming.'}
        - {name: at_check_duty_pct, type: uint16, label: Autotune Check Duty, units: '%', scale: 0.1, min: 10, max: 1000, default: 400, help: 'Open-drive duty for the pre-tune response check (confirms the plate moves before the sweep).'}
        - {name: at_check_min_pct, type: uint16, label: Autotune Check Min, units: '%', scale: 0.1, min: 10, max: 1000, default: 300, help: 'Plate must open past this on the response check or autotune aborts (dead/miswired/wrong direction).'}
        - {name: at_relay_timeout_ms, type: uint16, label: Autotune Relay Timeout, units: ms, scale: 1.0, min: 0, max: 30000, default: 9000, help: 'Max time for the relay phase to gather its cycles before the point is skipped ("no clean oscillation").'}
        # Learned calibration outputs (written by `findlimits`): the closed stop is 0% and the open stop
        # is 100% by definition (the TPS cal). relax_pct is the de-energized spring-rest (limp-home)
        # position within that span. 0 until calibrated.
        - {name: relax_pct, type: uint16, label: Relax Position, units: '%', scale: 0.1, min: 0, max: 1000, default: 0, help: 'Learned spring-rest (limp-home) plate position, found by `findlimits` at the de-energized settle point. Read-only output of calibration.'}
        # Spring feed-forward map — static PWM duty to HOLD the plate at each position, neutralising the
        # dual-torsion limp-home spring (incl. the preload step at rest). A per-ETB 2-D standard table:
        # X = plate position, Y = CLT (optional channel, OFF by default). The INSTANCE is the etb[] array
        # element (one table per ETB) — no Z axis. Default 16x1, max 32x4. Bins set client-side; cells
        # filled by the stage-2 sweep. Signed cells (int16 x0.1): <0 closes, >0 opens.
        - {name: ff_table, type: table, cell_type: int16, scale: 0.1, label: Spring Feed-Forward, display: curve, x_axis: {type: uint16, scale: 0.1, digits: 1, min: 2, max: 32, value_min: 0, value_max: 1000, units: '%', values: [0, 50, 100, 150, 200, 300, 400, 500, 600, 700, 800, 850, 900, 950, 980, 1000]}, y_axis: {type: int16, min: 1, max: 4, optional: true, signal: clt, units: C, values: [60]}, help: 'Feed-forward: the duty needed just to HOLD the plate at each position against its return spring, before the PID contributes anything. With it the loop only has to correct the difference, so it can run gentler gains and still respond quickly. It is measured rather than guessed — the `fillff` sweep drives the plate through its range and writes this table from what it took. The DEFAULT is a real measured curve off the jaytek_v1 bench throttle, not a guess or a zero row: a fresh board that has never been swept would otherwise make its first move with no feed-forward at all, leaving the PID to find the ~17% duty the spring needs before the plate even begins to move. Re-run `fillff` for the throttle actually fitted — this is a starting point, not a substitute.', cells: [-340, -209, 171, 179, 188, 203, 214, 225, 235, 246, 256, 261, 266, 271, 275, 421]}
  # HBridge — two INDEPENDENT half-bridge slots, each consuming its own demand/dis signal from the bus.
  # Any producer (ETB duty, stepper coil demand, idle duty …) binds via the slot's demand_sig. The board
  # DECLARES the bridges (locked hardware); only the signal wiring + DC mapping are tunable here. The
  # former single-demand + stepper logic now lives in the Stepper module below. See docs/pwm-hal-design.md.
  HBridge:
    # shadow:{when:live}: a 'w' sets the shadow bit; pwm_freq_hz is re-applied to both bridges then only.
    shadow: {default: true, when: live}
    requires: []
    provides: []
    config:
      scalars:
      - {name: pwm_freq_hz, type: uint32, label: PWM Carrier, units: Hz, scale: 1.0, min: 1, max: 50000, default: 20000, help: Shared DMA-PWM carrier for both bridges. Set high (20 kHz) to suppress audible whine.}
      arrays:
      - name: half
        count: 2
        label: Half Bridge
        element:
        - {name: enabled, type: uint8, label: Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Drive this half-bridge slot. The module is deliberately dumb — it applies the demand it is given and nothing else. Any integrator, ramp or current limit belongs to whichever module publishes the demand signal.'}
        - {name: demand_sig, type: uint8, label: Demand Signal, units: '', scale: 1.0, min: 0, max: 254, default: [etb_duty_1, etb_duty_2], help: 'Bus signal this half-bridge realises. Which SIGN CONVENTION it uses decides dc_map below: a SIGNED -100..+100 producer (etb_duty_N -- the throttle publishes negative to close) wants dc_map UNIPOLAR, which passes the sign straight through. An UNSIGNED 0..100 producer that encodes direction around midpoint (50 = stop) wants BIPOLAR.'}
        - {name: enable_sig, type: uint8, label: Enable Signal, units: '', scale: 1.0, min: 0, max: 255, default: [etb_en_1, etb_en_2], help: 'Bus signal that ENABLES this bridge while >= 0.5 (fail-safe: the bridge drives only when actively enabled). Not assigned = unconfigured -> bridge held off + DTC raised so a mis-wired tune is flagged immediately.'}
        - {name: dir_invert, type: uint8, label: Direction Invert, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: Flip the DIR pin to correct for motor wiring polarity without rewiring.}
        - name: dc_map
          type: enum
          label: DC Map
          options:
          - Unipolar
          - Bipolar
          units: ''
          scale: 1.0
          min: 0
          max: 1
          default: 0
          help: 'How the demand signal maps onto the bridge, and it follows the PRODUCER''s sign convention, not whether the load moves both ways. UNIPOLAR is a linear pass-through, cmd = demand/100 x max: a signed producer keeps its sign and drives both directions, which is what the electronic throttle needs -- it publishes -100..+100 and negative means close. BIPOLAR is cmd = (demand/50 - 1) x max, for a producer that only emits 0..100 and encodes direction around a midpoint: 50 = stop, 0 = full reverse, 100 = full forward. Getting it backwards is quiet and nasty: bipolar applied to a signed source turns +50 into (50/50-1) x max = ZERO drive and -50 into full reverse, so the plate only ever pulls one way and a calibration sweep measures no travel at all.'
        - {name: dc_max_pct, type: uint16, label: Max Authority, units: '%', scale: 0.1, min: 0, max: 1000, default: 1000, help: 'Ceiling on the duty this bridge will apply, as a percentage of full. It scales the whole map rather than clipping the top of it, so an actuator that must never see full rail voltage stays proportional over its entire demand range.'}
  # Stepper — bipolar stepper position controller. Converts a 0..100% position demand into two signed
  # coil duties (cos/sin at the current microstep position) and publishes them as step_demand_a/b on the
  # bus. The two HBridge slots consume those signals — no direct bridge wiring here. Keeps the position
  # integrator and move/hold current decision; the mechanical render is the HBridgeActuator's job via the
  # bus. Wire step_demand_a/b + step_en_a/b into the two HBridge bridge[] slots to complete the path.
  Stepper:
    cadence_hz: 200    # control cadence (firmware constant, not a tune field)
    requires: []
    provides:
    - step_demand_a
    - step_demand_b
    - step_en_a
    - step_en_b
    - step_pulse
    - step_dir
    - step_enable
    config:
      scalars:
      - {name: enabled, type: uint8, label: Stepper Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Drive a bipolar stepper to a position demanded by a bus signal (typically idle duty). Off, no coil is energised and no step signal is emitted, so the valve stays wherever it was left.'}
      - {name: driver_mode, type: enum, label: Driver Mode, default: 0, options: ["H-Bridge (coil drive)", "Step/Direction (external driver)"], help: 'H-Bridge: two signed coil demands drive the two HBridge slots (uses both bridges). Step/Direction: STEP/DIR/ENABLE bus outputs for an external driver IC (A4988/DRV8825) wired to Outputs GPIO slots — frees the H-bridges for ETB.'}
      - {name: input_sig, type: uint8, label: Position Demand Signal, units: '', scale: 1.0, min: 0, max: 254, default: idle_duty, help: 0..100% position demand input. Default idle_duty for a stepper idle valve.}
      - {name: dir_invert, type: uint8, label: Rotation Invert, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: Reverse stepper rotation direction (H-Bridge flips the sin coil B phase; Step/Dir flips the DIR level).}
      - {name: microstep, type: uint16, label: Microsteps per Full Step, units: '', scale: 1.0, min: 1, max: 256, default: 16, help: 'H-Bridge only: cos/sin render granularity. In Step/Direction the external driver owns microstepping.'}
      - {name: range_steps, type: uint16, label: Range, units: steps, scale: 1.0, min: 1, max: 10000, default: 200, help: 'Total travel (0..100% maps to 0..range_steps). H-Bridge: microsteps. Step/Direction: driver steps.'}
      - {name: max_step_per_update, type: uint16, label: Max Steps per Update, units: steps/svc, scale: 1.0, min: 1, max: 1000, default: 1, help: 'H-Bridge only: microsteps advanced per eligible service (velocity ramp ceiling).'}
      - {name: step_period_ms, type: uint16, label: Step Period, units: ms, scale: 1.0, min: 1, max: 300, default: 5, help: 'Minimum time per FULL step (rate limit). GM-style IAC valves run ~5-10 ms/step (100-200 steps/s) — do not go below the valve rating or it will miss steps. H-Bridge divides this across microsteps.'}
      - {name: move_current_pct, type: uint16, label: Move Current, units: '%', scale: 0.1, min: 0, max: 1000, default: 800, help: 'Coil current while the motor is actually stepping, as a percentage of full drive. Moving needs more current than holding — too little and the motor stalls and silently loses position, since a stepper has no feedback to notice.'}
      - {name: hold_current_pct, type: uint16, label: Hold Current, units: '%', scale: 0.1, min: 0, max: 1000, default: 300, help: 'Coil current once the target is reached. Deliberately lower than the move current: holding is a static load with no back-EMF to help, so full current here is heat in the motor and the driver for no extra holding torque. Too low and the valve creeps under spring or airflow load.'}
  FuelCalculator:
    requires: [map, clt, iat]
    provides:        # ids -> signals: catalog (the value bus); encoding lives there
    - base_pw
    - lambda_target
    - ve
    - clt_corr
    - inj_duty
    - inj_duty_2
    - inj_duty_3
    - inj_duty_4
    config:
      scalars:
      # (injector flow rate is now the 2D inj_flow_table; dead time the 2D stage1_dead_time_table)
      # (injection firing angle is now the 2D stage1_inj_angle_table — RPM × fuel-load)
      # A FUEL PROPERTY, like the specific gravity table below — which is why it is here and not in
      # Vehicle, whose fields are documentation and which nothing in the firmware reads. The level
      # sender measures a PERCENTAGE; this is what turns it into the litres a driver and every
      # broadcast protocol expect. 0 = unknown, and the litres channel then publishes nothing rather
      # than a confident zero.
      - name: tank_capacity_l
        type: uint16
        label: Fuel Tank Capacity
        units: 'L'
        scale: 0.1
        min: 0
        max: 5000
        default: 0
        help: 'How much the tank holds when full, in litres. The level sender reads a percentage of its own travel; only this turns that into a quantity. Leave it at 0 if you do not know it — the litres reading then stays absent, which is honest, rather than reading zero on a full tank.'
      - name: map_src
        type: uint8
        label: MAP Source Signal
        units: ''
        scale: 1.0
        min: 0
        max: 254
        default: map
        help: 'Which signal is read as manifold pressure. It is the load axis for speed-density and the density term in the air-mass calculation, so this is the single most consequential source selection in the module.'
      - name: tps_src
        type: uint8
        label: TPS Source Signal
        units: ''
        scale: 1.0
        min: 0
        max: 254
        default: tps
        help: 'Which signal is read as throttle position — the load axis for alpha-N and the Blend model''s low-RPM map, and what MAP prediction watches for a transient.'
      - name: clt_src
        type: uint8
        label: CLT Source Signal
        units: ''
        scale: 1.0
        min: 0
        max: 254
        default: clt
        help: 'Which signal is read as coolant temperature, used for warm-up enrichment and as part of the charge temperature estimate.'
      # NOTE: per-axis channel selectors (<table>_<ax>_src) + optional-axis enables (<table>_<ax>_en)
      # are AUTO-GENERATED by codegen from each table's axes (see auto_table_channels / table_descs.h);
      # no longer hand-declared. Defaults come from each table's x_channel/y_channel/z_channel.
      - name: iat_src
        type: uint8
        label: IAT Source Signal
        units: ''
        scale: 1.0
        min: 0
        max: 254
        default: iat
        help: 'Which signal is read as intake air temperature. It sets charge density directly: cold air is denser and needs more fuel, and this is where that enters the calculation.'
      # (lambda_src removed — was an unused FuelCalculator config field; closed-loop lives in the Lambda module.)
      - name: charge_temp_iat_pct
        type: uint16
        label: Charge Temp IAT Weight
        units: '%'
        scale: 0.1
        min: 0
        max: 1000
        default: 1000        # T_charge = this% IAT + rest CLT. 100 = pure IAT (textbook);
                            # blend in CLT to model port-wall heat-soak at low airflow.
        help: 'How much of the charge temperature estimate comes from INTAKE AIR rather than coolant, in percent. It is a physical statement about the engine''s ports: 100% assumes the charge arrives at the temperature the intake sensor reads, while lower values acknowledge that a hot cylinder head warms the charge on its way in. Port-injected engines with hot heads usually want less than 100%.'
      # --- Stage C: injector model (dead-time table + flow table; both index on the stage's own dP) ---
      #
      # WHAT HOLDS EACH RAIL UP. The injector's differential pressure — rail minus manifold — is the X
      # axis of both the flow and dead-time tables, so it is never optional. A fuel pressure SENSOR is:
      # most installs have a regulator and a number written on it. What the regulator REFERENCES is the
      # whole difference between the three answers:
      #
      #   Sensor       dP = measured rail - MAP.
      #   Fixed        the regulator holds the rail at a constant pressure, so dP FALLS as the manifold
      #                rises: dP = base + baro - MAP.
      #   Rising rate  a 1:1 regulator references the manifold, so it holds dP CONSTANT by construction —
      #                dP = base, and neither MAP nor baro is consulted at all.
      #
      # `base` is the number on the regulator: gauge pressure at atmosphere. Stated that way rather than
      # absolute so it is the figure a person actually has, and so Fixed degrades correctly — with no MAP
      # sensor the manifold reads atmosphere and dP falls out as exactly `base`.
      #
      # AND IT IS PER STAGE. Staged injection is very often a second set of injectors on a second rail —
      # port and direct, petrol and methanol, a big secondary set fed by its own pump and regulator —
      # with its own pressure, its own regulator type and its own sensor or none. One set of numbers for
      # all four stages could only describe the case where every stage shares a rail. Where they do (the
      # common case) the four stages simply carry the same answers, which is what they default to.
      - {name: stage1_fuel_press_mode, type: uint8, label: Stage 1 Fuel Pressure, units: '', scale: 1.0, min: 0, max: 2, default: 1, options: ["Sensor", "Fixed Regulator", "Rising Rate"], help: 'How stage 1''s rail pressure is known. A sensor measures it; a fixed regulator holds it at a set pressure so the differential falls as boost rises; a 1:1 rising-rate regulator references the manifold and holds the differential constant, which is the only one of the three needing no MAP sensor at all.'}
      - {name: stage1_fuel_press_base_kpa, type: uint16, label: Stage 1 Base Fuel Pressure, units: kPa, scale: 0.1, min: 0, max: 10000, digits: 1, default: 3000, help: 'The pressure stage 1''s regulator is set to, as gauge pressure at atmosphere — the number written on it (300 kPa = 3 bar = 43.5 psi). Used by the Fixed and Rising Rate modes; a Sensor install ignores it. It is NOT the differential except by coincidence: on a fixed regulator the differential is this minus whatever the manifold is doing.'}
      - {name: stage1_fuel_press_ratio, type: uint8, label: Stage 1 Rising Rate Ratio, units: ':1', scale: 0.1, min: 10, max: 200, digits: 1, default: 10, help: 'How much stage 1''s rail pressure climbs per unit of boost, for a Rising Rate regulator. 1.0:1 is a manifold-REFERENCED regulator: the rail follows the manifold exactly, so the differential never moves and the injectors flow the same at 2 bar of boost as at idle — that is what a stock returnless system does. Above 1.0 the rail climbs FASTER than the manifold and the differential rises with boost, which is what an aftermarket rising-rate regulator is for: 6.0:1 adds five units of differential per unit of boost. The rail tracks the manifold BOTH ways — put vacuum on the hose and the rail pressure drops, boost and it rises — which is the same thing as saying the differential holds: the rail is the differential plus the manifold. Under vacuum the ratio stops amplifying and the regulator behaves as 1.0:1, because multiplying vacuum by the ratio would drive the differential below zero and no regulator flows fuel backwards.'}
      - {name: stage1_fuel_press_src, type: uint8, label: Stage 1 Fuel Pressure Source, units: '', scale: 1.0, min: 0, max: 254, default: fuel_pressure, help: 'Which signal reports stage 1''s rail pressure, when its mode is Sensor. A stage on its own rail with its own transducer names that sensor here — any channel will do, so a generic or auxiliary input wired to a pressure sender is a valid answer. Ignored in the other two modes.'}
      - {name: stage2_fuel_press_mode, type: uint8, label: Stage 2 Fuel Pressure, units: '', scale: 1.0, min: 0, max: 2, default: 1, options: ["Sensor", "Fixed Regulator", "Rising Rate"], help: 'How stage 2''s rail pressure is known. A sensor measures it; a fixed regulator holds it at a set pressure so the differential falls as boost rises; a 1:1 rising-rate regulator references the manifold and holds the differential constant, which is the only one of the three needing no MAP sensor at all.'}
      - {name: stage2_fuel_press_base_kpa, type: uint16, label: Stage 2 Base Fuel Pressure, units: kPa, scale: 0.1, min: 0, max: 10000, digits: 1, default: 3000, help: 'The pressure stage 2''s regulator is set to, as gauge pressure at atmosphere — the number written on it (300 kPa = 3 bar = 43.5 psi). Used by the Fixed and Rising Rate modes; a Sensor install ignores it. It is NOT the differential except by coincidence: on a fixed regulator the differential is this minus whatever the manifold is doing.'}
      - {name: stage2_fuel_press_ratio, type: uint8, label: Stage 2 Rising Rate Ratio, units: ':1', scale: 0.1, min: 10, max: 200, digits: 1, default: 10, help: 'How much stage 2''s rail pressure climbs per unit of boost, for a Rising Rate regulator. 1.0:1 is a manifold-REFERENCED regulator: the rail follows the manifold exactly, so the differential never moves and the injectors flow the same at 2 bar of boost as at idle — that is what a stock returnless system does. Above 1.0 the rail climbs FASTER than the manifold and the differential rises with boost, which is what an aftermarket rising-rate regulator is for: 6.0:1 adds five units of differential per unit of boost. The rail tracks the manifold BOTH ways — put vacuum on the hose and the rail pressure drops, boost and it rises — which is the same thing as saying the differential holds: the rail is the differential plus the manifold. Under vacuum the ratio stops amplifying and the regulator behaves as 1.0:1, because multiplying vacuum by the ratio would drive the differential below zero and no regulator flows fuel backwards.'}
      - {name: stage2_fuel_press_src, type: uint8, label: Stage 2 Fuel Pressure Source, units: '', scale: 1.0, min: 0, max: 254, default: 0, help: 'Which signal reports stage 2''s rail pressure, when its mode is Sensor. A stage on its own rail with its own transducer names that sensor here — any channel will do, so a generic or auxiliary input wired to a pressure sender is a valid answer. Ignored in the other two modes.'}
      - {name: stage3_fuel_press_mode, type: uint8, label: Stage 3 Fuel Pressure, units: '', scale: 1.0, min: 0, max: 2, default: 1, options: ["Sensor", "Fixed Regulator", "Rising Rate"], help: 'How stage 3''s rail pressure is known. A sensor measures it; a fixed regulator holds it at a set pressure so the differential falls as boost rises; a 1:1 rising-rate regulator references the manifold and holds the differential constant, which is the only one of the three needing no MAP sensor at all.'}
      - {name: stage3_fuel_press_base_kpa, type: uint16, label: Stage 3 Base Fuel Pressure, units: kPa, scale: 0.1, min: 0, max: 10000, digits: 1, default: 3000, help: 'The pressure stage 3''s regulator is set to, as gauge pressure at atmosphere — the number written on it (300 kPa = 3 bar = 43.5 psi). Used by the Fixed and Rising Rate modes; a Sensor install ignores it. It is NOT the differential except by coincidence: on a fixed regulator the differential is this minus whatever the manifold is doing.'}
      - {name: stage3_fuel_press_ratio, type: uint8, label: Stage 3 Rising Rate Ratio, units: ':1', scale: 0.1, min: 10, max: 200, digits: 1, default: 10, help: 'How much stage 3''s rail pressure climbs per unit of boost, for a Rising Rate regulator. 1.0:1 is a manifold-REFERENCED regulator: the rail follows the manifold exactly, so the differential never moves and the injectors flow the same at 2 bar of boost as at idle — that is what a stock returnless system does. Above 1.0 the rail climbs FASTER than the manifold and the differential rises with boost, which is what an aftermarket rising-rate regulator is for: 6.0:1 adds five units of differential per unit of boost. The rail tracks the manifold BOTH ways — put vacuum on the hose and the rail pressure drops, boost and it rises — which is the same thing as saying the differential holds: the rail is the differential plus the manifold. Under vacuum the ratio stops amplifying and the regulator behaves as 1.0:1, because multiplying vacuum by the ratio would drive the differential below zero and no regulator flows fuel backwards.'}
      - {name: stage3_fuel_press_src, type: uint8, label: Stage 3 Fuel Pressure Source, units: '', scale: 1.0, min: 0, max: 254, default: 0, help: 'Which signal reports stage 3''s rail pressure, when its mode is Sensor. A stage on its own rail with its own transducer names that sensor here — any channel will do, so a generic or auxiliary input wired to a pressure sender is a valid answer. Ignored in the other two modes.'}
      - {name: stage4_fuel_press_mode, type: uint8, label: Stage 4 Fuel Pressure, units: '', scale: 1.0, min: 0, max: 2, default: 1, options: ["Sensor", "Fixed Regulator", "Rising Rate"], help: 'How stage 4''s rail pressure is known. A sensor measures it; a fixed regulator holds it at a set pressure so the differential falls as boost rises; a 1:1 rising-rate regulator references the manifold and holds the differential constant, which is the only one of the three needing no MAP sensor at all.'}
