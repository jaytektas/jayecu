        - [ -8,  12,  26,  38,  57,  94, 152, 172, 174, 182, 192, 206, 212, 216, 222, 222, 224, 226, 227, 231, 234]   # 140 kPa
        - [-15,   4,  13,  20,  36,  67,  95, 125, 146, 155, 164, 179, 184, 189, 194, 195, 197, 200, 203, 210, 214]   # 160 kPa
        - [-22,  -4,   5,  12,  22,  40,  68,  88, 108, 128, 136, 152, 156, 162, 166, 168, 170, 174, 178, 186, 194]   # 180 kPa
        - [-30, -12,  -3,   4,  10,  22,  40,  60,  80, 100, 109, 124, 129, 134, 139, 140, 142, 147, 153, 163, 174]   # 200 kPa
        - [-30, -20, -13,  -8,  -2,   8,  22,  37,  52,  67,  76,  91,  96, 101, 106, 107, 109, 111, 117, 129, 141]   # 220 kPa
        - [-30, -27, -22, -18, -14,  -7,   4,  14,  24,  34,  43,  58,  63,  68,  73,  74,  76,  78,  84,  96, 108]   # 240 kPa
        - [-30, -30, -30, -28, -26, -21, -14,  -4,   6,  16,  25,  40,  45,  50,  55,  56,  58,  60,  66,  78,  90]   # 260 kPa
        - [-30, -30, -30, -30, -30, -30, -30, -22, -12,  -2,   7,  22,  27,  32,  37,  38,  40,  42,  48,  60,  72]   # 280 kPa
        - [-30, -30, -30, -30, -30, -30, -30, -30, -30, -20, -11,   4,   9,  14,  19,  20,  22,  27,  32,  43,  54]   # 300 kPa
        - [-30, -30, -30, -30, -30, -30, -30, -30, -30, -30, -21,  -6,  -1,   4,   9,  10,  12,  17,  22,  33,  44]   # 350 kPa
        - [-30, -30, -30, -30, -30, -30, -30, -30, -30, -30, -30, -16, -11,  -6,  -1,   0,   2,   7,  12,  23,  34]   # 400 kPa
        # --- Z plane 1: ethanol 100% (identical to plane 0 until tuned) ---
        - [100, 150, 150, 150, 150, 150, 232, 272, 310, 318, 324, 332, 340, 340, 340, 340, 340, 340, 340, 340, 340]   #   0 kPa
        - [100, 150, 150, 150, 150, 150, 312, 342, 400, 408, 404, 402, 410, 410, 410, 410, 410, 410, 410, 410, 410]   #  20 kPa
        - [100, 150, 150, 150, 165, 200, 381, 383, 405, 412, 413, 416, 424, 424, 424, 424, 424, 424, 424, 424, 424]   #  30 kPa
        - [100, 150, 150, 150, 189, 280, 370, 365, 371, 376, 382, 384, 388, 388, 388, 388, 388, 388, 388, 388, 388]   #  40 kPa
        - [ 70, 174, 166, 170, 197, 298, 340, 348, 353, 355, 357, 358, 358, 358, 355, 356, 357, 358, 358, 358, 358]   #  50 kPa
        - [ 50, 197, 183, 168, 186, 256, 300, 306, 320, 328, 336, 338, 342, 342, 336, 338, 340, 342, 342, 342, 342]   #  60 kPa
        - [ 30, 220, 200, 180, 180, 235, 271, 275, 283, 295, 308, 315, 321, 324, 323, 325, 327, 329, 329, 329, 329]   #  70 kPa
        - [ 10, 220, 200, 180, 180, 212, 250, 260, 272, 280, 289, 294, 299, 304, 309, 310, 312, 314, 314, 314, 314]   #  80 kPa
        - [ 10, 185, 171, 148, 160, 207, 245, 255, 267, 275, 284, 289, 294, 299, 304, 305, 307, 309, 309, 309, 309]   #  90 kPa
        - [ 10, 151, 142, 126, 142, 192, 240, 250, 262, 270, 279, 284, 289, 294, 299, 300, 300, 300, 300, 300, 300]   # 100 kPa
        - [  0,  81,  84,  82,  99, 142, 190, 210, 217, 220, 229, 244, 249, 256, 259, 260, 262, 264, 264, 264, 264]   # 120 kPa
        - [ -8,  12,  26,  38,  57,  94, 152, 172, 174, 182, 192, 206, 212, 216, 222, 222, 224, 226, 227, 231, 234]   # 140 kPa
        - [-15,   4,  13,  20,  36,  67,  95, 125, 146, 155, 164, 179, 184, 189, 194, 195, 197, 200, 203, 210, 214]   # 160 kPa
        - [-22,  -4,   5,  12,  22,  40,  68,  88, 108, 128, 136, 152, 156, 162, 166, 168, 170, 174, 178, 186, 194]   # 180 kPa
        - [-30, -12,  -3,   4,  10,  22,  40,  60,  80, 100, 109, 124, 129, 134, 139, 140, 142, 147, 153, 163, 174]   # 200 kPa
        - [-30, -20, -13,  -8,  -2,   8,  22,  37,  52,  67,  76,  91,  96, 101, 106, 107, 109, 111, 117, 129, 141]   # 220 kPa
        - [-30, -27, -22, -18, -14,  -7,   4,  14,  24,  34,  43,  58,  63,  68,  73,  74,  76,  78,  84,  96, 108]   # 240 kPa
        - [-30, -30, -30, -28, -26, -21, -14,  -4,   6,  16,  25,  40,  45,  50,  55,  56,  58,  60,  66,  78,  90]   # 260 kPa
        - [-30, -30, -30, -30, -30, -30, -30, -22, -12,  -2,   7,  22,  27,  32,  37,  38,  40,  42,  48,  60,  72]   # 280 kPa
        - [-30, -30, -30, -30, -30, -30, -30, -30, -30, -20, -11,   4,   9,  14,  19,  20,  22,  27,  32,  43,  54]   # 300 kPa
        - [-30, -30, -30, -30, -30, -30, -30, -30, -30, -30, -21,  -6,  -1,   4,   9,  10,  12,  17,  22,  33,  44]   # 350 kPa
        - [-30, -30, -30, -30, -30, -30, -30, -30, -30, -30, -30, -16, -11,  -6,  -1,   0,   2,   7,  12,  23,  34]   # 400 kPa
        help: 'The main advance map: spark timing in degrees BTDC against RPM and load. Positive is before TDC. This is the engine''s core calibration — every other table here is a correction ADDED to what this gives, so the map should be right for a warm engine on good fuel and the corrections should handle the rest.'
      # Rotary leading/trailing SPLIT — degrees of RETARD applied to the trailing plug, over the same
      # rpm x load surface the timing table uses. Both plugs fire the same chamber, so the trailing
      # one has no advance of its own: trailing = leading - split.
      #
      # POSITIVE = RETARD, the industry convention (the split is the angle between the leading and
      # trailing advance, expressed in degrees of retard — e.g. the lead fires at -5 BTDC and the
      # trail at -20 with a 15 deg split). Common rotary practice is to shape this against rpm/load
      # rather than run a single number, which is why it is a surface and not a scalar.
      #
      # Read ONLY when Ignition Mode is Rotary Leading/Trailing; ignored on a piston engine.
      - name: trail_split_table
        label: Trailing Split Table
        units: deg
        min: -300            # entry clamp (deg). Negative would fire the TRAIL first — allowed, but
        max: 600             # it is not what a split means, so the range leans positive.
        type: int16
        scale: 0.1            # x.x resolution (cell stores degrees x10)
        rows: 16
        cols: 16
        depth: 2             # ethanol planes, mirroring ign_table
        x_axis: split_rpm_axis
        y_axis: split_load_axis
        z_axis: ign_ethanol_axis
        z_optional: true     # auto-generates trail_split_table_z_en (default off -> plain 2D surface)
        x_channel: rpm
        y_channel: fuel_load
        # Uniform 6.0 deg of retard — inside the factory band, so the surface behaves like the single
        # number it replaces until a tuner shapes it. (Same approach stage1_inj_angle_table took when it
        # replaced its scalar.)
        default: 60
        help: 'Rotary only: how far the TRAILING plug fires after the leading one, in degrees. A rotary''s chamber is long and moving, so the second plug is deliberately late to catch the flame front rather than starting a second one against it. It is subtracted from the leading spark angle, so a larger split means a later trailing spark.'
      - name: split_rpm_axis
        label: Split RPM Axis
        type: float
        size: 16
        max_size: 16
        default_values: [0, 500, 1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000, 5500, 6000, 7000, 8000, 9000]
        help: 'RPM breakpoints for the trailing split table.'
      - name: split_load_axis
        label: Split Load Axis
        units: kPa
        type: float
        size: 16
        max_size: 16
        scale: 1.0
        default_values: [0, 20, 30, 40, 50, 60, 70, 80, 90, 100, 120, 150, 180, 220, 280, 350]
        help: 'Load breakpoints for the trailing split table.'
      - name: ign_rpm_axis
        label: Ign RPM Axis
        type: float          # float real-unit axis for the table engine (tbl::interp)
        size: 21
        max_size: 32
        default_values: [0, 500, 750, 950, 1150, 1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000, 5500, 6000, 6500, 7000, 7500, 8000, 9000, 10000]
        help: 'RPM breakpoints for the main advance map. Where these sit decides where the map has resolution — concentrate them where the timing curve bends, not evenly across the range.'
      - name: ign_load_axis
        label: Ign Load Axis
        units: kPa
        type: float          # real-unit kPa axis — ABSOLUTE
        size: 22
        max_size: 32
        scale: 1.0
        default_values: [0, 20, 30, 40, 50, 60, 70, 80, 90, 100, 120, 140, 160, 180, 200, 220, 240, 260, 280, 300, 350, 400]
        help: 'Load breakpoints for the main advance map. Timing changes fastest with load near the transition into boost, which is where breakpoints are worth spending.'
      # Flex-fuel Z axis for ign_table — same shape as the VE / target-lambda tables' ethanol axis
      # (2 live planes, resizable to 4). Off by default via ign_table's z_optional.
      - {name: ign_ethanol_axis, label: Ign Ethanol Axis (%), units: '%', type: float, size: 2, max_size: 4, default_values: [0, 100], help: 'Optional ethanol-content axis for the main map, for a flex-fuel engine. Ethanol tolerates far more advance than petrol, so with a content sensor this axis lets one map serve both fuels and everything between rather than being a compromise for either.'}
      # 2D CLT advance trim on the table engine — like clt_corr: X = CLT, optional Y (default MAP,
      # tuner-selectable via clt_adv_y_src, switched by clt_adv_y_en). Y off → collapses to the z=0
      # row = the classic 1D CLT-advance curve (broadcast up every MAP row by default_row).
      - name: clt_ign_corr_table
        label: CLT Advance Correction
        units: deg
        min: -600            # entry clamp, RAW (deg x10) — matches ign_table
        max: 600
        type: int16           # was int8: +-12.7 deg was too tight a range for a cold-advance trim
        scale: 0.1
        rows: 8              # Y = MAP bins (resizable 2..16)
        cols: 14             # X = CLT bins (resizable 2..16)
        x_axis: clt_axis
        y_axis: clt_adv_map_axis
        y_optional: true     # auto-generates clt_ign_corr_table_y_en (default off → 1D CLT curve)
        x_channel: clt
        y_channel: map
        default_row:         # advance trim (deg) over CLT (x, 14 bins); broadcast to every MAP row
        - -50
        - -35
        - -25
        - -15
        - -8
        - -3
        - 0
        - 0
        - 0
        - 0
        - 0
        - 0
        - 0
        - 0
        help: 'Advance added or removed for coolant temperature, against load. A cold engine burns more slowly and usually wants a little more advance; an overheating one wants less, because it is already close to detonating. This is the correction that covers both ends.'
      - name: clt_axis
        label: CLT Axis (°C)
        type: float          # float real-unit axis for the table engine (tbl::interp)
        size: 14
        max_size: 16         # resizable trim table (matches clt_corr)
        default_values: [-40, -30, -20, -10, 0, 10, 20, 30, 40, 50, 60, 70, 90, 110]
        help: 'Coolant breakpoints for the coolant advance correction.'
      - name: clt_adv_map_axis
        label: CLT Advance MAP Axis (kPa)
        units: kPa
        type: float
        size: 8
        max_size: 16
        default_values: [20, 40, 60, 80, 120, 160, 210, 250]   # absolute kPa; only used when y_en=1
        help: 'Load breakpoints for the coolant advance correction — the correction that is right at idle is rarely right at full load, which is why this is two-dimensional.'
      # Ignition correction mirrors — additive degree trims (int16 ×0.1°, default 0) summed onto advance
      # in Ignition. Same recipe as the fuel side, just `adv += table_eval(...)` (summed directly).
      # Y is MAP, matching the fuel side's iat_corr_table and every other 2D ignition correction here
      # (clt / fuelcomp / rpmlimit / igngen all put MAP on the optional Y).
      - {name: iat_ign_corr_table, min: -600, max: 600, label: Ign Air Temp Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: iat_adv_axis, y_axis: iat_adv_map_axis, y_optional: true, x_channel: iat, y_channel: map, help: 'Advance correction for intake air temperature, against load. Hot intake air brings knock forward, so this normally pulls timing as the intake heats — on a turbo engine after a long pull it is the difference between surviving and not.'}
      - {name: iat_adv_axis, label: Ign IAT Axis (°C), units: 'C', type: float, size: 8, max_size: 16, default_values: [-20, 0, 20, 40, 60, 80, 100, 140], help: 'Intake air temperature breakpoints for the IAT advance correction.'}
      - {name: iat_adv_map_axis, label: Ign IAT MAP Axis (kPa), units: kPa, type: float, size: 8, max_size: 16, default_values: [20, 50, 80, 110, 140, 180, 220, 250], help: 'Load breakpoints for the IAT advance correction. Hot air matters far more under boost than at cruise, and this axis is what expresses that.'}
      - {name: fuelcomp_ign_corr_table, min: -600, max: 600, label: Ign Fuel Comp Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: fcomp_adv_axis, y_axis: fcomp_adv_load_axis, y_optional: true, x_channel: flex_ethanol, y_channel: map, help: 'Advance correction for fuel composition — ethanol content — against load. It is the alternative to putting ethanol on the main map''s third axis: a single correction table instead of a whole extra map dimension, which is easier to calibrate and easier to read.'}
      - {name: fcomp_adv_axis, label: Ign Fuel Comp Axis (%), units: '%', type: float, size: 8, max_size: 16, default_values: [0, 10, 20, 30, 40, 55, 70, 85], help: 'Fuel composition breakpoints, in percent, for the fuel-composition advance correction.'}
      - {name: fcomp_adv_load_axis, label: Ign Fuel Comp Load Axis (kPa), units: kPa, type: float, size: 8, max_size: 16, default_values: [20, 50, 80, 110, 140, 180, 220, 250], help: 'Load breakpoints for the fuel-composition advance correction.'}
      - {name: rpmlimit_ign_corr_table, min: -600, max: 600, label: Ign RPM Limiter Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 6, cols: 6, x_axis: rpmlimit_adv_axis, y_axis: rpmlimit_adv_map_axis, y_optional: true, x_channel: rpm_to_limit, y_channel: map, help: 'Advance correction as the engine APPROACHES the rev limit, indexed on how far short of the cut it is. Pulling timing before the limiter arrives softens the wall — the engine runs out of enthusiasm rather than hitting a cut — and it is evaluated per cycle rather than on the slow path so it can actually keep up with the approach.'}
      - {name: rpmlimit_adv_axis, label: Ign RPM Before Cut Axis, units: RPM, type: float, size: 6, max_size: 8, default_values: [0, 50, 100, 150, 200, 300], help: 'RPM-remaining-before-cut breakpoints for the rev-limit advance correction. Zero is the cut itself, so the breakpoints run backwards from it.'}
      - {name: rpmlimit_adv_map_axis, label: Ign Rev Limit MAP Axis, units: kPa, type: float, size: 6, max_size: 8, default_values: [20, 50, 90, 140, 200, 250], help: 'Load breakpoints for the rev-limit advance correction — a limiter approached at full throttle wants more softening than one reached on a trailing throttle.'}
      - {name: igngen1_ign_corr_table, min: -600, max: 600, label: Ign Generic 1 Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: igngen1_x_axis, y_axis: igngen1_y_axis, y_optional: true, x_channel: rpm, y_channel: map, help: 'General-purpose advance correction 1, on axes of your choosing. This is the escape hatch: any pair of bus signals can be its axes, so a correction that the fixed tables do not cover — timing against oil temperature, gear, a switch — can be built without new firmware.'}
      - {name: igngen1_x_axis, label: Ign Generic 1 X Axis, type: float, size: 8, max_size: 16, default_values: [500, 1500, 2500, 3500, 4500, 5500, 6500, 8000], help: 'X-axis channel and breakpoints for generic advance correction 1.'}
      - {name: igngen1_y_axis, label: Ign Generic 1 Y Axis, type: float, size: 8, max_size: 16, default_values: [20, 50, 80, 110, 140, 180, 220, 250], help: 'Y-axis channel and breakpoints for generic advance correction 1. Leave it off for a one-dimensional curve.'}
      - {name: igngen2_ign_corr_table, min: -600, max: 600, label: Ign Generic 2 Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: igngen2_x_axis, y_axis: igngen2_y_axis, y_optional: true, x_channel: rpm, y_channel: map, help: 'General-purpose advance correction 2 — see correction 1. The four generic tables are summed with everything else, so they compose rather than override.'}
      - {name: igngen2_x_axis, label: Ign Generic 2 X Axis, type: float, size: 8, max_size: 16, default_values: [500, 1500, 2500, 3500, 4500, 5500, 6500, 8000], help: 'X-axis channel and breakpoints for generic advance correction 2.'}
      - {name: igngen2_y_axis, label: Ign Generic 2 Y Axis, type: float, size: 8, max_size: 16, default_values: [20, 50, 80, 110, 140, 180, 220, 250], help: 'Y-axis channel and breakpoints for generic advance correction 2.'}
      - {name: igngen3_ign_corr_table, min: -600, max: 600, label: Ign Generic 3 Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: igngen3_x_axis, y_axis: igngen3_y_axis, y_optional: true, x_channel: rpm, y_channel: map, help: 'General-purpose advance correction 3 — see correction 1.'}
      - {name: igngen3_x_axis, label: Ign Generic 3 X Axis, type: float, size: 8, max_size: 16, default_values: [500, 1500, 2500, 3500, 4500, 5500, 6500, 8000], help: 'X-axis channel and breakpoints for generic advance correction 3.'}
      - {name: igngen3_y_axis, label: Ign Generic 3 Y Axis, type: float, size: 8, max_size: 16, default_values: [20, 50, 80, 110, 140, 180, 220, 250], help: 'Y-axis channel and breakpoints for generic advance correction 3.'}
      - {name: igngen4_ign_corr_table, min: -600, max: 600, label: Ign Generic 4 Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: igngen4_x_axis, y_axis: igngen4_y_axis, y_optional: true, x_channel: rpm, y_channel: map, help: 'General-purpose advance correction 4 — see correction 1.'}
      - {name: igngen4_x_axis, label: Ign Generic 4 X Axis, type: float, size: 8, max_size: 16, default_values: [500, 1500, 2500, 3500, 4500, 5500, 6500, 8000], help: 'X-axis channel and breakpoints for generic advance correction 4.'}
      - {name: igngen4_y_axis, label: Ign Generic 4 Y Axis, type: float, size: 8, max_size: 16, default_values: [20, 50, 80, 110, 140, 180, 220, 250], help: 'Y-axis channel and breakpoints for generic advance correction 4.'}
      # Ignition gear correction — 3D (load × rpm × gear, 8 gears, Z off until a gear input enables it).
      - {name: gear_ign_corr_table, min: -600, max: 600, label: Ign Gear Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, depth: 8, x_axis: ign_gear_load_axis, y_axis: ign_gear_rpm_axis, z_axis: ign_gear_axis, z_optional: true, x_channel: fuel_load, y_channel: rpm, z_channel: gear, help: 'Advance correction per gear, against RPM and load. It is how timing is pulled in the low gears where the drivetrain, not the engine, is the limit — the same torque that is fine in fourth will break something in first.'}
      - {name: ign_gear_load_axis, label: Ign Gear Load Axis (kPa), units: kPa, type: float, size: 8, max_size: 16, default_values: [20, 50, 80, 110, 140, 180, 220, 250], help: 'Load breakpoints for the per-gear advance correction.'}
      - {name: ign_gear_rpm_axis, label: Ign Gear RPM Axis, units: RPM, type: float, size: 8, max_size: 16, default_values: [500, 1500, 2500, 3500, 4500, 5500, 6500, 8000], help: 'RPM breakpoints for the per-gear advance correction.'}
      - {name: ign_gear_axis, label: Ign Gear Axis, units: '', type: float, size: 8, max_size: 8, default_values: [1, 2, 3, 4, 5, 6, 7, 8], help: 'Gear breakpoints for the per-gear advance correction. Needs a gear signal — from gear detection, CAN or Lua — or the table is read at whatever gear 0 means.'}
      # Ignition post-start correction — decaying advance trim (CLT × run-time), mirroring fuel post-start.
      - {name: post_start_ign_corr_table, min: -600, max: 600, label: Ign Post-Start Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: ips_clt_axis, y_axis: ips_time_axis, y_optional: true, x_channel: clt, y_channel: run_time, help: 'Advance correction just after starting, against coolant and time since start. A just-fired engine wants different timing from a running one — usually retarded, to bring the catalyst up to temperature quickly — and this table both applies that and takes it back out as the seconds pass.'}
      - {name: ips_clt_axis, label: Ign Post-Start CLT Axis (°C), units: 'C', type: float, size: 8, max_size: 16, default_values: [-20, 0, 20, 40, 60, 80, 100, 110], help: 'Coolant breakpoints for the post-start advance correction. A cold start needs far more of it, and for far longer, than a warm restart.'}
      - {name: ips_time_axis, label: Ign Post-Start Time Axis (s), units: 's', type: float, size: 8, max_size: 16, default_values: [0, 2, 4, 6, 10, 15, 22, 30], help: 'Seconds-since-start breakpoints for the post-start advance correction. These decide how long the correction lasts and how abruptly it is withdrawn — end it too sharply and the idle steps as it goes.'}
      # Per-cylinder ignition correction — 12 separate 2D tables (load × rpm), one per cylinder. Additive
      # degrees, applied to each cylinder's spark in the per-cylinder loop. All share the load/rpm axes.
      - {name: cyl1_ign_corr_table, min: -600, max: 600, label: Ign Cylinder 1 Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: ign_cyl_load_axis, y_axis: ign_cyl_rpm_axis, x_channel: fuel_load, y_channel: rpm, help: 'Per-cylinder advance trim for cylinder 1, against RPM and load. Cylinders are not identical — one may run hotter, be fed by a longer runner, or simply knock first — and this is where that one cylinder is given its own timing without compromising the other eleven. Only worth using with evidence: per-cylinder EGT, individual knock, or a wideband on that cylinder.'}
      - {name: cyl2_ign_corr_table, min: -600, max: 600, label: Ign Cylinder 2 Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: ign_cyl_load_axis, y_axis: ign_cyl_rpm_axis, x_channel: fuel_load, y_channel: rpm, help: 'Per-cylinder advance trim for cylinder 2 — see cylinder 1.'}
      - {name: cyl3_ign_corr_table, min: -600, max: 600, label: Ign Cylinder 3 Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: ign_cyl_load_axis, y_axis: ign_cyl_rpm_axis, x_channel: fuel_load, y_channel: rpm, help: 'Per-cylinder advance trim for cylinder 3 — see cylinder 1.'}
      - {name: cyl4_ign_corr_table, min: -600, max: 600, label: Ign Cylinder 4 Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: ign_cyl_load_axis, y_axis: ign_cyl_rpm_axis, x_channel: fuel_load, y_channel: rpm, help: 'Per-cylinder advance trim for cylinder 4 — see cylinder 1.'}
      - {name: cyl5_ign_corr_table, min: -600, max: 600, label: Ign Cylinder 5 Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: ign_cyl_load_axis, y_axis: ign_cyl_rpm_axis, x_channel: fuel_load, y_channel: rpm, help: 'Per-cylinder advance trim for cylinder 5 — see cylinder 1.'}
      - {name: cyl6_ign_corr_table, min: -600, max: 600, label: Ign Cylinder 6 Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: ign_cyl_load_axis, y_axis: ign_cyl_rpm_axis, x_channel: fuel_load, y_channel: rpm, help: 'Per-cylinder advance trim for cylinder 6 — see cylinder 1.'}
      - {name: cyl7_ign_corr_table, min: -600, max: 600, label: Ign Cylinder 7 Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: ign_cyl_load_axis, y_axis: ign_cyl_rpm_axis, x_channel: fuel_load, y_channel: rpm, help: 'Per-cylinder advance trim for cylinder 7 — see cylinder 1.'}
      - {name: cyl8_ign_corr_table, min: -600, max: 600, label: Ign Cylinder 8 Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: ign_cyl_load_axis, y_axis: ign_cyl_rpm_axis, x_channel: fuel_load, y_channel: rpm, help: 'Per-cylinder advance trim for cylinder 8 — see cylinder 1.'}
      - {name: cyl9_ign_corr_table, min: -600, max: 600, label: Ign Cylinder 9 Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: ign_cyl_load_axis, y_axis: ign_cyl_rpm_axis, x_channel: fuel_load, y_channel: rpm, help: 'Per-cylinder advance trim for cylinder 9 — see cylinder 1.'}
      - {name: cyl10_ign_corr_table, min: -600, max: 600, label: Ign Cylinder 10 Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: ign_cyl_load_axis, y_axis: ign_cyl_rpm_axis, x_channel: fuel_load, y_channel: rpm, help: 'Per-cylinder advance trim for cylinder 10 — see cylinder 1.'}
      - {name: cyl11_ign_corr_table, min: -600, max: 600, label: Ign Cylinder 11 Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: ign_cyl_load_axis, y_axis: ign_cyl_rpm_axis, x_channel: fuel_load, y_channel: rpm, help: 'Per-cylinder advance trim for cylinder 11 — see cylinder 1.'}
      - {name: cyl12_ign_corr_table, min: -600, max: 600, label: Ign Cylinder 12 Correction, units: deg, type: int16, scale: 0.1, default: 0, rows: 8, cols: 8, x_axis: ign_cyl_load_axis, y_axis: ign_cyl_rpm_axis, x_channel: fuel_load, y_channel: rpm, help: 'Per-cylinder advance trim for cylinder 12 — see cylinder 1.'}
      - {name: ign_cyl_load_axis, label: Ign Cyl Load Axis (kPa), units: kPa, type: float, size: 8, max_size: 16, default_values: [20, 50, 80, 110, 140, 180, 220, 250], help: 'Load breakpoints shared by every per-cylinder advance trim table.'}
      - {name: ign_cyl_rpm_axis, label: Ign Cyl RPM Axis, units: RPM, type: float, size: 8, max_size: 16, default_values: [500, 1500, 2500, 3500, 4500, 5500, 6500, 8000], help: 'RPM breakpoints shared by every per-cylinder advance trim table.'}
  Can:
    config:
      scalars:
      - name: obd_enabled
        type: uint8
        label: OBD-II Enabled
        units: ''
        scale: 1.0
        min: 0
        max: 1
        default: 1
        help: 'Answer OBD-II diagnostic requests (mode 01 live data, mode 03 stored codes) on the selected bus. This is the standardised scan-tool interface, not the ECU''s own protocol — a generic reader plugged into the car talks to this, and it is independent of any custom CAN frames configured elsewhere.'
      - name: obd_bus
        type: enum
        label: OBD-II Bus
        options:
        - CAN1
        - CAN2
        units: ''
        scale: 1.0
        min: 0
        max: 1
        default: 1
        help: 'Which physical CAN controller answers OBD-II. It defaults to CAN2 so the OBD port can be a separate bus from CAN1, which is typically the tuning/instrument link — a scan tool then cannot see, or interfere with, the traffic on that one.'
      # ---- GENERIC CAN. What this ECU says and hears on its own terms. -----------------------------
      # OBD above is a responder: it speaks when a scan tool asks. Generic CAN is the other half, and
      # it is not a fixed protocol — the frames below ARE the protocol, defined per car in the tune.
      #
      # A frame is an id, a direction and a list of fields; a field is a slice of bits bound to a
      # signal. Transmit builds the frame from the bus on a period. Receive decodes an arriving frame
      # and writes the bus. Nothing downstream learns about CAN: a received value becomes a signal and
      # is then indistinguishable from a sensor, and a transmitted field reads whatever any other
      # module already publishes.
      #
      # Published protocols (a dash's broadcast set, a vehicle interface) are TEMPLATES the studio
      # loads into this pool, not firmware tables — so a frame that turns out to be wrong is a tune
      # edit rather than a firmware release, and adding the next integration is studio data.
      #
      # THE POOLS ARE FLAT AND SHARED. Frames name their own bus and index a run of fields, so a
      # single-bus car can spend the whole pool on one bus and a second bus costs nothing when unused.
      arrays:
      # Per-bus hardware settings. The bitrate used to be a hardcoded 500 kbit in platform_can_init, so a
      # CAN sensor on another rate (1 Mbit, 250 kbit body bus) was simply unreachable and no tune
      # could say otherwise. Listen-only is the mode a bus should run in when it is TAPPING someone else's
      # network: the controller receives everything and never ACKs, so a diagnostic connection cannot
      # disturb the vehicle it is listening to.
      - name: bus
        label: CAN Bus
        count: 2
        element_labels: ["CAN1", "CAN2"]
        element:
        - {name: enabled, type: uint8, label: Bus Enabled, min: 0, max: 1, default: 1, help: 'Bring this bus up at all. A bus that is wired to nothing sits error-passive; switch it off instead.'}
        - {name: bitrate, type: enum, label: Bitrate, default: 2, options: ["125 kbit", "250 kbit", "500 kbit", "1 Mbit"], help: 'Bit rate for this bus. 500 kbit is OBD-II; CAN sensors are commonly 1 Mbit. Every node on a bus must agree — a mismatch never ACKs, which looks exactly like nothing being connected.'}
        - {name: listen_only, type: uint8, label: Listen Only, min: 0, max: 1, default: 0, help: 'Receive without ever transmitting or ACKing (silent mode). For tapping a bus you do not own — the ECU cannot disturb it. Nothing the ECU sends on this bus will go out, OBD replies included.'}
      # ---- The generic CAN frame pool. ------------------------------------------------------------
      - name: gc_frame
        label: Generic CAN Frames
        count: 96
        element:
        - {name: flags, type: uint8, label: Frame Flags, min: 0, max: 255, default: 0, help: 'Bit 0 in use, bit 1 transmit (clear = receive), bit 2 extended (29-bit) id, bit 3 PARKED (kept in the tune, not run). A frame with bit 0 clear is a free slot and is skipped entirely.'}
        - {name: bus, type: enum, label: Bus, default: 0, options: ["CAN1", "CAN2"], help: 'Which physical controller carries this frame. Frames on a bus that is switched off (Bus Enabled) do not run.'}
        - {name: id, type: uint32, label: CAN ID, min: 0, max: 536870911, default: 0, help: 'The identifier. 11-bit ids run to 0x7FF; set the extended flag for a 29-bit id, which is a separate address space — 0x100 standard and 0x100 extended are different frames on the same wire.'}
        - {name: dlc, type: uint8, label: Frame Length, min: 0, max: 8, default: 8, help: 'Payload bytes. Transmit sends exactly this many; a field whose bits fall past the end is dropped rather than scribbling outside the frame. Receive decodes only the fields that fit inside the frame that actually arrived: a field whose bits fall past its end is not decoded, so it goes stale rather than reading as zero.'}
        - {name: period_ms, type: uint16, label: Transmit Period, units: ms, scale: 1.0, min: 0, max: 65535, default: 50, help: 'How often a transmit frame goes out, in milliseconds — 50 is 20 Hz, 10 is 100 Hz. Ignored by a receive frame. Deadlines are spread across the period at start-up, so frames sharing a rate trickle instead of arriving as a burst.'}
        - {name: first_field, type: uint16, label: First Field, min: 0, max: 511, default: 0, help: 'Index of this frame''s first field in the shared field pool. The studio maintains this; it is not meant to be typed.'}
        - {name: field_count, type: uint8, label: Field Count, min: 0, max: 64, default: 0, help: 'How many fields from First Field belong to this frame. The studio maintains this.'}
        - {name: name, type: string, length: 20, label: Frame Name, default: '', help: 'What this frame is for, in your words — "dash gauges", "gear display". Carried so a tune stays readable a year later; the ECU never uses it.'}
      # ---- The generic CAN field pool. ------------------------------------------------------------
      - name: gc_field
        label: Generic CAN Fields
        count: 512
        element:
        - {name: sig, type: uint16, options_from: signals, label: Signal, default: 65535, help: 'The channel this field carries. On a transmit frame it is read from the bus; on a receive frame the decoded value is written to it. Anything on the bus can be either — a sensor, a derived value, a state word. 65535 is UNSET, which on a receive frame is not a dead field but one a SENSOR reads — point the sensor''s CAN Frame and Start Bit at it and the sensor publishes the channel, with its calibration and diagnostics. It cannot be 0: that is a real channel (abs_mode), so a field left alone would publish onto it.'}
        - {name: bit_off, type: uint16, label: Start Bit, min: 0, max: 63, default: 0, help: 'Where the field starts, numbered byte*8 + bit with bit 7 the most significant of its byte — byte 0 bit 7 is 7, byte 1 bit 7 is 15, byte 7 bit 0 is 56. This is the numbering DBC files and every CAN tool use, so a field copied from a document or another tool is the same number here. For a big-endian (Motorola) field this is the field''s MOST significant bit and the field runs down into the next byte; for little-endian (Intel) it is the LEAST significant bit and the field runs up.'}
        - {name: width, type: uint8, label: Bit Length, min: 1, max: 32, default: 8, help: 'How many bits the field occupies. Odd widths are fine — a 1-bit flag, a 12-bit sensor, a 4-bit gear all address the same way.'}
        - {name: flags, type: uint8, label: Field Flags, min: 0, max: 255, default: 0, help: 'Bit 0 signed (the slice is two''s complement, so a negative value survives rather than clamping to zero), bit 1 little-endian/Intel bit order, bit 2 the No Reading code below is in use.'}
        - {name: sentinel, type: uint32, label: No Reading Code, min: 0, max: 4294967295, default: 0, help: 'Receive only, and only when flags bit 2 is set: the RAW code this sender uses to say it has nothing to report — a wideband in free air sends 0x7FFF rather than a lambda. A frame carrying it is ignored for this field, so the value simply stops being refreshed and expires on its Valid For time. That is the difference between "no reading" and a reading of whatever the code happens to decode to, which for a wideband is a plausible and completely wrong mixture.'}
        - {name: scale, type: float, label: Multiplier, min: -1000000, max: 1000000, default: 1.0, help: 'Transmit encodes raw = value * Multiplier + Offset; receive decodes value = (raw - Offset) / Multiplier. Stated once in the transmit direction so the two can never disagree. A spec written as "y = x/10 - 101.3" is a Multiplier of 10 and an Offset of 1013.'}
        - {name: offset, type: float, label: Offset, min: -1000000, max: 1000000, default: 0.0, help: 'The constant half of the transform — see Multiplier. Where two systems disagree about zero this is what says so: Kelvin against Celsius is an offset of 2731.5 with a multiplier of 10.'}
        - {name: ttl_ms, type: uint16, label: Valid For, units: ms, scale: 1.0, min: 0, max: 65535, default: 500, help: 'Receive only: how long a decoded value stays good. If the frame stops arriving the signal expires and everything reading it sees an absent channel rather than a number frozen at whatever it last was. Size it at a few times the sender''s period. 0 means never expire, which is almost never what you want.'}
        - {name: policy, type: enum, label: If Absent, default: 0, options: ["Send zero", "Hold last", "Skip frame"], help: 'Transmit only: what goes in these bits when the signal has nothing to say — the sensor is not fitted, has failed, or nobody holds the role. Send zero writes RAW zero, which through an offset is a visibly broken reading and is the point of it; Hold last leaves the bits alone; Skip frame suppresses the whole frame this cycle, which costs the other fields in it and is the trade you are making when you choose it.'}
        - {name: priority, type: uint8, label: Priority, min: 0, max: 255, default: 10, help: 'Receive only: the authority this value is written with. A write is refused only by a STRICTLY higher priority, so two producers at the same number alternate and neither wins — which is why the default is 10 rather than 0. Sensors publish at 0 and publish even when INVALID, so a failing sensor at 0 would mark a good CAN value invalid; 10 keeps the frame you configured in charge. Lua overrides sit at 200 and still win. Lower this to 0 only to let a local sensor take the channel back.'}
  EngineProtection:
    cadence_hz: 100    # bus+ttl cut chain decouples it — safe to decimate
    requires: [clt, iat, map, battery, lambda_1]
    provides:        # ids -> signals: catalog (the value bus); encoding lives there
    - monitor_flags
    - prot_status
    config:
      scalars:
      - name: sensor_timeout_ms
        type: uint16
        label: Sensor Stale Timeout
        units: ms
        scale: 1.0
        min: 100
        max: 5000
        default: 500
        help: 'How old a signal may be before it is treated as stale. It applies to the protection checks and the threshold monitors: a monitor whose signal has gone quiet is SKIPPED rather than tripped, so a dead sensor does not itself become a cut.'
      - name: clt_warn_c
        type: int16
        label: CLT Warning Threshold
        units: C
        scale: 1.0
        min: 50
        max: 120
        default: 95
        help: 'Coolant temperature that raises a warning. It does not cut — it is the code that appears while there is still time to lift, which is the point of having it separate from the cut threshold.'
      - name: clt_cut_c
        type: int16
        label: CLT Cut Threshold
        units: C
        scale: 1.0
        min: 60
        max: 130
        default: 105
        help: 'Coolant temperature that raises a level 3 fault. Set from what the engine and its cooling system can actually survive, with enough margin below it for the warning to be useful.'
      - name: iat_cut_c
        type: int16
        label: IAT Cut Threshold
        units: C
        scale: 1.0
        min: 30
        max: 100
        default: 65
        help: 'Intake air temperature that raises a level 3 fault. Very hot intake air is a knock risk before it is anything else, so this is a protection against detonation as much as against heat.'
      - name: map_cut_kpa
        type: uint16
        label: Overboost Cut Threshold
        units: kPa
        scale: 1.0
        min: 100
        max: 500
        default: 250
        help: 'Manifold pressure that raises an overboost fault. This is the DTC path — the reaction it causes depends on the protection level configured for its severity. Boost control has its own separate hard cut as a last resort.'
      # battery low/high DETECTION moved to the battery sensor's operating-range check (it raises
      # P0562/P0563 from the sensor pipeline like any sensor) — EngineProtection only PROTECTS.
      # heal_delay_ms deleted with the FaultId state machine — the DTC table heals
      # immediately on the clearing edge (no per-fault heal timer).
      - name: trigger_error_pct_limit
        type: uint16
        label: Trigger Error % Limit
        units: '%'
        scale: 0.1
        min: 0
        max: 1000
        default: 0
        help: 'Noise tolerance for trigger errors, as a percentage of teeth per revolution. 0 — the default — records ANY single tolerated tooth miss, which is the strictest and most informative setting: a miss the decoder rode through must not be silently forgotten. Raising it ignores up to that error rate before recording, which is for a genuinely noisy installation rather than a way to quieten a bad wheel.'
      arrays:
      # The 3-tier reaction policy. A DTC's severity (1/2/3) selects
      # the matching level; the worst ACTIVE severity wins. Each level is a limp
      # profile applied by the control modules via the EngineFrame.
      - name: protection_levels
        label: Protection Levels
        count: 3         # severity 1 (least) .. 3 (most severe)
        element:
        - {name: enabled, type: uint8, label: Enable, default: 0, min: 0, max: 1, options: ["Off", "On"], help: 'Apply this reaction level. The three levels correspond to DTC severities 1, 2 and 3, and the WORST active fault selects which one acts — so a level that is disabled means a fault of that severity is recorded but produces no reaction at all.'}
        - {name: enrich_pct, type: uint8, label: Enrichment, units: '%', default: 0, min: 0, max: 100, help: 'Extra fuel added while this level is active, as a percentage. Enrichment cools the charge and the exhaust, which is the cheapest protection available and costs nothing but fuel.'}
        - {name: boost_corr_pct, type: int8, label: Boost Correction, units: '%', default: 0, min: -100, max: 0, help: 'How much boost is taken away at this level, as a negative percentage of the BOOST — the pressure above atmosphere, so -50 % halves the boost and -100 % leaves none. It can only ever REDUCE — the correction is clamped so a positive or nonsensical value cannot raise boost — which means a protection level can never make things worse here.'}
        - {name: ign_retard_deg, type: uint8, label: Ignition Retard, units: deg, default: 0, min: 0, max: 60, help: 'Timing pulled while this level is active. It reduces cylinder pressure and torque immediately, which is the fastest way to make an engine safe without cutting it. The cost is exhaust heat, so it is not the right tool for an over-temperature fault.'}
        - {name: rev_limit_type, type: enum, label: Rev Limit Type, default: 0, options: ["Ignition", "Fuel"], help: 'Whether this level''s rev limit cuts IGNITION or FUEL. Fuel is kinder to the exhaust when the limit may be held for a long time, which a limp-home limit usually is; ignition recovers faster.'}
        - {name: rev_limit_rpm, type: uint16, label: Rev Limit, units: rpm, default: 0, min: 0, max: 20000, help: 'The RPM ceiling imposed while this level is active — the limp-home limit. 0 means this level imposes none. It is enforced even when the user rev limiter is switched off, so a fault-driven limit cannot be defeated from a tuning screen.'}
        - {name: dtc_condition, type: enum, label: DTC Active Condition, default: 0, options: ["Current", "Stored"], help: 'Whether this level responds to CURRENT faults only, or also to STORED ones. Current means the reaction clears when the fault does. Stored means a fault that has already healed keeps the engine in limp until the codes are cleared — appropriate when the fault indicates damage that healing does not undo.'}
        - {name: auto_reset_s, type: uint16, label: Auto Reset, units: s, default: 0, min: 0, max: 600, help: 'How long after the condition clears before this level releases on its own. A delay stops a marginal fault from flickering the engine in and out of limp mode, which is worse to drive than staying in it. 0 means it does not self-release: the level holds for the rest of the KEY CYCLE, or until the codes are cleared. Switching off and on lets it go, and a fault that is still there simply trips it again — which is how a limp mode behaves on any other ECU. To hold a level across key cycles and restarts, set DTC Active Condition to Stored: that reads the codes on the card, so it trips again at boot and stays until they are cleared.'}
      # fault_actions[] (the per-FaultId action array) was the OLD error path — deleted.
      # Each protection check now raises its P-code into the DTC table with an intrinsic
      # severity (1/2/3); the reactor maps the worst active severity onto protection_levels[].
      - name: threshold_monitors
        label: Threshold Monitors
        count: 8
        element:
      # A `type: expression` field: 64 bytes of BYTECODE for the firmware's stack VM
      # (firmware/Signal/Expr.h), exactly as the sensors' precond_expr is. The studio compiles the
      # source the tuner writes against THIS layout's meta and bakes signal selectors and config
      # offsets into the instructions; the firmware validates each program once per config load and
      # then just runs it.
      #
      # This REPLACES {signal_id, lo_limit_x100, hi_limit_x100}, which could only say "one signal
      # outside a fixed band" — no context, no arithmetic, no combination. The same replacement
      # precond_expr made of its four flat slots, and with the same deal: no migration, because a
      # limit pair cannot be turned into a program that means what its author meant.
      #
      # EMPTY (all-zero, i.e. OP_END) = the slot watches nothing, whatever its action says. An
      # INVALID program is disarmed and raises a config DTC — the opposite of the sensor
      # precondition, and deliberately: there, a broken gate must not switch DETECTION off; here, a
      # broken condition must not be given authority to CUT the engine.
        - name: condition
          type: expression
          length: 64
          label: Condition
          help: "When this is true, the action happens. Reads any bus channel and any config setting, e.g. \"oil_pressure < 100 and rpm > 2000\" — a pressure limit that only applies while the engine is turning, which the old low/high pair could not say. Empty = the slot watches nothing. age(signal) gives the ms since a channel was written, so \"this sensor went quiet\" is itself a condition. A None or stale channel reads as false, so a dead sensor cannot trip a cut."
        - name: action
          type: enum
          label: Action
          options:
          # Quoted, or YAML reads it as the boolean false and the option arrives with no label at all —
          # which is exactly what happened: the monitor's Action list opened with a blank first entry.
          - "Off"
          - Record Only
          - Cut Fuel
          - Cut Ignition
          - Cut Both
          default: 0
          help: 'What happens while the condition holds: nothing, record only, cut fuel, cut ignition, or both. Record-only is worth using first — it proves the condition is right before it is given the authority to stop the engine. There is no debounce: the VM is stateless by design, so a condition true for one frame cuts for one frame, and a noisy signal wants margin rather than a tight limit.'
  Trigger:
    shadow:
      default: true
      when: engine_stop
    provides:        # ids -> signals: catalog (the value bus); encoding lives there
    - rpm
    - synchronized
    - sync_level
    - crank_angle
    - trigger_error_pct
    - trigger_last_error_tooth
    - trigger_last_error_kind
    - vvt_angle_1
    - vvt_angle_2
    - vvt_angle_3
    - vvt_angle_4
    config:
      scalars:
      # THE REFERENCE IS THE FIRST TOOTH AFTER SYNC. What sync IS depends on the stream's primitive:
      #   GAP      — the gap, and on a missing-tooth wheel that is the ONLY event the decoder can
      #              identify, so the reference is the tooth that ends it. That is why the first gap
      #              index must be 0 (enforced by codegen): any other value renames that tooth and
      #              moves the angle origin onto one that cannot be identified at all.
      #   SEQUENCE — the ratio pattern names every event, so it can sync anywhere; its origin is
      #              cell 0 as authored (SequenceMatcher sets angle_ = angle_of(best+1) on lock).
      #   WIDTH    — the reference pulse, which takes the authored target angle.
      #   uniform  — no absolute reference at all: relative lock only, abs_ = false.
      #
      # The post-gap tooth is the conventional origin for a missing-tooth wheel, and for the same
      # reason: it is the only tooth on the wheel that can be identified.
      #
      # Quoted the way every angle in this firmware is quoted: POSITIVE means the reference tooth
      # occurs that many degrees BTDC #1; NEGATIVE means it occurs ATDC. A 2JZ 36-2 is 155.
      #
      # It is a POSITION DECLARATION, not an advance control — turning it up tells the ECU TDC is
      # further away than it thought, so events fire later. The opposite convention (quoting the
      # angle ATDC of the first tooth after the gap) is equally common, so the sense is spelled out
      # here rather than assumed from the field name.
      - name: trigger_offset_btdc
        shadow: false        # read live every frame (EnginePositionHal::service) so a timing light can set it on a running engine
        type: int16
        label: Trigger Offset BTDC
        units: deg
        scale: 0.1
        min: -7200
        max: 7200
        default: 0
        help: 'Crank angle from the trigger''s reference point to TDC #1: POSITIVE means the reference occurs that many degrees BTDC #1, NEGATIVE means ATDC. The reference is the FIRST TOOTH AFTER SYNC — on a missing-tooth wheel that is the tooth ending the gap, the only event the decoder can identify. A 2JZ 36-2 is 155°. This is the ONE place the wheel-to-engine relationship is set — per-cylinder TDC angles are then plain engine angles (cyl 1 = 0).'
      # DISPLAY ONLY — the firmware stores this and never reads it. Where the pickup physically sits,
      # measured from vertical, positive ANTICLOCKWISE — the way it gets described out loud ("105 to
      # the left"), rather than in the clockwise bearings the drawing works in.
      # so the studio can draw the gear the way the user sees it at the front of the engine, and so
      # an offset can be derived from that picture rather than copied from someone else's number.
      #
      # It lives in the CONFIG rather than in the wheel library because the ECU has to be able to
      # describe its own trigger setup: the wheel a given ECU is running may not be in the library at
      # all (authored, imported, or edited in place), and without this the dial cannot be drawn for
      # it. The whole wheel-to-engine relationship the firmware acts on is still trigger_offset_btdc
      # alone — this is the missing piece of the PICTURE, not of the maths.
      #
      #     bearing(D) = -sensor_angle + trigger_offset_btdc + crank_angle - D
      #
      # (D = a tooth's decoder angle, crank_angle = 0 at TDC #1.) A 2JZ's pickup is +105.
      - name: sensor_angle
        shadow: false        # display only: the firmware never reads it
        type: int16
        label: Pickup Angle
        units: deg
        scale: 0.1
        min: -3600
        max: 3600
        default: 0
        help: 'Where the trigger pickup sits: degrees from vertical, positive ANTICLOCKWISE (to the left), seen from the front of the engine. A 2JZ is +105. DISPLAY ONLY — the ECU stores it so the studio can draw its trigger setup as you actually see it, and never acts on it. Timing comes from Trigger Offset BTDC alone.'
      - name: min_full_sync_rpm_x10
        shadow: false        # read live every frame (EnginePositionHal::service)
        type: uint32
        label: Min RPM for Full (PHASE) Sync
        units: RPM
        scale: 0.1
        min: 0
        max: 250000
        default: 0
        help: 'Lower edge of the rpm band in which the phase (cam) stream is trusted to ACQUIRE full sync. Below it the cam is ignored for acquisition — only crank (360°) sync is taken — but an already-locked phase is RETAINED on crank counting as rpm falls (e.g. back to idle). For a VR cam sensor (MAX9924) set ~1500: below that its auto-threshold reset glitches a single cam tooth. 0 with Max also 0 disables the band (phase acquired whenever the cam locks).'
      - name: max_full_sync_rpm_x10
        shadow: false        # read live every frame (EnginePositionHal::service)
        type: uint32
        label: Max RPM for Full (PHASE) Sync
        units: RPM
        scale: 0.1
        min: 0
        max: 250000
        default: 0
        help: 'Upper edge of the phase-acquisition band. Above it the cam stream is ignored for acquisition (retention unaffected). 0 = no upper bound. With both Min and Max 0 the band is disabled.'
      arrays:
      - name: streams
        label: Trigger Streams
        count: 6
        # ONE SLOT PER ROLE, and the index IS the role. There is no `role` field and no count.
        #
        # There are exactly six roles and each binds to exactly one hardware slot (crank_primary,
        # crank_secondary, cam[0..3]), so streams and roles are one-to-one. Carrying the role as a
        # field made it a value that must be unique across the array, and nothing enforced that:
        # two streams claiming Crank Primary silently overwrote each other in the assignment
        # resolver, the same failure a duplicate pin used to have. Indexing by role makes a
        # duplicate unrepresentable rather than merely checked.
        #
        # It also removes position-derived identity. Deriving a stream's role from where it sat in
        # the array could not describe a V engine with phasers on the intakes alone — Cam Intake B1
        # and Cam Intake B2 are slots 2 and 4, never 2 and 3 — and reading such a config off an ECU
        # and writing it back moved a cam to the wrong role.
        element_labels: ["Crank Primary", "Crank Secondary", "Cam Intake B1", "Cam Exhaust B1", "Cam Intake B2", "Cam Exhaust B2"]
        element:
        - name: enabled
          type: uint8
          label: Stream Enabled
          min: 0
          max: 1
          default: 0
          help: 'Whether this role is present on the engine. THE liveness rule — a disabled stream is not bound, not decoded, and holds no pin. Slots are independent: an engine with phasers on both intakes enables Cam Intake B1 and Cam Intake B2 and leaves the exhaust slots off.'
        - name: repeats
          type: uint8
          label: Pattern Repeats / Cycle
          min: 0
          max: 24
          default: 0
          help: 'How many times this stream''s pattern repeats per ENGINE CYCLE; its angular period is cycle/repeats. 0 takes the default from the slot — 2 for a crank slot on a four-stroke, 1 for a cam slot. State it when the wheel is neither: a symmetrical crank pattern that appears twice per revolution is 4, a 12-tooth Honda crank is 24, and a distributor on an ODD-cylinder engine is its cylinder count (5 pulses per cycle is 2.5 per revolution, which no crank-rate wheel can express).'
        - name: capture_index
          type: uint8
          label: Capture Input
          # WHICH PHYSICAL INPUT this stream arrives on, as an index into the board's capture pool.
          # The picker sources its list from the board's TRIGGER_INPUT capability group, so the option
          # index IS the pool index (VR1=0, VR2=1, DIG1=2 …) and nothing maps between them. Without it
          # the field dropped as a spin box and a user had to know that "4" meant DIG3 — every other
          # pin field in the schema has offered names for as long as the picker has existed; this one
          # lost them when the crank/cam inputs were replaced by generic streams and the declaration
          # did not come across.
          # "None" (the 255 sentinel) ahead of the pool: the firmware already reads an index at or past
          # the capture count as naming no pin (AssignmentResolver.cpp, EnginePositionHal.cpp), but the
          # picker offered only real pins — so a stream could be pointed at an input and never pointed
          # away from one again. A list that cannot express the field's own "unassigned" state is a list
          # with a missing option, not a tidier one.
          pickers:
          - {options: trigger_input, label: Capture Input, extra: [{value: 255, label: 'None'}]}
          help: 'WHICH PHYSICAL INPUT this stream arrives on, as an index into the board''s capture pool. The list comes from the board''s own TRIGGER_INPUT capability group, so the name you pick IS the pool index (VR1=0, VR2=1, DIG1=2 …) and nothing maps between them. It says where the signal enters; the stream''s INDEX, not this, says what role it plays.'
          default:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
        - name: edge
          type: enum
          label: Capture Edge
          options:
          - Rising
          - Falling
          - Both
          default: 0
          help: 'Which edge of this input the capture takes. A GAP or SEQUENCE stream counts EVERY event it is handed, so Both doubles the events per tooth and the pattern must then be described in those terms — it is not a way to be more tolerant. WIDTH always measures both edges (it needs the high time) and reads this only as which edge LEADS the pulse: Falling means the pulse is low-going.'
        - name: primitive
          type: enum
          label: Primitive
          options:
          - Gap
          - Sequence
          - Width
          default: 0
          help: 'Which matcher decodes this stream. GAP is a uniform wheel of Base Teeth with zero or more missing-tooth gaps at known positions — it subsumes the even/distributor wheel (no gaps, relative lock only), the single missing tooth, and multi-gap patterns. SEQUENCE is an explicit list of inter-event angles, for a pattern no uniform wheel describes: an odd-fire crank, or a cam''s group of unevenly spaced pulses. WIDTH identifies by PULSE LENGTH — one pulse whose angular width falls inside the WIDTH band anchors the stream, every other pulse is ignored.'
        - name: slots
          type: uint16
          label: Base Teeth (GAP)
          min: 0
          max: 3600
          default: 0
          help: 'GAP only. The BASE tooth count — what the wheel would have if nothing were missing — so a 60-2 is 60 and a 36-1 is 36, NOT 58 and 35. Tooth pitch is the stream''s angular period divided by this. The present-tooth count the decoder actually walks is derived, not entered: slots minus the sum of (Gap Ratio − 1) over every gap.'
        - name: gap_ratio
          type: uint8
          label: Gap Ratio (GAP, missing+1)
          min: 1
          max: 16
          default: 2
          help: 'GAP only. How many tooth pitches ONE gap spans, which is the number of missing teeth plus one: a 36-1 is 2, a 60-2 is 3. 0 is read as 2. It applies to every gap in this stream, so a wheel whose gaps differ in size is not a GAP wheel — describe it as a SEQUENCE.'
        - name: cell_len
          type: uint8
          label: Cell Length (gaps / steps)
          min: 0
          max: 96
          default: 0
          help: 'How many of this stream''s 96 cells are LIVE. What they MEAN depends on the primitive. GAP: each cell is the PRESENT-TOOTH INDEX of the tooth that ENDS one gap (counting only teeth that exist, from 0; the first gap is always 0, because the tooth after it is the reference), so the length is the gap count — the decoder reads at most 8. SEQUENCE: each cell is one INTER-EVENT ANGLE in 0.1° — the step from one event to the next, not an absolute position — so the length is the pattern''s event count, up to all 96. WIDTH uses no cells.'
        - name: window_pct
          type: uint8
          label: Match Window (±)
          units: '%'
          min: 0
          max: 99
          default: 25
          help: 'Match tolerance AT SPEED, as ± percent of one TOOTH PITCH — not of the interval, which is the same thing for a normal tooth and a very different thing at a gap. 50 means a valid tooth lands between half and one and a half pitches of where it was due, which is the same 1.5× that defines a gap, so the acceptance band and the gap rule share one boundary. Tighter rejects a marginal wheel sooner; looser rides through more before it stops trusting the position. 0 is read as 50.'
        - name: window_crank_pct
          type: uint8
          label: Match Window at Cranking (±)
          units: '%'
          min: 0
          max: 99
          default: 75
          help: 'The same tolerance while CRANKING, blended into the running one as the engine picks up. A starter turns an engine unevenly — it slows into every compression and surges over the top — so tooth-to-tooth speed swings hardest exactly where the decoder has the least history to predict from. At 6000 rpm the rotating inertia makes consecutive teeth almost identical and a tight band is free. One number cannot serve both: tight enough to catch a marginal wheel at speed is tight enough to stop the engine ever starting. 0 is read as the running value, which disables the blend.'
        - name: width_min
          type: int16
          units: deg
          scale: 0.1
          label: WIDTH min
          min: 0
          max: 7200
          default: 0
          help: 'WIDTH only. The narrowest pulse, in degrees of stream angle, that counts as THE reference. Width is measured as an ANGLE rather than a time, so one band holds across the rev range. A pulse outside [min, max] is ignored outright — it neither anchors nor breaks an existing lock — so the band wants to be wide enough for real jitter and narrow enough to exclude every other pulse on the wheel.'
        - name: width_max
          type: int16
          units: deg
          scale: 0.1
          label: WIDTH max
          min: 0
          max: 7200
          default: 0
          help: 'WIDTH only. The widest pulse, in degrees of stream angle, that counts as the reference. See WIDTH min: the pair is a band, and anything outside it is discarded rather than treated as a bad match.'
        - name: width_target
          type: int16
          units: deg
          scale: 0.1
          label: WIDTH target angle
          min: 0
          max: 7200
          default: 0
          help: 'WIDTH only. The angle of the reference pulse''s LEADING edge in this stream. The width is only known when the pulse ends, so the ECU anchors at the trailing edge, at this angle plus the measured width. A width match is an ABSOLUTE reference: nothing derives this number, the decoder simply takes it, so it alone positions the stream. Measure it on the engine; a guess here mis-phases everything downstream by exactly its error.'
        - name: nominal_angle
          type: int16
          units: deg
          scale: 0.1
          label: Cam Nominal Angle (VVT)
          min: 0
          max: 7200
          default: 0
          help: 'Cam slots only. The angle this cam''s reference sits at with the phaser HOME (parked on its stop: fully retarded for a typical intake, fully advanced for a typical exhaust). The reported cam angle is how far the cam has moved from here, in degrees of ADVANCE (positive = earlier, negative = retarded), wrapped into ±360°. It is also what the sync-position check measures against, so on a PHASED cam it must be right — see Cam Is Phased.'
        - name: phased
          type: uint8
          label: Cam Is Phased (VVT)
          min: 0
          max: 1
          default: 0
          help: 'Whether a phaser can move this cam relative to the crank. It changes two things and both matter. A phased cam CANNOT ANCHOR a crank that has no unique feature of its own — a phaser is a controlled variable, not a reference — so an even-tooth crank with only a phased cam can never know where it is, and the tune is refused rather than run. And the sync-position check has to allow the phaser its travel: on a fixed cam the reference must land within a tooth of its nominal angle, on a phased one it is expected to move by design, and checking it against a fixed position would drop phase continuously on a perfectly healthy VVT engine.'
        - name: phase_authority
          type: int16
          units: deg
          scale: 0.1
          label: Phaser Authority
          min: 0
          max: 1800
          default: 600
          help: 'How far, in CRANK degrees, the phaser can move this cam away from its nominal (parked) angle. Only read when Cam Is Phased. The sync-position check allows ± this much: a cam found outside it has not been moved by the phaser, it has moved because something mechanical did — a stretched or jumped chain. Set it to the phaser''s real travel; too large blinds the check, too small drops phase at full authority. The band is symmetric on purpose even though a phaser parks at one end, so that a tune does not have to state which direction its cam travels and cannot fault a healthy engine by getting that backwards.'
        - name: phase_allowance
          type: int16
          units: deg
          scale: 0.1
          label: Cam Mechanical Allowance
          min: 0
          max: 1800
          default: 0
          help: 'FIXED cams only (a phased one is bounded by Phaser Authority instead). How far this cam may sit from its nominal angle for mechanical reasons the trigger layer cannot derive — chain stretch, gear lash, torsional wind-up under load. The sync-position check allows the LARGER of this and the decoder''s own measurement floor, so raising it only ever widens the band and 0 (the default) leaves the check exactly as tight as the decoder can measure. It is separate from Phaser Authority because the two bound different things: authority is travel the ECU commands, allowance is slop it does not. Widen it if a healthy engine drops phase under load; do not widen it to silence a fault that appears suddenly, which is what a jumped chain looks like.'
        # PRIVATE, not pooled. These used to be a run inside one shared 48-entry cell_pool, with each
        # stream carrying a cell_off saying where its run began — so two streams could claim the same
        # cells, describe the same wheel, and nothing said so. Only a tuner doing the arithmetic stood
        # between a valid-looking config and that.
        #
        # A pool per stream makes the overlap UNREPRESENTABLE rather than merely discouraged, which is
        # the same argument the role-indexed streams array is built on. cell_off went with it: a private
        # run always starts at 0, so the field had nothing left to say.
        #
        # 96 because that is MAX_PATTERN_TEETH — the most a SEQUENCE can decode. Sized to the cap rather
        # than above it, so there is no cell the studio can write and the decoder will silently ignore;
        # GenericTriggerBuilder static_asserts the two are equal so they cannot drift apart.
        #
        # 96, not 32, because a wheel whose position is encoded in TOOTH WIDTHS needs a cell per EDGE
        # rather than per tooth: an LS1 24x is 48 spans, and nothing says the next such wheel is not
        # bigger. The cost is 2 bytes per cell per stream — 768 bytes of tune and the same again of RAM
        # for the whole increase — which is not worth economising against a silent truncation.
        - name: cell
          type: array
          count: 96
          help: 'This stream''s own cells — its gap positions (GAP) or inter-event angles in 0.1° (SEQUENCE), read from 0 up to Cell Length. Private to the stream: nothing here is shared with another role, so two streams can no longer describe the same wheel by accident. Edited directly only when describing a wheel by hand; the trigger designer writes them for you.'
          element:
          - {name: v, type: int16, label: Cell value, default: 0, min: 0, max: 7200, help: 'One cell of THIS stream''s run, read only while its index is below Cell Length. Its meaning is set by the stream''s primitive: for GAP it is the PRESENT-TOOTH INDEX of the tooth that ENDS one gap, for SEQUENCE it is one INTER-EVENT ANGLE in 0.1° — the step to the next event, not a position. WIDTH reads no cells at all. Cells past Cell Length are ignored, not cleared, so shrinking a pattern leaves the old values in place.'}
  Engine:
    shadow:
      default: true
      when: engine_stop
    config:
      scalars:
      - name: cylinder_count
        type: uint8
        label: Cylinders
        scale: 1.0
        min: 1
        max: 12
        default: 4
        help: 'How many cylinders the engine has. It sizes almost everything downstream — the per-cylinder tables, the trim scopes, the misfire codes — so it is one of the first things to get right and one of the worst to get wrong quietly.'
      - {name: bore_mm, type: uint16, label: Bore, units: mm, scale: 0.1, min: 0, max: 2000, default: 0, help: 'Cylinder bore. Used for the knock band: with Knock Frequency at 0 the band centre is derived from it (900 / (pi x bore/2) kHz — about 6.7 kHz for an 86 mm bore), because the ringing frequency of a knocking cylinder follows its bore. 0 = not entered, and the knock band then sits at a generic 7 kHz.'}
      - name: displacement
        type: uint16
        label: Displacement
        units: cc
        scale: 1.0
        min: 1
        max: 30000
        default: 2000
        help: 'Total engine swept volume. The speed-density air model uses it — per-cylinder swept volume = displacement / cylinders.'
      - name: cycle_type
        type: enum
        label: Engine Cycle
        options:
        - Two-Stroke (360°)
        - Four-Stroke (720°)
        - Rotary (1080°)
        default: 1
        help: 'How many crank degrees one complete engine cycle takes, which is the span every angle in the tune is expressed in. FOUR-STROKE is 720°, TWO-STROKE 360°, ROTARY 1080°. It also sets the default repeat rate for a crank-mounted trigger stream, so changing it moves the trigger decode as well as the scheduling.'
      - name: ign_mode
        type: enum
        label: Ignition Mode
        options:
        - Single Coil (distributor)
        - Wasted Spark
        - Coil-on-Plug
        default: 1
        help: 'How the COILS are wired. The studio lays out the coil outputs from it (IGN1 = cylinder 1 and so on) whenever it changes; the pin pages are where they are then read or changed. WASTED SPARK: each coil output names ONE cylinder and also fires that cylinder''s companion — the cylinder half an engine cycle away, taken from the firing order at run time, so a changed firing order never moves an output. It needs only crank sync. COIL-ON-PLUG needs cam PHASE sync to fire sequentially (before phase it fires companion pairs together). DISTRIBUTOR is one coil for every cylinder. A rotary''s trailing plug comes from the engine cycle, not from here.'
      - name: odd_fire
        type: bool
        label: Odd-Fire Engine
        default: 0
        help: 'Even-fire (0): every cylinder''s TDC is COMPUTED from the firing order — position × cycle / cylinders — and the ECU writes it back into each cylinder''s tdc_angle (studio shows the computed angle greyed out). Odd-fire (1): the engine does NOT fire at even intervals, so each cylinder''s tdc_angle is directly editable instead. Injection mode and squirt count are NOT here — they are per injection stage (see inj_stage).'
      - name: num_inj_stages
        type: uint8
        label: Number of Injection Stages
        units: ''
        scale: 1.0
        min: 1
        max: 4
        default: 1
        help: 'How many injection stages are active. Only inj_stage[0 .. num_inj_stages-1] are built and claimed; higher entries are ignored whatever they hold. Stage 1 is the primary; a second stage is the staged secondary; 3 and 4 are further stages.'
      - name: injector_timing_method
        type: enum
        label: Injector Timing Method
        options:
        - End of Injection
        - Start of Injection
        default: 0
        help: 'What the injection firing angle refers to (injector timing method). END OF INJECTION (default): the angle is where the pulse CLOSES, so the firmware opens the injector a pulse-width of angle earlier so it finishes on the set angle — the fuel lands at a fixed point regardless of how long the pulse is. START OF INJECTION: the angle is where the pulse OPENS, and it closes a pulse-width later. End is the common choice because it keeps the delivered charge''s end point steady as pulse width grows with load.'
      # --- Engine run-state thresholds (drive the STOPPED/CRANKING/RUNNING machine; published as
      #     engine_state). STOPPED means the decoder has no position: rpm 0, asserted when trigger teeth
      #     stop arriving (the lost-trigger watchdog forces sync loss; timeout scales with the wheel's
      #     tooth count, no config needed). Once RUNNING the engine holds RUNNING through any RPM dip
      #     until it actually stops (full hysteresis) — only a real stop re-arms post-start. ---
      - name: cranking_rpm
        type: uint16
        label: Cranking Threshold
        units: RPM
        scale: 1.0
        min: 100
        max: 2000
        default: 400
        help: CRANKING->RUNNING. Above this RPM the engine has caught and is running (anchors post-start).
      # ---- Output gateways ---------------------------------------------------
      # TWO SWITCHES THAT STOP THE ENGINE FIRING, on purpose. Crank with no fuel to check for spark,
      # or with no spark to check fuel delivery and to clear a flooded engine — the two halves of
      # "it will not start" that you otherwise separate by pulling fuses.
      #
      # They join the SAME path every other cut uses (wk::ign_cut / wk::fuel_cut, ORed at the output
      # stage), so nothing new can fire while they are off and a datalog already shows it: the
      # ign_exec_mask / inj_exec_mask channels go to zero, which is what says "the tables asked for
      # something and nothing came out".
      #
      # NOT `enabled`. That name means "this feature module is bundled" everywhere else in this schema;
      # these are operational switches on core engine outputs, which is a different statement.
      #
      # THESE PERSIST. Burn one off and it stays off through a reset, which is the point — you can walk
      # away mid-job — and also the hazard: an engine that cranks and will not start, for a reason that
      # is a checkbox. So each publishes its state as telemetry and the page says what it is doing.
      - name: ign_enable
        type: uint8
        label: Ignition Outputs
        min: 0
        max: 1
        default: 1
        enum: bool_active
        help: 'Off stops every coil firing, the same way a rev limiter''s spark cut does. For cranking with no spark — checking fuel delivery, or clearing a flooded engine. It SURVIVES A RESET, so an engine that cranks and will not start is worth checking here first.'
      - name: inj_enable
        type: uint8
        label: Injector Outputs
        min: 0
        max: 1
        default: 1
        enum: bool_active
        help: 'Off stops every injector opening, the same way an overrun fuel cut does. For cranking with no fuel — checking for spark, or building oil pressure on a fresh engine. It SURVIVES A RESET, so an engine that cranks and will not start is worth checking here first.'
      arrays:
      # THE FIRING ORDER — an array of cylinder numbers indexed by firing POSITION: firing_order[i] is the
      # cylinder that fires i-th (1-based; 0 = position unused). A 6-cylinder firing 1-5-3-6-2-4 is
      # [1,5,3,6,2,4]. Even-fire per-cylinder TDCs are computed FROM it — cylinder firing_order[i] gets
      # TDC = i × cycle / cylinders — into cyl[].tdc_angle; odd-fire uses the stored cyl[].tdc_angle.
      - name: firing_order
        label: Firing Order
        count: 12
        element:
        - name: cyl
          type: uint8
          label: Cylinder
          scale: 1.0
          min: 0
          max: 12
          default: 0
          help: 'The cylinder that fires at this position in the order (1-based); 0 = position unused. THE firing order lives here — a 6-cylinder firing 1-5-3-6-2-4 sets [1,5,3,6,2,4]. Even-fire TDC of cylinder firing_order[i] = i × cycle / cylinders, computed into that cylinder''s tdc_angle.'
      # Per-cylinder data: the bank and (odd-fire) the explicit TDC. Output binding is NOT here: which coil
      # and which injector serve a cylinder is the output row's business (outputs.output[], one row per
      # physical pin: function Ignition / Injector + the cylinder it serves). The STUDIO writes those rows.
      - name: cyl
        label: Per-Cylinder Map
        count: 12
        element:
        - name: bank
          type: uint8
          label: Bank
          scale: 1.0
          min: 1
          max: 2
          default: 1
          help: 'Which cylinder bank (1 or 2) this cylinder is on. A single-bank engine leaves every cylinder on bank 1; per-bank consumers (lambda/O2, knock) read it.'
        # Odd-fire only (engine.odd_fire = 1) is editable. On an even-fire engine the firmware computes this
        # from the firing_order array and writes it here; studio shows the computed value greyed out. Bound
        # at the largest cycle (1080° rotary); the firmware wraps into the configured cycle.
        - name: tdc_angle
          type: int16
          label: TDC Angle
          units: deg
          scale: 0.1            # stored x10 (0.1° resolution); the control shows degrees
          min: 0
          max: 10800            # RAW (deg x10) = 1080°, the longest engine cycle there is (rotary)
          default: 0
          help: 'This cylinder''s compression TDC in the engine cycle, in crank degrees from zero. Ordinary config data. On an EVEN-fire engine the ECU computes it from the firing position (position × cycle / cylinders) and writes it back here on a stopped-engine reconfigure — the studio shows it greyed. On an ODD-fire engine (engine.odd_fire = 1) it is directly editable, because the engine does not fire at even intervals.'
      # INJECTION STAGING. Up to 4 stages, each with its own firing MODE and squirt count; that is the whole
      # of the bank/multi-point/sequential difference (see EventScheduler::build_inj_events). WHICH injectors
      # belong to a stage is not here: an output row with function Injector names its stage and its
      # cylinder, so a stage is exactly the rows that say so. num_outputs is the STUDIO's input for laying
      # those rows out on a grouped stage; the firmware never reads it.
      - name: inj_stage
        label: Injection Stages
        count: 4
        element:
        - name: num_outputs
          type: uint8
          label: '# of Injector Outputs'
          scale: 1.0
          min: 0
          max: 12
          default: 0
          help: 'How many injectors a BANK or MULTI-POINT stage has. The studio lays out that many injector outputs for the stage when this changes (sequential stages always get one per cylinder). Which pins they are, and what each serves, is on the pin pages.'
        - name: mode
          type: enum
          label: Injection Mode
          options:
          - Sequential
          - Semi-Sequential
          - Multi-Point
          - Bank
          - Sequential-Any-Sync
          default: 0
          help: 'How THIS stage fires its own outputs (each stage is scheduled independently on its own mode). SEQUENTIAL: each injector once per cycle at its cylinder''s TDC (needs cam PHASE sync) — the only mode that delivers per-cylinder trim. Until the cam is seen (cranking, a cam fault, below Min RPM for Full (PHASE) Sync) it fires every revolution with half the fuel each time. SEMI-SEQUENTIAL: each twice per cycle (its companion pair fires together), crank sync only. MULTI-POINT: every output together, ''Injections Per Cycle'' times — overall correction only. BANK: outputs grouped by cylinder bank, each bank fired together, ''Injections Per Cycle'' times; a single-bank engine fires them all together. Carries per-bank correction. SEQUENTIAL-ANY-SYNC: once per cycle at A cylinder''s TDC (not necessarily its own), works in any sync.'
        - name: injections_per_cycle
          type: uint8
          label: Injections Per Cycle
          scale: 1.0
          min: 1
          max: 4
          default: 1
          help: 'How many times each injector in this stage fires per engine cycle (the "number of squirts"). Multi-Point and Bank ONLY read it; the sequential modes derive their own (Sequential = 1, Semi-Sequential = once per crank revolution). The fuel calculation divides this stage''s charge by the same count, so raising it splits one cycle''s fuel into more, smaller squirts rather than adding fuel.'
    provides:        # ids -> signals: catalog (the value bus); encoding lives there
    - secl
  Vehicle:
    config:
      scalars:
      - name: Make
        type: string
        label: Make
        units: ''
        scale: 1.0
        min: 0
        max: 255
        default: 0
        length: 32
        help: 'Vehicle manufacturer. Documentation only — nothing in the firmware reads any of these fields. They travel with the tune so a saved file identifies the car it belongs to, which matters as soon as there is more than one.'
      - name: Model
        type: string
        label: Model
        units: ''
        scale: 1.0
        min: 0
        max: 255
        default: 0
        length: 32
        help: 'Vehicle model. Documentation only; see Make.'
      - name: Engine
        type: string
        label: Engine
        units: ''
        scale: 1.0
        min: 0
        max: 255
        default: 0
        length: 32
        help: 'Engine designation — the thing most worth recording, since a tune is far more specific to the engine than to the body it sits in. Documentation only.'
      - name: Notes
        type: string
        label: Notes
        units: ''
        scale: 1.0
        min: 0
        max: 255
        default: 0
        length: 32
        help: 'Free text about this vehicle or tune. Documentation only, and the right place for what a future reader would otherwise have to guess: what was changed, what is known-marginal, what was never tested.'
      - name: VIN
        type: string
        label: VIN
        units: ''
        scale: 1.0
        min: 0
        max: 255
        default: 0
        length: 32
        help: 'Vehicle identification number. Documentation only — it is not checked against anything and does not gate any function.'
      - name: Name
        type: string
        label: Name
        units: ''
        scale: 1.0
        min: 0
        max: 255
        default: 0
        length: 32
        help: 'A short name for this vehicle, for telling saved tunes apart at a glance. Documentation only.'
  Lua:
    provides:        # ids -> signals: catalog (the value bus); encoding lives there
    - lua_gauge_1
    - lua_gauge_2
    - lua_gauge_3
    - lua_gauge_4
    - lua_gauge_5
    - lua_gauge_6
    - lua_gauge_7
    - lua_gauge_8
    # The user Lua script lives here in the config (string field `source`), so it pushes via the
    # normal page-write, burns into the tune, and bakes into the MCU at firmware build. ScriptEngine
    # reads g_config.lua. Edit `source` in Studio on the Lua Scripting page.
    config:
      scalars:
      - {name: enabled, type: uint8, label: Script Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'Run the user script. Off, the script is not executed at all and every signal it would publish simply goes absent — which is the difference between a script that writes 0 and a script that is not there, and the modules downstream treat those as different situations.'}
      - {name: max_exec_us, type: uint16, label: Script Watchdog, units: us, scale: 1.0, min: 0, max: 65000, default: 0, help: 'Abort onTick if it exceeds this WALL-CLOCK budget; 0 = off, which is the default. A script cannot reach the engine to hurt it: Lua runs on its own task at the lowest non-idle priority, below the 1 kHz engine frame and every other producer. Measured on the bench, a script spinning for 8 s and never yielding left rpm, sync and trigger error untouched and cost 9% of comms throughput — so there is nothing here for a watchdog to protect, and a tight limit only aborts legitimate work. Set one if you want a stuck script reported rather than merely slow; size it from lua_exec_us, and allow for preemption, since time spent suspended counts. A script can set its own with setWatchDog(us), which overrides this.'}
      - name: source
        type: string
        label: Lua Script Source
        units: ''
        scale: 1.0
        min: 0
        max: 255
        help: 'The script itself. It lives in the CONFIG, so it travels with the tune and is written like any other setting rather than being flashed — edit it on the Lua Scripting page rather than here, where the raw tree gives no editor and no syntax feedback.'
        length: 4096
        default: |
          -- JayECU user script. Edit it in Studio on the Lua Scripting page; it travels with the tune.
          -- API: rpm() map() tps() clt() iat() lambda() battery()
          --      signalRead("name")  signalWrite("name", value)  -- affect anything by writing its signal
          --      canSend(bus,id,{..})  interp(x,xs,ys)  tickMs()  ecu_print(msg)
          function onTick()
          end

  # Sensors — Tier 3: the mutable per-sensor tune. ONE config row per catalog
  # entry (count_from: sensors → SENSOR_COUNT), index-aligned with SENSOR_CATALOG[]
  # in generated/sensors_catalog.h: config.sensors.sensor[i] configures the named
  # sensor SENSOR_CATALOG[i]. The catalog (Tier 2) is read-only code; this is the
  # tune. See docs/sensors-design.md.
  #
  # First-cut record (flat superset; fields unused by a given type are ignored by
  # the runtime pipeline). Calibration is a 2-point linear raw→units map; the
  # file-loadable breakpoint curve is a later upgrade. Diagnostics carry the four
  # standard checks (raw min/max in mV, operating min/max in engineering units),
  # each gated by `diag_enable` bits with a packed 2-bit severity and a shared
  # persistence delay. Defaults are uniform + safe (disabled, unassigned); per-
  # sensor catalog-seeded defaults (the type's min..max window, DTC presence) come next.
  Sensors:
    config:
      scalars:
      # Crank-angle window (degrees) over which engine-sync sensors (MAP, locked) are averaged in
      # the grid ISR. Group-level — shared by all engine-sync sensors. 360° ≈ 2 intake events on a
      # 4-cyl; set it to N·(720/cylinders) for an N-cylinder window. 0 = sampler default (360°).
      - {name: engine_sync_window_deg, type: uint16, label: Engine-Sync Window (deg), units: deg, scale: 1.0, min: 0, max: 720, default: 360, help: 'The crank-angle window over which engine-synchronous sensors are averaged. It exists for MAP: sampling manifold pressure at an arbitrary moment catches whatever the intake pulse is doing, and the reading swings with RPM rather than with load. Averaging the ADC across a defined window of crank rotation instead gives a figure that means the same thing at every engine speed. Only sensors marked engine-sync use it; everything else is read directly.'}
      arrays:
      - name: sensor
        label: Sensor
        count_from: sensors        # 1 row per named sensor (SENSOR_COUNT) — no hardcode
        element:
        - {name: enabled, type: bool, label: Enabled, options: ["Off", "On"], default: 0, help: 'Run this sensor. Off, its pipeline is not built at all, so it publishes nothing — which is different from publishing zero. Modules that require it will see the signal as absent and take their documented fallback.'}
        # What this sensor MEASURES. For a catalogued sensor the type is fixed and this field is
        # ignored — effective_type() applies the catalog's type, exactly as active_iface() applies
        # the catalog's interface lock. It is live only for a `generic` input, which is an input with
        # no type yet: choosing one here gives it that type's units, precision and range.
        - {name: type, type: uint8, label: Sensor Type, default: 0, options_from: sensor_types, help: 'What this input measures. Only a generic input can set this — every catalogued sensor already knows what it is, and the firmware uses the catalog''s type regardless of what is stored here. Choosing a type gives the input that type''s units, precision and value range, so a generic wired to a pressure sender reads in kPa at 0.1 resolution rather than as a bare number.'}
        - {name: interface, type: uint8, label: Interface, default: 0, options_from: sensor_interfaces, help: 'How this sensor is physically read — analog voltage, engine-synchronous analog, frequency, digital level, SENT, pulse. It selects which pipeline is built for it, and therefore which of the fields below apply: a switch read as a digital level has no calibration curve, a SENT sensor has no analog thresholds. The list offers only the interfaces THIS sensor can be read through, because the catalogue declares them: a flex-fuel sender is a frequency device and nothing else, and a switch is a digital level or a pair of analog trips.'}

        # board resource index (255 = unassigned). One picker per interface over this one byte; the app
        # shows whichever matches the selected interface. `ifaces` are SensorIfaceSel values, which are
        # positions in the sensor_interface list above and NOT a separate numbering:
        # 0 AnalogVoltage, 1 EngineSync, 2 OnBoard, 3 Frequency, 4 Digital, 5 CAN, 6 SENT, 7 PulseWidth.
        # (There has been no "Default" entry since the selector was defaulted per sensor at codegen.)
        # WHICH GENERIC CAN FIELD THIS SENSOR READS — named by the FRAME and the START BIT, which is
        # how a CAN document names it and what the bit grid on the Receive page draws. It used to be the
        # field's index in the 512-deep pool, and that was wrong twice over: nobody can look at 137 and
        # say which field it is, and the studio REPACKS the whole pool on any structural edit, so adding
        # a frame above this one renumbered every later field and silently re-pointed the sensor at
        # somebody else's bits — a valid index decoding to a plausible number, with no code raised.
        # The frame's id is its identity and its name is only a label, so the id is what is stored.
        # Its own two settings rather than another meaning for `source`: that is a board PIN index,
        # int8 because there are about thirty pins, and it is not the same kind of thing.
        - {name: can_frame, type: uint32, label: CAN Frame, default: 0, min: 0, max: 4294967295, help: 'Which generic CAN receive frame carries this sensor, as one number: the bus in bits 30-31, the extended-id flag in bit 29, and the CAN id in the low 29 bits — the same key the firmware matches an arriving frame on. The sensor page picks it by the frame''s name, so this is not meant to be typed. Frames are added and laid out on Configuration > CAN Bus > CANn > Receive.'}
        - {name: can_bit, type: int16, label: Start Bit, default: -1, min: -1, max: 63, help: 'Which field of that frame, named by its Start Bit — the same number the field carries on the Receive page, byte*8 + bit with bit 7 the most significant of its byte. A start bit is stable: inserting a field ahead of this one moves neither the bits nor this reference, which a position in the pool could not promise. -1 = no field named, and a CAN-interface sensor with none publishes nothing. Leave the field''s own Signal unset: the sensor publishes the channel, so the field writing it as well would put two producers on one channel.'}
        - name: source
          type: int8            # board-pin/pool index (only ~30 pins) — int8 with -1 = unassigned
          label: Source
          default: -1
          min: -1
          max: 127
          pickers:
          - {options: sensor_source, ifaces: [0, 1], label: Source}                       # analog AV/AT
          - {suffix: freq, options: sensor_source_digital, ifaces: [3], label: Frequency Input}    # DIG1-8
          - {suffix: digital, options: sensor_source_digital, ifaces: [4], label: Digital Input}    # DIG1-8
          - {suffix: sent, options: sensor_source_digital, ifaces: [6], label: SENT Input}          # DIG1-8
          - {suffix: pulse, options: sensor_source_digital, ifaces: [7], label: Pulse Input}         # DIG1-8
          help: 'Which input the sensor is wired to, chosen from the pool the selected interface can use. The picker changes with the interface for exactly that reason — a frequency sensor''s list is the digital inputs, an analog sensor''s is the analog pool, and there is no mapping between the two numberings.'
        - name: flags                              # one byte, edited as per-bit checkboxes
          type: uint8
          label: Wiring
          default: 0
          help: 'Per-bit wiring options for this input. They describe how the sensor is CONNECTED rather than what it measures, so a bit that does not apply to the selected interface is simply ignored rather than being an error.'
          bits:                                              # lsb 1-4 reserved (removed dead pullup/edge/derivative;
                                                             # lsb 4 was Enforce-SENT-CRC — CRC is now always enforced,
                                                             # trying all J2716/GM variants, so the knob was dropped)
          - {name: invert, lsb: 0, label: Invert Signal, options: ["Normal", "Inverted"],
             help: "Flip the raw level of a SWITCH input, so a grounded-when-active switch reads the same as a pulled-high one. Applies to a switch sensor however it is read — a digital pin, or an analog one against its two trip points; other sensor types ignore it."}
        # Location assignment — for wideband O2 (group o2) and EGT (engine) sensors: what this sensor
      # --- calibration: a 1-D lookup table edited as a curve. The axis (cal_raw) is the raw
      # breakpoints; the value (cal_val) is the engineering reading per breakpoint; cal_n is the live
      # point count (2..16), resizable. A sensor's catalog `default_cal` seeds it at its NATURAL point
      # count (a 2-point linear sensor stores exactly 2 points); the fallback below is a 0..5000 ->
      # 0..10 line. cal_raw must stay ascending over the live points.
        - name: cal
          type: table
          display: curve
          label: Calibration
          points: 16
          axis:  {name: cal_raw, type: uint16, units: ADC, label: Sensor Raw, min: 0, max: 65535}   # ADC counts; client shows counts/mV/V
          value: {name: cal_val, type: int16, type_scaled: true, label: Reading}
          default: [[0, 0], [5000, 1000]]
          help: 'The curve turning this sensor''s raw reading into an engineering value — raw breakpoints on the axis, the reading at each on the value. The sensor type seeds it with its natural shape and point count, so a 2-point linear sensor stores exactly two points. The raw axis must ascend across the live points.'
      # --- conditioning ---
      # NOTE: there is deliberately no `filter_tau_ms` here. A sensor publishes what it measured.
      # Smoothing is the CONSUMER's call, because only the consumer knows whether it is fuelling off
      # the value or closing a 500 Hz position loop around it — and one shared tau cannot serve both.
      # The old default was 50 ms, inherited by every sensor including the ETB's own feedback, and it
      # was the dominant pole in a limit cycle that looked for all the world like a mistuned PID.
        - name: diag_enable                        # one byte, edited as per-check checkboxes
          type: uint8
          label: Checks
          subcat: Diagnostics
          default: 0
          help: 'Which fault checks run on this sensor, one bit each. They fall into two families that are easy to confuse: the RAW pair is an electrical test on the input in millivolts, BEFORE calibration; the READING pair is a plausibility test on the calibrated value, after filtering and only while the preconditions hold. Enable what the wiring can actually distinguish — a check that cannot tell a fault from normal operation is just a source of false codes.'
          # Named for WHAT IS TESTED, not for a presumed cause. The raw pair is an ELECTRICAL test on the
          # input in mV, before calibration; the reading pair is a PLAUSIBILITY test on the calibrated
          # value, after the filter and only while the preconditions hold. "Detect Short-to-GND" read as
          # though it tested for a dead short (adc == 0) when it is really "raw below Diag Raw Min" — which
          # a short causes, but so does an open circuit pulled low or a sensor drifting under its floor.
          bits:
          - {name: raw_min, lsb: 0, label: Detect Raw Low, options: ["Off", "On"],
             help: "Raw input below Raw Low Threshold (default 250 mV), before calibration. Usually a short to ground or an open circuit pulled low."}
          - {name: raw_max, lsb: 1, label: Detect Raw High, options: ["Off", "On"],
             help: "Raw input above Raw High Threshold (default 4750 mV), before calibration. Usually a short to VCC or a disconnected input pulled high."}
          - {name: op_min, lsb: 2, label: Detect Reading Low, options: ["Off", "On"],
             help: "Calibrated reading below Reading Low Threshold, in engineering units. Electrically fine but implausible — only raised while the preconditions hold."}
          - {name: op_max, lsb: 3, label: Detect Reading High, options: ["Off", "On"],
             help: "Calibrated reading above Reading High Threshold, in engineering units. Electrically fine but implausible — only raised while the preconditions hold."}
          - {name: stuck, lsb: 4, label: Detect Stuck, options: ["Off", "On"],
             help: "A switch that never changes state for the stuck delay. Switch sensors only, but whichever way one is read — a digital pin or an analog one against its trip points."}
          - {name: max_deriv, lsb: 5, label: Detect Rate Spike, options: ["Off", "On"],
             help: "Value changing faster than Max Rate of Change (units/s). Needs a sensor type with a derivative stage."}
        - {name: diag_raw_min, type: uint16, units: mV, raw_adc: true, label: "Raw Low Threshold", subcat: Diagnostics, help: "Trip point for Detect Raw Low, before calibration, in the INPUT'S OWN UNITS: pin voltage on a voltage input, Hz on a frequency input, microseconds on a pulse-width input, the sensor's counts on SENT. Not used by the on-board sensors.", default: 250, min: 0, max: 5000}
        - {name: diag_raw_max, type: uint16, units: mV, raw_adc: true, label: "Raw High Threshold", subcat: Diagnostics, help: "Trip point for Detect Raw High, before calibration, in the INPUT'S OWN UNITS: pin voltage on a voltage input, Hz on a frequency input, microseconds on a pulse-width input, the sensor's counts on SENT. Not used by the on-board sensors.", default: 4750, min: 0, max: 5000}
        - {name: diag_op_min, type: int16, label: "Reading Low Threshold", subcat: Diagnostics, help: "Trip point for Detect Reading Low, in engineering units.", type_scaled: true, default: 0}
        - {name: diag_op_max, type: int16, label: "Reading High Threshold", subcat: Diagnostics, help: "Trip point for Detect Reading High, in engineering units.", type_scaled: true, default: 1000}
        - name: diag_severity                      # 2-bit per check, edited as severity dropdowns
          type: uint16
          label: Severity
          subcat: Diagnostics
          default: 0
          help: 'How serious each check''s fault is when it trips, two bits per check. The severity is recorded on the DTC and folded into this sensor''s worst-severity summary, which selects the protection level (Level 1, 2 or 3) that reacts — so this is where a sensor fault is given its level.'
          # How serious each check's fault is when it trips. Recorded on the DTC and folded into the
          # sensor's worst-severity summary, which selects the protection level that reacts.
          bits:
          - {name: raw_min, lsb: 0, width: 2, label: Raw Low Severity, options: ["None", "Level 1", "Level 2", "Level 3"],
            help: "Severity recorded when this check trips, and folded into the sensor's worst-severity summary."}
          - {name: raw_max, lsb: 2, width: 2, label: Raw High Severity, options: ["None", "Level 1", "Level 2", "Level 3"],
            help: "Severity recorded when this check trips, and folded into the sensor's worst-severity summary."}
          - {name: op_min, lsb: 4, width: 2, label: Reading Low Severity, options: ["None", "Level 1", "Level 2", "Level 3"],
            help: "Severity recorded when this check trips, and folded into the sensor's worst-severity summary."}
          - {name: op_max, lsb: 6, width: 2, label: Reading High Severity, options: ["None", "Level 1", "Level 2", "Level 3"],
            help: "Severity recorded when this check trips, and folded into the sensor's worst-severity summary."}
          - {name: stuck, lsb: 8, width: 2, label: Stuck Severity, options: ["None", "Level 1", "Level 2", "Level 3"],
            help: "Severity recorded when this check trips, and folded into the sensor's worst-severity summary."}
          - {name: max_deriv, lsb: 10, width: 2, label: Rate Spike Severity, options: ["None", "Level 1", "Level 2", "Level 3"],
            help: "Severity recorded when this check trips, and folded into the sensor's worst-severity summary."}
        - {name: diag_delay_ms, type: uint16, label: DTC Delay, units: ms, subcat: Diagnostics, default: 250, min: 0, max: 60000, help: 'How long a diagnostic check must trip CONTINUOUSLY before it becomes a fault. It is what separates a real failure from a spike: the timer resets the moment the check passes again, so an intermittent glitch never accumulates. 0 raises the fault on the first bad sample.'}
      # --- switch stuck detection: flag if the debounced state holds longer than this (0=off) ---
        - {name: diag_stuck_ms, type: uint16, label: Stuck Timeout, units: ms, subcat: Diagnostics, default: 0, min: 0, max: 60000, help: 'Switch sensors only, however they are read: how long the input may hold one state before it is called stuck. A switch that never changes is indistinguishable from a working switch nobody pressed, so this is only meaningful for one that is expected to toggle regularly. 0 disables the check.'}
      # --- frequency rate-of-change plausibility: flag if |d(value)/dt| exceeds this (units/s, 0=off) ---
        - {name: diag_max_deriv, type: uint16, label: Max Rate of Change, subcat: Diagnostics, default: 0, min: 0, max: 65535, help: 'The fastest this reading may legitimately change, per second. Anything quicker is not physics but wiring — a connection making and breaking, or an input picking up something it should not. Set it from what the physical quantity can actually do, with margin; too tight and hard transients read as faults. 0 disables the check.'}
      # --- operating-diagnostic precondition (inline, per-sensor) ---
      # The operating-range checks (op_min/op_max) only raise DTCs while this expression holds.
      #
      # A `type: expression` field: 64 bytes of BYTECODE for the firmware's stack VM
      # (firmware/Signal/Expr.h). The studio compiles the source text the tuner writes
      # ("rpm > 2500 and (map > 50 or tps > 80)") against THIS layout's meta, baking signal
      # selectors and config offsets straight into the instructions; the firmware validates
      # the program once per config load and then just runs it.
      #
      # This replaces the four flat {signal,op,combine,value} slots, which folded
      # sum-of-products with no way to group terms — you could write "A AND B OR C" but never
      # "A AND (B OR C)". No migration: old slot values are not carried over (see
      # docs/expression-evaluator-design.md).
      #
      # EMPTY (all-zero, i.e. OP_END) = no preconditions, always armed — the default, and the
      # same meaning the old slot-0-Off had. An INVALID program fails ARMED and raises a config
      # DTC: a broken gate must never silently switch detection off.
        - {name: precond_expr, type: expression, length: 64, label: Precondition, subcat: Diagnostics,
           help: "Expression that must hold for the reading checks (Reading Low/High) to raise a DTC. Empty = always armed. Reads bus channels and config settings, e.g. \"rpm > 2500 and (map > 50 or tps > 80)\". A None or stale channel reads as false, so a dead sensor cannot arm a fault."}
