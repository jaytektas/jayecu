# The OUTPUT EXECUTION MASK, split by channel kind — which coils and which injectors are currently
# allowed to fire. 1 = enabled, 0 = cut. This is the cut itself, not a request for one: every cut
# requester ORs into wk::ign_cut / wk::fuel_cut, and EnginePositionHal::set_output_cuts turns those
# into these bits. Logged because a cut is now invisible in the commanded values -- advance and pulse
# width go on reporting what the tables asked for, which is the point -- so without this there is
# nothing in a datalog saying why the engine went quiet.
# Two signals rather than one 34-bit number: a float carries 24 bits exactly, so 12 and 22 fit and
# their union would not.
- {id: ign_exec_mask, label: "Ign Execution Mask", units: '', scale: 1.0, telem_type: uint16, min: 0.0, max: 4095.0, category: "EngineProtection", bus_type: float, datalog: true, owner: firmware}
# Bit c = cylinder c is cut for pre-ignition. Published by Knock and ACTUATED by EngineTask, which is
# where every other cut is applied too — the module decides, the output stage acts.
- {id: preign_cut_mask, label: "Pre-Ignition Cut Mask", units: '', scale: 1.0, telem_type: uint16, min: 0.0, max: 4095.0, category: "Knock", bus_type: float, datalog: true, owner: firmware}
