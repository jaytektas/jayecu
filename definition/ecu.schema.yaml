# APPENDED, NOT INSERTED. A sensor's config lives at its INDEX in this list, so adding one in the
# middle would move every sensor after it — a tune's coolant settings would land on somebody else's
# sensor. New entries go on the end, always.

# ---------------------------------------------------------------------------
# signals: the first-class channel namespace (the value bus). Each signal exists
# independently of any producer; sensors / CAN decoders / modules / Lua bind to a
# signal id and fill it. AUTO-MATERIALISED from derive_channels (step 1 of the
# signals-first rework) — the authored source of truth from here on.
# ---------------------------------------------------------------------------
- id: clt
  name: Coolant Temperature
  type: temperature
  group: engine
  interfaces:
  - analog_voltage
  dtc:
    raw_min: P0117
    raw_max: P0118
    operating_min: P0116
    operating_max: P0116
- id: iat
  name: Air Temperature
  type: temperature
  group: engine
  interfaces:
  - analog_voltage
  dtc:
    raw_min: P0112
    raw_max: P0113
    operating_min: P0111
    operating_max: P0111

# FOUR WHEEL-SPEED PICKUPS BELONG HERE AND ARE NOT HERE, because the board has no RAM for them. Every
# catalogue row costs 411 bytes of pipeline and config pool whether that sensor is fitted or not, so four
# rows took the image 2184 bytes past its 384K region — and the build before them fitted with 84 bytes to
# spare, so this was not margin spent carelessly. It was already gone.
#
# The MODULE still supports all five sources: wheel_hz_fl..rr are ordinary bus signals, so wheel speeds
# arriving over CAN or written from Lua are converted and published exactly as a local pickup would be.
# What is missing is only the four INPUT rows. Restoring them is four lines, the day the pipeline pool is
# one entry per ENABLED sensor rather than one per catalogue row — which would return about 40 KB.
# THE SWITCHES AN OUTPUT CONDITION NAMES. A template is only as good as the channels it can read, and
# these are the ones the standard conventions need: a push-button start, the air-conditioning request
# that a fan and a compressor clutch both answer to, and four spare switches for whatever a car has
# that this list does not. Declared as ordinary sensors, so each is wired through the same dialog,
# calibrated the same way, and diagnosed the same way as everything else.
- {id: ac_request, name: "Air Conditioner Request", type: switch, group: aircon, interfaces: [digital, analog_voltage, can_device]}
- {id: start_sw, name: "Start Button", type: switch, group: chassis, interfaces: [digital, analog_voltage, can_device]}
- {id: switch_1, name: "Generic Switch 1", type: switch, group: other, interfaces: [digital, analog_voltage, can_device]}
- {id: switch_2, name: "Generic Switch 2", type: switch, group: other, interfaces: [digital, analog_voltage, can_device]}
- {id: switch_3, name: "Generic Switch 3", type: switch, group: other, interfaces: [digital, analog_voltage, can_device]}
- {id: switch_4, name: "Generic Switch 4", type: switch, group: other, interfaces: [digital, analog_voltage, can_device]}
# THE CRUISE CONTROL SWITCH — a stalk or wheel buttons on ONE wire through a resistor ladder, each button
# its own voltage, decoded by the multi-position switch type into a POSITION NUMBER. What each position
# MEANS is not fixed here and deliberately so: it is whatever the cruise module's conditions say about
# it, so `cruise_sw == 2` in Set When makes position 2 the set button on this car and something else on
# the next. Naming the positions for functions would be writing one stalk's wiring down as though it
# were the truth. A catalogue row rather than a generic input set to that type, so the cruise module
# reads one named signal and a user calibrates it by capturing each button, never by pointing cruise at
# "aux 3". Appended, like every row.
- {id: cruise_sw, name: "Cruise Control Switch", type: multi_switch, group: chassis, interfaces: [analog_voltage, can_device]}

