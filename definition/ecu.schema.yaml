# Commanded fuel pulse width (the injection period before the short-PW adder), in ms — the X axis of
# the short-pulse-width adder table.
# Fuel specific gravity, as the model actually used it this cycle. It has been a table since the SD
# fix and it moves with fuel temperature and ethanol, so on a flex car it silently changes every pulse
# width when the blend does — and there was no way to see what the model believed. Published for the
# same reason injector duty is: a number the firmware computes and consumes privately is one nobody
# can check. It is also what converts the fuel flow sensor's MASS to the volume everything else quotes.
