  # Runtime-configurable output bindings — the OUTPUT-side mirror of Sensors. Each slot binds up to 4
  # roled candidate bus signals (primary/limit/override + policy) through arbitrate->encode->emit onto a
  # board output pin (PWM via SoftPwm, or digital GPIO). shadow:{when:live}: a 'w' into this block sets
  # the JAYECU_SHADOW_OUTPUTS bit and OutputManager rebuilds ONLY then — region-scoped, so tuning an
  # unrelated fuel/ignition cell never disturbs a physical output. Pool sized to the board output pins.
  Outputs:
    shadow: {default: true, when: live}
    config:
      arrays:
      # ONE ROW PER PHYSICAL OUTPUT. output[i] IS pin i, in the board's own output order — IGN1..12,
      # LS1..22, HS1..8 on jaytek_v1 — so there is no `pin` field and no way to point two functions at one
      # pin. What the pin does is the row's FUNCTION: a coil, an injector, or a generic output (the
      # conditions / candidates / value source below — a tachometer is one of those, from its template).
      #
      # THE STUDIO ASSIGNS. It lays the coil and injector rows out when a setting that decides them changes
      # (cylinder count, ignition mode, stages, a stage's mode or injector count) and the user may then edit
      # any pin. The firmware fires exactly what the rows say: it allocates nothing and writes nothing back.
      - name: output
        count_from_board: output_pins   # IGNITION_OUT + LOWSIDE_OUT + HIGHSIDE_OUT pins, in that order
                                        # (jaytek_v1: 12 + 22 + 8 = 42). H-bridges are not rows: they are
                                        # a three-pin DMA-driven device owned by the HBridge module.
        count: 42          # fallback used only if no board yaml is found (must equal jaytek_v1's count).
        label: Output
        element:
        - name: function
          applies: engine_stop   # studio: greyed while the engine turns (a coil/injector change waits for the stop)
          type: enum
          label: Function
          options:
          - None
          - Ignition
          - Injector
          - Generic
          default: 0
          help: 'What this pin does. NONE leaves it undriven (high impedance). IGNITION fires a coil for the cylinder below, and only an IGN pin can do it; INJECTOR opens an injector for the cylinder below in its stage, and only an LS pin can. GENERIC is an output driven by its own conditions and value — a fuel pump, a fan, a tachometer. A coil or injector change applies at the next engine stop, like any firing change.'
        # WHICH CYLINDER a coil or injector serves — one value, never a set. A wasted-spark coil names one
        # cylinder and the firmware fires its companion too (the cylinder half a cycle away, from the firing
        # order at run time), so a changed firing order moves no output. ALL is a distributor or a
        # multi-point injector; BANK n is a bank-fired injector. On a rotary the number is the ROTOR.
        - name: cylinder
          applies: engine_stop   # studio: greyed while the engine turns (a coil/injector change waits for the stop)
          type: enum
          label: Cylinder
          options:
          - None
          - Cylinder 1
          - Cylinder 2
          - Cylinder 3
          - Cylinder 4
          - Cylinder 5
          - Cylinder 6
          - Cylinder 7
          - Cylinder 8
          - Cylinder 9
          - Cylinder 10
          - Cylinder 11
          - Cylinder 12
          - All Cylinders
          - Bank 1
          - Bank 2
          default: 0
          help: 'The cylinder this coil or injector serves. On WASTED SPARK a coil names one cylinder and also fires its companion, whichever the firing order makes that. ALL CYLINDERS is a distributor coil, or a multi-point injector. BANK 1 / BANK 2 is an injector shared by every cylinder on that bank. On a rotary the number is the rotor.'
        - name: inj_stage
          applies: engine_stop   # studio: greyed while the engine turns (a coil/injector change waits for the stop)
          type: enum
          label: Injection Stage
          options:
          - Stage 1
          - Stage 2
          - Stage 3
          - Stage 4
          default: 0
          help: 'Which injection stage this injector belongs to: Stage 1 is the primary, Stages 2-4 the staged secondaries — the same stages Fuel Tuning names. The stage''s mode (Fuel System) decides how its injectors fire, and a row in a stage beyond Number of Injection Stages is ignored.'
        - name: ign_plug
          applies: engine_stop   # studio: greyed while the engine turns (a coil/injector change waits for the stop)
          type: enum
          label: Plug
          options:
          - Leading
          - Trailing
          default: 0
          help: 'Rotary only: whether this coil fires the rotor''s leading or trailing plug. A piston engine ignores it.'
        - name: kind
          type: enum
          label: Kind
          options:
          - PWM
          - Digital
          default: 0
          help: 'PWM drives a duty cycle at the configured frequency; DIGITAL drives a plain on/off level. Choose by what is on the other end: a solenoid being modulated wants PWM, a relay or a lamp wants digital, and driving a relay with PWM buzzes it.'
        - {name: active_high, type: uint8, label: Active High, default: 1, help: 'Which electrical level means ON — for every function, a coil (ON = dwell) and an injector (ON = open) included. Active-high asserts by driving the pin high; active-low asserts by pulling it low, which is what a load wired to +12V through a low-side driver needs. Getting it backwards inverts the output — the actuator is then energised whenever it should be idle, including at reset.'}
        - {name: pwm_freq_hz, type: uint16, label: PWM Frequency, units: Hz, default: 250, help: 'Carrier frequency for a PWM output. It is set by the load, not by preference: a solenoid wants a frequency low enough to move but high enough not to buzz, a heater wants low, and a valve driven too fast simply sees an average and stops responding at all.'}
        - name: primary_policy
          type: enum
          label: Primary Policy
          options:
          - First
          - Average
          - Minimum
          - Maximum
          default: 0
          help: 'How to combine several valid PRIMARY candidates into one value. FIRST takes the first valid one in order and is the plain choice. AVG blends them. MIN and MAX take an extreme — MIN being the conservative one, since it lets any contributing module hold the output down. It has no effect when only one primary is ever valid.'
        - {name: n_cand, type: uint8, label: Candidate Count, default: 0, help: 'How many of the four candidate slots are in use. Candidates are read in order, and their ROLES compose a fixed precedence: primaries make the request, limits clamp it down, and the first valid override replaces everything. That is what separates a plain knob from a knob a safety limiter can cap and an override can veto.'}
        # 4 roled arbitration candidates {sig, role} — read as a RoledCandidate[] by the OutputManager.
        - name: cand
          type: array
          count: 4
          help: 'Up to four candidate signals feeding this output, each with a ROLE. The roles compose a fixed precedence rather than a list of alternatives: PRIMARY signals make the request (combined by the primary policy), LIMIT signals clamp the result DOWN to the lowest of them, and the first valid OVERRIDE replaces everything. That is what makes an output a request a safety limiter can cap and an override can veto, rather than a value one module owns outright. A candidate whose signal is not valid is skipped, and if none are valid the failsafe is emitted.'
          element:
          - {name: sig,  type: uint16, label: Signal, default: 255, help: 'The bus signal this candidate contributes. 255 leaves the slot unused. A candidate whose signal is not valid right now is skipped entirely rather than treated as zero — which is the difference between a module that has nothing to say and a module asking for nothing.'}
          - name: role
            type: enum
            label: Role
            options:
            - Primary
            - Limit
            - Override
            default: 0
            help: 'How this candidate participates. PRIMARY makes the request — several primaries are combined by the output''s primary policy. LIMIT clamps the result DOWN, and the lowest valid limit wins, so any module may hold the output back but none can push it up. OVERRIDE vetoes: the first valid one replaces everything above it. The precedence is fixed (primary, then limit, then override), so the role alone decides authority — order in the list does not.'
        # Encode the SHAPING terms as scaled ints. Not for alignment — that reason was checked and is
        # false: GCC knows a #pragma pack(1) member is unaligned and routes a packed float through an
        # unaligned integer ldr plus a vmov, never a VLDR, and the M7 does unaligned ldr in hardware
        # (nothing here sets SCB->CCR.UNALIGN_TRP). These stay integers because a scale in thousandths
        # and an offset in tenths are exact in an integer and approximate in a float, and because
        # OutputManager reads them in C++ where the divide is free.
        # OutputManager converts: scale = scale_x1000/1000, the rest /10. Covers 0..100% duty + headroom.
        - {name: scale_x1000, type: uint16, label: Scale (x1000), default: 1000, help: 'Multiplier applied to the arbitrated engineering value on its way to the actuator command, expressed in thousandths (1000 = ×1). With the offset it is the unit conversion between what the module means and what the hardware takes.'}
        - {name: offset_x10, type: int16, label: Offset (x10), default: 0, help: 'Constant added after scaling, in tenths. Together with the scale it maps an engineering range onto an actuator range — the pair is a straight line, so two known points are enough to determine both.'}
        - {name: clamp_lo_x10, type: int16, label: Clamp Lo (x10), default: 0, help: 'Lower bound on the final command, in tenths, applied after scale and offset. It is the actuator''s own limit, not a control decision: a valve that must never be commanded fully shut is held off its stop here rather than trusting every producer upstream to remember.'}
        - {name: clamp_hi_x10, type: int16, label: Clamp Hi (x10), default: 1000, help: 'Upper bound on the final command, in tenths. Same purpose as the low clamp — the last defence, past every module, that the hardware is never asked for more than it can take.'}
        - {name: failsafe_x10, type: int16, label: Failsafe (x10), default: 0, help: 'The command emitted when NO candidate signal is valid, in tenths — a dead bus, a crashed producer, a module that never started. Arbitration always emits something rather than nothing, and this is that something, so the choice matters: it is the state the actuator is driven to when the software has stopped having an opinion.'}
        # ---- WHEN this output is on ---------------------------------------------------------------
        # An output used to be a VALUE and nothing else: candidates arbitrated, scaled, emitted. That
        # covers a solenoid being modulated and covers nothing that is simply on or off at the right
        # moment — a fuel pump, a thermo fan, a starter, a main relay. Those are the majority of what a
        # car's outputs do, and they were unreachable without writing Lua.
        #
        # So a slot carries a CONDITION. Two of them, in fact, because "on when" and "off when" are how
        # hysteresis is written honestly: a fan is `clt > 95` on and `clt < 90` off, and that is the
        # whole of it. The expression VM (Signal/Expr.h) is deliberately pure — no timers, no latches —
        # so the STATE belongs here, on the slot: minimum on and off times, a maximum on time with a
        # re-arm delay (a starter motor must not be cranked forever), and what to do when the question
        # cannot be answered at all.
        - {name: on_expr, type: expression, length: 64, label: Turn On When, help: 'The condition that turns this output ON. Empty means the slot is driven by its candidate value alone, exactly as before. Reads any bus channel and any config setting: "clt > 95" for a fan, "uptime_s < 3 or age(trigger_teeth) < 1500" for a fuel pump (prime, then run while the wheel turns).'}
        - {name: off_expr, type: expression, length: 64, label: Turn Off When, help: 'The condition that turns it OFF again. Empty means "when Turn On When stops being true", which is right for a plain switch; a separate condition is how hysteresis is written — on above 95, off below 90 — and it is the difference between a fan that settles and one that chatters at the threshold.'}
        # ---- HOW MUCH, and HOW FAST ---------------------------------------------------------------
        # An output is three questions, not one: is it ON (the conditions above), how much (duty), and
        # at what carrier (frequency). The first is a yes/no from an expression; the other two are
        # NUMBERS, and a number is either computed or looked up — so each takes an expression or a
        # table, and says which.
        #
        # The expression VM is the same one the conditions use, read for its VALUE rather than its
        # truth: "clt * 2 - 100" is a fan ramp, "map / 2" a proportional bleed. A table is the answer
        # when the shape is not arithmetic — a pump against demand, a solenoid against temperature.
        - {name: duty_expr, type: expression, length: 48, label: Duty Expression, help: 'The commanded value, computed. Used when Value From is EXPRESSION; the number the program returns IS the duty (before scale, offset and the clamps). A program that cannot be answered leaves the output at its failsafe, exactly as a dead candidate does.'}
        - name: freq_source
          type: enum
          label: Frequency From
          options:
          - Fixed
          - Table
          - Expression
          default: 0
          help: 'Where the PWM carrier comes from. FIXED is the frequency below and is what almost every load wants. TABLE and EXPRESSION exist because some do not: a stepper-style valve swept over its range, a horn or buzzer whose pitch is the output, an injector-style solenoid whose carrier follows engine speed. Digital outputs ignore this entirely.'
        - {name: freq_expr, type: expression, length: 48, label: Frequency Expression, help: 'The carrier frequency in Hz, computed. Used when Frequency From is EXPRESSION. Clamped to the same 1..50000 Hz the fixed setting allows, so an expression cannot ask for a carrier the timer cannot make.'}
        - {name: min_on_ms, type: uint16, label: Minimum On Time, units: ms, scale: 1.0, min: 0, max: 65535, default: 0, help: 'Once on, stay on at least this long whatever the conditions say. A relay that chatters is a relay that welds, and a compressor or a pump wants a floor under its cycle time.'}
        - {name: min_off_ms, type: uint16, label: Minimum Off Time, units: ms, scale: 1.0, min: 0, max: 65535, default: 0, help: 'Once off, stay off at least this long before it may come on again. The other half of anti-chatter, and on an air-conditioning compressor it is a hardware requirement rather than a nicety.'}
        - {name: max_on_ms, type: uint16, label: Maximum On Time, units: ms, scale: 1.0, min: 0, max: 65535, default: 0, help: 'A hard limit on how long it may stay on in one go; 0 = no limit. This is what makes a starter output safe: cranking is bounded, and the output releases whatever the button says. After it trips, the Re-Arm Delay must pass before it can run again.'}
        - {name: rearm_ms, type: uint16, label: Re-Arm Delay, units: ms, scale: 1.0, min: 0, max: 65535, default: 0, help: 'How long the slot is locked out after the maximum on time trips. For a starter it is the motor cooling down; for anything else it is a rate limit on a condition that keeps asking.'}
        - name: on_invalid
          type: enum
          label: If Unanswerable
          options:
          - 'Off'
          - 'On'
          - Hold
          default: 0
          help: 'What to do when the condition cannot be evaluated — a channel it names is dead, absent or never assigned. The right answer is not the same for every load, which is why it is a setting: a cooling fan should fail ON, a starter and a fuel pump must fail OFF, and something that is merely inconvenient can HOLD its last state. A condition that cannot be answered is not the same as one that answered no.'
        # ---- HOW MUCH, when it is on ---------------------------------------------------------------
        # A slot's value came from candidate SIGNALS and nothing else, which is right for a solenoid
        # some module is already commanding and useless for the loads a car actually PWMs: a
        # variable-speed fan, a PWM fuel pump, a speed-sensitive steering pump. There was nothing to
        # interpolate — you could say WHEN, never HOW HARD, and Lua was the only way round it.
        #
        # So the value has a SOURCE. Candidates is what every existing slot does and stays the
        # default; Table interpolates this slot's own duty map; Fixed is a constant, which is most of
        # what a pump wants. The gate is unchanged and orthogonal: the condition decides when, the
        # source decides how much, and neither knows about the other.
        - name: value_source
          type: enum
          label: Value From
          options:
          - Candidates
          - Table
          - Fixed
          - Expression
          default: 0
          help: 'Where the commanded value comes from while the slot is on. CANDIDATES arbitrates the bus signals below, which is what a slot driven by a module wants. TABLE interpolates this slot''s own duty map against the two channels you point its axes at — a fan against coolant, a steering pump against road speed, a fuel pump against demand. FIXED is a constant, which is what most relays and many pumps actually need. EXPRESSION computes it: the duty expression''s NUMBER is the command, so a duty can be arithmetic over any channels rather than a surface somebody has to draw.'
        - {name: fixed_x10, type: int16, label: Fixed Value, units: '%', scale: 0.1, min: -1000, max: 2000, default: 1000, help: 'The constant commanded while the slot is on, when the value source is Fixed. 100% is full on — for a digital output anything above the switching threshold is simply "on", so the default suits a relay as it stands.'}
        # THE DUTY MAP. Both axes are channel-selectable per slot (the axis carries its own source and
        # its own live bin count), so the same table shape serves a fan on coolant, a pump on fuel
        # demand and a steering pump on road speed without a table each.
        # 8 x 4, not 16 x 8: forty-two slots each carry a map, so every cell costs 42 times its own size
        # in a RAM the tune image already takes a third of. Eight breakpoints along the main axis is a
        # real curve — the fan and pump maps this exists for are gentle — and the second axis is a
        # MODIFIER, optional and usually unused, for which four is generous.
        # THE CARRIER, as a surface. Its own axes rather than the duty map's: they are different
        # questions (how much, how fast) and a slot that wants a frequency table rarely wants its duty
        # on the same two channels. 8 x 4, the same shape and for the same reason as the duty map.
        # WHICH TABLE, rather than a table of its own. Forty-two slots each carrying a private duty
        # map and a private carrier map cost ten kilobytes of a full RAM region to say something two
        # slots ever disagree about — and a fan and a pump that want the SAME shape had to have it
        # typed in twice, then kept in step by hand. A slot now names a table out of the ones the ECU
        # already has: the generic pool (GenericTables — eight maps that exist for exactly this), or
        # any table in the tune. The id is the expression VM's own table id, so "the table this output
        # reads" and "the table an expression reads" are one namespace with one registry behind it.
        - {name: duty_table_sel, type: int16, control: table, label: Duty Table, default: -1, min: -1, max: 32767, help: 'Which table this output reads for its commanded value, when Value From is TABLE. The generic tables exist for this; any other table in the tune may be named too, and it is read at its OWN axes. Unset — or a table that is not there — leaves the slot at its failsafe, exactly as a dead candidate does.'}
        - {name: freq_table_sel, type: int16, control: table, label: Frequency Table, default: -1, min: -1, max: 32767, help: 'Which table gives the PWM carrier in Hz, when Frequency From is TABLE. Read at its own axes and clamped to what the pulse engine can make; unanswerable falls back to the fixed frequency rather than stopping the output.'}

        # THE TEMPLATE'S PARAMETERS. A template writes conditions that REFERENCE these rather than
        # baking numbers into the program: "uptime_s < [#…param_a]" instead of "uptime_s < 3". Two
        # reasons, and the second is the one that matters. Every fuel pump then compiles to the SAME
        # bytecode whatever its prime time, so the studio still recognises the template after the
        # numbers have been changed — and after a tune has been round-tripped through an ECU, where
        # only bytecode comes back. And the wizard has somewhere to put an answer: it edits these,
        # with the labels and units the template supplies, while the condition stays what it is.
        #
        # Generic on purpose. What param_a MEANS is the template's business, and the page says so.
        #
        # FLOATS, IN ENGINEERING UNITS, so a condition reads one with no conversion at all. They were
        # int32 in thousandths, and the compiler therefore appended `* 0.001` after every read — which
        # the bytecode could not encode: OP_PUSH_F holds an i32 of HUNDREDTHS, so 0.001 became the
        # literal 0 and every template condition multiplied its parameter by nothing. A fuel pump's
        # "uptime_s < prime_s" was "uptime_s < 0", false for ever, and no fault was raised anywhere
        # because a multiply by zero is a perfectly good program. A wider literal (OP_PUSH_F32) fixes
        # the encoding; storing the number the template actually means removes the conversion instead.
        # Four bytes either way, and nothing in C++ reads these — the expression VM is the only reader.
        - {name: param_a, type: float, label: Parameter A, units: '', scale: 1.0, min: -2000000, max: 2000000, default: 0, digits: 3, help: 'The first number the slot''s template asks for — prime seconds, a fan''s switch-on temperature, a starter''s crank limit. What it means is written on the wizard that set it; the condition reads it by name.'}
        - {name: param_b, type: float, label: Parameter B, units: '', scale: 1.0, min: -2000000, max: 2000000, default: 0, digits: 3, help: 'The second number the slot''s template asks for.'}
        - {name: param_c, type: float, label: Parameter C, units: '', scale: 1.0, min: -2000000, max: 2000000, default: 0, digits: 3, help: 'The third number the slot''s template asks for.'}
        - {name: param_d, type: float, label: Parameter D, units: '', scale: 1.0, min: -2000000, max: 2000000, default: 0, digits: 3, help: 'The fourth number the slot''s template asks for.'}
        # (No template id is stored. The studio recognises a template by comparing the COMPILED
        #  programs against what the template would write, so a slot cannot claim to be a fuel pump
        #  while holding somebody else's conditions — a stored id could, and would be believed.)
        - {name: name, type: string, length: 16, label: Name, help: 'What this output IS, in your words — "Left Fan", "Pump A", "Starter". A pin name says where it is wired, not what is on the end of it, and the name travels to the pages, the datalog and the fault text.'}
      scalars: []
  # ---------------------------------------------------------------------------------------------
  # THE GENERIC TABLES. Eight maps that belong to nobody and can be pointed at by anything.
  #
  # Every other table in this ECU is owned by the module that reads it: the VE map is the fuel
  # calculator's, the boost target is the boost controller's, and each says what its cells MEAN. That
  # covers everything the firmware does on its own and nothing a tuner invents — a fan ramp against
  # coolant, a buzzer's pitch against engine speed, a bleed valve against demand. Those wanted a table
  # with no opinion, and the only way to get one was to give every output slot its own private map
  # whether it used it or not.
  #
  # So: a pool. Each carries a NAME (the pickers show it), two selectable axes and a live shape, and
  # nothing else — no units, no scale, no meaning. Meaning arrives when something points at it. They
  # are module tables like any other, so they are in the expression VM's registry and an expression can
  # read one by name too.
  GenericTables:
    config:
      scalars:
