# Set speed minus road speed. Published as a CHANNEL because the three gain curves index it: a table
# axis reads its coordinate off the bus, so the error has to BE on the bus before they are evaluated.
- {id: cruise_error_kph, label: "Cruise Speed Error", units: 'km/h', scale: 0.1, telem_type: int16, min: -400.0, max: 400.0, category: "Actuators", bus_type: float, datalog: true, owner: firmware}
