      - {name: stage3_ethanol_pct, type: uint8, label: Stage 3 Ethanol %, units: '%', scale: 1.0, min: 0, max: 100, default: 0, help: 'Flex Fuel OFF: the ethanol content of stage 3''s fuel, used all the time (0 petrol, 85 E85). Flex Fuel ON: what to fuel for until the sensor has given one good reading since power-up — after that a dropout holds the LAST GOOD reading, because the tank does not change mid-drive. Set it to what the car normally runs: a dead sensor read as 0 % fuels an ethanol engine as petrol, about a third lean.'}
      - {name: stage3_stoich_x10, type: uint16, label: Stage 3 Stoich AFR, units: '', scale: 0.1, min: 10, max: 300, digits: 1, default: 147, help: 'The stoichiometric ratio of stage 3''s BASE fuel — the fuel at 0 % ethanol. 14.7 for petrol; 6.4 for methanol, which is set here with Ethanol % at 0.'}
      - {name: stage3_stoich_ethanol_x10, type: uint16, label: Stage 3 Stoich AFR (Ethanol), units: '', scale: 0.1, min: 10, max: 300, digits: 1, default: 90, help: 'The stoichiometric ratio of pure ethanol, around 9.0. Stage 3''s working ratio is blended between its base fuel and this by its ethanol content.'}
      - {name: stage3_film_enabled, type: uint8, label: Stage 3 Port Film, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'Stage 3''s fuel wets the intake port, so the fuel film model tracks a film for it (when Fuel Film is on). Turn it off for a DIRECT-injected stage: its fuel goes straight into the cylinder and never touches a port wall.'}
      - {name: stage4_flex_enabled, type: uint8, label: Stage 4 Flex Fuel, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Stage 4''s ethanol content is MEASURED by a flex sensor (its Ethanol Source). Off, the stage runs a fixed blend: its Ethanol % is used as-is, and its fuel-composition correction is not applied. Stages sharing one fuel system can point at the same sensor.'}
      - {name: stage4_ethanol_src, type: uint8, label: Stage 4 Ethanol Source, units: '', scale: 1.0, min: 0, max: 254, default: ethanol, help: 'Which signal reports stage 4''s ethanol content, when Flex Fuel is on. Several stages may use the same sensor.'}
      - {name: stage4_ethanol_pct, type: uint8, label: Stage 4 Ethanol %, units: '%', scale: 1.0, min: 0, max: 100, default: 0, help: 'Flex Fuel OFF: the ethanol content of stage 4''s fuel, used all the time (0 petrol, 85 E85). Flex Fuel ON: what to fuel for until the sensor has given one good reading since power-up — after that a dropout holds the LAST GOOD reading, because the tank does not change mid-drive. Set it to what the car normally runs: a dead sensor read as 0 % fuels an ethanol engine as petrol, about a third lean.'}
      - {name: stage4_stoich_x10, type: uint16, label: Stage 4 Stoich AFR, units: '', scale: 0.1, min: 10, max: 300, digits: 1, default: 147, help: 'The stoichiometric ratio of stage 4''s BASE fuel — the fuel at 0 % ethanol. 14.7 for petrol; 6.4 for methanol, which is set here with Ethanol % at 0.'}
      - {name: stage4_stoich_ethanol_x10, type: uint16, label: Stage 4 Stoich AFR (Ethanol), units: '', scale: 0.1, min: 10, max: 300, digits: 1, default: 90, help: 'The stoichiometric ratio of pure ethanol, around 9.0. Stage 4''s working ratio is blended between its base fuel and this by its ethanol content.'}
      - {name: stage4_film_enabled, type: uint8, label: Stage 4 Port Film, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'Stage 4''s fuel wets the intake port, so the fuel film model tracks a film for it (when Fuel Film is on). Turn it off for a DIRECT-injected stage: its fuel goes straight into the cylinder and never touches a port wall.'}
      # ATMOSPHERE, WHICH MAY OR MAY NOT BE MEASURED. Alpha-N has no manifold reading to take charge
      # density from and used a hardcoded 101.3 kPa; the barometric correction table indexes on baro and
      # read nothing at all when no sensor published it. Both want the same number, and it has one home
      # here: the sensor while it is live, the stated assumption otherwise. A car that never sees an
      # altitude change needs no baro sensor and should not be made to have one.
      - {name: baro_src, type: uint8, label: Barometric Source, units: '', scale: 1.0, min: 0, max: 254, default: baro_kpa, help: 'Which signal reports barometric pressure. Leave it set even if no sensor is fitted — when the channel is not being published the Assumed Barometric Pressure below stands in, and the fuelling is identical to what it was before either existed.'}
      - {name: baro_assumed_kpa, type: uint16, label: Assumed Barometric Pressure, units: kPa, scale: 0.1, min: 500, max: 1100, digits: 1, default: 1013, help: 'What to assume atmosphere is when no barometric sensor is publishing. 101.3 kPa is sea level. An engine that lives at altitude and has no baro sensor should say so here rather than be fuelled for a coast it is not on.'}
      # Acceleration enrichment moved to its own 1 kHz AccelEnrich module (E-2d) — it needs a fast,
      # un-windowed source, which the per-cycle FuelCalculator can't give it. FuelCalc still composes
      # fuel_corr_accel from the bus; it just no longer produces it.
      # --- Stage F: model-selectable air estimation (one air_mass, different sources) ---
      # 0 = Speed Density (VE vs MAP, MAP density) · 1 = Alpha-N (VE vs TPS, baro density)
      # · 2 = MAF (measured mass airflow / induction events; VE+density bypassed).
      - name: fuel_model
        type: enum
        label: Air Model
        options:
        - Speed-Density
        - Alpha-N
        - MAF
        - Blend
        units: ''
        scale: 1.0
        min: 0
        max: 3
        default: 0
        help: 'How the air entering each cylinder is estimated, which is the foundation everything else corrects. SPEED-DENSITY computes it from MAP, temperature and the VE table — accurate, and it needs a good VE map. ALPHA-N uses throttle position instead, for engines whose manifold signal is too noisy to use (individual throttle bodies, big cams). MAF measures airflow directly. BLEND is the individual-throttle answer: two maps — the Alpha-N VE table (RPM x throttle) down low and the VE table on measured MAP up top — with their air masses crossfaded between Blend Start and End RPM, so each range is tuned on its own cells. Point Target Lambda and the Ignition map at Charge Load for Blend (the studio offers to).'
      - {name: maf_src, type: uint8, label: MAF Source Signal, units: '', scale: 1.0, min: 0, max: 254, default: maf, help: 'Which signal reports mass airflow, used only by the MAF model.'}
      # Blend air model (fuel_model=3) = TWO MAPS, crossfaded by RPM (the clean ITB path). Below
      # blend_rpm_lo the Alpha-N VE table (rpm x TPS, air at baro) carries the charge — the MAP signal is
      # no use on ITBs down low; above blend_rpm_hi the VE table on measured MAP does; linear between.
      # The AIR MASSES are mixed, not the VE numbers (they rest on different densities), and each range
      # has its own cells, so low-RPM tuning never moves the MAP-indexed cells up top. It used to feed ONE
      # VE table a MAP estimated from the Predicted MAP table — a transient table — which coupled the two.
      - {name: blend_rpm_lo, type: uint16, label: Blend Crossover Start RPM, units: RPM, scale: 1.0, min: 0, max: 20000, default: 2000, help: 'Where the Blend model starts crossfading from the Alpha-N VE map toward the VE map on measured MAP. Below it the charge comes entirely from throttle — the alpha-N region, where an ITB manifold signal is unusable.'}
      - {name: blend_rpm_hi, type: uint16, label: Blend Crossover End RPM, units: RPM, scale: 1.0, min: 0, max: 20000, default: 4000, help: 'Where the crossfade completes and the charge comes entirely from the VE map on measured MAP. Above it the engine is pure speed-density. The gap between this and the start RPM is the blend region, and it wants to span the range where the manifold signal becomes trustworthy rather than being a sharp switch.'}
      # Wall-film (X-τ) transient model — the physical alternative to the TransientThrottle heuristic
      # (run ONE or the other). A fraction X of injected fuel wets the port wall (the "film"); the
      # film evaporates into the cylinder with time constant τ. The compensation injects extra to
      # fill the film on tip-in and less on tip-out (the film gives it back). Disabled by default.
      - {name: map_predict_enabled, type: uint8, label: MAP Prediction Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'While the throttle is moving fast, take manifold pressure from the predicted table rather than the sensor, which is necessarily averaged over a cylinder period and therefore late. Meant to be used WITH the wall-film model and INSTEAD of transient throttle: this one fixes the measurement, the film model fixes the fuel.'}
      - {name: map_predict_hold_ms, type: uint16, label: Predicted MAP Time, units: ms, scale: 1.0, min: 0, max: 2000, default: 200, help: 'How long prediction stays in effect after the throttle movement that triggered it. Too short and it lets go before the real sensor has caught up, which is the lean hole it exists to fill; a long or shared MAP hose wants more. 200 ms suits a typical install.'}
      - {name: map_predict_tipout, type: uint8, label: Predict Tip-Out, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Also predict when the throttle CLOSES quickly: the estimate moves down towards Predicted MAP, taking the LOWER of the two, the same way a tip-in takes the higher. Off, a lift is left to the sensor. Opt in once the Predicted MAP table is tuned at part throttle — an untuned table predicting down makes a lean spike on every lift.'}
      - {name: wallfilm_enabled, type: uint8, label: Fuel Film Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Model the fuel film on the port walls explicitly, rather than correcting for it with transient tables. A fraction of every injection wets the wall and evaporates later, so the fuel delivered and the fuel that arrives are different during any change — this computes the difference from first principles and injects what is actually needed. At steady state it corrects nothing; on a tip-in it over-injects to fill the film, on a tip-out it under-injects because the film gives fuel back. It is only modelled while RUNNING: during cranking the port is dominated by priming rather than these dynamics.'}
      # Prime pulse: a ONE-SHOT simultaneous injector squirt fired once on the first crank/sync after power-up
      # (the STOPPED->CRANKING edge). prime_mode picks how the prime_fuel_table cell is read.
      # FLOOD CLEAR. Hold the throttle wide open while cranking and the ECU stops injecting, so the
      # engine pumps out a flooded cylinder instead of being given more fuel to drown in. It is a
      # deliberate operator action — nothing else asks for wide-open throttle at cranking speed — and it
      # cuts through the same wk::fuel_cut every other cut requester uses, so the prime pulse and the
      # cranking enrichment both stop with it.
      #
      # Off by default: a feature that can stop an engine starting has to be asked for, and a throttle
      # sensor reading high for its own reasons would otherwise turn into a no-start with no explanation.
      - {name: flood_clear_enabled, type: uint8, label: Flood Clear Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Cut fuel while cranking with the throttle held open, to clear a flooded engine. Spark is left alone: the engine turns over and pumps the excess fuel out of the cylinders. It only acts while CRANKING and only above the throttle threshold below, so it cannot cut a running engine, and it needs a valid throttle reading — an absent or failed TPS never triggers it.'}
      - {name: flood_clear_tps_pct, type: uint8, label: Flood Clear Above TPS, units: '%', scale: 1.0, min: 0, max: 100, default: 90, help: 'How far the throttle must be open, while cranking, before fuel is cut. High enough that it cannot be reached by accident: at 90% only a deliberately floored pedal gets there, and a fast-idle or sticking throttle does not.'}
      - {name: prime_enable, type: uint8, label: Prime Pulse Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 0, help: 'Inject once, on every injector together, on the FIRST CRANK — the moment the trigger syncs — to wet the ports of a cold engine. Not at key-on: a prime at key-on is wasted on an engine that is not then cranked, and floods one that is keyed on and off. Once per power-up. It is the difference between an engine that catches on the first compression stroke and one that spins for a couple of seconds.'}
      - name: prime_mode
        type: enum
        label: Prime Mode
        options:
        - Injection Time (ms)
        - VE (%)
        units: ''
        scale: 1.0
        min: 0
        max: 1
        default: 0
        help: 'How to read the prime table''s cells. INJECTION TIME is a literal pulse width in milliseconds — direct and injector-specific. VE PERCENT expresses it as a fraction of a full-VE charge instead, so the prime scales with the engine and injectors rather than needing retuning when either changes.'
      # Overall fuel correction — a single global % trim (not a table) → fuel_corr_overall.
      - {name: overall_corr_pct, type: int16, label: Overall Fuel Correction, units: '%', scale: 0.1, min: -1000, max: 3000, default: 0, help: 'A single global multiplier on all delivered fuel, in percent. The right tool for a whole-map offset — a fuel that differs from what was tuned, or injectors that flow slightly off their rating — and the wrong tool for anything that varies with operating point. Because it applies everywhere, it also hides map errors rather than fixing them.'}

      # PER-CORRECTION ENABLES. Every correction is a table that multiplies the fuel mass, and "off" used
      # to mean "a table tuned to 0%" — which is not the same statement: a neutral table still costs an
      # evaluation every cycle, it still reads its axis channels, and a page showing 1.000 cannot tell you
      # whether that is a deliberate neutral or a correction nobody set up. Each flag SHORT-CIRCUITS its
      # branch: the table is not evaluated, and its signal is published as exactly 1.000 so the aggregate
      # and the telemetry agree.
      #
      # All default ON, which is what every existing tune already does — a flag that defaulted off would
      # silently disable a correction somebody had tuned, the moment their tune was loaded into firmware
      # that has these fields and their tune file does not.
      - {name: enable_warmup, type: uint8, label: Warmup (Coolant) Correction Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'The warmup enrichment table (coolant, and optionally load) is evaluated and applied. Off, the correction is a flat 1.000 and its table is not read at all — which is the difference between "tuned to do nothing" and "not in the calculation": a neutral table still costs an evaluation, and still hides a mis-set axis behind a zero.'}
      - {name: enable_cranking, type: uint8, label: Cranking Correction Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'The cranking enrichment table is evaluated while the engine is cranking. Off, cranking gets the base fuel calculation with no enrichment at all, which almost no engine starts on — this is here to be turned off deliberately while chasing a flooding problem, not as a tuning step.'}
      - {name: enable_poststart, type: uint8, label: Post-Start Correction Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'The post-start enrichment table (coolant x run time) is applied for the seconds after the engine catches. Off, fuelling steps straight from cranking to the running calculation.'}
      - {name: enable_iat, type: uint8, label: Air Temp Correction Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'The intake-air-temperature correction table is evaluated and applied. Note this is a TRIM on top of the charge-temperature model, which already accounts for air density — turning it off does not make the ECU ignore air temperature.'}
      - {name: enable_revlimit, type: uint8, label: Rev Limiter Correction Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'The enrichment that comes in as the rev limiter is approached is evaluated and applied. It softens the cut and cools the chambers; off, the limiter cuts against the plain fuel calculation.'}
      - {name: enable_baro, type: uint8, label: Barometric Correction Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'The barometric correction table is evaluated and applied. Only meaningful with a baro source assigned.'}
      - {name: enable_gear, type: uint8, label: Gear Correction Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'The per-gear fuelling table is evaluated and applied. Only meaningful with gear detection running.'}
      - {name: enable_generic1, type: uint8, label: Generic 1 Correction Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'The first spare correction table is evaluated and applied. A spare does nothing until its axes are pointed at channels that matter, so leaving it on with a neutral table costs an evaluation and nothing else.'}
      - {name: enable_generic2, type: uint8, label: Generic 2 Correction Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'The second spare correction table is evaluated and applied.'}
      - {name: enable_generic3, type: uint8, label: Generic 3 Correction Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'The third spare correction table is evaluated and applied.'}
      - {name: enable_generic4, type: uint8, label: Generic 4 Correction Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'The fourth spare correction table is evaluated and applied.'}
      - {name: enable_overall, type: uint8, label: Overall Correction Enabled, units: '', scale: 1.0, min: 0, max: 1, default: 1, help: 'The single global fuel multiplier above is applied. Off, it is ignored entirely rather than set to zero — so a global offset can be taken out and put back without losing the number that was in it.'}
      # Staged injection: how many stages + each stage's Staging Duty Cycle live in engine.inj_stage[]
      # (the firmware fills the stages sequentially by their duty caps — see FuelCalculator). The stage-2
      # injector tables (flow/dead-time/short-pulse/angle) are below; stages 3-4 currently share them.
      # Per-cylinder / per-bank correction is no longer stage-selected here: each injection stage's own
      # mode decides what it can deliver (Sequential → per-cyl, Bank → per-bank, else overall).
      tables:
      # FUEL SPECIFIC GRAVITY, PER STAGE (density relative to water = g/cc = mg/µl) — converts the fuel
      # MASS a stage delivers into the VOLUME its injectors' flow (cc/min) is quoted in. Default a 1x1
      # constant 0.740 (98 RON premium unleaded). Each stage's fuel is its own, so each has its own table:
      # X = fuel temperature (point it at that stage's fuel-temperature signal — a flex sensor reports its
      # line's), Y = that stage's ethanol content. E85 ~0.785, methanol ~0.792.
      - {name: stage1_specific_gravity_table, label: Stage 1 Fuel Specific Gravity, units: '', type: uint16, scale: 0.001, min: 500, max: 2000, rows: 1, cols: 1, x_axis: stage1_sg_temp_axis, y_axis: stage1_sg_eth_axis, x_optional: true, y_optional: true, x_channel: fuel_temp, y_channel: stage1_ethanol, default: 740, help: 'The density of stage 1''s fuel against its temperature and ethanol content. Injector flow is quoted by VOLUME but the engine needs a MASS of fuel; this converts between them, so it keeps the fuelling right as the fuel warms in the rail or the blend changes. Point the X axis at the temperature of THIS stage''s fuel.'}
      - {name: stage1_sg_temp_axis, label: Stage 1 Fuel SG Temp Axis, units: °C, type: float, size: 1, max_size: 8, default_values: [20], help: 'Fuel temperature breakpoints for stage 1''s specific gravity table.'}
      - {name: stage1_sg_eth_axis, label: Stage 1 Fuel SG Ethanol Axis, units: '%', type: float, size: 1, max_size: 8, default_values: [0], help: 'Ethanol content breakpoints for stage 1''s specific gravity table. Ethanol is appreciably denser than petrol, so a flex stage needs this axis for the mass conversion to follow the blend.'}
      - {name: stage2_specific_gravity_table, label: Stage 2 Fuel Specific Gravity, units: '', type: uint16, scale: 0.001, min: 500, max: 2000, rows: 1, cols: 1, x_axis: stage2_sg_temp_axis, y_axis: stage2_sg_eth_axis, x_optional: true, y_optional: true, x_channel: fuel_temp, y_channel: stage2_ethanol, default: 740, help: 'The density of stage 2''s fuel against its temperature and ethanol content. Injector flow is quoted by VOLUME but the engine needs a MASS of fuel; this converts between them, so it keeps the fuelling right as the fuel warms in the rail or the blend changes. Point the X axis at the temperature of THIS stage''s fuel.'}
      - {name: stage2_sg_temp_axis, label: Stage 2 Fuel SG Temp Axis, units: °C, type: float, size: 1, max_size: 8, default_values: [20], help: 'Fuel temperature breakpoints for stage 2''s specific gravity table.'}
      - {name: stage2_sg_eth_axis, label: Stage 2 Fuel SG Ethanol Axis, units: '%', type: float, size: 1, max_size: 8, default_values: [0], help: 'Ethanol content breakpoints for stage 2''s specific gravity table. Ethanol is appreciably denser than petrol, so a flex stage needs this axis for the mass conversion to follow the blend.'}
      - {name: stage3_specific_gravity_table, label: Stage 3 Fuel Specific Gravity, units: '', type: uint16, scale: 0.001, min: 500, max: 2000, rows: 1, cols: 1, x_axis: stage3_sg_temp_axis, y_axis: stage3_sg_eth_axis, x_optional: true, y_optional: true, x_channel: fuel_temp, y_channel: stage3_ethanol, default: 740, help: 'The density of stage 3''s fuel against its temperature and ethanol content. Injector flow is quoted by VOLUME but the engine needs a MASS of fuel; this converts between them, so it keeps the fuelling right as the fuel warms in the rail or the blend changes. Point the X axis at the temperature of THIS stage''s fuel.'}
      - {name: stage3_sg_temp_axis, label: Stage 3 Fuel SG Temp Axis, units: °C, type: float, size: 1, max_size: 8, default_values: [20], help: 'Fuel temperature breakpoints for stage 3''s specific gravity table.'}
      - {name: stage3_sg_eth_axis, label: Stage 3 Fuel SG Ethanol Axis, units: '%', type: float, size: 1, max_size: 8, default_values: [0], help: 'Ethanol content breakpoints for stage 3''s specific gravity table. Ethanol is appreciably denser than petrol, so a flex stage needs this axis for the mass conversion to follow the blend.'}
      - {name: stage4_specific_gravity_table, label: Stage 4 Fuel Specific Gravity, units: '', type: uint16, scale: 0.001, min: 500, max: 2000, rows: 1, cols: 1, x_axis: stage4_sg_temp_axis, y_axis: stage4_sg_eth_axis, x_optional: true, y_optional: true, x_channel: fuel_temp, y_channel: stage4_ethanol, default: 740, help: 'The density of stage 4''s fuel against its temperature and ethanol content. Injector flow is quoted by VOLUME but the engine needs a MASS of fuel; this converts between them, so it keeps the fuelling right as the fuel warms in the rail or the blend changes. Point the X axis at the temperature of THIS stage''s fuel.'}
      - {name: stage4_sg_temp_axis, label: Stage 4 Fuel SG Temp Axis, units: °C, type: float, size: 1, max_size: 8, default_values: [20], help: 'Fuel temperature breakpoints for stage 4''s specific gravity table.'}
      - {name: stage4_sg_eth_axis, label: Stage 4 Fuel SG Ethanol Axis, units: '%', type: float, size: 1, max_size: 8, default_values: [0], help: 'Ethanol content breakpoints for stage 4''s specific gravity table. Ethanol is appreciably denser than petrol, so a flex stage needs this axis for the mass conversion to follow the blend.'}
      # Each base table OWNS its axes (no sharing) so resizing/editing one never touches another.
      # Main fuel/lambda axes resize to 32; flex-composition Z axes cap at 4.
      - name: ve_table
        min: 0
        max: 2000            # VE% x10 -> 200.0% ceiling (was 255 = 25.5%, below the physical range + the default cells)
        label: VE Table
        units: '%'
        type: uint16
        scale: 0.1            # x.x resolution (cell stores VE% x10)
        # Default surface = a representative 2JZ Base Fuel (VE) tune.
