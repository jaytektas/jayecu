# TIME AND ROTATION, for the conditions that drive outputs. A fuel pump primes for a few seconds at
# key-on and then runs while the engine turns — both halves of that need a fact nothing published:
# how long the ECU has been awake, and whether the trigger wheel is moving RIGHT NOW.
#
# trigger_teeth is a COUNT, published only when it changes, so `age(trigger_teeth)` is milliseconds
# since the last tooth — the standard "the engine is turning" test, and it answers before the decoder
# has synced, which is the whole point: the pump should be running before the first spark.
- {id: cpu_load_pct, label: "MCU Load", units: '%', scale: 1.0, telem_type: uint8, min: 0.0, max: 100.0, category: "Engine", bus_type: float, datalog: true, owner: firmware, gauge: {min: 0, max: 100, hi_warn: 80, hi_bad: 95}}   # 100 - the idle task's share of the last second
