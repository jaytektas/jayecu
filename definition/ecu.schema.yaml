- {id: ign_advance_trim, label: "Ign Advance Trim", units: 'deg', scale: 0.1, telem_type: int16, min: -30.0, max: 30.0, category: "Ignition", bus_type: float, datalog: true, owner: firmware}  # summed SLOW advance corrections (clt/iat/gear/gen/post-start), computed off the per-cycle path by IgnitionTrim and read by Ignition
# WHERE THE TIMING CAME FROM. ign_advance_trim is the SUM of nine slow corrections, which answers
# "how much" and never "which one" — and a tuner watching a number move needs the term, not the total.
# The fuel side has published its corrections individually since it was written (fuel_corr_*); these are
# the ignition equivalents, so a diagnostics page can read base -> each correction -> final and the
# attribution is the firmware's own arithmetic rather than the studio guessing at it.
- {id: ign_base_adv, label: "Ign Base Advance", units: 'deg', scale: 0.1, telem_type: int16, min: -30.0, max: 70.0, category: "Ignition", bus_type: float, datalog: true, owner: firmware}
# WHICH base the advance came from. A conditional base table REPLACES the map rather than correcting
# it, so a breakdown that always names the map would be reading the wrong row out loud the whole time
# the engine was cranking. One channel, so the page can say which.
# MANIFOLD PRESSURE, AS THE FUEL MODEL SEES IT. `map` is the sensor's own channel and stays that;
# map_est is the ECU's ESTIMATE, which is the sensor's value except while prediction is standing in for
# it. Separate channels because they are separate claims: one is a measurement, the other is what the
# calculation used, and a page that cannot show both cannot show prediction working.
- {id: map_est, label: "Manifold Pressure (est)", units: 'kPa', scale: 0.1, telem_type: uint16, min: 0.0, max: 600.0, category: "FuelCalculator", bus_type: float, datalog: true, owner: firmware}
