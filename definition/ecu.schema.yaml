# owner: firmware because the FUEL CALCULATOR now names this id — it publishes the tuner's stated
# assumption here whenever no barometric sensor is publishing, so the baro correction table (which
# indexes on this channel and read an absent one as nothing) and the Alpha-N density reference agree
# about what atmosphere is. A live sensor always wins; this only fills a silence.
