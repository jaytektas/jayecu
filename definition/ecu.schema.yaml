# ---------------------------------------------------------------------------
# trigger_wheels — the SHIPPED wheel library.
#
# Reference data, not code: these describe how to fill trigger.streams[], which is schema-defined
# config, so they belong beside it and travel to the studio in the meta like every other resolved
# fact. They used to be a hardcoded seedWheels() list inside the studio binary, which meant the
# library a studio offered depended on which build happened to be running rather than on what the
# connected firmware can decode.
#
# Angles are DECIDEGREES. gap: `slots` base teeth, `ratio` spans per gap (ratio-1 teeth missing,
# 0 = an EVEN wheel with no gaps), `gaps` the tooth indices. seq: inter-event angles summing to the
# stream period (3600 crank-rate, 7200 cam-rate). width: a reference pulse window.

# ---------------------------------------------------------------------------
# pc_vars: HOST VARIABLES the shipped dashboard binds to (paths "pc.<name>").
#
# Values the studio keeps and the ECU never sees: a page's view chooser, the bench test's count and
# timings, the argument a command takes. They are part of what this firmware's pages need, exactly
# like a channel or a setting, so they are declared here and ride in the meta (key "pcVars") — the
# one file that always reaches the studio, whether it came off the SD card, the library or the
# installer. They have no ECU storage, so they do not touch the layout_hash.
#
# A user can add more of their own in the studio's dictionary; those live in the project's
# pcvars.json side-car. These are read-only there.
#
# Fields: name, label, units, min, max, default (optional), kind (enum) + options.
# Option lists for diag_view and knock_noise_cyl must match the pages that use them
# (tools/layout/diag_pages.py VIEWS, knock_pages.py CYLS); apply_workspaces checks it.
# ---------------------------------------------------------------------------
pc_vars:
- {"name": "diag_view", "label": "Diagnostics View", "units": "", "min": 0.0, "max": 10.0, "kind": "enum", "options": ["Engine & Trigger", "Fuel", "Spark", "Air & Throttle", "Outputs & Bridges", "Sensors — Raw", "Sensors — Engine", "Vehicle & Traction", "Sensors — Vehicle", "Protection & Faults", "CAN Bus"]}
- {"name": "test_count", "label": "Test Count", "units": "", "min": 1.0, "max": 100000.0, "default": 3.0}
- {"name": "test_on_ms", "label": "Test On Time", "units": "ms", "min": 1.0, "max": 10000.0, "default": 4.0}
- {"name": "test_off_ms", "label": "Test Off Time", "units": "ms", "min": 0.0, "max": 60000.0, "default": 500.0}
- {"name": "knock_noise_cyl", "label": "Noise Floor Cylinder", "units": "", "min": 0.0, "max": 11.0, "kind": "enum", "options": ["Cyl 1", "Cyl 2", "Cyl 3", "Cyl 4", "Cyl 5", "Cyl 6", "Cyl 7", "Cyl 8", "Cyl 9", "Cyl 10", "Cyl 11", "Cyl 12"]}
- {"name": "etb_autotune_rule", "label": "Autotune Rule", "units": "", "min": 0.0, "max": 4.0, "kind": "enum", "options": ["Tyreus-Luyben  (robust, low overshoot)", "Ziegler-Nichols classic", "ZN no-overshoot", "ZN some-overshoot", "Pessen integral rule"]}

# ---------------------------------------------------------------------------
# datalog_templates: WHICH CHANNELS a recording carries, as data.
#
# Choosing channels one at a time is a job nobody wants to do twice, and the useful sets are not
# personal — a fuel session wants the same columns on any engine. So the conventions ship here and
# arrive in the meta, which means the studio offers the sets the CONNECTED firmware actually has
# rather than a list compiled into the app (the same reason output_templates works this way).
#
# A template names `categories` (every channel in them) and `signals` (individual additions), unioned.
# Categories are the signal catalog's own `category:` values, so a template written once keeps working
# as channels are added to a category — which is the property a hand-listed set does not have.
#
# `all: true` means every channel and ignores the lists. Nothing here EXCLUDES: a template is a
# starting selection the tuner edits, not a restriction, and the studio's picker is what edits it.
# ---------------------------------------------------------------------------
datalog_templates:
- id: standard
  name: Standard
  rate_hz: 10
  blurb: 'What the definition marks worth logging: every sensor reading, plus the control outputs.'
  detail: 'The default, and the right answer when you do not yet know what you are looking for. It leaves out the raw hardware channels (ADC counts and input frequencies), which describe the wiring rather than the engine.'
  use_datalog_flag: true

- id: everything
  name: Everything
  rate_hz: 10
  blurb: 'Every channel the ECU publishes, raw hardware included.'
  detail: 'The widest possible log and the largest. Worth it when chasing something you cannot name yet — a raw input channel is how you tell a dead sensor from a dead wire — and worth changing away from once you can.'
  all: true

# HIGH-RATE DIAGNOSTIC SETS. Small on purpose, and every channel in them is published by a module on
# the control frame — so they genuinely resolve at 1 kHz rather than recording the same sensor reading
# a hundred times. That distinction is the whole point: a sensor is decimated to its type's cadence
# (coolant 5 Hz, lambda 20, pressure 100, throttle 200) and logging faster does NOT speed it up,
# because forcing acquisition to follow the logger would change the system being measured and could
# hide the very fault being hunted. So these sets carry what is already fast, and nothing else.
#
# Each is around thirty to forty bytes a record, which is 30-40 KB/s at 1 kHz — a tenth of what the
# card was measured to take, so the rate is real and not aspirational.
- id: fast_trigger
  name: Trigger and Sync (1 kHz)
  rate_hz: 1000
  blurb: 'Crank and cam decode at full frame rate — for sync faults, tooth errors and jitter.'
  detail: 'The set for "it cuts out and nothing in the log explains it". Every channel here is decoder state, published on the control frame, so a 1 kHz log resolves single-tooth events. Carries the error KIND and the tooth it happened on, because a sync loss with no tooth number is a symptom without a location.'
  signals: [rpm, crank_angle, sync_level, synchronized, trigger_teeth, trigger_error_pct,
            trigger_last_error_kind, trigger_last_error_tooth, per_cycle_count,
            vvt_angle_1, vvt_angle_2, advance, dwell, ign_cut, fuel_cut]

- id: fast_throttle
  name: Throttle and Pedal (1 kHz)
  rate_hz: 1000
  blurb: 'Both pedal tracks, both throttle tracks, the motor and the supervisor.'
  detail: 'Drive-by-wire settles in tens of milliseconds, so anything slower than this is looking at the aftermath. Both redundant tracks and the PID integrator, because the redundancy IS the safety case and a single-track log cannot show which sensor disagreed. Throttle is also the one sensor already claimed to 1 kHz — by transient enrichment — so it resolves here for real.'
  signals: [rpm, app_1, app_2, tps, tps_2, pedal_demand, throttle_demand, app_state,
            etb_target_1, etb_position_1, etb_duty_1, etb_iterm_1, etb_state_1,
            traction_cap, transient_active, tt_load_rate, ign_corr_transient]

- id: fast_combustion
  name: Knock and Misfire (1 kHz)
  rate_hz: 1000
  blurb: 'Per-event knock and misfire against the timing that caused them.'
  detail: 'Knock and misfire are judged per combustion event, so they belong at frame rate beside the advance that produced them. The cut masks say WHICH cylinders were cut, which is the difference between one bad injector and a fuelling problem.'
  signals: [rpm, advance, knock_retard, spark_retard_total, dwell,
            knock_1, knock_2, knock_level, knock_count, preign_cut_mask,
            misfire_count, misfire_rough, misfire_cut_mask, fuel_load, inj_pw]

- id: tuning
  name: Tuning
  rate_hz: 50
  blurb: 'Everything a full tune needs and nothing else: the axes, the targets, the corrections and what stopped the pull.'
  detail: 'The everyday set. Standard logs every sensor the definition marks, which is the right default and about four times the columns a tuner actually reads — this is the subset that answers tuning questions. It carries both halves of every decision: lambda AND its target, ve AND the corrections applied to it, commanded advance AND what retarded it, so a trace explains itself instead of raising a second question. Left out deliberately: per-cylinder trims (a misfire hunt, not a tune), raw hardware channels (wiring, not engine), the EGT and chassis banks (mostly unassigned, so mostly zeroes), and the output slots.'
  signals: [
    # the axes everything is read against, plus enough state to know which pull this is
    rpm, map, tps, app_1, clt, iat, battery, vehicle_spd, gear, engine_state, sync_level,
    run_time, baro_kpa,
    # the fuel calculation: what it read, what it decided
    ve, fuel_load, air_mass, charge_temp, map_source, map_est, imap, inj_pw, base_pw,
    pw_add_deadtime, lambda_target, inj_press_diff, fuel_pressure, tps_rate,
    # …and WHY it was not the table value. A mixture error with no corrections in the file
    # is a question, not an answer.
    # THE WHOLE MULTIPLY CHAIN, not a selection of it: fuel_corr_overall says the mixture was moved
    # and only the terms say by what. One unlogged term is one correction you cannot rule out.
    fuel_corr_overall, fuel_corr_warmup, fuel_corr_iat, fuel_corr_baro,
    fuel_corr_accel, fuel_corr_film, fuel_corr_poststart, fuel_corr_cranking, fuel_corr_fuelcomp,
    fuel_corr_gear, fuel_corr_egt, fuel_corr_protection, fuel_corr_revlimit,
    fuel_corr_generic1, fuel_corr_generic2, fuel_corr_generic3, fuel_corr_generic4,
    clt_corr, prime_pw, flood_clear,
    # FUEL COMPOSITION. A flex tune is computed against these — the blend, its temperature, and the
    # two corrections it drives — and a log without them cannot explain why the same cell wanted
    # different fuel on two different tanks.
    ethanol, ethanol_2, fuel_temp_flex, fuel_flow,
    # air the charge model needs: what was measured, what it came through, what the air was like
    maf, humidity, ambient_air_temp, iat_pre_ic, boost_pressure_pre_ic, exh_manifold_pressure,
    fuel_pressure_pre,
    # measured mixture and the closed loop moving it. Bank-level only — per-cylinder is its own hunt.
    lambda_1, lambda_2, fuel_corr_stft, fuel_corr_ltft, stft_pct, ltft_pct,
    stft_bank_1_pct, stft_bank_2_pct, ltft_bank_1_pct, ltft_bank_2_pct, lambda_protect_active,
    # timing, and everything that took some away
    advance, ign_base_adv, ign_base_kind, dwell, spark_retard_total, knock_retard, ign_advance_trim,
    ign_corr_clt, ign_corr_iat, ign_corr_poststart, ign_corr_transient, ign_corr_fuelcomp,
    ign_corr_gear, ign_corr_revlimit,
    ign_corr_generic1, ign_corr_generic2, ign_corr_generic3, ign_corr_generic4,
    antilag_active, antilag_retard, nitrous_active, nitrous_retard,
    knock_1, knock_2, knock_level, knock_count, preign_cut_mask,
    # boost, cams, tip-in and idle — the other four things a tune is made of
    boost_target, wastegate_duty, boost_est, wastegate_pressure, turbo_speed_1,
    vvt_angle_1, vvt_angle_2, vvt_angle_3, vvt_angle_4, vvt_duty_1, vvt_duty_2, vvt_duty_3,
    transient_active, transient_enrich_pct, tt_load_rate,
    idle_active, idle_state, idle_duty, idle_target_rpm, idle_rpm_error, idle_ign_corr,
    # WHAT ENDED THE PULL. Without these a trace just stops and the log cannot say why.
    fuel_cut, ign_cut, dfco_active, shift_cut_active, launch_active, launch_ign_adv, launch_end_rpm, launch_cut_pct, prot_status,
    prot_ign_retard, prot_boost_corr, rpm_to_limit, soft_cut_pct, egt_protect_active,
    misfire_cut_mask, traction_cap,
    # the torque model, when there is one: what the ECU thought it was making while it decided
    engine_torque_nm, engine_power_kw, lambda_torque_ratio,
    # health worth having in the same file, and the faults raised while it was recorded
    oil_pressure, oil_temp, fuel_temp, misfire_count, misfire_rough,
    trigger_error_pct, dtc_active, dtc_worst_code, dtc_worst_sev,
    # drive-by-wire: the pedal-to-plate chain, since it sits between the driver and every axis above
    pedal_demand, throttle_demand, etb_target_1, etb_position_1, app_state,
    ]

- id: fuel
  name: Fuel and Mixture
  rate_hz: 20
  blurb: 'Everything the fuel calculation reads and everything it decides.'
  detail: 'The set for VE work: the load and speed axes, the charge estimate, the trims, and both lambda and its target — MegaLogViewer cannot analyse VE without the target in the file.'
  categories: [FuelCalculator, Lambda, "Sensors - Engine", "Sensors - Air", "Sensors - Derived"]
  signals: [rpm, map, tps, clt, iat, ve, lambda_target, air_mass, fuel_load, battery, vehicle_spd]

- id: ignition
  name: Ignition and Knock
  rate_hz: 50
  blurb: 'Timing, dwell, and every correction applied to them.'
  detail: 'What advance was commanded and why it was not what the table said — the corrections are the point, since a log showing only final advance cannot tell a knock retard from a coolant correction.'
  categories: [Ignition, Knock, Trigger]
  signals: [rpm, map, tps, clt, iat, advance, dwell, knock_retard, crank_angle, sync_level]

- id: boost
  name: Boost
  rate_hz: 50
  blurb: 'Manifold pressure against target, and what the wastegate was asked for.'
  detail: 'Includes throttle and RPM because a boost trace without them cannot distinguish a control problem from the driver lifting.'
  categories: [Boost]
  signals: [rpm, map, tps, app_1, boost_target, wastegate_duty, boost_est, vehicle_spd, gear, iat]

- id: throttle
  name: Drive-by-Wire
  rate_hz: 100
  blurb: 'Pedal, throttle, the motor demand and the supervisor.'
  detail: 'Both pedal and both throttle tracks, because the redundancy IS the safety case — a single-track log cannot show which sensor disagreed.'
  categories: [ElectronicThrottle]
  signals: [rpm, app_1, app_2, tps, tps_2, app_state, vehicle_spd]

- id: diagnostics
  name: Faults and Protection
  rate_hz: 10
  blurb: 'What the ECU objected to, and what it did about it.'
  detail: 'The set for an intermittent nobody can reproduce on demand — small enough to leave running for a long session, and it carries the cuts and the protection state that explain a moment nobody was watching.'
  categories: [Diagnostics, Protection]
  signals: [rpm, map, clt, battery, dtc_active, dtc_worst_sev, dtc_worst_code, dtc_indicators,
            fuel_cut, ign_cut, prot_status, sync_level, uptime_s, vehicle_spd]

# A TEMPLATE CARRIES ITS RATE. It is a complete suggestion, not a channel list — "Trigger and Sync
# (1 kHz)" that leaves the logger at 10 Hz has named a thing it does not do. Every template states
# one, including the slow ones: without that, installing a 1 kHz set and then a wide one would leave
# 148 channels running at 1 kHz, which is a gigabyte an hour nobody asked for.
#
# ---------------------------------------------------------------------------
# output_templates: what an output slot can BE, as data.
#
# The slots are deliberately generic — nothing in the firmware knows what a fuel pump is, which is why
# four pumps and eight fans is twelve slots rather than a limit somebody chose. The cost of that is a
# blank expression editor, so the conventions live here: a personality writes the two conditions, the
# timings, the fail direction and the kind, and asks the user only for the numbers that vary.
#
# The conditions REFERENCE the slot's parameters ({name} substitutes to param_a..d in `params` order)
# rather than baking numbers in. Every fuel pump therefore compiles to identical bytecode whatever its
# prime time, so the studio still recognises the template after the numbers change — and after a tune
# has been through an ECU, where only bytecode comes back.
#
# (The keys are on_when/off_when, not on/off: YAML 1.1 reads a bare `on:` as the BOOLEAN true, so
# a condition written under `on:` silently became a key nobody could look up.)
#
# `inputs` names the sensors a template's conditions read, so the wizard can offer to wire them: a
# switch nobody has wired reads as absent, and a condition that names it reads it as FALSE
# (Expr.h OP_AND/OP_OR clean their operands), which is a condition that answers no for ever.
#
# `options` is that same problem solved rather than reported. A term some cars have and others do not
# — a neutral switch, a clutch switch, a brake switch — is not a number, so it cannot be a parameter;
# and hard-wired into the condition it makes the template useless to anybody without that switch. So
# each option is a CLAUSE the wizard offers as a tick box: the ones ticked are assembled into the
# `{@options}` token, prefixed by `options_lead`. Tick none and the token AND its lead both vanish —
# the condition is then simply the part every car shares, and it names no switch nobody wired.
#
# HOW THEY COMBINE is also the car's business, so each option carries the connective that attaches it
# to the ones before — `join: and` / `join: or` — which the wizard offers and the user can change.
# Assembly is strictly LEFT TO RIGHT with explicit brackets, so what is listed is what is meant and
# no operator precedence has to be guessed at: neutral, clutch `or`, brake `and` reads
# "((neutral or clutch) and brake)", which is the modern manual, while three `and`s demand all three
# and three `or`s accept any. The first ticked option's join is unused, by definition. Order the
# options so the useful groupings fall out of that rule — a term that qualifies all the others
# (a brake pedal) goes LAST.
#
# An option's `input` is the sensor its clause reads, and it joins `inputs` only while it is ticked:
# the wizard warns about an unwired switch you asked for, and says nothing about one you declined.
#
# `candidates` is for a slot whose VALUE comes off the bus rather than from a table or a constant — a
# boost solenoid takes wastegate_duty, and a module that publishes a duty is the only thing that knows
# what it should be. Each entry names a signal and its role (primary requests, limit clamps down,
# override replaces), and the wizard resolves the name to an id through the meta, so a template cannot
# point a slot at a channel this firmware does not have.
#
# POLARITY IS NOT HERE. Whether a switch reads 1 closed or 1 open is a fact about the loom, not about
# the starter, and it already has a home: sensors.sensor[<id>].flags bit `invert`. Putting it in the
# condition too would fix the starter and leave the dash reading "in gear" while the box is in
# neutral. The wizard edits that flag on the input rows instead — one truth, every consumer.
# ---------------------------------------------------------------------------
output_templates:
- id: fuel_pump
  name: Fuel Pump
  blurb: 'Primes at key-on, then runs while the engine is turning. Stops when the teeth stop.'
  detail: 'The second half is the one that matters: it watches TEETH, not sync, so the rail is up before the decoder has locked and long before the first spark. It also stops when the wheel stops — however the engine stopped.'
  kind: 1
  value_source: 2
  fixed_pct: 100
  on_invalid: 0
  params:
  - {name: prime_s, label: Prime Time, units: s, default: 3, min: 0, max: 30, digits: 1, help: 'How long the pump runs at key-on to bring the rail up before cranking.'}
  - {name: stop_ms, label: Stop After, units: ms, default: 1500, min: 200, max: 10000, digits: 0, help: 'How long after the last trigger tooth the pump is switched off. Long enough to ride out a slow crank, short enough to be off promptly when the engine stops.'}
  on_when:  'uptime_s < {prime_s} or age(trigger_teeth) < {stop_ms}'
  off_when: 'uptime_s >= {prime_s} and age(trigger_teeth) >= {stop_ms}'

- id: thermo_fan
  name: Thermo Fan
  blurb: 'On above a coolant temperature, off below a lower one.'
  detail: 'The gap between the two is the hysteresis — without it a fan chatters at the threshold. It fails ON: if the coolant reading dies the engine still needs cooling, and a fan running for no reason is a nuisance where a fan refusing to run is a head gasket.'
  kind: 1
  value_source: 2
  fixed_pct: 100
  on_invalid: 1
  min_on_ms: 5000
  min_off_ms: 5000
  params:
  - {name: on_c,  label: Switch On Above, units: C, default: 95, min: 40, max: 130, digits: 0}
  - {name: off_c, label: Switch Off Below, units: C, default: 90, min: 40, max: 130, digits: 0}
  on_when:  'clt > {on_c}'
  off_when: 'clt < {off_c}'

- id: thermo_fan_ac
  name: Thermo Fan with A/C
  blurb: 'The same fan, with the air conditioning as a second reason to run.'
  detail: 'One more term on each condition. The compressor asking for the fan is not a temperature, so it belongs in the condition rather than in the numbers.'
  kind: 1
  value_source: 2
  fixed_pct: 100
  on_invalid: 1
  min_on_ms: 5000
  min_off_ms: 5000
  inputs: [ac_request]
  params:
  - {name: on_c,  label: Switch On Above, units: C, default: 95, min: 40, max: 130, digits: 0}
  - {name: off_c, label: Switch Off Below, units: C, default: 90, min: 40, max: 130, digits: 0}
  on_when:  'clt > {on_c} or ac_request > 0.5'
  off_when: 'clt < {off_c} and ac_request < 0.5'

- id: variable_fan
  name: Variable-Speed Fan
  blurb: 'A PWM fan: on above a temperature, and its duty comes from a table you can shape.'
  detail: 'The condition still decides whether it runs at all; the table decides how hard, against whatever channels you point its axes at. It starts on Generic Table 1 — edit the cells there, or point the slot at another table on the Output Setup page. A slot naming no table sits at its failsafe, which for a fan means off.'
  kind: 0
  value_source: 1
  # WHICH TABLE the wizard leaves it reading. A slot that names none falls to its failsafe, so a
  # template that sets value_source to TABLE and stops there configures a fan that never runs —
  # the same "applied, and nothing happened" the enable flag used to cause.
  duty_table: generic_tables_table_1
  on_invalid: 1
  min_on_ms: 5000
  min_off_ms: 3000
  pwm_freq_hz: 200
  params:
  - {name: on_c,  label: Switch On Above, units: C, default: 92, min: 40, max: 130, digits: 0}
  - {name: off_c, label: Switch Off Below, units: C, default: 86, min: 40, max: 130, digits: 0}
  on_when:  'clt > {on_c}'
  off_when: 'clt < {off_c}'

- id: starter
  name: Starter Motor
  blurb: 'Cranks while the button is held, and never for too long. Interlocks to taste.'
  detail: 'A press LATCHES the crank: the starter runs until the engine catches, or until Maximum Crank runs out, whichever comes first — you do not have to hold the button, and letting go does not stop it. Hold it and you get another crank after the Rest, and another, until you let go. The maximum on time is what makes that safe. The interlocks are the part that varies between cars, so they are ticked rather than assumed — on a manual leave at least one on, because that is what stops the car being started in gear. An interlock you tick and do not wire reads as false, which is a starter that never cranks; the wizard says which of them are wired.'
  kind: 1
  value_source: 2
  fixed_pct: 100
  on_invalid: 0
  min_off_ms: 500
  inputs: [start_sw]
  options_label: 'Only crank when'
  options_lead: ' and '
  options:
  - {name: neutral, label: 'In neutral',    input: neutral_sw, default: 1, join: or,  term: 'neutral_sw > 0.5', help: 'Only crank with the gearbox in neutral. An automatic reads this off park/neutral; a manual usually has no such switch and uses the clutch instead.'}
  - {name: clutch,  label: 'Clutch down',   input: clutch_sw,  default: 1, join: or,  term: 'clutch_sw > 0.5',  help: 'Only crank with the clutch pedal down. On a manual this is the interlock that stops the car being started in gear.'}
  - {name: brake,   label: 'Brake pressed', input: brake_sw,   default: 0, join: and, term: 'brake_sw > 0.5',   help: 'Only crank with the brake pedal pressed, as a push-button car does. Joined with AND after the gearbox terms it reads "in neutral or clutch down, AND on the brake"; switch it to OR and the brake alone is enough, which is not usually what anybody wants.'}
  params:
  - {name: crank_s, label: Maximum Crank, units: s, default: 10, min: 1, max: 30, digits: 0, help: 'How long one attempt may last before the output releases, whatever the button says.'}
  - {name: rest_s,  label: Rest Before Retry, units: s, default: 3, min: 0, max: 60, digits: 0, help: 'How long the slot is locked out afterwards — the motor cooling down.'}
  # THE CRANK IS LATCHED, and both of these say so.
  #
  # `off_when` no longer names the button. That is what turns a momentary press into a crank: the gate
  # holds its state while NEITHER condition is true (OutputGate.h — the deadband), so the press starts
  # it and Maximum Crank or the engine catching ends it. Naming the button here instead meant the
  # starter ran only while you held it, which is a key, not a button.
  #
  # AND THE STATE, NOT THE RPM. engine_state is the run state machine (0 STOPPED / 1 CRANKING /
  # 2 RUNNING) and RUNNING carries full hysteresis — once caught it is held through any rpm dip until a
  # real stop. "rpm >= cranking_rpm" had none, so a running engine stumbling under 400 made the off
  # condition false and the on condition true in the same frame; the gate takes the on branch first,
  # and that is a starter engaging on a spinning engine. Both conditions read the state for that reason
  # — the on side must go false the instant the off side goes true, or the dip re-opens the same hole.
  # (The compiler has no names for enum values yet, hence the 2.)
  on_when:  'start_sw > 0.5 and engine_state < 2{@options}'
  off_when: 'engine_state >= 2'
  max_on_from: crank_s
  rearm_from: rest_s

- id: main_relay
  name: Main Relay
  blurb: 'On because the ECU is awake.'
  detail: 'Everything else hangs off it. The key-on gate already parks every output on the bench, so there is nothing subtler to say here.'
  kind: 1
  value_source: 2
  fixed_pct: 100
  on_invalid: 1
  params: []
  on_when:  '1'
  off_when: '0'

- id: shift_light
  name: Shift Light
  blurb: 'On above an rpm, off a little below it.'
  detail: 'The gap between the two stops it strobing at the threshold — the same hysteresis a fan needs, with different numbers.'
  kind: 1
  value_source: 2
  fixed_pct: 100
  on_invalid: 0
  params:
  - {name: on_rpm,  label: Light On Above, units: RPM, default: 6500, min: 1000, max: 12000, digits: 0}
  - {name: off_rpm, label: Light Off Below, units: RPM, default: 6300, min: 1000, max: 12000, digits: 0}
  on_when:  'rpm > {on_rpm}'
  off_when: 'rpm < {off_rpm}'

- id: check_engine_light
  name: Check Engine Light
  blurb: 'On for any current code or level 3; slow flash for level 1, fast for level 2 once their codes have cleared.'
  detail: 'The key-on flash is the bulb check: a lamp that never lights at key-on is a dead bulb or an open circuit, not a healthy engine. After it, the lamp is ON while any code is current, and ON at protection level 3. A level can hold after its codes have cleared, or act on stored codes; then level 2 FLASHES FAST and level 1 FLASHES SLOWLY, so the lamp still says the engine is in limp. A level only ever adds a flash: it never turns the lamp off while a code is current. Which codes and why is on the Diagnostic Trouble Codes list. If the ECU cannot read any of it the lamp is ON: a warning light fails lit.'
  kind: 1
  value_source: 2
  fixed_pct: 100
  on_invalid: 1
  params:
  - {name: bulb_s, label: Bulb Check, units: s, default: 3, min: 0, max: 10, digits: 1, help: 'How long the lamp lights at key-on before it shows the state. 0 skips the check.'}
  # One condition, no Turn Off: the lamp follows it (an empty off condition means "when this stops").
  # ON for any current code or level 3; levels 1 and 2 only FLASH, and only when neither holds — a level
  # can add a flash, never turn the lamp off.
  on_when:  'uptime_s < {bulb_s} or dtc_active > 0 or prot_level == 3 or (prot_level == 2 and blink_fast) or (prot_level == 1 and blink_slow)'
  off_when: ''

- id: tachometer
  name: Tachometer
  blurb: 'The square wave an analog tacho reads: a frequency that follows engine speed.'
  detail: 'Nothing about a tacho is special to the ECU — it is a PWM output whose CARRIER is the signal. The frequency is rpm / 60 x Pulses per Rev, computed every frame; the duty is the pulse shape, and 50 % suits almost every tacho. Most four-stroke tachos want half the cylinder count in pulses per rev. Below the squelch rpm the output is off rather than crawling at a frequency the gauge cannot read.'
  kind: 0
  value_source: 2
  fixed_pct: 50
  on_invalid: 0
  freq_expr: 'rpm * {ppr} / 60'
  params:
  - {name: ppr, label: Pulses per Rev, units: '', default: 2, min: 0.5, max: 24, digits: 1, help: 'Pulses the tacho expects per crank revolution. A four-stroke tacho is usually wired for half the cylinder count — 2 for a four, 3 for a six, 4 for an eight.'}
  - {name: min_rpm, label: Squelch Below, units: RPM, default: 60, min: 0, max: 2000, digits: 0, help: 'Below this the output stays off. The carrier cannot go below 1 Hz, so a tacho asked for less would otherwise hold the last frequency it could make.'}
  on_when:  'rpm > {min_rpm}'
  off_when: 'rpm <= {min_rpm}'

- id: boost_solenoid
  name: Boost Solenoid (Wastegate)
  blurb: 'A PWM wastegate solenoid, driven by whatever duty Boost Control is asking for.'
  detail: 'The slot does not decide the boost — Boost Control does, and publishes wastegate_duty; this is the wiring that gets it to the valve. So there is no threshold here to set twice: the module''s own activation RPM and pressure decide when it asks for anything, and while it is not asking, the candidate is not valid and the slot sits at its failsafe. That failsafe is OFF, which on a conventionally plumbed three-port MAC valve passes full pressure to the actuator and gives the wastegate''s spring pressure — the LEAST boost, which is the only safe direction to fail. Check that against your own plumbing before you drive it. 30 Hz suits most MAC valves; the carrier is on the slot''s Frequency page if yours wants something else.'
  kind: 0
  value_source: 0
  on_invalid: 0
  pwm_freq_hz: 30
  candidates:
  - {signal: wastegate_duty, role: 0}
  params:
  - {name: off_rpm, label: Stop Below RPM, units: RPM, default: 200, min: 0, max: 2000, digits: 0, help: 'The solenoid stops being driven below this. It is an engine-stopped check, not a boost threshold — Boost Control''s own activation settings decide when there is any boost to control.'}
  on_when:  'rpm > [#engine.cranking_rpm]'
  off_when: 'rpm < {off_rpm}'

- id: vvt_intake_bank_1
  name: VVT Solenoid (Intake Bank 1)
  blurb: 'The phaser solenoid for the bank 1 intake cam, driven by the duty Cam Control asks for.'
  detail: 'Cam Control decides the duty and publishes vvt_duty_1; this slot is the wiring that gets it to the solenoid. It is driven only while the engine runs: Cam Control keeps publishing its base duty with the engine stopped, and a solenoid held at that with the key on only gets hot. Off, the phaser parks on its stop, which is where it rests without oil pressure anyway. 250 Hz is a starting point, not a specification: set the carrier on the slot''s Frequency page to what the solenoid''s maker gives.'
  kind: 0
  value_source: 0
  on_invalid: 0
  pwm_freq_hz: 250
  candidates:
  - {signal: vvt_duty_1, role: 0}
  params:
  - {name: off_rpm, label: Stop Below RPM, units: RPM, default: 200, min: 0, max: 2000, digits: 0, help: 'The solenoid stops being driven below this. It is an engine-stopped check; Cam Control''s own tables decide where the cam should be.'}
  on_when:  'rpm > [#engine.cranking_rpm]'
  off_when: 'rpm < {off_rpm}'

- id: vvt_exhaust_bank_1
  name: VVT Solenoid (Exhaust Bank 1)
  blurb: 'The phaser solenoid for the bank 1 exhaust cam, driven by the duty Cam Control asks for.'
  detail: 'Cam Control decides the duty and publishes vvt_duty_2; this slot is the wiring that gets it to the solenoid. It is driven only while the engine runs: Cam Control keeps publishing its base duty with the engine stopped, and a solenoid held at that with the key on only gets hot. Off, the phaser parks on its stop, which is where it rests without oil pressure anyway. 250 Hz is a starting point, not a specification: set the carrier on the slot''s Frequency page to what the solenoid''s maker gives.'
  kind: 0
  value_source: 0
  on_invalid: 0
  pwm_freq_hz: 250
  candidates:
  - {signal: vvt_duty_2, role: 0}
  params:
  - {name: off_rpm, label: Stop Below RPM, units: RPM, default: 200, min: 0, max: 2000, digits: 0, help: 'The solenoid stops being driven below this. It is an engine-stopped check; Cam Control''s own tables decide where the cam should be.'}
  on_when:  'rpm > [#engine.cranking_rpm]'
  off_when: 'rpm < {off_rpm}'

- id: vvt_intake_bank_2
  name: VVT Solenoid (Intake Bank 2)
  blurb: 'The phaser solenoid for the bank 2 intake cam, driven by the duty Cam Control asks for.'
  detail: 'Cam Control decides the duty and publishes vvt_duty_3; this slot is the wiring that gets it to the solenoid. It is driven only while the engine runs: Cam Control keeps publishing its base duty with the engine stopped, and a solenoid held at that with the key on only gets hot. Off, the phaser parks on its stop, which is where it rests without oil pressure anyway. 250 Hz is a starting point, not a specification: set the carrier on the slot''s Frequency page to what the solenoid''s maker gives.'
  kind: 0
  value_source: 0
  on_invalid: 0
  pwm_freq_hz: 250
  candidates:
  - {signal: vvt_duty_3, role: 0}
  params:
  - {name: off_rpm, label: Stop Below RPM, units: RPM, default: 200, min: 0, max: 2000, digits: 0, help: 'The solenoid stops being driven below this. It is an engine-stopped check; Cam Control''s own tables decide where the cam should be.'}
  on_when:  'rpm > [#engine.cranking_rpm]'
  off_when: 'rpm < {off_rpm}'

- id: vvt_exhaust_bank_2
  name: VVT Solenoid (Exhaust Bank 2)
  blurb: 'The phaser solenoid for the bank 2 exhaust cam, driven by the duty Cam Control asks for.'
  detail: 'Cam Control decides the duty and publishes vvt_duty_4; this slot is the wiring that gets it to the solenoid. It is driven only while the engine runs: Cam Control keeps publishing its base duty with the engine stopped, and a solenoid held at that with the key on only gets hot. Off, the phaser parks on its stop, which is where it rests without oil pressure anyway. 250 Hz is a starting point, not a specification: set the carrier on the slot''s Frequency page to what the solenoid''s maker gives.'
  kind: 0
  value_source: 0
  on_invalid: 0
  pwm_freq_hz: 250
  candidates:
  - {signal: vvt_duty_4, role: 0}
  params:
  - {name: off_rpm, label: Stop Below RPM, units: RPM, default: 200, min: 0, max: 2000, digits: 0, help: 'The solenoid stops being driven below this. It is an engine-stopped check; Cam Control''s own tables decide where the cam should be.'}
  on_when:  'rpm > [#engine.cranking_rpm]'
  off_when: 'rpm < {off_rpm}'

- id: ps_pump
  name: Power Steering Pump
  blurb: 'Runs while the engine runs; duty from the slot''s own map if it is a PWM pump.'
  detail: 'An electro-hydraulic pump only needs to be on with the engine. Speed-sensitive assistance is the same slot with the value source set to Table and road speed on the map''s axis.'
  kind: 0
  value_source: 2
  fixed_pct: 100
  on_invalid: 0
  min_on_ms: 2000
  min_off_ms: 1000
  pwm_freq_hz: 200
  params:
  - {name: off_rpm, label: Stop Below RPM, units: RPM, default: 200, min: 0, max: 2000, digits: 0}
  on_when:  'rpm > [#engine.cranking_rpm]'
  off_when: 'rpm < {off_rpm}'

- id: ac_clutch
  name: A/C Compressor Clutch
  blurb: 'Engages on request while the engine is running and the throttle is not wide open.'
  detail: 'The minimum off time is a hardware requirement rather than a nicety — a compressor short-cycled will not last. Dropping it at full throttle is the usual courtesy to a small engine.'
  kind: 1
  value_source: 2
  fixed_pct: 100
  on_invalid: 0
  min_on_ms: 5000
  min_off_ms: 10000
  inputs: [ac_request]
  params:
  - {name: cut_tps, label: Cut Above Throttle, units: '%', default: 90, min: 50, max: 100, digits: 0}
  on_when:  'ac_request > 0.5 and rpm > [#engine.cranking_rpm] and tps < {cut_tps}'
  off_when: 'ac_request < 0.5 or rpm < 200 or tps > {cut_tps}'

