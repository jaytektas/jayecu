# Electronic throttle (ETB) — per-channel resolved position / duty / latched-disable / state. Published
# Plate-% channels carry scale 0.01, not 0.1. The feedback is a 12-bit ADC across the plate's travel —
# measured at 3328 counts closed-to-open on the bench body, so one count is 0.030 % of travel. Encoding
# the telemetry in tenths quantises that to 0.1 %, discarding 3.3x the resolution the sensor already
# gives, and it is the resolution that decides whether a 0.05 % hold error is visible or reads as zero.
# 0.01 costs nothing: 0..100 % is 10000 counts of a uint16, and +/-100 % duty is +/-10000 of an int16.
# by ElectronicThrottle (see docs/throttle-control-design.md). etb_position_N is the canonical plate-% that
# transient/Alpha-N/idle bind to on an ETB engine (vs tps on a cable engine).
- {id: etb_position_1, label: "ETB1 Position", units: '%', scale: 0.01, telem_type: uint16, min: 0.0, max: 100.0, category: "ElectronicThrottle", bus_type: float, datalog: true, owner: firmware}
- {id: etb_position_2, label: "ETB2 Position", units: '%', scale: 0.01, telem_type: uint16, min: 0.0, max: 100.0, category: "ElectronicThrottle", bus_type: float, datalog: true, owner: firmware}
