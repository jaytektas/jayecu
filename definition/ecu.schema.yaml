# WHAT EACH OUTPUT SLOT IS DOING, one channel per slot. An output whose state is invisible cannot be
# tuned, cannot be tested on a bench and cannot be believed: the Outputs pages have shown a live figure
# per slot since they were written, bound to channels that did not exist, so every one of them read 0
# whatever the pin was doing. The value is the COMMAND after arbitration, gate, encode and clamp —
# what the sink was actually handed — so a digital slot reads 0 or 100 and a PWM slot reads its duty.
- {id: out_N, per_slot: outputs.output, label: "{pin}", units: '%', scale: 0.5, telem_type: uint8, min: 0.0, max: 100.0, category: "Outputs", bus_type: float, datalog: true, owner: firmware}
