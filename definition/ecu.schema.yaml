- {id: tps_2, label: "Throttle Position 2", category: "Sensors - Engine", bus_type: float, owner: firmware, gauge: {min: 0, max: 100}}# Accelerator pedal position (APP1/APP2) — the DBW driver-demand inputs for the Pedal-to-Throttle map.
