# The RAW pickups. A speed sensor is a frequency sensor and nothing more — it counts teeth — so what it
# publishes is Hz, and turning that into a road speed needs a number it cannot know: how many pulses the
# car makes per kilometre. That number lives on the VehicleSpeed module with the rest of the calibration,
