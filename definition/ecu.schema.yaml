# TRIGGER HEALTH THAT SURVIVES THE TRIGGER STOPPING. trigger_error_pct above is derived from counts
# snapshotted at a cycle boundary that is itself counted in TEETH — so the moment the teeth stop it
# freezes at whatever it last read, which made it useless for seeing the one fault that stops teeth.
# These three are free-running or level-triggered, and they are the channels to watch on a rig.
- {id: trigger_absent, label: "Trigger Signal Absent", units: '', scale: 1.0, telem_type: uint8, min: 0.0, max: 1.0, category: "Trigger", bus_type: float, datalog: true, enum: bool_active, owner: firmware}
- {id: trigger_noise_edges, label: "Trigger Noise Edges", units: '', scale: 1.0, telem_type: uint32, min: 0.0, max: 4000000000.0, category: "Trigger", bus_type: uint32, datalog: true, owner: firmware}
- {id: trigger_missed_teeth, label: "Trigger Missed Teeth", units: '', scale: 1.0, telem_type: uint32, min: 0.0, max: 4000000000.0, category: "Trigger", bus_type: uint32, datalog: true, owner: firmware}
# Phase downgrades. THE number to watch when setting a cam's Phaser Authority: a count that climbs
# while the engine runs normally means the authority is set smaller than the phaser's real travel, and
# the decoder is calling the phaser's own movement a fault. A single sample cannot show that — phase
# drops and re-acquires within a cycle and reads as healthy in between.
- {id: trigger_phase_lost, label: "Trigger Phase Lost", units: '', scale: 1.0, telem_type: uint32, min: 0.0, max: 4000000000.0, category: "Trigger", bus_type: uint32, datalog: true, owner: firmware}
# WHICH STREAM raised the last trigger fault, as a slot index — and the slot index is the role, so
# this reads directly as Crank Primary / Crank Secondary / Cam Intake B1 / Cam Exhaust B1 / Cam
# Intake B2 / Cam Exhaust B2. A V engine has a cam and a chain per bank: "the trigger is unhappy" is
# not a fault anyone can act on, "bank 2's cam is 90 degrees out" is. 255 = nothing has faulted.
- {id: trigger_fault_stream, label: "Trigger Fault Stream", units: '', scale: 1.0, telem_type: uint8, min: 0.0, max: 255.0, category: "Trigger", bus_type: float, datalog: true, owner: firmware}
# THE HIGHEST SYNC LEVEL THIS TUNE CAN EVER REACH, decided from the configuration alone at every
# reconfigure — not what it has reached, what it could. A wheel with no unique feature and nothing to
# anchor it reads None and will not be allowed to fire; one with no cam reads Crank, which is the
# honest answer to "why will this not run sequential" given on the bench instead of by a car.
- {id: trigger_sync_ceiling, label: "Trigger Sync Ceiling", units: '', scale: 1.0, telem_type: uint8, min: 0.0, max: 2.0, category: "Trigger", bus_type: float, datalog: true, enum: sync_level, owner: firmware}
- {id: trigger_last_error_kind, label: "Trigger Last Error Kind", units: '', scale: 1.0, telem_type: uint8, min: 0.0, max: 2.0, category: "Trigger", bus_type: float, datalog: true, owner: firmware}
- {id: trigger_last_error_tooth, label: "Trigger Last Error Tooth", units: '', scale: 1.0, telem_type: uint16, min: 0.0, max: 1000.0, category: "Trigger", bus_type: float, datalog: true, owner: firmware}
