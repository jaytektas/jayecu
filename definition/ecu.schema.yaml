# Injector duty cycle — the commanded opening as a fraction of the time one squirt HAS. The denominator
# is the engine cycle divided by the stage's injections per cycle, so it already answers for sequential
# vs semi-sequential vs batch without anyone re-deriving it: FuelCalculator computes exactly that number
# (`full_pw`) to decide staging, and this publishes it instead of leaving every consumer to reconstruct
# it from PW and RPM and get the mode wrong. ONE PER STAGE for the same reason as the pressure
# differential above — a stage on its own rail, with its own flow, reaches its limit at its own point.
# It CAN exceed 100%: past every injector at full duty the residual is still commanded (FuelCalculator
# pass 3) rather than silently dropped, and a duty that reads 118% is the honest way to see that.
