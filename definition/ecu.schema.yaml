schema_version: '1.0'

# Project-wide table sizing. Axes inherit `axis_max` for their MAX allocation (resizable up to it)
# unless they pin their own `max_size` — so table dimensions are definable in ONE place, not
# concrete per-axis. `depth_max` caps a (future) 4D table's depth axis. Storage is reported by
# `make` (the table-cost report) and budgeted against a 256 KB flash bank.
table_defaults: {axis_max: 32, depth_max: 8}

# Fuel correction signals — FuelCalculator aggregates these bus signals onto the base fuel.
# `mult` factors scale fuel mass (applied before flow conversion); `add` factors add microseconds
# (injector domain, after flow). Order within a group is irrelevant (commutative). Add a correction

# Studio UI hints — kept as DATA so the studio stays a faithful renderer (it bakes in nothing).
#   renamable_keys: containers whose child KEYS may be renamed in the tree. EVERYTHING ELSE is
#     locked (structural keys — config/modules/interfaces/primitive types/… — would break codegen
#     if renamed). Default-locked, opt-in here. (List-item ids, e.g. signals, rename regardless.)
primitive_types:
  uint8:
    c_type: uint8_t
    size: 1
    ini_type: U08
  int8:
    c_type: int8_t
    size: 1
    ini_type: S08
  uint16:
    c_type: uint16_t
    size: 2
    ini_type: U16
  int16:
    c_type: int16_t
    size: 2
    ini_type: S16
  uint32:
    c_type: uint32_t
    size: 4
    ini_type: U32
  int32:
    c_type: int32_t
    size: 4
    ini_type: S32
  float:
    c_type: float
    size: 4
    ini_type: F32

# ===========================================================================
# Enums — the single source of truth for every closed value-set in the schema.
# Each entry is {id, label}; codegen emits the C enum + option lists FROM here,
# and the studio renders any field that references an enum as a labelled dropdown
# (stores the id, shows the label). Add a value here and it appears everywhere.
# ===========================================================================
enums:
  etb_autotune_rule:
  - {id: tyreus_luyben, label: "Tyreus-Luyben"}
  - {id: ziegler_nichols, label: "Ziegler-Nichols"}
  - {id: zn_no_overshoot, label: "ZN - no overshoot"}
  - {id: zn_some_overshoot, label: "ZN - some overshoot"}
  - {id: pessen_integral, label: "Pessen Integral"}
  raw_quantity:
  - {id: volts, label: "Voltage"}
  - {id: hz, label: "Frequency"}
  - {id: state, label: "Digital State"}
  # `universal: true` = the FIRMWARE builds this interface generically, for any sensor, so the
  # catalogue cannot rule it out. A CAN input binds a device signal to the sensor's CHANNEL and never
  # looks at what kind of sensor it is (Sensors.cpp:97), so EVERY sensor can come off the bus — there
  # are CAN coolant switches, CAN flex senders, CAN everything. Analog / engine-sync / frequency /
  # pulse / SENT all take a raw scalar and decode it through the sensor's own cal curve
  # (PipelineBuilder.h:124-134), so which one applies is a fact about the customer's WIRING, not about
  # the sensor: the ECU has no way to know and no business refusing.
  # The two without it are the two the firmware genuinely cannot build for an arbitrary sensor:
  #   on_board — three acquire functions exist (voltage, temp, baro) and nothing else (:141-148);
  #   digital  — the pin level IS the value, with no decode at all (:139), so a temperature read this
  #              way would publish 0 or 1 degrees.
  # A sensor's own `interfaces:` list is still what it is NATURALLY read as; it picks the default and
  # the ADC front-end. It is not a permission list, and enforcing it as one is what wrongly refused a
  # coolant-flow switch on CAN.
  sensor_interface:
  - {id: analog_voltage, label: "Analogue Voltage", universal: true}
  - {id: engine_sync_voltage, label: "Engine Sync Voltage", universal: true}
  - {id: on_board, label: "On-board"}
  - {id: digital_freq, label: "Frequency", universal: true}
  # DIGITAL, not "Switch". Every other entry here names how a PIN IS READ — analog voltage,
  # frequency, SENT, pulse width, CAN — and this one named a kind of SENSOR instead. It has always
  # meant "read the pin's digital level": the firmware resolves it straight to HW_DIG_LEVEL_SIG.
  # The old name also collided with the sensor TYPE `switch`, and an option id is unique only
  # within its own set — which silently deleted this entry from the Interface list, so a switch
  # could be wired to no digital input at all.
  - {id: digital, label: "Digital"}
  - {id: can_device, label: "CAN Bus", universal: true}
  - {id: sent, label: "SENT", universal: true}
  - {id: pulse_width, label: "Pulse Width", universal: true}
  sensor_group:
  - {id: engine_sync, label: "Engine Synchronous"}
  - {id: engine, label: "Engine"}
  - {id: o2, label: "O2"}
  - {id: transmission, label: "Transmission"}
  - {id: aircon, label: "Air Con"}
  - {id: chassis, label: "Chassis"}
  - {id: boost, label: "Boost/Turbo"}
  - {id: nitrous, label: "Nitrous"}
  - {id: atmospheric, label: "Atmospheric"}
  - {id: vehicle_speed, label: "Vehicle Speed"}
  - {id: other, label: "Other"}
  pipeline_stage:
  - {id: calibration, label: "Calibration (transfer curve)"}
  - {id: pulse_scale, label: "Pulse Scale (Hz→units)"}
  - {id: debounce, label: "Debounce"}
  - {id: filter, label: "Low-pass Filter"}
  - {id: derivative, label: "Derivative"}
  - {id: diagnostics, label: "Diagnostics"}
  diagnostic_kind:
  - {id: raw_min, label: "Raw Min (open/short low)"}
  - {id: raw_max, label: "Raw Max (open/short high)"}
  - {id: operating_min, label: "Operating Min (range low)"}
  - {id: operating_max, label: "Operating Max (range high)"}
  - {id: max_derivative, label: "Max Derivative (rate)"}
  - {id: stuck, label: "Stuck"}
  severity:
  - {id: none, label: "None"}
  - {id: level1, label: "Level 1"}
  - {id: level2, label: "Level 2"}
  - {id: level3, label: "Level 3"}
  # Enum-valued signals: a `signals:` entry with `enum: <id>` advertises a closed value-set,
  # so the precondition VALUE input becomes a named dropdown instead of a raw number. These are
  # the SINGLE SOURCE for both the firmware enum (see enum_cpp) AND the TS picker labels, so a
  # published value can't drift from what the user selects. Order = the integer value (index 0 first).
  engine_run_state:
  - {id: stopped, label: "Stopped"}
  - {id: cranking, label: "Cranking"}
  - {id: running, label: "Running"}
  sync_level:
  - {id: none, label: "None"}
  - {id: crank, label: "Crank"}
  - {id: phase, label: "Phase"}
  bool_active:                       # shared by the 0/1 flag signals (no firmware enum — they publish 0/1)
  - {id: false, label: "Off"}
  - {id: true, label: "On"}
  supply_state:                      # a 5 V sensor reference's power-good line (sensor_supply_N)
  - {id: fault, label: "Fault"}
  - {id: ok, label: "OK"}
  cruise_switch_position:            # WHICH position the stalk has settled in — its band's position number.
  - {id: rest,  label: "Rest"}       # What each one MEANS is whatever the cruise module's conditions say
  - {id: pos_1, label: "Position 1"} # about it (`cruise_sw == 2` in Set When makes position 2 the set
  - {id: pos_2, label: "Position 2"} # button), so naming them here for a function would be naming one
  - {id: pos_3, label: "Position 3"} # particular stalk's wiring and calling it the truth. Rest is the
  - {id: pos_4, label: "Position 4"} # exception: position 0 is rest by the band decoder's own rule, and
  - {id: pos_5, label: "Position 5"} # it is the only position that may be held indefinitely.
  - {id: pos_6, label: "Position 6"}
  - {id: pos_7, label: "Position 7"}
  map_source_kind:                   # where the manifold-pressure ESTIMATE came from this frame
  - {id: measured, label: "Measured"}
  - {id: predicted, label: "Predicted (transient)"}
  # The sensor is configured and not reading: the fuel model is on ATMOSPHERE (the assumed baro), not on
  # the predicted table — that is for transients, and only when prediction is on. Short, because a value
  # label is read in a readout on the dense diagnostics card; which sensor, and why, is the DTC's job.
  - {id: failover, label: "Failed (baro)"}
  ign_base_kind:                     # which base table the advance came from this cycle (display only)
  - {id: map, label: "Advance Map"}
  - {id: cranking, label: "Cranking Table"}
  - {id: launch, label: "Launch Table"}
  can_bus_state:                     # CanErrorStatus::state — what the controller says about itself
  - {id: active, label: "Active"}
  - {id: warning, label: "Warning"}
  - {id: passive, label: "Error Passive"}
  - {id: bus_off, label: "Bus Off"}
  can_last_error:                    # CanErrorStatus::last_err — WHY, which is the useful half
  - {id: none, label: "None"}
  - {id: stuff, label: "Stuff - bit rate disagrees"}
  - {id: form, label: "Form - bit rate disagrees"}
  - {id: ack, label: "No acknowledgement - nobody else on the bus"}
  - {id: bit_recessive, label: "Bit recessive - something driving against us"}
  - {id: bit_dominant, label: "Bit dominant - something driving against us"}
  - {id: crc, label: "CRC"}
  lua_script_state:                  # ScriptEngine.state — display only (firmware publishes the number)
  - {id: ok, label: "OK"}
  - {id: disabled, label: "Disabled"}
  - {id: load_error, label: "Load error"}
  - {id: runtime_error, label: "Runtime error"}

  # WHAT IDLE IS DOING, which `idle_active` could never say. That flag is the idle CONDITION — running,
  # throttle shut, under the lockout rpm — and it is true in open loop, true while the closed loop is
  # still standing off, and true when the PI is hard at work. Three different situations, one lamp, and
  # the difference between them is the whole of tuning an idle.
  idle_state:                        # Idle's own state (firmware publishes the number)
  - {id: "off",       label: "Off"}           # QUOTED: bare `off` is a YAML 1.1 BOOLEAN
  - {id: not_running, label: "Not Running"}   # enabled, but the engine is stopped or cranking
  - {id: off_idle,    label: "Off Idle"}      # running, and one of the idle gates says this is not idle
  - {id: open_loop,   label: "Open Loop"}     # idling on the base tables; there is no loop to close
  - {id: waiting,     label: "Waiting"}       # closed-loop mode, idling, rpm still above the activation offset
  - {id: closed_loop, label: "Closed Loop"}   # the PI is stepping — the only state in which gains matter
  cruise_state:                      # CruiseControl's own state machine (firmware publishes the number)
  - {id: "off",    label: "Off"}            # QUOTED: bare `off` is a YAML 1.1 BOOLEAN, and parses as False
  #                                        # switched off in the tune — not the same as the driver's switch
  - {id: disabled, label: "Disabled"}       # armed in the tune, main switch off
  - {id: ready,    label: "Ready"}          # standing by; may still hold a set speed for Resume
  - {id: cruising, label: "Cruising"}       # closed loop live
  - {id: fault,    label: "Fault"}          # an integrity check tripped; engagement is BLOCKED

# Enums that codegen emits as a firmware `enum class` (generated/signal_enums.h) which the firmware
# INCLUDES and uses — so the published value is, by construction, the schema's value. bool_active is
# absent: its signals are plain booleans, the picker is presentation only.
enum_cpp:
  engine_run_state: EngineRunState
  sync_level: SyncLevel
  cruise_state: CruiseState
  idle_state: IdleState

# The Lua scripting API surface, exported into tuneit-meta.json (lua_api) for the studio editor's
# context-sensitive autocomplete. `functions` MUST stay in lock-step with firmware ECU_API — codegen
# validates the name set and fails on drift (a function added to firmware but not documented here, or
# vice versa). Signatures/docs are display-only.
lua_api:
  functions:
  - {name: rpm,            sig: "rpm() -> number",                              doc: "Engine speed (RPM)."}
  - {name: map,            sig: "map() -> number",                              doc: "Manifold pressure (kPa)."}
  - {name: tps,            sig: "tps() -> number",                              doc: "Throttle position (%)."}
  - {name: clt,            sig: "clt() -> number",                              doc: "Coolant temperature."}
  - {name: iat,            sig: "iat() -> number",                              doc: "Intake air temperature."}
  - {name: lambda,         sig: "lambda() -> number",                           doc: "Measured lambda."}
  - {name: battery,        sig: "battery() -> number",                          doc: "Battery voltage."}
  - {name: signalRead,     sig: "signalRead(name) -> number|nil",               doc: "Read a bus signal by name."}
  - {name: signalWrite,    sig: "signalWrite(name, value[, ttl_ms]) -> bool",   doc: "Publish a bus signal by name (optional expiry)."}
  - {name: getCalibration, sig: "getCalibration(name) -> number",               doc: "Read a tune scalar (scale applied)."}
  - {name: evalTable,      sig: "evalTable(name) -> number",                     doc: "Interpolate a config table at the current axes."}
  - {name: evalCurve,      sig: "evalCurve(name) -> number",                     doc: "Interpolate a 1-D curve (alias of evalTable)."}
  - {name: interp,         sig: "interp(x, xs, ys) -> number",                  doc: "Linear interpolation over paired tables."}
  - {name: tickMs,         sig: "tickMs() -> number",                           doc: "Monotonic milliseconds since boot."}
  - {name: setTickRate,    sig: "setTickRate(hz)",                              doc: "Decimate onTick to ~hz (0 = every cycle)."}
  - {name: setWatchDog,    sig: "setWatchDog(us)",                              doc: "Abort onTick if it exceeds this wall-clock budget (0 = off). Overrides the tune's max_exec_us."}
  - {name: ecu_print,      sig: "ecu_print(msg)",                               doc: "Emit a debug log line to the ECU console."}
  - {name: canSend,        sig: "canSend(bus, id, bytes) -> bool",              doc: "Transmit a CAN frame."}
  - {name: canSubscribe,   sig: "canSubscribe(id[, mask[, bus]])",              doc: "Subscribe to CAN ids delivered to onCanRx."}
  - {name: setDtc,         sig: "setDtc(code[, sev])",                          doc: "Raise/keep-active a script-sourced DTC (sev 1-3 = level 1-3, defaults to level 1)."}
  - {name: clearDtc,       sig: "clearDtc(code)",                               doc: "Heal a script-raised DTC."}
  - {name: dtcActive,      sig: "dtcActive(code) -> bool",                      doc: "Is this DTC code currently active?"}
  - {name: dtcCount,       sig: "dtcCount() -> number",                         doc: "Count of currently active DTCs."}
  - {name: dtcList,        sig: "dtcList() -> table",                           doc: "Table of {code, sev} for each active DTC."}
  callbacks:
  - {name: onTick,    sig: "function onTick() end",                  doc: "Runs each cycle (or per setTickRate)."}
  - {name: onCanRx,   sig: "function onCanRx(bus, id, data) end",    doc: "Fires on a subscribed CAN frame."}

# Battery-backed BKPSRAM "learned" tables (LTFT/LTT) — exported into tuneit-meta.json (learned) so the
# studio can view, Apply-to-base, and Reset them WITHOUT a bespoke command. They are reached through the
# ordinary config r/w block protocol: an offset >= `page_base` routes to the learned region instead of
# g_config (see CommsManager learned_ptr + platform_learned_base). Each module bump-allocates its slice
# at RUNTIME in init order, so block offsets are NOT fixed here — the studio reads the whole page once
# and LOCATES each block by scanning for its little-endian u32 `magic` at the block start, then reads the
# cells that follow: [magic:u32][cells: f32 x rows*cols], row-major (cell = row*cols + col). Codegen
# validates every `magic` string actually appears in the firmware source (validate_learned) to catch
# drift. Apply-to-base is studio-side: read the grid, add each cell into `apply_to`, then Reset by writing
# zeros back to the block's cells (magic preserved).
learned:
  page_base: '0x40000000'    # comms offset base routed to the learned region (far above any g_config offset,
                             # and within positive int32 so the studio Cache can address it as an offset)
  region_cap: 65536          # append ceiling for the RAM-backed learned region (NOT a storage limit — the
                             # region lives in RAM and persists to rotating SD totem files, so this is just a
                             # sanity bound. The RAM buffer is sized to REGION_USED, not to the cap. Was 4096
                             # when battery-backed in the 4 KB BKPSRAM; lifted so per-wideband LTFT fits.)
  blocks:
  - id: vvt_ltt
    module: vvt_control
    label: "VVT Long-Term Trim"
    units: '%'
    rows: 4                  # cams (loop order: Intake B1, Exhaust B1, Intake B2, Exhaust B2)
    cols: 8                  # CLT bins, even 0..140 C (VvtControl CLT_SPAN / CLT_BINS)
    row_labels: ["Intake B1", "Exhaust B1", "Intake B2", "Exhaust B2"]
    col_axis: {channel: clt, min: 0.0, max: 140.0}
    # The ROWS are the four cams, and that is an axis like any other — one whose coordinate the FIRMWARE
    # supplies (the cam loop index) rather than a bus channel, which is what `external` means. Without it
    # this was a 2-D table carrying a single axis: nothing described the row dimension at all, so its
    # allocation went unrecorded and the studio read the whole grid as one row.
    row_axis: {external: true, min: 0, max: 4}
    apply_to: [config.vvt_control.intake_base_duty_1, config.vvt_control.exhaust_base_duty_1]
    apply_mode: add          # duty offset: VvtControl adds it to the base duty
  # THE FUEL TRIM, and there is one of it. It lives under fuel_calculator rather than lambda because
  # it BORROWS ve_table's axes — the same arrays, the same signal ids, the same allocation — and an
  # axis reference resolves inside one module's config. That is the whole point: LTFT cell (i,j,k) IS
  # VE cell (i,j,k), so Apply-to-Base is a copy rather than a resample, and resizing a VE axis resizes
  # the trim with it instead of silently putting two grids out of step.
  #
  # int16 at 0.01 % spans ±327 %, six times the widest authority the config permits. 32x32x4 is the VE
  # table's ALLOCATION, which is what any tune may grow to — not what today's default happens to use.
  #
  # There is no per-cylinder learned trim and no second table for bank 2. Per-cylinder fuelling is the
  # manual cylN_fuel_corr_tables; bank difference is two learned SCALARS (see the lambda module),
  # because it is dominated by injector flow variance and manifold bias, which is close to a constant
  # offset rather than a surface.
  - id: lambda_ltft
    module: fuel_calculator
    type: int16
    scale: 0.01
    label: "Long Term Fuel Trim"
    units: '%'
    rows: 32                 # == ve_table's y allocation
    cols: 32                 # == ve_table's x allocation
    depth: 4                 # == ve_table's z allocation (ethanol plane)
    col_axis:   {path: config.fuel_calculator.ve_table_x_axis, channel: rpm}
    row_axis:   {path: config.fuel_calculator.ve_table_y_axis, channel: fuel_load}
    depth_axis: {path: config.fuel_calculator.ve_table_z_axis, channel: flex_ethanol, en: ve_table_z_en}
    apply_to: [config.fuel_calculator.ve_table]   # Apply to Base Table, then reset (operator-confirmed)
    apply_mode: multiply     # a percentage of the VE cell: base x (1 + trim/100)
  # BANK DIFFERENCE IS TWO NUMBERS, NOT A SECOND TABLE. What separates one bank from the other is
  # dominated by injector flow variance and manifold bias — close to a constant offset, not a surface
  # that varies across the whole operating range. Two learned scalars carry it for four bytes; a
  # second 8 KB table to say the same thing would be paying for a shape the evidence does not have.
  # A single-bank engine uses index 0 and that IS the whole trim. If a bank difference turns out to
  # vary with rpm and load, the manual cylN_fuel_corr_tables already exist for it.
  - id: lambda_bank_trim
    module: fuel_calculator
    type: int16
    scale: 0.01
    label: "Bank Trim"
    units: '%'
    rows: 1
    cols: 2
    # THE AXIS IS THE BANK NUMBER, and banks are 1 and 2 to everyone who works on an engine. An external
    # axis is spaced evenly across [min, max), so 1..3 over two bins is the pair (1, 2) — and the
    # labels say it in words, because a column headed "1" on a two-column table is as easily a count
    # as a bank.
    col_axis: {external: true, min: 1, max: 3}
    col_labels: ["Bank 1", "Bank 2"]
  # THE BOOST TRIM, and it BORROWS the base duty table's axes — the same arrays, the same channels,
  # the same allocation. That is the whole point, exactly as the fuel trim borrows the VE table's:
  # trim cell (i,j) IS base duty cell (i,j), so Apply to Base is a copy rather than a resample, and
  # redrawing a base duty axis moves the trim with it instead of silently putting two grids out of
  # step. The axes are the target and rpm because that is what the table it corrects is indexed on.
  - id: boost_ltt
    module: boost
    type: int16
    scale: 0.1
    label: "Boost Long-Term Trim"
    units: '%'               # learned wastegate duty offset
    rows: 16                 # == base_boost_duty_table's y allocation (rpm)
    cols: 16                 # == its x allocation (target pressure)
    col_axis: {path: config.boost.base_targ_axis, channel: boost_target}
    row_axis: {path: config.boost.base_rpm_axis, channel: rpm, en: base_boost_duty_table_y_en}
    apply_to: [config.boost.base_boost_duty_table]
    # A DUTY OFFSET the firmware ADDS to the base (Boost.cpp: base + ltt), so it is folded in by adding.
    apply_mode: add
  - id: idle_ltt
    module: idle
    label: "Idle Long-Term Trim"
    units: '%'               # learned %duty offset
    rows: 1
    cols: 8                  # CLT bins from the config axis (non-even)
    col_axis: {path: config.idle.ltt_clt_axis, channel: clt}
  # KNOCK NOISE FLOOR, per cylinder — what this cylinder normally SOUNDS like at this operating point
  # when it is not knocking. Knock intensity is measured against this, never against an absolute level.
  #
  # Why a MAP and not a running average: an average lags whenever the operating point moves, and it
  # moves hardest exactly when knock happens. Open the throttle, the mechanical noise floor jumps, a
  # single average trails it, and every cycle in the transient reads as knock. A map moves to a cell
  # that already knows its own floor instead of dragging one number across the whole range.
  #
  # Why PER CYLINDER: sensor distance, mounting and block path differ per cylinder, which is what the
  # per-cylinder `gain` trim was compensating by hand. A per-cylinder floor IS that normalisation.
  #
  # 8x8 rather than the 16x16 the LTFTs use: a noise floor is a smooth function of rpm and load with
  # none of a VE map's structure, so the extra resolution would only slow learning by splitting the
  # same evidence across four times as many cells.
  - id: knock_noise
    module: knock
    label: "Knock Noise Floor"
    units: 'dB'
    per_cylinder: true
    rows: 8                  # LOAD bins (outer index: cell = load*8 + rpm)
    cols: 8                  # RPM bins
    row_axis: {channel: fuel_load, min: 0.0, max: 250.0}
    col_axis: {channel: rpm, min: 0.0, max: 8000.0}
  # Clean-sample count per cell, parallel to knock_noise. Its job is to make "never learned"
  # DISTINGUISHABLE from "learned to something that happens to equal the seed" — without it a fresh
  # region of zeroes is indistinguishable from a genuinely measured 0 dB floor, and the detector would
  # trust a number nothing ever wrote. It also drives fast-learn: below learn_fast_n a cell averages
  # 1/n so it converges in a few cycles instead of crawling up from the seed at the EMA rate.
  # WHEEL / SEGMENT ERROR, per cylinder — the correction that makes segment timing trustworthy.
  #
  # A trigger wheel's teeth are not perfectly evenly spaced, and neither are the TDCs they are measured
  # against. The residual is a FIXED per-segment bias: one cylinder's segment reads consistently long
  # for no combustion reason at all, which is indistinguishable from that cylinder always misfiring.
  #
  # It is learnable for free, because there is a condition where every segment SHOULD be identical:
  # overrun fuel cut. Nothing is firing, the crank is being driven by the wheels, so any spread that
  # remains is pure geometry. DFCO already publishes exactly that condition (it ORs into wk::fuel_cut),
  # so the learn gate costs nothing new.
  #
  # Stored as a RATIO (this segment / the cycle mean) so it is speed-independent: 1.0 = a perfect
  # segment, 1.02 = one that always reads 2% long.
  - id: misfire_seg
    module: misfire
    label: "Misfire Segment Correction"
    units: ''
    per_cylinder: true
    rows: 1
    cols: 1
  - id: knock_noise_n
    module: knock
    label: "Knock Noise Samples"
    units: ''
    digits: 0                # a COUNT — the learned region is flat floats, but there is no half sample
    per_cylinder: true
    rows: 8
    cols: 8
    row_axis: {channel: fuel_load, min: 0.0, max: 250.0}
    col_axis: {channel: rpm, min: 0.0, max: 8000.0}

# WHAT THE STUDIO'S VE AUTOTUNER MEASURES, and what disqualifies a reading. The autotuner is host-side
# — it watches, it does not run on the ECU — but WHICH CHANNELS IT WATCHES is a fact about this ECU,
# and the alternative to declaring it is a hard-coded channel list in the studio that no board can
# correct. A TunerStudio ini states exactly this in its own [VeAnalyze] section; the studio reads both
# through one path, so a rusEFI ECU and this one get the same feature from their own definitions.
#
# THE EGO CHANNELS ARE THE PART THAT IS NOT OBVIOUS. If the closed loop is adding 8 % and the mixture
# is on target, the fuel table is still 8 % wrong — the loop is hiding it. So the corrections the ECU
# is already applying are multiplied back in, and what the autotuner proposes is the error the table
# would have had on its own. With the trims switched off they read 1.000 and the same arithmetic is
# simply the plain measurement.
autotune:
  table:          fuel_calculator.ve_table    # the map being tuned
  lambda_channel: lambda_1                    # what the mixture actually was
  target_channel: lambda_target               # …and what it was asked to be, as the ECU commanded it
  ego_channels:   [fuel_corr_stft, fuel_corr_ltft]   # multipliers, folded back in (1.0 = none)
  # A filter REJECTS a record when its channel stands in this relation to the value — so "Minimum RPM"
  # is (rpm < 500). Each one names a condition under which the mixture is not the fuel table's doing:
  #   fuel cut   — no fuel is being delivered at all, and the sensor reads pinned lean
  #   warm-up    — the error belongs to coolant temperature, not to rpm and load
  #   cranking   — fuelling comes from the cranking table and bears no relation to the VE model
  #   a tip-in   — accel enrichment's error belongs to dTPS
  #   overrun    — a closed throttle is decel fuelling, not a cell worth learning
  #   low VBatt  — injector dead time is voltage-dependent and its correction is not the table's
  #   Blend's low range — the Alpha-N VE table carries (some of) the charge there
  filters:
  - {name: "Fuel Cut",    channel: fuel_cut,  op: '>', value: 0.5}
  - {name: "Minimum RPM", channel: rpm,       op: '<', value: 500}
  - {name: "Minimum CLT", channel: clt,       op: '<', value: 60}
  - {name: "Minimum TPS", channel: tps,       op: '<', value: 1}
  - {name: "dTPS",        channel: tps_rate,  op: '>', value: 50}
  - {name: "VBatt",       channel: battery,   op: '<', value: 12}
  # Blend's low range is the Alpha-N VE table's charge, not this table's: learning it here would move the
  # MAP-indexed cells the upper range shares. Only records where the Alpha-N map carried none of it (a log
  # without the channel reads 0, which is right: it cannot be a Blend low-range record).
  - {name: "Blend (Alpha-N)", channel: blend_alpha_share, op: '>', value: 0.1}
  # The delay table the studio credits a reading backwards through. The firmware has its own
  # (lambda.ltft_delay_table) for its own learning; the studio reads THAT when it is connected to an
  # ECU that has one, and falls back to this only for an ECU that states nothing.
  delay: {table: lambda.ltft_delay_table}

# TABLES THE STUDIO LEARNS FROM A CHANNEL THAT MEASURES THE ANSWER, rather than from a wideband ratio.
# Each is a second target in the Auto Tune tool. A record counts once every `steady` channel has held within
# its span for `settle_ms` — the value an engine SETTLES to is the answer; what it reads on the way there is
# the transient. The proposal is the cell's new value (as the VE target's is a percentage), applied only
# when the user presses Apply.
value_autotune:
# PREDICTED MAP is steady-state manifold pressure against RPM x throttle: hold a throttle and a speed, and
# the MAP it settles to IS the cell. It is USED during a throttle transient (MAP prediction) and LEARNED
# outside one. `map`, not `map_est`: during prediction map_est is the table's own value.
- name: Predicted MAP
  table: fuel_calculator.predicted_map_table
  value_channel: map
  settle_ms: 500
  steady:
  - {channel: rpm, span: 150}
  - {channel: tps, span: 1.0}
  - {channel: map, span: 3.0}
  filters:
  - {name: "Minimum RPM",   channel: rpm,        op: '<', value: 500}
  - {name: "Predicting",    channel: map_source, op: '>', value: 0.5}   # prediction active, or MAP failed
  # Under boost the pressure depends on spool, gear and boost control, not only RPM and throttle. The
  # threshold is the user's: raise it to learn boost too.
  - {name: "Above Atmosphere", channel: map,     op: '>', value: 102}

sensor_types:
- {id: temperature, units: C, decimals: 1, raw: volts, stages: [calibration, filter, diagnostics], diagnostics: [raw_min, raw_max, operating_min, operating_max], min: -40.0, max: 300.0, update_hz: 5}
- {id: exhaust_temperature, units: C, decimals: 1, raw: volts, stages: [calibration, filter, diagnostics], diagnostics: [raw_min, raw_max, operating_min, operating_max], min: -40.0, max: 1500.0, update_hz: 5}  # EGT/turbine-side: a far wider domain than coolant/oil/air temp
- {id: pressure, units: kPa, decimals: 1, raw: volts, stages: [calibration, filter, derivative, diagnostics], diagnostics: [raw_min, raw_max, operating_min, operating_max], min: -101.3, max: 3000.0, update_hz: 100}  # -101.3 = full vacuum referenced to atmosphere
- {id: percent, units: '%', decimals: 1, raw: volts, stages: [calibration, filter, derivative, diagnostics], diagnostics: [raw_min, raw_max, operating_min, operating_max], min: -100.0, max: 200.0, update_hz: 200}
- {id: position, units: deg, decimals: 1, raw: volts, stages: [calibration, filter, diagnostics], diagnostics: [raw_min, raw_max, operating_min, operating_max], min: -720.0, max: 720.0, update_hz: 100}
- {id: level, units: '%', decimals: 1, raw: volts, stages: [calibration, filter, diagnostics], diagnostics: [raw_min, raw_max, operating_min, operating_max], min: 0.0, max: 100.0, update_hz: 2}
- {id: lambda, units: 'λ', decimals: 2, raw: volts, stages: [calibration, filter, diagnostics], diagnostics: [raw_min, raw_max, operating_min, operating_max], min: 0.5, max: 1.5, update_hz: 20}
- {id: flow, units: g/s, decimals: 1, raw: volts, stages: [calibration, filter, diagnostics], diagnostics: [raw_min, raw_max, operating_min, operating_max], min: 0.0, max: 1000.0, update_hz: 50}
- id: composition
  units: '%'
  decimals: 1
  raw: hz
  stages: [pulse_scale, filter, diagnostics]
  diagnostics: [operating_min, operating_max]
  min: 0.0
  max: 100.0
  update_hz: 5
  # Secondary outputs: extra signals this type derives from the SAME input. Each becomes its
  # OWN full pipeline (acquire -> decode_linear -> cond_op_window -> cond_ema -> publish) reusing
  # the standard stages — not a bolt-on. A flex sensor encodes fuel temperature in the pulse
  # WIDTH (GM/Continental: 1.000 ms = -40 C, 5.000 ms = 125 C). `cal` gives two raw->eng points
  # (codegen derives the linear scale/offset); `range` feeds cond_op_window (always armed);
  # out-of-range raises the operating_min/max P-code (low/high split, free from the op-window).
  outputs:
  - {role: temperature, raw: pulse_us, units: C, cal: [[1000, -40], [5000, 125]], range: {min: -40, max: 125}, severity: 1, dtc: {operating_min: P0182, operating_max: P0183}}
# A FREQUENCY SENSOR IS 1:1 BY DEFAULT, and it has to be said here or the generic fallback applies —
# [[0, 0], [5000, 1000]], a 0.2 slope, which is right for nothing and quietly wrong for this: 1200 Hz
# at the pin came out as 240. Hz in, Hz out. Nothing about a tooth passing a pickup needs a curve, and
# turning pulses into a road speed is pulses_per_km's job, one module downstream.
#
# The curve is still THERE, and earns its keep the moment the input is not already a frequency: an
# analog or pulse-width speed signal from another module is a real curve, and so is a pickup whose
# output needs scaling before anything counts it. Identity is a default, not a law.
#
# 32767 because that is what the storage holds — the value cell is int16 at this type's scale — and a
# wheel pickup at 32.7 kHz is 546 revolutions a second. The type's 100 kHz ceiling is the acquire's,
# not the curve's.
- {id: frequency, units: Hz, decimals: 0, raw: hz, stages: [pulse_scale, filter, derivative, diagnostics], diagnostics: [operating_min, operating_max, max_derivative], min: 0.0, max: 100000.0, update_hz: 50, default_cal: [[0, 0], [32767, 32767]]}
- {id: switch, units: bool, decimals: 0, raw: state, stages: [debounce, diagnostics], diagnostics: [stuck], min: 0, max: 1, update_hz: 50}
# A NARROWBAND'S OWN DOMAIN. It is a Nernst cell swinging roughly 0.1 V lean to 0.9 V rich, so the
# useful swing is ~0.1..0.9 V and three decimals matter (the switch point is 0.450). Sharing the
# generic `voltage` type would put a 32 V full-scale domain around a 1 V sensor.
#
# THE DOMAIN IS WHAT THE INPUT MEASURES, NOT WHAT A HEALTHY SENSOR READS. 0..5 V, because that is what
# an AV pin presents and the calibration below is the identity: 0-5 V in, 0-5 V out. Declaring 0..1.1
# here — the plausible READING — made the transfer squeeze the whole pin range into a volt, so a real
# 0.450 V sensor would have arrived as 0.090 V, never crossed the switch point, and left the loop
# ramping fuel in permanently for want of a crossing. "What it can read" and "what it should read" are
# two statements; the second belongs on the sensor's operating diagnostics, not on its domain.
- {id: narrowband, units: V, decimals: 3, raw: volts, stages: [calibration, filter, diagnostics], diagnostics: [raw_min, raw_max, operating_min, operating_max], min: 0.0, max: 5.0, update_hz: 50}
- {id: voltage, units: V, decimals: 2, raw: volts, stages: [calibration, filter, diagnostics], diagnostics: [raw_min, raw_max, operating_min, operating_max], min: 0.0, max: 32.0, update_hz: 20}  # covers the AV12 divider's 30.25 V full-scale (see battery's cal)
# A MULTI-POSITION SWITCH: several buttons on ONE analog wire through a resistor ladder, each position
# giving its own voltage — a cruise stalk, steering-wheel buttons. (A rotary knob does NOT want this: it
# is a voltage that means an angle, so it is an ordinary calibration curve like any other analog input,
# and the space between its detents is transit rather than a fault.)
#
# The value is WHICH position, not a voltage: the calibration holds one voltage BAND per position as a
# pair of breakpoints [low, high] with the position number as the value (up to 8 bands). A reading in no
# band is not "between two positions": the channel goes INVALID, which shuts down anything consuming it,
# and the sensor raises its own no-band code so the user learns WHY rather than inferring it.
#
# 0 V IS A POSITION LIKE ANY OTHER. There used to be a hard floor here — a forced 200 mV below which a
# reading was a fault and no band could be calibrated — on the reasoning that 0 V must never read as a
# press. That reasoning does not hold. A dead 5 V reference is caught separately by the power-good
# inputs, and a button that GROUNDS the line is a real position on most cruise stalks: Toyota's grounds
# it for MAIN through no resistor at all. What remains is a short to ground being indistinguishable from
# that press — the same ambiguity a temperature sensor has at 0 V — and it is settled the same way here
# as everywhere else on this ECU: the user says where the fault line is, with Raw Min.
#
# APPENDED, like every type: the stored `type` byte is this list's index, so inserting one would silently
# re-point every generic input configured as a type after it.
- {id: multi_switch, units: '', decimals: 0, raw: volts, stages: [bands, diagnostics], diagnostics: [raw_min, raw_max, stuck], min: 0, max: 15, update_hz: 50}

# HIGH PRESSURE: a bottle, not a manifold. The calibration's value cell is int16 at the type's scale, and
# `pressure` keeps a decimal (0.1 kPa), so the most a pressure sensor could ever read was 3276.7 kPa —
# 475 psi. A nitrous bottle runs at 900-1000 psi and a CO2 bottle much the same, so a bottle sensor could
# not be calibrated to the pressures it exists to watch, and a minimum-pressure interlock on it could only
# ever refuse. Whole kPa here: 32767 kPa, about 4750 psi. The default curve is the common 0.5-4.5 V,
# 0-1500 psi (0-10342 kPa) bottle transducer. APPENDED, like every type (see multi_switch above).
- {id: high_pressure, units: kPa, decimals: 0, raw: volts, stages: [calibration, filter, diagnostics], diagnostics: [raw_min, raw_max, operating_min, operating_max], min: 0.0, max: 30000.0, update_hz: 20, default_cal: [[500, 0], [4500, 10342]]}

# Tier 2 — the named-sensor catalog. Each row is an Input pipeline node: a type
# instance with a UI `group`, the `interfaces` it may bind, an optional `locked`
# interface, default OBD-II `dtc` codes per diagnostic check, and `provides` — the
# bus signal(s) it publishes (default [id]). A node may provide more than one signal
# (e.g. a flex sensor → ethanol% + fuel temp); combining/selecting multiple inputs is
# a MODULE's job (it reads the bus), never a parent-sensor with sub-sensors.
# NOTE: the first eight rows are ordered so the derived channel indices stay
# legacy-stable (map=0 … battery=7) — the FuelCalculator/Ignition *_src defaults
# and the existing SIG_* consumers depend on this order. Do not reorder the core.
sensors:
  # --- core (always-present channels; kept as the first section) ---
- {id: battery, name: "Battery Voltage", type: voltage, group: other, interfaces: [analog_voltage], locked: analog_voltage, source_pin: "@battery", default_cal: "@battery", dtc: {operating_min: P0562, operating_max: P0563}}  # @battery = whichever ANALOG_VOLTAGE pin the BOARD marks with a `divider`; the cal line is derived from it (vref/divider)
# Wideband O2 + EGT are per-cylinder: codegen replicates each to _1.._N (N = board MAX_CYLINDERS), one
# configurable input per cylinder, scoped Overall/Bank/Cylinder by the sensor's assign_mode/assign_to.
# A WIDEBAND REPORTS LAMBDA, so its calibration ends in lambda — the sensor's own type says so (units
# lambda, domain 0.5-1.5). What varies is the CONTROLLER: it decides what its analogue output means and
# every brand decides differently, 0-5 V being 0.5-1.5 on one and 0.68-1.36 on another. So the default
# is the common case and the whole of the declared domain, and the two numbers from the controller's
# manual are what a user changes.
#
# The fallback this replaces mapped the full pin range onto 0.00-10.00 — not a mapping any controller
# has, and not even inside the lambda domain, so every reading past 5 V-equivalent was rejected as
# implausible while the rest were quietly wrong.
- {id: lambda, per_cylinder: true, extra: 3, name: "Wideband O2", type: lambda, group: o2, interfaces: [can_device, analog_voltage], default_cal: [[0, 0.5], [5000, 1.5]]}   # 12 cyl + 2 bank + 1 overall = 15 freely-assignable widebands (Lambda resolves the role named on O2 Control from assign_mode/assign_to)
- {id: tps, name: "Throttle Position", type: percent, group: engine, interfaces: [analog_voltage, can_device, sent], dtc: {raw_min: P0122, raw_max: P0123, operating_min: P0121, operating_max: P0121}}
# Track B of the throttle. A drive-by-wire plate carries TWO position tracks so a failure can be
# DETECTED -- the whole safety argument is that two independent tracks must agree -- and the ETB
# refuses to close its loop unless B is valid, not merely close. It was previously borrowed from a
# generic aux input, which meant TPS B only worked if someone also remembered to give that input a
# type; forgetting left B publishing nothing and the throttle latched on a correlation fault that
# looked like a wiring problem. A catalogued sensor knows what it is. SAE codes for "sensor B".
- {id: tps_2, name: "Throttle Position 2", type: percent, group: engine, interfaces: [analog_voltage, can_device, sent], dtc: {raw_min: P0222, raw_max: P0223, operating_min: P0221, operating_max: P0221}}
# Accelerator pedal (APP) — the DBW driver-demand input. Two of them because the App module A/B
# cross-checks: app_1 IS the value, app_2 is the correlation check (disagree -> pedal_demand 0).
# The app_1/app_2 CHANNELS have existed since the ETB work, but nothing acquired them: no catalog
# entry meant find_sensor() missed, so the channel read 0 forever, App faulted to the idle floor, and
# `pedalcal` sampled a span of 0 and rejected its own calibration. Declared like tps (the same kind of
# analog % input) so the pipeline — acquire, cal, filter, diagnostics — runs for them too.
# P2122/P2123 = APP sensor 1 circuit low/high, P2127/P2128 = APP sensor 2, P2138 = A/B correlation.
# The correlation code is NOT claimed here: this row's operating_min/max are per-sensor range checks and
# P2138 answers a question about the PAIR, which only the App module can ask. Claimed by a sensor slot it
# was consumed by the first claimant (the allocator's rule 3) and the module had nothing left to raise —
# so a pedal cut named no code at all. The range slots take manufacturer codes like any other uncoded
# check; APP_CORRELATION in module_dtc holds P2138.
- {id: app_1, name: "Accelerator Pedal", type: percent, group: engine, interfaces: [analog_voltage, can_device], dtc: {raw_min: P2122, raw_max: P2123}}
- {id: app_2, name: "Accelerator Pedal 2", type: percent, group: engine, interfaces: [analog_voltage, can_device], dtc: {raw_min: P2127, raw_max: P2128}}
  # --- Engine Synchronous ---
- {id: exh_manifold_pressure, name: "Exhaust Manifold Pressure", type: pressure, group: engine_sync, interfaces: [engine_sync_voltage, analog_voltage]}
- {id: fuel_pressure, name: "Fuel Pressure", type: pressure, group: engine_sync, interfaces: [engine_sync_voltage, analog_voltage], dtc: {raw_min: P0192, raw_max: P0193, operating_min: P0191, operating_max: P0191}}

  # --- Engine ---
- {id: clt_return, name: "Coolant Temperature Return", type: temperature, group: engine, interfaces: [analog_voltage]}
- {id: coolant_flow_sw, name: "Coolant Flow Switch", type: switch, group: engine, interfaces: [digital, analog_voltage]}
- {id: coolant_level, name: "Coolant Level", type: level, group: engine, interfaces: [analog_voltage, digital]}
- {id: coolant_pressure, name: "Coolant Pressure", type: pressure, group: engine, interfaces: [analog_voltage]}
- {id: crankcase_pressure, name: "Crank Case Pressure", type: pressure, group: engine, interfaces: [analog_voltage]}
- {id: egt, per_cylinder: true, name: "Exhaust Gas Temperature", type: exhaust_temperature, group: engine, interfaces: [can_device, analog_voltage]}
  # The one genuine multi-output node: one frequency input decodes to BOTH ethanol% and fuel
  # temp. provides[1] (temp) publishes once the composition pipeline emits its second value.
- {id: flex_fuel, name: "Flex Fuel Composition & Temperature", type: composition, group: engine, interfaces: [digital_freq], provides: [ethanol, fuel_temp_flex], dtc: {raw_min: P0178, raw_max: P0179, operating_min: P0177, operating_max: P0177}}
- {id: flex_fuel_comp, name: "Flex Fuel Composition", type: composition, group: engine, interfaces: [digital_freq], provides: [ethanol_2]}
- {id: fuel_flow, name: "Fuel Flow", type: flow, group: engine, interfaces: [digital_freq]}
- {id: fuel_pressure_pre, name: "Fuel Pressure Pre Filter", type: pressure, group: engine, interfaces: [analog_voltage]}
- {id: fuel_temp, name: "Fuel Temperature", type: temperature, group: engine, interfaces: [analog_voltage]}
- {id: iat_pre_ic, name: "Air Temperature Pre Intercooler", type: temperature, group: engine, interfaces: [analog_voltage]}
- {id: maf, name: "Mass Air Flow", type: flow, group: engine, interfaces: [analog_voltage, digital_freq]}
- {id: oil_level, name: "Oil Level", type: level, group: engine, interfaces: [analog_voltage, digital]}
- {id: oil_pressure, name: "Oil Pressure", type: pressure, group: engine, interfaces: [analog_voltage], dtc: {raw_min: P0522, raw_max: P0523, operating_min: P0524, operating_max: P0521}}
- {id: oil_pressure_sw, name: "Oil Pressure Switch", type: switch, group: engine, interfaces: [digital, analog_voltage, can_device]}
- {id: oil_temp, name: "Oil Temperature", type: temperature, group: engine, interfaces: [analog_voltage], dtc: {raw_min: P0197, raw_max: P0198}}
- {id: oil_temp_return, name: "Oil Temperature Return", type: temperature, group: engine, interfaces: [analog_voltage]}

  # Vehicle Speed: one frequency/CAN input per pickup. Each publishes its RAW Hz and nothing else — a
  # sensor measures, it does not decide. Choosing between them, converting to a road speed and deriving
  # the driven/undriven pair is the VehicleSpeed MODULE's job, which is where the calibration lives.
  #
  # THESE FOUR SIT HERE, not appended at the end of the list, and that is allowed: there is no released
  # software. No ECU is in the field, every tune and meta can be regenerated, and signal_ids.lock can be
  # rebuilt from nothing. Append-only is a convenience that avoids needless churn — a renumber costs a
  # regenerated tune and a reflash — NOT a compatibility constraint. Where a layout is wrong, move it.
- {id: driveshaft_speed, name: "Drive Shaft Speed", type: frequency, group: vehicle_speed, interfaces: [digital_freq, can_device], provides: [shaft_hz]}
- {id: wheel_speed_fl, name: "Wheel Speed Front Left", type: frequency, group: vehicle_speed, interfaces: [digital_freq, can_device], provides: [wheel_hz_fl]}
- {id: wheel_speed_fr, name: "Wheel Speed Front Right", type: frequency, group: vehicle_speed, interfaces: [digital_freq, can_device], provides: [wheel_hz_fr]}
- {id: wheel_speed_rl, name: "Wheel Speed Rear Left", type: frequency, group: vehicle_speed, interfaces: [digital_freq, can_device], provides: [wheel_hz_rl]}
- {id: wheel_speed_rr, name: "Wheel Speed Rear Right", type: frequency, group: vehicle_speed, interfaces: [digital_freq, can_device], provides: [wheel_hz_rr]}
- {id: gps_speed, name: "GPS Speed", type: frequency, group: vehicle_speed, interfaces: [digital_freq, can_device], provides: [gps_hz]}

  # --- O2 ---
# A NARROWBAND IS NOT A LAMBDA SENSOR, and calling it one had teeth. It is a zirconia Nernst cell:
# the voltage follows ln(pO2_ref / pO2_exh), and exhaust oxygen partial pressure collapses ~20 orders
# of magnitude across stoichiometry, so the output is a STEP — ~0.1 V lean, ~0.9 V rich, switching
# almost vertically at lambda 1. It reports which SIDE of stoich you are on and nothing about how far.
#
# Declared as `type: lambda, group: o2` it was admitted to Lambda::resolve_widebands(), which takes
# every enabled sensor of that type and group as "one more reading of the same quantity", and then
# consumed as a PROPORTIONAL error: err += (lam - target)/target. A saturated 0.9 V became "lambda
# 0.90" and the loop read a flat asymptote as a 10 % measurement. Bench-measured 2026-09-04
# (tools/bench_ltft.py): a genuinely 10 % lean wideband learned +11.80 %, and enabling ONE narrowband
# dragged the same case to +1.75 % — a working sensor degraded by one that cannot see the quantity.
#
# So it is VOLTS, which is the only honest thing it has ever produced. It logs, it drives a rich/lean
# lamp, and it can never again vote in a lambda loop. Closed loop on a narrowband is a different
# control law (a switching integrator, stoich only) and is not implemented; if it ever is, it gets its
# own type rather than borrowing this one.
- {id: narrowband_1, name: "Narrowband 1", type: narrowband, group: o2, interfaces: [analog_voltage], default_cal: [[0, 0.0], [5000, 5.0]]}
- {id: narrowband_2, name: "Narrowband 2", type: narrowband, group: o2, interfaces: [analog_voltage], default_cal: [[0, 0.0], [5000, 5.0]]}

  # --- Transmission ---
- {id: clutch_pressure, name: "Clutch Pressure", type: pressure, group: transmission, interfaces: [analog_voltage]}
- {id: clutch_sw, name: "Clutch Pedal Switch", type: switch, group: transmission, interfaces: [digital, analog_voltage, can_device]}
- {id: diff_oil_temp, name: "Differential Oil Temperature", type: temperature, group: transmission, interfaces: [analog_voltage]}
- {id: neutral_sw, name: "Neutral Switch", type: switch, group: transmission, interfaces: [digital, analog_voltage, can_device]}
- {id: reverse_sw, name: "Reverse Switch", type: switch, group: transmission, interfaces: [digital, analog_voltage, can_device]}
- {id: torque_conv_pressure, name: "Torque Converter Pressure", type: pressure, group: transmission, interfaces: [analog_voltage]}
# A TRANS BRAKE is a switch like any other here, and it is in the catalogue for one reason: launch
# control's Arm When has to be able to NAME it. An expression can read any channel, which is worth
# nothing if the thing the driver is actually holding has no channel to read.
- {id: trans_brake_sw, name: "Trans Brake Switch", type: switch, group: transmission, interfaces: [digital, analog_voltage, can_device]}
- {id: trans_input_rpm, name: "Transmission Input RPM", type: frequency, group: transmission, interfaces: [digital_freq]}
- {id: trans_line_pressure, name: "Transmission Line Pressure", type: pressure, group: transmission, interfaces: [analog_voltage]}
- {id: trans_oil_temp, name: "Transmission Oil Temperature", type: temperature, group: transmission, interfaces: [analog_voltage]}
- {id: transfer_case_pressure, name: "Transfer Case Pressure", type: pressure, group: transmission, interfaces: [analog_voltage]}

  # --- Air Con ---
- {id: ac_pressure, name: "Air Conditioner Pressure", type: pressure, group: aircon, interfaces: [analog_voltage]}
- {id: ac_temp, name: "Air Conditioner Temperature", type: temperature, group: aircon, interfaces: [analog_voltage]}

  # --- Chassis ---
- {id: brake_fluid_level_sw, name: "Brake Fluid Level Switch", type: switch, group: chassis, interfaces: [digital, analog_voltage]}
- {id: brake_pressure_f, name: "Brake Pressure Front", type: pressure, group: chassis, interfaces: [analog_voltage]}
- {id: brake_pressure_r, name: "Brake Pressure Rear", type: pressure, group: chassis, interfaces: [analog_voltage]}
- {id: brake_sw, name: "Brake Pedal Switch", type: switch, group: chassis, interfaces: [digital, analog_voltage, can_device]}
- {id: handbrake_sw, name: "Handbrake Switch", type: switch, group: chassis, interfaces: [digital, analog_voltage]}
- {id: power_steering_pressure, name: "Power Steering Pressure", type: pressure, group: chassis, interfaces: [analog_voltage]}
- {id: power_steering_sw, name: "Power Steering Switch", type: switch, group: chassis, interfaces: [digital, analog_voltage]}
