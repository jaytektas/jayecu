# TWO SENSORS CANNOT HOLD ONE JOB. A role — Overall, Bank 2, Cylinder 5 — names one sensor, so a
# duplicate is a configuration error rather than a preference, and the ECU marks its own homework here
# exactly as it does for the firing order: it recomputes on every config change and says so on this
# channel, instead of the studio re-deriving a rule the firmware already has to enforce. The assignment
# widgets paint red while it holds.
# THE TWO BANKS MUST MEASURE THE SAME KIND OF THING, and a chosen role must actually resolve. A
# narrowband and a wideband are not two grades of one instrument — one reports lambda, the other which
# side of stoichiometry the mixture is on — so a banked pair split across the two would be running two
# loops whose errors are not comparable, in different units, feeding one trim surface. And a role
# nothing is assigned to is a source that does not exist. Both are configuration errors the ECU can see
# on a config change, so it says so here and the selectors paint red, rather than the studio
# re-deriving rules the firmware has to enforce anyway.
