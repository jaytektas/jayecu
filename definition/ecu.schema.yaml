  # ---- SYMMETRICAL crank wheels: the pattern recurs more than once per revolution ------------------
  # Measured off the rig with tools/stim_repeats.py, which finds the smallest rotation the sample
  # table is invariant under. These are the first wheels whose `repeats` is not the slot default, and
  # they are why the field exists.
  #
  # A symmetrical wheel COULD be declared crank-rate with every gap listed — the edges come out the
  # same — but then the matcher has several identical gaps and no way to tell which one it found, so
  # it locks on whichever came first and is a whole period out the rest of the time. Declaring the
  # true repeat count makes that ambiguity structural: the crank says where it is inside ONE period
  # and the cam says which period, instead of the crank guessing.
  # An ODD-CYLINDER DISTRIBUTOR, and the reason cam-period streams had to work at all. Three
  # primaries 240 deg apart over the 720 cycle — 1.5 per crank revolution, so it cannot be a
  # crank-rate wheel at any tooth count — plus a "+1" index pulse 30 deg after the first. There is
  # no crank stream: the pickup is the only sensor on the engine.
  #
  # The +1 is what makes it identifiable. Without it three evenly spaced pulses carry no cylinder
  # identity, exactly like a uniform distributor; with it the spans are 30/210/240/240 and the ratio
  # sequence is unique, so the phase is MEASURED here rather than asserted.
  #
  # Derived from the rig's own table (144 entries at 5 deg = 720). Ardu-Stim's registry declares this
  # wheel as 360 degrees, which its own array comments and entry count contradict; decoding it as 720
  # reaches PHASE on the bench and as 360 only reaches CRANK, so the array is right and the registry
  # entry is wrong.
  - name: "Daihatsu 3+1 distributor"
    sync: "PHASE"
    cam_edge: 0
    streams:
      - rate: 1
        role: 2
        repeats: 1
        kind: "seq"
        cell: [300, 2100, 2400, 2400]
  - name: "Renix 4cyl symmetrical"
    sync: "PHASE"
    cam_edge: 0
    streams:
      - rate: 0
        role: 0
        repeats: 4               # pattern recurs every 180 deg of a 720 cycle
        kind: "gap"
        slots: 9                 # 180 deg / 20 deg pitch
        ratio: 6                 # 4 teeth then a 120 deg space
        gaps: [0]
      - rate: 1
        role: 2
        repeats: 1
        kind: "gap"              # ONE tooth per cycle: an even wheel of a single slot
        slots: 1
        ratio: 0
        gaps: []
  - name: "Renix 6cyl symmetrical"
    sync: "PHASE"
    cam_edge: 0
    streams:
      - rate: 0
        role: 0
        repeats: 6               # pattern recurs every 120 deg
        kind: "gap"
        slots: 6                 # 120 deg / 20 deg pitch
        ratio: 3                 # 4 teeth then a 60 deg space
        gaps: [0]
      - rate: 1
        role: 2
        repeats: 1
        kind: "gap"
        slots: 1
        ratio: 0
        gaps: []
  - name: "Nissan 360 CAS"
    sync: "PHASE"
    cam_edge: 0
    streams:
      - rate: 0
        kind: "gap"
        slots: 180
        ratio: 0
        gaps: []
      - rate: 1
        kind: "seq"
        cell: [1276, 1276, 1276, 1296, 1276, 800]

