- {id: transient_enrich_pct, label: "Transient Enrich %", units: '%', scale: 0.1, telem_type: int16, min: -100.0, max: 300.0, category: "TransientThrottle", bus_type: float, datalog: true, owner: firmware}  # current applied transient % (signed: +enrich / -disenrich)
- {id: tt_load_rate, label: "Transient Load Rate", units: '/s', scale: 0.1, telem_type: int16, min: -3000.0, max: 3000.0, category: "TransientThrottle", bus_type: float, datalog: true, owner: firmware}  # 1st derivative of the load channel; drives the rate-table axes
- {id: tt_start_load, label: "Transient Start Load", units: '%', scale: 0.1, telem_type: uint16, min: 0.0, max: 300.0, category: "TransientThrottle", bus_type: float, datalog: true, owner: firmware}  # load captured at event start; drives rate/ign-corr axes
