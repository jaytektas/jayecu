        - [ 10, 220, 200, 180, 180, 212, 250, 260, 272, 280, 289, 294, 299, 304, 309, 310, 312, 314, 314, 314, 314]   #  80 kPa
        - [ 10, 185, 171, 148, 160, 207, 245, 255, 267, 275, 284, 289, 294, 299, 304, 305, 307, 309, 309, 309, 309]   #  90 kPa
