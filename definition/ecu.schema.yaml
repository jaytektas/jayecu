# ---------------------------------------------------------------------------
# CAN BUS HEALTH. Two buses, and the same nine questions about each — because "the CAN is not working"
# is never one fault, and the controller already knows which one it is.
#
# THERE ARE NO COLLISIONS ON CAN, so there is no collision count here. Arbitration is non-destructive:
# the lower id wins the wire and the loser retries on the next slot, costing latency and never data.
# What a bus actually does when it is unhealthy is COUNT ERRORS, and past a threshold it stops talking
# — so the error counters, the resulting state, and the number of times it has dropped out are the
# honest answers to "is this bus alright".
#
# Last Error is the most useful single field on a bench: ACK means nothing else is out there to answer,
# bit errors mean something is driving against us, and form/stuff errors usually mean the two ends
# disagree about the bit rate. Those three are the whole of what a dead-looking bus is normally doing.
#
# Load is an ESTIMATE and says so: frames are counted with their DLC and converted to bits at the
# worst-case stuffing allowance, so it reads slightly HIGH rather than flattering the headroom.
- {id: can1_load_pct, label: "CAN1 Bus Load", units: '%', scale: 0.1, telem_type: uint16, min: 0.0, max: 100.0, category: "CAN", bus_type: float, datalog: true, owner: firmware}
