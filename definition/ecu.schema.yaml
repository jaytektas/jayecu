# WHICH state the cruise system is in, and WHY it will not engage. cruise_active answers only "is it
# holding a speed"; these two answer "I pressed Set and nothing happened", which is the question a
# driver and a bench script both actually ask. cruise_inhibit is one bit per refusal reason, so a
# dashboard or a test reads the CAUSE rather than inferring it from an absence.
- {id: cruise_state, label: "Cruise State", units: '', scale: 1.0, telem_type: uint8, min: 0.0, max: 4.0, category: "Actuators", bus_type: float, datalog: true, enum: cruise_state, owner: firmware}
