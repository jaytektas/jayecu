# WHICH LOOP IS ACTUALLY RUNNING, because "enabled" and "correcting" are not the same claim and the
# difference is invisible from the trims alone: a loop with nothing to listen to, and a loop that has
# nothing to correct, both publish 1.000. 0 = off, 1 = closed on a wideband, 2 = closed on a narrowband,
# 3 = OPEN LOOP — enabled, but nothing usable for THIS target: either no O2 sensor is reading at all,
# or the only one that is is a narrowband and the target is away from stoichiometry where it cannot see.
# Under boost on a narrowband car that is the normal, correct state rather than a fault, which is why
# it is said out loud here; P1753 is what separates "nothing is reading" from "cannot see this target".
- {id: lambda_cl_state, label: "Closed-Loop State", units: '', scale: 1.0, telem_type: uint8, min: 0, max: 3, category: "Lambda", bus_type: float, datalog: true, owner: firmware, options: ["Off", "Wideband", "Narrowband", "Open loop"]}
# WHY CLOSED LOOP IS HELD (frozen, not reset) — a state that said only "open loop" could not say whether
# that was a fuel cut, a cold engine or a throttle transient, which are three different things to fix.
- {id: lambda_cl_hold, label: "Closed-Loop Hold", units: '', scale: 1.0, telem_type: uint8, min: 0, max: 6, category: "Lambda", bus_type: float, datalog: true, owner: firmware, options: ["None", "Fuel Cut", "After Cut", "Settling", "Cold", "Off Range", "Transient"]}
