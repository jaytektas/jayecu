  # GM LS1 24x. ONE entry, decoded the way GM meant it: the crank finds ITSELF.
  #
  # A cam-synced version of this wheel also works — count only the falling edges, call it an even
  # 24-tooth crank with no gap, and let the half-moon do the syncing. It was written first and then
  # deleted, because offering both asks a tuner to choose between two decoder strategies for one
  # engine, which is not a question they should be asked. This one is strictly better: it syncs in 75
  # degrees instead of waiting for the cam edge, it keeps running on the crank alone if the cam sensor
  # fails, and it resolves 7.5 degrees rather than 15.
  #
  # The 24 falling edges are evenly spaced (exactly 15 degrees apart) and say nothing. The information
  # is in the WIDTHS: each rising edge sits 3 or 12 degrees before the next fall, one binary digit per
  # tooth, and the 24 of them spell 0x0A33BE — a code with no repeating five-tooth run, so FIVE
  # consecutive teeth (75 degrees) identify the crank absolutely.
  #
  # THAT CONSTANT HAS A CONVENTION, and without it the same wheel reads as a different number: 12
  # degrees high = 1, and the FIRST tooth of `cell` is the LEAST significant bit. Written the other way
  # up the identical code is 0x7DCC50. Note also that `cell` starts at a FALL, so the EVEN indices are
  # the fall-to-rise (low) spans and the ODD ones are the rise-to-fall widths that carry the code —
  # reading the even ones as the widths yields 0x8233AF, which is this wheel misread, not another wheel.
  # Derived from the rig and checked against it 2026-09-19: on the Ardu-Stim's own pattern table the
  # falls sit at 0,15,30,... with no exception, the rises at 6/15/24-degree spacing, and all 24 of the
  # five-tooth windows are distinct (four-tooth windows are not — only 16 of 24). That is a sixth of a revolution, and unlike a missing-
  # tooth wheel it does not depend on where the wheel happened to stop: every window is unique, so
  # the worst case is the same wherever cranking starts.
  #
  # Taken on BOTH edges the wheel is therefore a 48-span SEQUENCE alternating 3 and 12 degrees, and
  # SequenceMatcher locks it absolutely with no new decoder — an asymmetric cell is exactly what it
  # is for. 48 spans is why MAX_PATTERN_TEETH is 96; at 32 this cell would silently truncate.
  #
  # The cam is still needed for PHASE, because a four-stroke is 720 degrees and the widths only
  # resolve 360. What the widths buy is a crank that syncs without it: lose the cam sensor and this
  # drops to CRANK sync and keeps running wasted-spark rather than stopping, and it reaches that
  # point in 75 degrees rather than waiting for a gap to come round.
  #
  # BOTH EDGES ARE USABLE, and it is worth saying why, because the folklore says otherwise. The LS1
  # crank sensor is a 3-wire part: a reluctor element with internal signal conditioning that outputs
  # a Hall-style square wave. "Reluctor" in LS1 talk is the 24x WHEEL, not a passive two-wire VR
  # pickup — so there is no soft zero-crossing here and no reason to distrust one edge over the other.
  # That also makes a square-wave stimulator a faithful stand-in rather than a flattering one.
  #
  # Bench-verified 2026-09-19 against an Ardu-Stim GM_LS1_CRANK_AND_CAM: CRANK sync with the cam
  # DISABLED, PHASE with it enabled, zero noise edges, at every speed tried.
  - name: "GM LS1 24x"
    sync: "PHASE"
    cam_edge: 2
    streams:
      - rate: 0
        kind: "seq"
        edge: 2
        cell: [120, 30, 30, 120, 30, 120, 30, 120, 30, 120, 30, 120, 120, 30, 30, 120, 30, 120, 30, 120, 120, 30, 120, 30, 30, 120, 30, 120, 120, 30, 120, 30, 120, 30, 30, 120, 120, 30, 30, 120, 120, 30, 120, 30, 120, 30, 120, 30]
      - rate: 1
        kind: "width"
        width_min: 0
        width_max: 7200
        width_target: 0
  # GM LS Gen IV — the 58x crank with the 4x cam. Same 60-2 crank wheel as the Gen III's neighbour
  # above, and a completely different cam: four pulses per cycle whose RISING edges fall 180, 60, 180
  # and 300 degrees apart. That sequence has no repeating rotation, so the phase is known from three
  # consecutive cam edges and the widths never have to be measured — which is why this one syncs on
  # rising edges (cam_edge 0) where the LS1 above needs both.
  #
  # Derived from the bench rig's own table (tools/gen_library_wheels.py, stim wheel 25) and measured
  # on it, like every other entry here: 116 crank edges per cycle, 58 per revolution, gap at tooth 0.
  - name: "GM LS 58x + 4x cam"
    sync: "PHASE"
    cam_edge: 0
    streams:
      - rate: 0
        role: 1
        kind: "gap"
        slots: 60
        ratio: 3
        gaps: [0]
      - rate: 1
        role: 3
        kind: "seq"
        cell: [1800, 600, 1800, 3000]
